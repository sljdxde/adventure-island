      <!-- 亮核 -->
      <circle cx="32" cy="32" r="10" fill="url(#mw-core)"/>
      <!-- 亮星 -->
      <g fill="#fff" opacity="0.9">
        <circle cx="42" cy="24" r="1.3"/><circle cx="23" cy="19" r="1.2"/><circle cx="33" cy="46" r="1.2"/><circle cx="41" cy="45" r="1.1"/>
