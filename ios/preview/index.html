<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>探险岛 · 儿童学习大冒险</title>
<style>
/* ============ 探险岛 App 模拟器（1:1 还原 ios/ SwiftUI 工程；数据由 tools/gen_preview_data.py 注入） ============ */
:root{
  --orange:#FF9F43;--orange-dk:#F08C1F;--orange-ddk:#D97706;
  --yellow:#FFC53D;--yellow-dk:#F5A623;--yellow-ddk:#D98A0F;
  --coral:#FF7B6B;--coral-dk:#E85D4E;--coral-ddk:#C24836;
  --blue:#4FA9E8;--blue-dk:#2F86C9;--blue-ddk:#20629E;
  --purple:#9B7BF5;--purple-dk:#7C5CE0;--purple-ddk:#5E3FBE;
  --green:#58C96B;--green-dk:#3BA851;--green-ddk:#2E8A40;
  --cream:#FFF9EE;--cream-dk:#FFF1D8;--ink:#57433A;--ink-soft:#A08A76;
  --gold:#FFD34D;--gold-dk:#E5A916;--gold-ddk:#C08A0C;
  /* 棋盘格 token（决策 26）：浅色=格面、彩色=格底，彩底与上方学科 token 同值 */
  --space-q:#FFE9AE;--space-q-dk:#F5B93B;
  --space-coin:#C9EFFB;--space-coin-dk:#6FC9EE;
  --space-chest:#E3D8FF;--space-mush:#FFD9D2;--space-rest:#D7F5DD;
  /* 商店/衣橱按钮 token（决策 26）：购买=金币系、换上=绿色系、使用中=激活绿 */
  --buy-hi:#FFD76B;--buy:#F5B32E;--buy-dk:#C98A1E;--buy-ink:#7A4A10;
  --use-hi:#5BD47A;--use:#2FB855;--use-dk:#1E9242;
  --ok:#34C759;--ok-bg:#F2FFF5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#17120D;display:grid;place-items:center;min-height:100vh;height:100vh;font-family:"YouYuan","幼圆","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.frame{position:absolute;left:50%;top:50%;width:1052px;height:796px;border-radius:38px;border:14px solid #0d0a07;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 3px #3A2E22;overflow:hidden;background:var(--cream)}
.stage{position:absolute;inset:0;overflow:hidden}
.note{position:fixed;left:18px;top:14px;color:#8a7a63;font-size:13px;font-weight:700;line-height:1.7;z-index:99}
.note b{color:#FFD34D}
/* iPad/触屏：隐藏开发说明，避免压住 HUD */
@media (pointer:coarse){ .note{display:none !important} body{background:#0d0a07} .frame{border-radius:0} }
img.ic{display:inline-block;vertical-align:middle}

/* ---------- Boss 关（工单06：整屏 flex，心条固定行、题目占中区，互不遮挡） ---------- */
.boss-battle{position:absolute;inset:86px 0 0 0;display:flex;flex-direction:column;background:rgba(28,22,16,.28)}
.bb-row{display:flex;align-items:center;gap:12px;padding:0 40px;min-height:72px}
.bb-boss{background:linear-gradient(180deg,rgba(60,46,34,.55),rgba(60,46,34,.15))}
.bb-boss .bb-avatar{line-height:1;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.bb-boss.boss-hit .bb-avatar{animation:bossKnock .45s ease}
@keyframes bossKnock{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(28px) rotate(-8deg)}100%{transform:translateX(0) rotate(0)}}
.bb-name{font-size:18px;font-weight:900;color:#FFF3DC}
.bb-step{flex:1;min-height:0;padding:10px 26px;display:flex}
.bb-step > *{flex:1;min-height:0}
.bb-player{background:linear-gradient(0deg,rgba(60,46,34,.55),rgba(60,46,34,.15));min-height:64px}
.bb-player .bb-avatar{line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.bb-player.player-hit .bb-avatar{animation:playerHit .5s ease}
@keyframes playerHit{0%{transform:translateY(0)}30%{transform:translateY(-16px);filter:drop-shadow(0 0 6px #E84838)}100%{transform:translateY(0)}}
.bb-hearts{display:flex;gap:4px}
.boss-result{background:linear-gradient(180deg,#fff,#FFF1D8);border-radius:32px;padding:30px 42px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.3);border:5px solid var(--yellow);max-width:720px}

/* ---------- 场景背景 ---------- */
.scene{position:absolute;inset:0;z-index:0}
.scene .sky{position:absolute;inset:0}
.scene .glow{position:absolute;width:320px;height:320px;border-radius:50%;left:-180px;top:-180px;background:radial-gradient(circle,#FFF6C9f2,#FFE28A59 55%,transparent 72%)}
.scene .hill{position:absolute;left:-2%;right:-2%;bottom:-4px;height:250px;background-repeat:repeat-x;background-size:auto 100%;background-position:bottom center}
.scene .hill.back{height:300px;opacity:.9}
.hill.back{background-image:url("../../design/assets/bg/hills-back.svg")}
.hill.front{background-image:url("../../design/assets/bg/hills-front.svg")}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92;box-shadow:0 10px 24px rgba(111,199,242,.25)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:14%;bottom:26%}
.cloud::after{width:38%;height:115%;right:12%;bottom:22%}
/* ---------- 关卡场景变体：v1 黄昏 / v2 星夜（index%3 轮换）+ astro 常驻星夜 ---------- */
/* v0.12.3 重命名背景云类：原来是 .c1/.c2/.c3，和月球环形山的 .cr.c1/.c2/.c3 撞了类名选择器
   ——`.c2` 同时命中「第二朵云」和「第二个环形山」，`@keyframes drift` 把 left 推到 1060px，
   环形山被丢到关卡可视区外（preview_sweep 报 4 处越界）。加 sk- 前缀彻底分开。 */
.cloud.sk1{width:150px;height:44px;top:60px;animation:drift 38s linear infinite}
.cloud.sk2{width:100px;height:30px;top:140px;opacity:.8;animation:drift 28s linear infinite reverse}
.cloud.sk3{width:180px;height:50px;top:26px;animation:drift 46s linear infinite;animation-delay:-18s}
@keyframes drift{0%{left:-200px}100%{left:1060px}}
/* 关卡场景变体：v1 黄昏 / v2 星夜（index%3 轮换）+ astro 常驻星夜 */
.tint{position:absolute;inset:0;pointer-events:none}
.tint.dusk{background:linear-gradient(180deg,rgba(255,150,80,.42),rgba(255,181,107,.18) 45%,transparent 80%)}
.tint.night{background:linear-gradient(180deg,rgba(22,30,78,.55),rgba(34,46,110,.34) 48%,rgba(58,72,148,.16) 90%)}
.stars{position:absolute;inset:0 0 34% 0;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite alternate;background-image:
 radial-gradient(2px 2px at 6% 14%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 13% 42%,#fff 55%,transparent 60%),
 radial-gradient(2.4px 2.4px at 21% 10%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 30% 30%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 38% 8%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 47% 24%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 55% 7%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 63% 34%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 71% 13%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 79% 40%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 87% 11%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 94% 30%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 18% 55%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 44% 48%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 68% 52%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 90% 56%,#fff 55%,transparent 60%)}
@keyframes twinkle{0%{opacity:.75}100%{opacity:1}}
/* v0.12.4：装饰月亮固定在 right:74px / top:34px。这个位置在关卡页正好被 HUD 右侧的
   步骤条 + 金币条压住 —— 卡片是半透明的，月亮透出来一块黄斑，还被卡片边切掉一角，
   看着就是「有遮挡」。关卡页顶部 98px 是唯一露出天空的横条，但整条都被 HUD 占满，
   装饰月亮没有安全位置，所以关卡页的 nightDecor 不再渲染它（星空 .stars 保留，
   星点稀疏、不与控件冲突）。主页/收集册等页面 HUD 右侧只有 3 个按钮，月亮照常显示。 */
.moon{position:absolute;right:74px;top:34px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#FFFBEE,#FFE9A8 70%,#F7D77E);box-shadow:0 0 36px 12px rgba(255,240,190,.5);pointer-events:none}
.moon::before,.moon::after{content:'';position:absolute;border-radius:50%;background:rgba(214,178,90,.4)}
.moon::before{width:14px;height:14px;right:12px;top:10px}
.moon::after{width:9px;height:9px;right:26px;top:32px}
.theme-cn .sky{background:linear-gradient(180deg,#FFDE9E,#FFCF87 46%,#FFE9BE)}
.theme-cn .hill.back{opacity:.5}
.theme-math .sky{background:linear-gradient(180deg,#58C4F7,#9FE0FB 46%,#DCF6FE)}
.theme-lab .sky{background:linear-gradient(180deg,#8F74EC,#B39CF7 40%,#E2DAFE)}
.theme-lab .hill{opacity:.5}
.theme-pinyin .sky{background:linear-gradient(180deg,#FFC98A,#FFDCA8 46%,#FFF0CE)}
.theme-pinyin .hill{opacity:.8}
.theme-english .sky{background:linear-gradient(180deg,#6FD0A8,#A8E5C8 46%,#E1F8EC)}
.theme-english .hill{opacity:.85}
.theme-astro .sky{background:linear-gradient(180deg,#232C68,#3D4CB0 48%,#7B8ADF)}
.theme-astro .hill{opacity:.5;filter:saturate(.45) brightness(.62) hue-rotate(28deg)}
.theme-coll .sky{background:linear-gradient(180deg,#FFC964,#FFDE94 40%,#FFF2C4)}
.theme-coll .hill{opacity:.6}
.theme-parent .sky{background:linear-gradient(180deg,#A9C0DC,#C6D6E9 44%,#E6EEF5)}
.theme-parent .hill{opacity:.35}
.theme-shop .sky{background:linear-gradient(180deg,#7FC6F2,#A9DCFA 42%,#DFF3FF)}
.theme-shop .hill{opacity:.5}
.v1 .hill{filter:saturate(1.05) brightness(.88) sepia(.18)}
.v1 .cloud{opacity:.7;background:#FFE9CF}
.v2 .hill{filter:saturate(.5) brightness(.62) hue-rotate(24deg)}
.v2 .cloud{opacity:.35;background:#C9D4FF}
.is-night .cloud{opacity:.35;background:#C9D4FF}
/* 地下砖块关（SMB 1-2 风）：深蓝洞窟 + 底部砖排 */
.v3 .sky{background:linear-gradient(180deg,#141F5C,#23337F 52%,#3A55B0)!important}
.v3 .hill{filter:saturate(.45) brightness(.5) hue-rotate(190deg)}
.v3 .cloud{display:none}
.v3 .glow{opacity:.35;background:radial-gradient(circle,#9FB4FF80,transparent 70%)}
.bricksrow{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;z-index:1;pointer-events:none}
.bricksrow img{width:54px;height:54px;margin-right:2px;flex:none}
/* 旋转金币 + 顶砖 + 金币飞行（马里奥元素） */
@keyframes spincoin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.sky-coins img{animation:spincoin 2.6s linear infinite}
.sky-coins img:nth-child(2){animation-delay:.5s}
.sky-coins img:nth-child(3){animation-delay:1s}
@keyframes blockbump{0%{transform:translateX(-50%) translateY(0)}35%{transform:translateX(-50%) translateY(-16px)}100%{transform:translateX(-50%) translateY(0)}}
.blk{cursor:pointer}
.blk.bump{animation:blockbump .5s ease}
.flycoin{position:absolute;z-index:70;pointer-events:none;transition:transform .75s cubic-bezier(.25,-.15,.55,1),opacity .75s}
@keyframes chipbump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.goldchip.bumped{animation:chipbump .45s}
/* 马里奥小人：待机蹦跳 + 点击起跳 */
@keyframes mascotbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(.98,1.03)}}
.mascot{cursor:pointer;animation:mascotbob 1.5s ease-in-out infinite;transition:filter .15s}
.mascot:hover{filter:brightness(1.08) drop-shadow(0 4px 8px rgba(0,0,0,.2))}
@keyframes mascotjump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(3px) scale(1.12,.82)}45%{transform:translateY(-34px) scale(.94,1.1)}70%{transform:translateY(0) scale(1.06,.9)}100%{transform:translateY(0) scale(1,1)}}
.mascot.jump{animation:mascotjump .65s ease-out}
/* 翻翻牌（扑克牌风 3D 翻转） */
.memgrid{display:grid;grid-template-columns:repeat(3,150px);gap:16px}
.mcard{width:150px;height:130px;perspective:700px;cursor:pointer}
.mc-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.9,.4,1.1);transform-style:preserve-3d}
.mcard.flip .mc-inner{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mc-back{background:linear-gradient(180deg,#5A78E8,#3A55C8);border:4px solid #fff;box-shadow:0 5px 0 #2E44A8;color:#fff}
.mc-back b{font-size:36px;font-weight:900}
.mc-back span{font-size:16px;opacity:.85}
.mc-front{background:linear-gradient(180deg,#fff,#F6F9FF);border:3px solid #D8E2F8;transform:rotateY(180deg);position:absolute}
.mcard.ok .mc-front{border-color:#BFE8C9;background:linear-gradient(180deg,#fff,#EFFBEF)}
.mc-suit{position:absolute;top:6px;left:9px;font-size:13px;color:#8A9CC8;font-style:normal}
/* 掷骰子 */

/* ---------- 通用组件 ---------- */
.screen{position:absolute;inset:0;z-index:2;animation:screenIn .28s ease}
@keyframes screenIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.hud{position:absolute;top:0;left:0;right:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:16px 22px 0;z-index:40;pointer-events:none}
.hud-l,.hud-r{display:flex;align-items:center;gap:12px;pointer-events:auto}
.sqbtn{width:62px;height:62px;border:none;cursor:pointer;border-radius:21px;background:linear-gradient(180deg,#FFFDF6,#FFF3DC);box-shadow:0 4px 0 #E8D5AE,0 8px 14px rgba(84,66,58,.12);display:grid;place-items:center;transition:transform .08s}
/* v0.13 票 14：朗读看门狗——800ms 没出声就把「再念一遍」亮出来 */
#vbtn.vpulse{animation:vPulse .9s ease-in-out 3;box-shadow:0 0 0 4px #FFD34D,0 4px 0 #E8D5AE}
@keyframes vPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.sqbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E8D5AE}
/* 关卡页「重玩本关」按钮（v0.12.4）：用户两次反馈「找不到关卡重置按钮」。
   一开始放进 HUD 左侧，但 HUD 左侧已是「返回键 + 两行标题」、右侧是「步骤条 + 金币条」，
   再多一个元素就把标题挤折行、把金币条挤出屏幕（实测 1400 宽就崩）。
   所以改为**浮在左下角的胶囊**（.lv-body 的 bottom 14px 之外那块空白），
   不参与 HUD 布局，任何窗口宽度都不会挤坏别的元素。 */
.redobtn{position:absolute;left:24px;bottom:22px;z-index:45;cursor:pointer;
  padding:9px 16px;border:3px solid #fff;border-radius:999px;
  font-family:inherit;font-size:15px;font-weight:900;color:#8A5B00;white-space:nowrap;
  background:linear-gradient(180deg,#FFF6DF,#FFE4A8);box-shadow:0 4px 0 #E3C57E,0 8px 14px rgba(84,66,58,.2);
  transition:transform .08s,box-shadow .08s}
.redobtn:hover{transform:translateY(-2px)}
.redobtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E3C57E}
/* ---------- 关卡列表页（v0.12.5） ---------- */
.zl-body{position:absolute;top:98px;left:22px;right:22px;bottom:14px;z-index:10;overflow-y:auto;padding-right:4px}
.zl-zone{margin-bottom:14px}
.zl-zt{display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:900;color:var(--accent-ink);
  margin:2px 0 8px;padding-left:4px}
.zl-zt b{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;font-size:14px;
  background:var(--accent);color:#fff}
.zl-zt span{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.zl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.zl-card{position:relative;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 9px 12px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  box-shadow:0 3px 0 rgba(84,66,58,.07);transition:transform .12s,box-shadow .12s}
.zl-card:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(84,66,58,.14)}
.zl-card .zl-ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center}
.zl-card .zl-nm{font-size:14px;font-weight:900;color:var(--ink);text-align:center;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.zl-card .zl-meta{font-size:12px;font-weight:900;color:var(--ink-soft)}
.zl-card.done{border-color:#BFE8C9;background:#F7FDF9}
.zl-card.done .zl-meta{color:var(--gold-ddk);letter-spacing:1px}
.zl-card.cur{border-color:var(--accent);box-shadow:0 0 0 4px rgba(245,159,67,.2),0 3px 0 var(--accent-dk)}
.zl-card.cur .zl-meta{color:var(--accent-ink)}
.zl-card.lock{opacity:.55;background:#F6F2EA}
.zl-redo{position:absolute;right:7px;bottom:7px;border:2px solid #fff;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:900;color:#8A5B00;padding:3px 9px;
  background:linear-gradient(180deg,#FFF6DF,#FFE4A8);box-shadow:0 2px 0 #E3C57E}
.zl-redo:active{transform:translateY(2px);box-shadow:none}
/* 模块级「从头开始」（关卡列表页右上角）：清空本模块进度、从第 1 关重玩 */
.modbtn{padding:9px 16px;border:3px solid #fff;border-radius:999px;cursor:pointer;flex:none;
  font-family:inherit;font-size:14.5px;font-weight:900;color:#8A5B00;white-space:nowrap;
  background:linear-gradient(180deg,#FFF6DF,#FFE4A8);box-shadow:0 4px 0 #E3C57E,0 6px 10px rgba(84,66,58,.16);
  transition:transform .08s,box-shadow .08s}
.modbtn:hover{transform:translateY(-2px)}
.modbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E3C57E}
.goldchip{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFDF4,#FFF2CE);border-radius:999px;padding:8px 18px 8px 10px;box-shadow:0 4px 0 #EBD9A8,0 6px 12px rgba(84,66,58,.1);font-size:21px;font-weight:900;color:#8A5B00}
.goldchip .ico{width:33px;height:33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE68A,var(--gold) 60%,var(--gold-dk));display:grid;place-items:center}
.jbtn{font-family:inherit;border:none;cursor:pointer;border-radius:999px;font-weight:800;color:#fff;padding:13px 28px;font-size:20px;letter-spacing:1px;position:relative;transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.14)}
.jbtn:active{transform:translateY(4px)}
.j-orange{background:linear-gradient(180deg,#FFB25C,var(--orange) 45%,var(--orange-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--orange-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-yellow{background:linear-gradient(180deg,#FFDD7A,var(--yellow) 45%,var(--yellow-dk));color:#7A4A00;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 var(--yellow-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-green{background:linear-gradient(180deg,#7FD98A,var(--green) 45%,var(--green-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 #2E8A40,0 8px 14px rgba(84,66,58,.18)}
.j-blue{background:linear-gradient(180deg,#7CC4F5,var(--blue) 45%,var(--blue-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--blue-ddk),0 8px 14px rgba(84,66,58,.18)}

/* ---------- 学一学学科动画（v0.12 起 HTML 端实现 28 种 anim id） ----------
   动画只做演示，朗读仍由「读一读」按钮触发（可全程静音）。
   每个 anim 卡是一块 244x244 的舞台（.anim-stage），子元素用 CSS keyframes 驱动；
   未登记的 anim id 由 animHTML() 回退静态大字卡。 */
.anim-stage{position:relative;width:244px;height:244px;border-radius:24px;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center}
/* 舞台子元素一律绝对定位；坐标按「舞台左上角」显式给出，行内样式的 left/top 优先。
   注意：绝对定位元素不受父级 flex 对齐影响，凡是要居中的都必须自带 left:50% + margin-left，
   或直接写死像素坐标 —— 否则会贴左掉出视野（v0.12 踩坑）。 */
.anim-stage>*{position:absolute}
.anim-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.anim-cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--font-title);
  font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55);pointer-events:none}
/* 拼音 pydraw：笔画沿轨迹描出 + 字母淡入 */
@keyframes pydraw-dash{from{stroke-dashoffset:var(--dash,300)}to{stroke-dashoffset:0}}
@keyframes pydraw-in{0%{opacity:0;transform:scale(.75)}18%,82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.75)}}
.anim-pydraw .anim-trace{stroke-dasharray:var(--dash,300);animation:pydraw-dash 2.6s ease-in-out infinite}
.anim-pydraw .anim-glyph{animation:pydraw-in 2.6s ease-in-out infinite}
/* 拼音 tone：声调帽上下起伏 */
@keyframes tone-cap{0%,100%{transform:translateY(0)}25%{transform:translateY(-26px)}50%{transform:translateY(4px)}75%{transform:translateY(-12px)}}
.anim-tone .anim-capglyph{animation:tone-cap 2.2s ease-in-out infinite}
/* 拼音 merge：两音相向靠近再拼合成词 */
@keyframes merge-a{0%,100%{transform:translateX(0)}45%,55%{transform:translateX(46px)}}
@keyframes merge-b{0%,100%{transform:translateX(0)}45%,55%{transform:translateX(-46px)}}
@keyframes merge-word{0%,40%{opacity:0;transform:scale(.6)}60%,100%{opacity:1;transform:scale(1)}}
.anim-merge .anim-m1{animation:merge-a 2.8s ease-in-out infinite}
.anim-merge .anim-m2{animation:merge-b 2.8s ease-in-out infinite}
.anim-merge .anim-mword{animation:merge-word 2.8s ease-in-out infinite}
/* 英语 walk：小猫横向散步（左右往返） */
@keyframes walk-x{0%,100%{transform:translateX(-58px) scaleX(1)}48%{transform:translateX(58px) scaleX(1)}52%{transform:translateX(58px) scaleX(-1)}100%{transform:translateX(-58px) scaleX(-1)}}
@keyframes walk-leg{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
.anim-walk .anim-cat{animation:walk-x 3.4s ease-in-out infinite}
.anim-walk .anim-ground i{animation:walk-leg .34s linear infinite}
/* 英语 rainbow：彩虹条依次升起 */
@keyframes rb-bar{0%,100%{transform:scaleY(.25);opacity:.45}50%{transform:scaleY(1);opacity:1}}
.anim-rainbow .anim-rb{transform-origin:bottom;animation:rb-bar 2.6s ease-in-out infinite}
/* 英语 countpop：星星逐个蹦出 */
@keyframes countpop{0%,100%{transform:scale(0);opacity:0}30%,70%{transform:scale(1);opacity:1}90%{transform:scale(1.15);opacity:0}}
.anim-countpop .anim-pop{animation:countpop 2.8s ease-in-out infinite}
/* 英语 fall：苹果落地弹跳 */
@keyframes fall-drop{0%{transform:translateY(-92px)}55%{transform:translateY(56px)}72%{transform:translateY(30px)}100%{transform:translateY(56px)}}
.anim-fall .anim-apple{animation:fall-drop 2.2s ease-in-out infinite}
/* 英语 heartbeat：心脏两拍一跳 */
@keyframes hb-beat{0%,100%{transform:scale(1)}18%{transform:scale(1.22)}36%{transform:scale(1)}54%{transform:scale(1.14)}}
.anim-heartbeat .anim-heart{animation:hb-beat 1.15s ease-in-out infinite}
/* 英语 train：火车行进 + 轮转 + 烟飘 */
@keyframes train-go{0%{transform:translateX(-110px)}100%{transform:translateX(110px)}}
@keyframes train-wheel{to{transform:rotate(360deg)}}
@keyframes train-smoke{0%{transform:translate(0,0) scale(.5);opacity:.7}100%{transform:translate(-26px,-46px) scale(1.5);opacity:0}}
.anim-train .anim-train{animation:train-go 3s linear infinite}
.anim-train .anim-wh{animation:train-wheel .8s linear infinite}
.anim-train .anim-smoke{animation:train-smoke 1.5s linear infinite}
/* 环球 river：江河奔流（波浪横移） */
@keyframes river-flow{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
.anim-river .anim-wave{animation:river-flow 2.4s ease-in-out infinite alternate}
/* 环球 wall：长城沿山脊延展 */
@keyframes wall-grow{0%,100%{transform:scaleX(.15)}50%{transform:scaleX(1)}}
.anim-wall .anim-wallbar{transform-origin:left center;animation:wall-grow 3.2s ease-in-out infinite}
/* 环球 mountain：雪峰云影（云横过山腰） */
@keyframes mtn-cloud{0%{transform:translateX(-70px)}100%{transform:translateX(70px)}}
.anim-mountain .anim-cloud{animation:mtn-cloud 4s linear infinite alternate}
/* 环球 panda：熊猫抱竹啃食 */
@keyframes panda-chew{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.anim-panda .anim-panda{animation:panda-chew 1.1s ease-in-out infinite}
/* 环球 drift：大陆漂移（两块相向/背离） */
@keyframes drift-a{0%,100%{transform:translateX(-30px)}50%{transform:translateX(10px)}}
@keyframes drift-b{0%,100%{transform:translateX(30px)}50%{transform:translateX(-10px)}}
.anim-drift .anim-drift1{animation:drift-a 3.6s ease-in-out infinite}
.anim-drift .anim-drift2{animation:drift-b 3.6s ease-in-out infinite}
/* 环球 windmill：风车叶片旋转 */
@keyframes wm-spin{to{transform:rotate(360deg)}}
.anim-windmill .anim-blades{animation:wm-spin 2.8s linear infinite;transform-origin:center}
/* ---- 天文台 13 种（与 Swift AstroAnimView 观感对齐） ---- */
@keyframes an-sunrise-sun{0%{left:-26px;bottom:26px}50%{left:96px;bottom:150px}100%{left:218px;bottom:26px}}
.anim-sunrise .anim-sunrise-sun{animation:an-sunrise-sun 6s ease-in-out infinite;bottom:26px}
@keyframes an-dn-spin{to{transform:rotate(360deg)}}
.anim-daynight{animation:an-dn-spin 5s linear infinite}
.anim-daynight>div{position:absolute;inset:0}
@keyframes an-orbit{to{transform:rotate(360deg)}}
.anim-orbit-er{animation:an-orbit 6s linear infinite;transform-origin:center}
@keyframes an-sat{to{transform:rotate(-360deg)}}
.anim-sat{animation:an-sat 5s linear infinite;transform-origin:24px 20px}
@keyframes an-mp{0%,100%{opacity:.25}50%{opacity:1}}
.anim-mp{animation:an-mp 2s ease-in-out infinite}
/* v0.12.3 月相周期：8 个相位的刻度条 + 中央真月相盘 + 相名。
   相盘本身由 JS 按 p 值重绘（moonPhaseHTML），这里只画刻度条和名字的样式。 */
.anim-mp-dial{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px}
.anim-mp-track{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;
  background:rgba(12,18,48,.5);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14)}
.anim-mp-tick{width:16px;height:16px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  background:#2A3470;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
/* 刻度小球直接复用同一套月相画法：亮盘 + 左半暗框 + 晨昏线，按 --p 决定亮面。
   左半永远是暗的（月球被太阳照亮的一面要么整个在右、要么整个在左），
   --p 从 0（新月，全暗）走到 .875（残月，只剩左缘一条亮）。 */
.anim-mp-tick::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#FFFCEB,#F1EACF 55%,#CFC5A6);
  clip-path:inset(0 calc(50% - 8px * var(--p)) 0 0)}
.anim-mp-tick::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:#141B45;clip-path:inset(0 calc(50% + 8px * var(--p)) 0 0)}
.anim-mp-tick.on{box-shadow:0 0 0 2px #FFD34D,inset 0 0 0 1.5px rgba(255,255,255,.5);transform:scale(1.18)}
.anim-mp-moon{line-height:1;filter:drop-shadow(0 0 14px rgba(255,240,190,.45))}
.anim-mp-name{font-family:var(--font-title);font-weight:900;font-size:16px;color:#FFE58A;
  letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
/* 自转标记：orbit/satellite 的地球和卫星加一条「自转轴」虚线，转起来能看出是自己在转 */
@keyframes an-spin{to{transform:rotate(360deg)}}
.anim-spin{animation:an-spin 2.4s linear infinite;transform-origin:center}
.anim-axis{position:absolute;left:50%;top:50%;width:2px;height:64px;margin:-32px 0 0 -1px;
  background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.05),rgba(255,255,255,.65))}
@keyframes an-flag{0%{transform:translateY(0)}100%{transform:translateY(-220px)}}
@keyframes an-flame{0%,100%{transform:scaleY(1);opacity:.95}50%{transform:scaleY(1.5);opacity:.7}}
.anim-rocket{animation:an-flag 4.5s ease-in infinite}
.anim-flame{animation:an-flame .22s linear infinite;transform-origin:top center}
@keyframes an-cd{0%,100%{opacity:.25}50%{opacity:1}}
.anim-countdown{animation:an-cd 1s step-end infinite}
@keyframes an-floaty{0%,100%{transform:translateY(-26px) rotate(-8deg)}50%{transform:translateY(26px) rotate(10deg)}}
.anim-floaty{animation:an-floaty 5s ease-in-out infinite}
@keyframes an-meteor{0%{transform:translate(120px,-40px) scale(.7);opacity:0}12%{opacity:1}100%{transform:translate(-150px,120px) scale(1);opacity:0}}
.anim-meteor{animation:an-meteor 4s linear infinite}
@keyframes an-dstar{0%,100%{opacity:0;transform:scale(.4)}35%,70%{opacity:1;transform:scale(1)}}
.anim-dstar{animation:an-dstar 4.6s ease-in-out infinite}
@keyframes an-dline{0%,55%{stroke-dashoffset:0;opacity:0}70%,100%{stroke-dashoffset:260;opacity:1}}
.anim-dipper-line{stroke-dasharray:1 6;animation:an-dline 6s linear infinite}
@keyframes an-accretion{to{transform:rotate(360deg)}}
.anim-accretion{animation:an-accretion 4s linear infinite}
@keyframes an-galaxy{to{transform:rotate(360deg)}}
.anim-galaxy{animation:an-galaxy 12s linear infinite}
@keyframes an-bang{0%,14%{transform:scale(.1);opacity:1}60%{transform:scale(2.2);opacity:.24}100%{transform:scale(2.8);opacity:0}}
.anim-bang{animation:an-bang 5s ease-out infinite}
@keyframes an-tide1{0%,100%{height:52px}50%{height:76px}}
@keyframes an-tide2{0%,100%{height:38px}50%{height:58px}}
@keyframes an-tide-moon{0%,100%{transform:translateX(-58px)}50%{transform:translateX(58px)}}
.anim-tide1{animation:an-tide1 5s ease-in-out infinite}
.anim-tide2{animation:an-tide2 5s ease-in-out infinite}
.anim-tide-moon{animation:an-tide-moon 5s ease-in-out infinite}
/* ---- 学科动画第二批 26 种（v0.12.1：数学 8 / 英语 6 / 环球 9 / 拼音 3）----
   舞台一律 244×244（.anim-stage overflow:hidden），下落类粒子行程必须 ≤ 214px，防止 rect 越界被 sweep 误报 */
@keyframes x2-grpin{0%{transform:scale(.5);opacity:0}18%,84%{transform:scale(1);opacity:1}100%{transform:scale(.5);opacity:0}}
@keyframes x2-drop{0%{transform:translate(0,-64px);opacity:0}18%,82%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx,0),var(--dy,0));opacity:0}}
@keyframes x2-pull{0%,14%{transform:scaleX(.12)}55%,82%{transform:scaleX(1)}100%{transform:scaleX(.12)}}
@keyframes x2-slide{0%,18%{left:26px;opacity:0}42%{opacity:1}66%,84%{left:198px;opacity:1}100%{left:198px;opacity:0}}
@keyframes x2-swing{0%,100%{transform:rotate(0)}50%{transform:rotate(-62deg)}}
@keyframes x2-tilt{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
@keyframes x2-fall{0%{transform:translateY(-74px);opacity:0}22%,88%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes x2-scene{0%{transform:scale(.4) translateY(30px);opacity:0}20%,82%{transform:scale(1) translateY(0);opacity:1}100%{transform:scale(.4) translateY(30px);opacity:0}}
@keyframes x2-faceA{0%,26%{opacity:1}34%,92%{opacity:0}100%{opacity:1}}
@keyframes x2-faceB{0%,26%{opacity:0}34%,59%{opacity:1}67%,100%{opacity:0}}
@keyframes x2-faceC{0%,59%{opacity:0}67%,92%{opacity:1}100%{opacity:0}}
@keyframes x2-abchop{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-22px) rotate(-7deg)}70%{transform:translateY(0) rotate(5deg)}}
@keyframes x2-pawin{0%,100%{opacity:0;transform:scale(.4)}22%,78%{opacity:1;transform:scale(1)}}
@keyframes x2-flip{0%,16%{transform:rotateX(0)}48%,70%{transform:rotateX(-150deg)}100%{transform:rotateX(0)}}
@keyframes x2-chomp{0%,18%{transform:translate(46px,-52px) scale(1)}38%,62%{transform:translate(16px,-10px) scale(.55)}82%,100%{transform:translate(46px,-52px) scale(1)}}
@keyframes x2-pindrop{0%,10%{transform:translateY(-100px);opacity:0}42%{transform:translateY(0);opacity:1}50%{transform:translateY(-16px)}58%,88%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes x2-ring{0%,30%{transform:scale(.2);opacity:.9}70%,100%{transform:scale(1.9);opacity:0}}
@keyframes x2-petal{0%,12%{transform:scale(.15);opacity:0}46%,80%{transform:scale(1);opacity:1}100%{transform:scale(.15);opacity:0}}
@keyframes x2-erupt{0%,52%{transform:translateY(6px) scale(.4);opacity:0}60%{transform:translateY(-88px) scale(1.05);opacity:1}74%{transform:translateY(-30px) scale(.7);opacity:.85}100%{transform:translateY(14px) scale(.35);opacity:0}}
@keyframes x2-snow{0%{transform:translateY(-14px);opacity:0}10%{opacity:.95}88%{opacity:.95}100%{transform:translateY(212px);opacity:0}}
@keyframes x2-festa{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes x2-turn{0%,38%{transform:rotateY(0)}50%,88%{transform:rotateY(180deg)}100%{transform:rotateY(0)}}
@keyframes x2-labA{0%,30%{opacity:1}45%,80%{opacity:0}95%,100%{opacity:1}}
@keyframes x2-labB{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
@keyframes x2-softgo{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}}

/* ---------- 迷你棋盘（v0.8 工单02 骨架 + v0.10 档 B5/C1/C2 视觉：大富翁式环形赛道） ----------
   棋盘本体是一块垫子：环带即赛道（.broad），格子是铺在赛道上的地契砖（.bcell：色带+米白身体+标签），
   四角是锚点格（起点/回城堡），中央空地放终点城堡地标 + 星轨 + 骰子木托盘。 */
.bboard{position:absolute;inset:0 4px 8px 4px;z-index:10;border-radius:34px;border:7px solid #fff;
  background:linear-gradient(180deg,#FFFBF0,#FFF0D2);
  box-shadow:0 6px 0 rgba(150,110,40,.22),0 18px 34px rgba(84,66,58,.2),inset 0 0 0 5px #F3DFB2;overflow:hidden}
.broad{position:absolute;border:54px solid #E9C983;border-radius:118px;pointer-events:none;
  box-shadow:inset 0 0 0 5px #D6AF63,0 0 0 5px #D6AF63,inset 0 6px 14px rgba(150,110,40,.18)}
.broad-dash{position:absolute;border:3px dashed rgba(255,255,255,.7);border-radius:98px;pointer-events:none}
.bcell{position:absolute;transform:translate(-50%,-50%);width:124px;border-radius:15px;overflow:hidden;z-index:12;
  background:linear-gradient(180deg,#fff,#FFF7E6);border:4px solid #fff;
  box-shadow:0 4px 0 var(--edge-c,#D6AF63),0 7px 12px rgba(84,66,58,.2);transition:transform .14s,box-shadow .14s}
.bcell .band{height:24px;background:linear-gradient(180deg,var(--c1,#FFE9AE),var(--c2,#F5B93B));
  border-bottom:3px solid rgba(255,255,255,.7);box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.bcell .cbd{padding:5px 4px 6px;text-align:center}
.bcell .ico{width:36px;height:36px;margin:0 auto;display:grid;place-items:center}
.bcell .nm{font-size:14px;font-weight:900;letter-spacing:.5px;color:#6B4A20;line-height:1.15}
.bcell .no{position:absolute;right:7px;top:3px;font-size:12px;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 1px 0 rgba(0,0,0,.28)}
/* 走过的格：色带转灰 + 路上留脚印，格体保持可读（不降饱和，见 v0.10 §4 B5 刻意偏离） */
.bcell.done{--edge-c:#B9A88F}
.bcell.done .band{background:linear-gradient(180deg,#CFC2AC,#A8977C)}
.bcell.now{transform:translate(-50%,-50%) scale(1.09);z-index:13;
  box-shadow:0 5px 0 var(--edge-c),0 0 0 5px rgba(255,255,255,.9),0 0 24px 10px rgba(255,214,110,.8)}
.bcell.corner{width:132px}
.bcell.corner .band{height:30px}
.bcell.corner .ico{width:44px;height:44px}
.bcell.corner .nm{font-size:16px}
/* 中央空地：终点城堡地标 + 本关星轨 + 骰子木托盘（大富翁把 logo 放中间，我们放终点城堡） */
.bhub{position:absolute;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:4px 0}
.bgoal{position:relative}
.bgoal .lawn{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:216px;height:28px;border-radius:50%;
  background:radial-gradient(ellipse at center,#8FD86B 0%,#8FD86B 58%,rgba(143,216,107,0) 62%);opacity:.9}
.bgoal .row{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4px;
  filter:drop-shadow(0 7px 0 rgba(150,110,40,.26))}
.bgoal .cap{margin-top:-2px;font-size:15px;font-weight:900;color:#8A5A00;letter-spacing:1px}
.bgoal.reached .row{animation:cheer .6s ease-out}
@keyframes cheer{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-4deg)}70%{transform:scale(.96) rotate(3deg)}100%{transform:scale(1)}}
.bstars{display:flex;gap:9px;background:rgba(255,253,246,.94);border:3px solid #fff;border-radius:999px;padding:4px 13px;box-shadow:0 3px 8px rgba(84,66,58,.16)}
.bstars i{width:26px;height:26px;display:block;background:#E7DAC0;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.bstars i.on{background:radial-gradient(circle at 40% 30%,#FFF0A8,#F7B32B);filter:drop-shadow(0 0 6px rgba(255,200,60,.85))}
.btray{display:flex;align-items:center;gap:16px}
.bdietray{position:relative;width:148px;height:86px;border-radius:20px;border:4px solid #fff;
  background:linear-gradient(180deg,#C98A4B,#9C6229);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.28),inset 0 -8px 14px rgba(0,0,0,.28),0 6px 0 #6E421A,0 12px 20px rgba(84,66,58,.35)}
.bdietray::after{content:"";position:absolute;inset:8px;border-radius:13px;background:linear-gradient(180deg,#7E4E1F,#A5713C);box-shadow:inset 0 5px 12px rgba(0,0,0,.4)}
/* CSS 3D 立方体骰：结果先定后演，动画只负责把目标面转到正面（v0.10 §5 C1 五段节拍） */
.bdie-holder{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:62px;height:62px;z-index:3;perspective:520px}
.bdie-lift{width:62px;height:62px;transition:transform .12s ease-out}
.bdie-tilt{width:62px;height:62px;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(-9deg)}
.bdie-cube{position:relative;width:62px;height:62px;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.16,.72,.3,1)}
.bdie-cube .f{position:absolute;inset:0;border-radius:13px;border:2px solid rgba(0,0,0,.14);
  background:linear-gradient(160deg,#fff,#F0E7D2);box-shadow:inset 0 4px 0 rgba(255,255,255,.9),inset 0 -6px 10px rgba(160,130,90,.28)}
.bdie-cube .f span{position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FF9A8A,#C24836);box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5)}
.bf1{transform:rotateY(0deg) translateZ(31px)}
.bf2{transform:rotateY(180deg) translateZ(31px)}
.bf3{transform:rotateY(90deg) translateZ(31px)}
.bf4{transform:rotateY(-90deg) translateZ(31px)}
.bf5{transform:rotateX(90deg) translateZ(31px)}
.bf6{transform:rotateX(-90deg) translateZ(31px)}
.bdie-shadow{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:50px;height:12px;border-radius:50%;
  background:rgba(0,0,0,.42);filter:blur(3px);transition:transform .12s ease-out,opacity .12s}
.brollbtn{font-family:inherit;font-size:23px;font-weight:900;letter-spacing:2px;color:#7A4A00;cursor:pointer;
  border:4px solid #fff;border-radius:999px;padding:11px 26px;
  background:linear-gradient(180deg,#FFDD7A,var(--yellow) 45%,var(--yellow-dk));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 5px 0 var(--yellow-ddk),0 9px 15px rgba(84,66,58,.22);
  transition:transform .1s,box-shadow .1s}
.brollbtn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 1px 0 var(--yellow-ddk)}
.brollbtn:disabled{filter:grayscale(.65) opacity(.6);cursor:default}
/* 角色棋子：起跳压扁→空中拉长→落地压扁→小回弹，影子随高度缩放（transform 动画，不再用 margin） */
.btoken{position:absolute;z-index:26;transform:translate(-50%,-50%);transition:left .3s ease-in-out,top .3s ease-in-out;pointer-events:none}
.btoken .tw{width:50px;height:50px;line-height:1}
.btoken .tsh{position:absolute;left:50%;top:46px;transform:translateX(-50%);width:34px;height:10px;border-radius:50%;
  background:rgba(84,66,58,.3);filter:blur(2px)}
.btoken.hop .tw{animation:bhop .32s cubic-bezier(.3,-.4,.5,1.5)}
.btoken.hop .tsh{animation:bsh .32s ease-out}
@keyframes bhop{0%{transform:translateY(0) scale(1.14,.86)}30%{transform:translateY(-32px) scale(.9,1.14)}
  62%{transform:translateY(0) scale(1.16,.84)}82%{transform:translateY(-7px) scale(.97,1.03)}100%{transform:translateY(0) scale(1)}}
@keyframes bsh{0%{transform:translateX(-50%) scale(1);opacity:.34}30%{transform:translateX(-50%) scale(.55);opacity:.16}100%{transform:translateX(-50%) scale(1);opacity:.3}}
.bprint{position:absolute;width:9px;height:12px;border-radius:50% 50% 45% 45%;background:rgba(150,110,40,.3);
  transform:translate(-50%,-50%) rotate(var(--r,0deg));z-index:11;pointer-events:none}
.bshake{animation:bshk .22s}
@keyframes bshk{0%,100%{transform:none}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-2px)}80%{transform:translate(2px,2px)}}
.boverlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(46,36,28,.42)}
.boverlay .sticker{width:min(940px,96%);height:min(560px,92%);padding:18px 26px}
.rest-mascot{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);animation:restin 1.7s ease-in-out forwards}
@keyframes restin{0%{opacity:1;transform:translateX(-50%) scale(1)}60%{opacity:.9;transform:translateX(-50%) scale(.5)}100%{opacity:.12;transform:translateX(-50%) scale(.3)}}

/* ---------- 主页 ---------- */

.banner .stud{position:absolute;width:17px;height:17px;border-radius:50%;background:var(--gold);border:2.5px solid var(--gold-ddk)}

.sky-coins{position:absolute;right:26px;top:96px;display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
.trail{position:absolute;left:0;right:0;top:262px;height:118px;z-index:12}

  border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:800;color:var(--ink-2);box-shadow:0 2px 0 var(--line)}

.lnode .lab{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(63,158,56,.6);white-space:nowrap}
.lnode.done{background:linear-gradient(180deg,#7FD98A,var(--green));border:3.5px solid #fff;box-shadow:0 4px 0 var(--green-ddk)}

.arcpanel{position:absolute;left:-20px;right:-20px;bottom:-24px;height:112px;background:linear-gradient(180deg,#FFFBF0,var(--cream-dk));border-radius:50% 50% 0 0/70px 70px 0 0;box-shadow:0 -6px 20px rgba(84,66,58,.12);z-index:14}

.opt{width:164px;height:164px;border-radius:28px;border:5px solid #fff;outline:4px solid #F2E2C4;background:#fff;box-shadow:0 10px 20px rgba(84,66,58,.16);display:grid;place-items:center;cursor:pointer;font-size:84px;transition:transform .12s;position:relative}
.opt:hover{transform:translateY(-6px) rotate(-1deg)}

.tcard{min-width:168px;height:112px;padding:0 30px;border-radius:24px;background:linear-gradient(180deg,#FFE58A,#F7B32B);border:4px solid #fff;box-shadow:0 6px 0 #B8770A88;display:grid;place-items:center;font-weight:900;color:#fff;text-shadow:1px 3px 0 #B8770A}

.pinyin{font-size:34px;font-weight:900;color:#fff;background:linear-gradient(180deg,var(--coral),var(--coral-dk));border-radius:16px;padding:5px 26px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 #C24836;text-shadow:0 2px 0 rgba(0,0,0,.14)}

.pond.grass{background:linear-gradient(180deg,#E8F6CF,#B4E18E);outline-color:rgba(143,201,107,.5)}

 radial-gradient(2px 2px at 8% 16%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 20% 34%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 33% 12%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 47% 30%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 60% 10%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 73% 28%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 86% 14%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 94% 32%,#fff 55%,transparent 60%)}

.plate{width:250px;height:162px;border-radius:50%;background:radial-gradient(circle at 40% 34%,#fff,#F2EDDF 78%);border:5px solid #fff;box-shadow:0 7px 0 #E4D9C2,0 10px 16px rgba(84,66,58,.12);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 6px;padding:16px}
