/* 自动答题（?AISolve=1 调试通道 + 回归脚本） */
function kindAuto(st){
  if(st.kind==="match"){ (st.pairs||[]).forEach((_,i)=>{ matchPick('l',i); matchPick('r',i); }); }
  else if(st.kind==="shadow") pickShadow(st.answer||0);
  else if(st.kind==="tapall"){ (st.options||[]).forEach((o,i)=>{ if(o.correct) tapAllToggle(i); }); }
  else if(st.kind==="sequence"){ (st.seq||[]).forEach((_,i)=>pickSeq(i)); }
  else if(st.kind==="balance") pickBalance(st.answerKey==="right"?"right":"left");
  else if(st.kind==="sort"){ (st.items||[]).forEach((it,i)=>{ sortPick(i); sortDrop(it.bin); }); }
  else if(st.kind==="lineup"){ (st.lineup||[]).forEach((_,i)=>pickLineup(i)); }
  else if(st.kind==="spotlight") pickSpot(spotState.idx);
}

function settleLevel(){
  const L=S.lv;
  L.finished=true;
  const stars=L.wrong===0?3:(L.wrong===1?2:1);
  const key=curLevelObj().id;               // 星级按关卡 id 记账（工单05 平移迁移）
  const old=S.stars[key]||0;
  // 仪式金币雨只数本次实际入账（与账本一致，工单07）：星级金币（修订口径：3 星通关 +5，1/2 星按星数）
  let rain=0;
  if(stars>old||old===0){ S.stars[key]=stars; const amt=(stars===3?5:stars); earn("level-stars",amt); rain+=amt; }
  L.rain=rain; L.cerStars=stars;
  L.ceremony={skipped:false, done:false};
  S.daily[L.subject]=(S.daily[L.subject]||0)+1;
  save();
  checkRestAfterSettle();   /* 工单10：若单次时限在关中到达，仪式播完后进入休息 */
}
function nextStep(){

}

/* ================= 迷你棋盘（v0.8 工单02：识字村试点） =================
   掷骰 → 角色沿蛇形路径逐格蹦跳 → 题目格出题（答对 +2 金币、答错可重答）
   → 金币格 +5 → 到城堡走既有结算。路径形状按格数计算，不进 JSON。 */
let boardState={rolling:false,hopping:false,turnsX:0,turnsY:0,pose:{x:90,y:0}};

/* 环形赛道几何（v0.10 档 B5）：格子顺时针铺在圆角矩形环上，四角是锚点格。
   环上的槽位比 JSON 空格多两个——slot 0 = 起点、slot n+1 = 回城堡；L.bd.pos 语义不变
   （-1 起点 · 0..n-1 空格 · n 城堡），所以槽位 = pos+1。 */
const BRING={x0:112,y0:104,x1:868,y1:572};
const BHUB={x:BRING.x0+58,y:BRING.y0+56,w:BRING.x1-BRING.x0-116,h:BRING.y1-BRING.y0-112};
const _ring={};
function ringLayout(nSlots){
  if(_ring[nSlots]) return _ring[nSlots];
  const c=[{x:BRING.x0,y:BRING.y1},{x:BRING.x1,y:BRING.y1},{x:BRING.x1,y:BRING.y0},{x:BRING.x0,y:BRING.y0}]; // 左下 右下 右上 左上
  const edges=Math.max(0,nSlots-4), per=[0,0,0,0];
  for(let i=0;i<edges;i++) per[i%4]++;                    // 底→右→顶→左 均分边格
  const out=[c[0]];
  for(let s=0;s<4;s++){
    const a=c[s], b=c[(s+1)%4];
    for(let j=1;j<=per[s];j++){ const t=j/(per[s]+1); out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); }
    if(s<3) out.push(b);
  }
  _ring[nSlots]=out; return out;
}
function bdPoint(pos){ return ringLayout(curLevelObj().board.spaces.length+2)[pos+1]; }
/* .bboard 原点在 stage 坐标系里的位置（lv-body 22/98 + bboard 左内缩 4）：金币飞行按 stage 坐标落点 */

  match: {c1:"#E9F0FF",c2:"#5A7FD6",edge:"#3F62B8",ico:"clip"},

function kindSkin(kind){

const GO_SKIN={c1:"#8FE39E",c2:"#3BA851",edge:"#2E8A40",ico:"flag",nm:"起点",no:"GO"};
const END_SKIN={c1:"#FFD9D2",c2:"#E85D4E",edge:"#C24836",ico:"castle",nm:"回城堡",no:"END"};
/* 骰面点位 → 3D 立方体六面 */
function dieFacesHtml(){

    `<span style="left:calc(${p[0]*100}% - 6px);top:calc(${p[1]*100}% - 6px)"></span>`).join("")}</div>`).join("");
}
const DIE_POSE={1:[0,0],2:[0,180],3:[0,-90],4:[0,90],5:[-90,0],6:[90,0]};
function starRowHtml(){ const k=S.lv.wrong===0?3:(S.lv.wrong===1?2:1); return [0,1,2].map(i=>`<i class="${i<k?"on":""}"></i>`).join(""); }
function boardHTML(lv){
  const L=S.lv, sps=lv.board.spaces, n=sps.length, pos=L.bd.pos, pts=ringLayout(n+2);
  const cell=(i,sk,extraCls)=>{
    const p=pts[i], si=i-1;
    return `<div class="bcell ${extraCls}${si===pos?" now":""}${si<pos?" done":""}" id="bc${i}"
      style="left:${p.x}px;top:${p.y}px;--c1:${sk.c1};--c2:${sk.c2};--edge-c:${sk.edge}">
      <div class="band"></div>${sk.no?`<div class="no">${sk.no}</div>`:""}
      <div class="cbd"><div class="ico">${ic(sk.ico,sk===GO_SKIN||sk===END_SKIN?42:36)}</div><div class="nm">${sk.nm}</div></div></div>`;
  };
  let cells=cell(0,GO_SKIN,"corner ");
  sps.forEach((sp,i)=>{
    let sk=CELL_SKIN[sp.type]||CELL_SKIN.question;
    if(sp.type==="question"){
      const st=lv.steps.find(x=>x.id===sp.step);
      sk=kindSkin(st?st.kind:"quiz");
    }
    cells+=cell(i+1, sk, "");
  });
  cells+=cell(n+1,END_SKIN,"corner ");
  const mp=pts[pos+1];
  return `<div class="bboard">
    <div class="broad" style="left:${BRING.x0-27}px;top:${BRING.y0-27}px;width:${BRING.x1-BRING.x0+54}px;height:${BRING.y1-BRING.y0+54}px"></div>
    <div class="broad-dash" style="left:${BRING.x0+12}px;top:${BRING.y0+12}px;width:${BRING.x1-BRING.x0-24}px;height:${BRING.y1-BRING.y0-24}px"></div>
    <div class="bhub" style="left:${BHUB.x}px;top:${BHUB.y}px;width:${BHUB.w}px;height:${BHUB.h}px">
      <div class="bgoal" id="bgoal"><div class="lawn"></div>
        <div class="row">${ic("tree",34)}${ic("castle",104)}${ic("home",30)}</div><div class="cap">终点 · 城堡</div></div>
      <div class="bstars" id="bstars">${starRowHtml()}</div>
      <div class="btray">
        <div class="bdietray"><div class="bdie-shadow" id="bdieShadow"></div>
          <div class="bdie-holder"><div class="bdie-lift" id="bdieLift"><div class="bdie-tilt">
            <div class="bdie-cube" id="bdieCube" style="transform:rotateX(${boardState.pose.x}deg) rotateY(${boardState.pose.y}deg)">${dieFacesHtml()}</div>
          </div></div></div></div>
        <button class="brollbtn" id="broll" onclick="boardRoll()" ${L.bd.mode==="roll"?"":"disabled"}>掷骰子</button>
      </div>
    </div>
    <div id="bprints">${printsHtml(pts,pos)}</div>
    ${cells}
    <div class="btoken" id="btoken" style="left:${mp.x}px;top:${mp.y-46}px"><div class="tsh"></div><div class="tw">${activeCharIcon(50)}</div></div>
  </div>`;
}
/* 走过的路上留一串脚印（替代旧版「已走过 = 降饱和」） */
function printsHtml(pts,pos){
  let h="";
  for(let i=0;i<pos+1;i++){
    const a=pts[i], b=pts[Math.min(i+1,pts.length-1)];
    const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    for(let k=1;k<=2;k++){ const t=k/3;
      h+=`<div class="bprint" style="left:${a.x+(b.x-a.x)*t}px;top:${a.y+(b.y-a.y)*t+((k%2)?7:-7)}px;--r:${ang}deg"></div>`; }
  }
  return h;
}
/* 只刷格态/脚印/星轨，不整屏重绘——整屏重绘会把骰子立方体的累计姿态打回原点（闪帧）。
   hop 期间传入视觉位置：L.bd.pos 要等 arriveBoard 才提交，否则途经题目队列会被清空（试玩反馈①） */
function paintBoard(visPos){
  const L=S.lv, n=curLevelObj().board.spaces.length, pos=(visPos===undefined?L.bd.pos:visPos), pts=ringLayout(n+2);
  for(let i=0;i<=n+1;i++){
    const el=document.getElementById("bc"+i); if(!el) continue;
    el.classList.toggle("done", i-1<pos);
    el.classList.toggle("now", i-1===pos);
  }
  const bp=$("#bprints"); if(bp) bp.innerHTML=printsHtml(pts,pos);
  const tk=$("#btoken"); if(tk){ const p=pts[pos+1]; tk.style.left=p.x+"px"; tk.style.top=(p.y-46)+"px"; }
  const st=$("#bstars"); if(st) st.innerHTML=starRowHtml();
}
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
const dieAlive=()=>S.route==="level"&&!!document.getElementById("bdieCube");
/* 五段节拍（v0.10 §5 C1）：蓄力 120 → 抛出 480 → 落地 90 → 回弹 220 → 定格 260，总 1.17s。
   结果先定后演：掷的瞬间就出 r，动画只把 r 那一面转到正面，所以永远不会卡在"立着"。 */
async function boardRoll(){
  const L=S.lv, n=curLevelObj().board.spaces.length;
  if(L.bd.mode!=="roll"||boardState.rolling||boardState.hopping) return;
  boardState.rolling=true;
  const btn=$("#broll"); if(btn) btn.disabled=true;
  const cube=$("#bdieCube"), lift=$("#bdieLift"), sh=$("#bdieShadow");
  const r=1+Math.floor(Math.random()*6);
  boardState.turnsX+=1; boardState.turnsY+=2;          // 两轴累计不同速 → 翻滚而不是转盘
  const px=DIE_POSE[r][0]+boardState.turnsX*360, py=DIE_POSE[r][1]+boardState.turnsY*360;
  lift.style.transition="transform .12s ease-out";      // ① 蓄力
  lift.style.transform="translateY(-18px) scale(1.15)";
  sh.style.transform="translateX(-50%) scale(.6)"; sh.style.opacity=".14";
  await sleepMs(120);
  if(!dieAlive()){ boardState.rolling=false; return; }
  cube.style.transition="transform .48s cubic-bezier(.16,.72,.3,1)";   // ② 抛出
  cube.style.transform=`rotateX(${px}deg) rotateY(${py}deg)`;
  lift.style.transform="translateY(0) scale(1)";
  sh.style.transform="translateX(-50%) scale(1)"; sh.style.opacity=".34";
  await sleepMs(470);
  if(!dieAlive()){ boardState.rolling=false; return; }
  lift.style.transition="transform .09s ease-in";       // ③ 落地 squash
  lift.style.transform="translateY(0) scale(1.14,.84)";
  sh.style.transform="translateX(-50%) scale(1.25)"; sh.style.opacity=".44";
  await sleepMs(90);
  lift.style.transition="transform .22s cubic-bezier(.3,-1.4,.6,1)";   // ④ 回弹
  lift.style.transform="translateY(0) scale(1)";
  sh.style.transform="translateX(-50%) scale(1)"; sh.style.opacity=".3";
  await sleepMs(220);
  if(!dieAlive()){ boardState.rolling=false; return; }
  boardState.pose={x:px,y:py};                          // ⑤ 定格：姿态存进 boardState，重绘后仍停在点数面上
  const scr=$(".screen"); if(scr){ scr.classList.add("bshake"); setTimeout(()=>scr.classList.remove("bshake"),230); }
  toast(`掷出 ${r} 点！`,1.4);
  await sleepMs(260);
  if(!dieAlive()){ boardState.rolling=false; return; }
  boardState.rolling=false;
  L.bd.mode="moving";
  hopBoard(Math.min(L.bd.pos+r,n));
}
function hopBoard(target){
  const L=S.lv, el=$("#btoken");
  boardState.hopping=true;
  let p=L.bd.pos;
  const stepHop=()=>{
    if(S.route!=="level"||!$("#btoken")){ boardState.hopping=false; return; }
    if(p>=target){ boardState.hopping=false; arriveBoard(target); return; }
    const go=()=>{
      p++;
      const pt=bdPoint(p);
      el.style.left=pt.x+"px"; el.style.top=(pt.y-46)+"px";
      el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
      paintBoard(p);
      setTimeout(stepHop,340);
    };
    if(p+1===target) setTimeout(go,120); else go();   // 最后一跳前停 120ms（anticipation），落点才有力
  };
  stepHop();
}
function arriveBoard(p){
  if(S.route!=="level") return;
  const L=S.lv, lv=curLevelObj(), n=lv.board.spaces.length;
  const from=L.bd.pos;
  L.bd.pos=p;
  /* 试玩反馈①：途经的题目格依次作答——掷大点数=多做几题，绝不跳题（学习密度优先） */
  const passed=[];
  for(let i=from+1;i<=Math.min(p,n-1);i++){ if(lv.board.spaces[i].type==="question") passed.push(i); }
  L.bd.queue=passed; L.bd.qi=0;
  if(passed.length>0){ L.bd.q=passed[0]; L.bd.mode="question"; renderLevel(); return; }
  landBoard(p);
}
/* 落格结算唯一入口（决策 6「掷骰 → … → 落格结算」）：到城堡→通关仪式；
   题目格必经途经队列作答，答完回正常回合；其余事件格→遭遇结算，一格都不许吞 */
function landBoard(p){
  if(S.route!=="level") return;
  const L=S.lv, sps=curLevelObj().board.spaces, n=sps.length;
  if(p>=n){
    const tk=$("#btoken"), goal=$("#bgoal");
    if(tk&&goal){
      /* 最后一格：角色跳进中央城堡——大富翁的中间空地从此有了用途 */
      tk.style.transition="left .42s ease-in-out,top .42s ease-in-out";
      tk.style.left=((BRING.x0+BRING.x1)/2)+"px";
      tk.style.top=(BHUB.y+104)+"px";
      goal.classList.add("reached");
      paintBoard();
      setTimeout(()=>{ if(S.route!=="level") return; settleLevel(); renderLevel(); },540);
      return;
    }
    settleLevel(); renderLevel(); return;              // 到城堡 → 结算仪式
  }
  if(sps[p].type==="question"){ L.bd.mode="roll"; renderLevel(); return; }  // 落点题目格已在队列答完
  resolveSpace(p);
}
/* 落点遭遇结算：金币 +5（工单04）/ 宝箱 3-8（工单03）/ 幸运蘑菇 / 休息站演出 */
function resolveSpace(p){
  if(S.route!=="level") return;
  const L=S.lv, sp=curLevelObj().board.spaces[p];
  if(sp.type==="coin"){
    const pt=bdPoint(p);
    flyCoins(pt.x+BD_OX,pt.y+BD_OY,3);
    earn("coin-space",5);                    // 金币格 +5 经账本（工单04）
    toast("金币格 +5 金币！",1.6);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },900);
    return;
  }
  if(sp.type==="chest"){
    const amt=chestAmount(), pt=bdPoint(p);   // 宝箱 3-8 随机经账本（工单03）
    flyCoins(pt.x+BD_OX,pt.y+BD_OY,Math.min(amt,5));
    confetti();
    earn("chest",amt);
    toast(`🎁 宝箱打开：+${amt} 金币！`,1.8);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },1100);
    return;
  }
  if(sp.type==="mushroom"){
    if(!S.mushroom){ S.mushroom=true; save(); confetti(); toast("🍄 幸运蘑菇到手：下次答错不算错！",2); }
    else toast("已经有一朵幸运蘑菇啦",1.6);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },900);
    return;
  }
  if(sp.type==="rest"){
    L.bd.mode="rest";                        // 休息站：小房子喝水演出（纯视觉，静音等效）
    renderLevel();
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },2100);
    return;
  }
}
/* 休息站演出覆盖层 */
function restHTML(){
  return `<div class="boverlay"><div style="background:#fff;border-radius:28px;padding:34px 46px;text-align:center;box-shadow:0 12px 24px rgba(84,66,58,.22)">
    <div style="position:relative;width:132px;height:112px;margin:0 auto">${ic("home",120)}<div class="rest-mascot">${activeCharIcon(46)}</div></div>
    <div style="font-size:20px;font-weight:900;color:var(--ink);margin-top:6px">咕咚咕咚…喝水休息一下 💧</div>
  </div></div>`;
}
function flyCoins(x,y,k){
  const chip=document.querySelector('.goldchip'); if(!chip) return;
  const sr=stage.getBoundingClientRect(), cr=chip.getBoundingClientRect();
  /* 整块 frame 被 fitFrame 缩放，getBoundingClientRect 是缩放后的像素：先除以缩放比再喂给 transform */
  const z=sr.width/1024||1;
  const tx=(cr.left-sr.left+cr.width/2)/z-x, ty=(cr.top-sr.top+cr.height/2)/z-y;
  for(let i=0;i<k;i++){
    const c=document.createElement('div'); c.className='flycoin';
    c.innerHTML=ic("coin",30);
    c.style.left=(x-15)+'px'; c.style.top=(y-46)+'px';
    stage.appendChild(c);
    setTimeout(()=>{ c.style.transform=`translate(${tx}px,${ty}px) scale(.4)`; c.style.opacity='0'; }, i*90);
    setTimeout(()=>c.remove(), 950+i*90);
  }
  setTimeout(()=>{ chip.classList.remove("bumped"); void chip.offsetWidth; chip.classList.add("bumped"); }, 720);
}
function boardStepDone(){
  const L=S.lv, lv=curLevelObj(), n=lv.board.spaces.length;
  if(L.bd.mode==="intro"){ L.bd.mode="roll"; renderLevel(); return; }
  if(L.bd.mode==="question"){
    earn("answer",2);                        // 题目格答对 +2 经账本（工单04）
    toast("答对啦 +2 金币！",1.6);
    /* 试玩反馈①：途经题目队列——答完一题看还有没有路过的题目格，都答完再结算落点 */
    if(L.bd.queue && L.bd.qi < L.bd.queue.length-1){
      L.bd.qi++; L.bd.q=L.bd.queue[L.bd.qi]; renderLevel(); return;
    }
    landBoard(L.bd.pos);                     // 落点结算：城堡/事件格照发，不吞落格奖励（决策 6）
    return;
  }
}

      <button class="jbtn j-green" onclick="bossRetry()">再来一次</button>
      <button class="jbtn j-orange" style="margin-left:10px" onclick="route('map')">返回地图</button>

function bossWrong(){
  const b=S.lv.boss;
  if(b.locking) return;                 // 反馈窗口内忽略重复点击
  if(mushroomShield("这次不掉心！")) return;
  b.ph--;
  b.locking=true;
  renderLevel();   // 心条 + 受击动画立即反馈
  if(b.ph<=0){ b.outcome="lost"; setTimeout(renderLevel,450); return; }
  const nQ=curLevelObj().board.spaces.length;   // 题目数读生成好的 boss 棋盘 JSON，不再写死 8
  setTimeout(()=>{ b.locking=false; if(S.lv.boss&&S.lv.boss.outcome==="fighting"){ b.qi=Math.min(b.qi+1,nQ-1); renderLevel(); } },1200);
}
function bossCorrect(){
  const b=S.lv.boss;
  b.bh--;
  if(b.bh<=0){
    b.outcome="won";
    bossWinRewards();
    renderLevel();
    return;
  }
  b.qi=Math.min(b.qi+1,curLevelObj().board.spaces.length-1);
  renderLevel();
}
function bossWinRewards(){
  const b=S.lv.boss; if(b.rewarded) return; b.rewarded=true;
  const stars=b.ph===3?3:(b.ph===2?2:1), key=curLevelObj().id, old=S.stars[key]||0;
  if(stars>old) S.stars[key]=stars;
  earn("boss",15);                           // boss 奖励走账本（工单04 口径）
  S.daily[S.lv.subject]=(S.daily[S.lv.subject]||0)+1;
  save();
  checkRestAfterSettle();                    /* 工单10：boss 战同样是结算断点，单次时限到点照样进休息 */
}
function bossRetry(){
  S.lv.boss={bh:3,ph:3,qi:0,outcome:"fighting",rewarded:false};
  renderLevel();
}

    case "galaxy":
      return nightBox(`
        <div class="anim-galaxy" style="position:absolute;left:50%;top:62px;margin-left:-60px;width:120px;height:120px;border-radius:50%;
          background:radial-gradient(circle,rgba(255,246,208,.95),rgba(255,246,208,0) 68%)"></div>

          background:radial-gradient(circle,#FFF6D0,#FFC93C);box-shadow:0 0 18px #FFD24D"></div>`,"银河系在旋转");
    case "bigbang":
      return nightBox(`
        <div class="anim-bang" style="position:absolute;left:50%;top:61px;margin-left:-61px;width:122px;height:122px;border-radius:50%;background:#fff;box-shadow:0 0 40px #fff"></div>`,"宇宙大爆炸");

      return nightBox(`
        <div style="position:absolute;top:34px;left:50%;margin-left:-20px" class="anim-tide-moon">${ic("moon",40)}</div>
        <div class="anim-tide1" style="position:absolute;left:-20px;right:-20px;bottom:34px;height:64px;border-radius:50% 50% 0 0;
          background:rgba(95,168,224,.92)"></div>

          background:rgba(78,143,208,.8)"></div>`,"月亮拉起了潮水");
  }
  switch(anim){
    case "pydraw": {
      /* 铅笔描画：字母按笔画顺序淡入，下划线像笔尖走过 */
      const chs = g.replace(/\s+/g,"").split("").slice(0,6);
      const dash = 320;
      const glyphs = chs.map((c,i)=>{
        const delay=(i*0.28).toFixed(2);
        return `<span class="anim-glyph" style="position:relative;font-family:var(--font-title);font-weight:900;

      }).join("");
      return `<div class="anim-stage anim-pydraw" style="background:linear-gradient(160deg,#FFF8EC,#FFEFD6)">
        <svg width="244" height="244" viewBox="0 0 244 244" style="position:absolute;inset:0">
          <path class="anim-trace" d="M32 190 C 84 190, 104 160, 116 126 S 146 66, 206 66"
            fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" opacity=".55"/>
          <path class="anim-trace" style="--dash:${dash};animation-delay:.4s" d="M40 208 H 204"
            fill="none" stroke="#FFD98A" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;left:0;right:0;top:56px;display:flex;align-items:center;justify-content:center;gap:6px">${glyphs}</div>
        <div class="anim-cap">${ic("bulb",14)} 看老师描一描</div>
      </div>`;
    }
    case "tone": {
      /* 声调帽子：帽子飞上去戴在字母头上 */
      const base = g.replace(/[āáǎà]/g,"a")[0]||"a";
      return `<div class="anim-stage anim-tone" style="background:linear-gradient(160deg,#FFF3EE,#FFE3DA)">
        <span class="anim-capglyph anim-center" style="font-family:var(--font-title);font-weight:900;font-size:104px;color:var(--accent-dk);margin-top:26px">${base}</span>
        <span class="anim-capglyph" style="left:50%;top:50%;transform:translate(-50%,-50%);animation-delay:-.55s;font-family:var(--font-title);font-weight:900;font-size:58px;color:var(--pink,#F0705E);margin-top:-64px">ˉ ˊ ˇ ˋ</span>
        <div class="anim-cap">四声帽子，戴在头上</div>
      </div>`;
    }
    case "merge": {
      /* 两音相拼：声母 + 韵母 靠近 → 拼成音节 */
      const parts = (g||"").split(/\s+/);
      const a = parts[0]||"b", b = parts[1]||"a";
      return `<div class="anim-stage anim-merge" style="background:linear-gradient(160deg,#FFF6EC,#FFE9D2)">
        <span class="anim-m1" style="font-family:var(--font-title);font-weight:900;font-size:66px;color:var(--accent-dk);margin-right:96px">${a}</span>
        <span class="anim-m2" style="font-family:var(--font-title);font-weight:900;font-size:66px;color:var(--green,#3FA85A);margin-left:96px">${b}</span>
        <span class="anim-mword" style="font-family:var(--font-title);font-weight:900;font-size:52px;color:var(--accent,#FF9F43);margin-top:88px">${(a+b).replace(/\s/g,"")}</span>
        <div class="anim-cap">两音相拼，合成一个音节</div>
      </div>`;

    case "walk": {
      /* 小猫散步：横向往返 + 四条腿摆动 */
      return `<div class="anim-stage anim-walk" style="background:linear-gradient(180deg,#EAF8EE 62%,#CDEBD6 62%)">
        <div class="anim-cat" style="position:absolute;top:96px;left:50%;margin-left:-43px">${ic("cat",86)}</div>
        <div class="anim-ground" style="position:absolute;top:186px;left:50%;transform:translateX(-50%);display:flex;gap:26px">

        <div class="anim-cap">Walk like a cat</div>
      </div>`;
    }
    case "rainbow": {
      /* 彩虹条依次升起 */
      const cols=["#F0705E","#FF9F43","#FFD24D","#3FA85A","#3E93D6","#8B6BE8"];
      return `<div class="anim-stage anim-rainbow" style="background:linear-gradient(180deg,#EAF4FF,#D6EAFB)">

    case "share": {

      const items=Array.from({length:6},(_,i)=>`<span style="position:absolute;top:70px;left:110px;--dx:${(i%3-1)*56}px;--dy:${70+Math.floor(i/3)*12}px;animation:x2-drop 2.8s ease-in-out infinite;animation-delay:${(i*0.34).toFixed(2)}s">${ic("apple",26)}</span>`).join("");
      const baskets=Array.from({length:3},(_,b)=>`<div style="position:absolute;top:148px;left:${42+b*62}px;width:44px;height:26px;border-radius:0 0 22px 22px;background:#C89A63;box-shadow:inset 0 4px 0 #A87C4A"></div>`).join("");

        <div class="anim-cap">每人分得一样多</div></div>`;

    case "ruler": {
      /* 长度：卷尺拉开 + 箭头滑到刻度 */

    case "viewcube": {
      /* 观察物体：方块转面，前/侧/后轮流亮 */

/* v0.12.3 月相周期驱动：moonphases 舞台里 #mpDial 是一个「8 相刻度条 + 中央月相盘 + 相名」。
   相盘靠 JS 按 p 值重绘——CSS 画不出晨昏线椭圆的连续变化。
   节拍 700ms/格，一圈 5.6s；定时器登记进 S.timers，换关/换页时 timersClear 会收走，
   不会出现「A 关排的定时器在 B 关里改 DOM」（v0.12.2 踩过的坑）。 */
const MOON_PHASE_NAMES=["新月","蛾眉月","上弦月","盈凸月","满月","亏凸月","下弦月","残月"];
function startMoonPhases(){
  const dial=$("#mpDial"); if(!dial) return;
  const moon=$("#mpMoon"), name=$("#mpName"), ticks=dial.querySelectorAll(".anim-mp-tick");
  let i=0;
  const draw=()=>{
    const p=i/8;
    if(moon) moon.innerHTML=moonPhaseHTML(96,p);
    if(name) name.textContent=MOON_PHASE_NAMES[i];
    ticks.forEach((t,k)=>t.classList.toggle("on",k===i));
  };
  draw();
  const t=setInterval(()=>{ i=(i+1)%8; draw(); },700);
  S.timers.push(t);
}

function letterHTML(sub, st){
  const en=sub==="english", astro=sub==="astro";
  const guideIcon = (en||astro) ? "robot" : "panda";
  const disp = st.display || (st.letters&&st.letters[0]) || "?";
  /* 字号按标题字数收敛：原来 3 字以上一律 62px，「木星的卫星」这种 5 字标题
     在 252px 的卡里会被挤成两行、把整张卡撑到 360px 高，下方的知识点和按钮被压出屏。
     v0.12.4：4 字起逐级收小，并给卡片加最大高度。 */
  const dlen=disp.length;
  const fs = dlen<=1 ? 122 : (dlen===2 ? 84 : (dlen===3 ? 62 : (dlen===4 ? 48 : 38)));
  const exs=(st.examples||[]).map(w=>`<span class="wordchip" onclick="speak('${(w.say||w.text).replace(/'/g,'')}');toast('例词：${w.text}')">${w.icon?ic(w.icon,22):optVisual(w,20)} ${w.text}</span>`).join("");
  const stats=(st.stats||[]).map(s=>`<span class="stat"><b>${s.value}</b><span>${s.label}</span></span>`).join("");
  const say = en?"Look and say! 看一看，读一读～":(astro?"认识新朋友啦！看一看，读一读～":"看卡片，读一读～（不出声也可以）");
  /* 单焦点舞台（档 B1）：字母大卡是唯一的视觉主角，指令走角色气泡这一条通道。
     天文台（v0.10）开场卡画的是按真实比例的天体圆盘 + 一排数据，不再是一个名字；
     v0.12 起配了 anim 的关播学科动画，未登记/未配则回退静态大字卡。 */
  const animBox = animHTML(st.anim, st);
  const cardInner = animBox ? animBox
                 : (st.body ? bodyHTML(st.body, st.bodySize||132)
                 : (st.phase!=null ? moonPhaseHTML(st.bodySize||132, st.phase)
                 : `<span style="font-size:${fs}px">${disp}</span>`));
  return `<div class="sticker teach-stage">
    <div class="q-pill">${st.question||"学一学"}</div>
    <div class="lettercard${animBox?" animcard":(st.body||st.phase!=null?" cardart":"")}">${cardInner}${st.sub?`<span class="csub">${st.sub}</span>`:""}</div>
    ${(st.letters&&st.letters.length>1)?`<div class="hud-sub">本关字母：${st.letters.join(" ")}</div>`:""}
    ${stats?`<div class="statrow">${stats}</div>`:""}
    ${st.fact?`<div class="factline">${st.fact}</div>`:""}
    <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">${exs}</div>
    <div class="mascot-row"><span class="m">${ic(guideIcon,64)}</span>
      <div class="say">${say}</div>
      <div class="mr-btns">
        <button class="jbtn j-cream" onclick="speak('${disp}')">${ic("speaker",20)} ${en?"Listen":"读一读"}</button>
        <button class="jbtn j-green" onclick="teachNext()">${en?"Next ▶":"下一步 ▶"}</button>
      </div>
    </div>
  </div>`;
}

function listenHTML(st){
  listenState={solved:false};
  window._listen={ans:st.answer, hint:st.hint, praise:st.praise, say:st.speakText};
  const prompt=st.prompt||st.speakText||"?";
  const pfs = prompt.length>=3 ? 40 : (prompt.length===2 ? 52 : 68);
  const card=o=>{
    const v=optVisual(o,92);
    const lb=(o.icon||o.body||o.phase!=null)&&o.text?`<span class="slabel">${o.text}</span>`:"";
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px">${v}${lb}</div>`;
  };
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px" class="sticker">
    <div class="q-pill">${st.question||"找一找"}</div>
    ${st.promptBody?`<div class="tcard" style="min-width:168px;width:150px;padding:0 20px;display:grid;place-items:center">${bodyHTML(st.promptBody,84)}</div>`
      : st.promptIcon
      ? `<div class="tcard" style="min-width:168px;width:150px;padding:0 20px;display:grid;place-items:center">${ic(st.promptIcon,84)}</div>`
      : `<div class="tcard" style="font-size:${pfs}px">${prompt}</div>`}
    <div class="optrow">
      ${(st.options||[]).map((o,i)=>`<div class="opt" id="lopt${i}" onclick="pickListen(${i})">${card(o)}</div>`).join("")}
    </div>
    <div id="lfb" style="min-height:40px;display:flex;align-items:center">
      <button class="speakopt" onclick="speak(window._listen.say);toast('🔊 朗读：'+window._listen.say)">${ic("speaker",18)} 想听点这里</button>
    </div>
    <div class="mascot-row"><span class="m">${ic((SUBJECTS[S.lv.subject]||{}).guide||"panda",40)}</span><div class="say">点一点图片答题，答对有 <b style="color:var(--gold-ddk)">星星</b> 哦！答错了也没关系～</div></div>
  </div>`;
}
function pickListen(i){
  const {ans,hint,praise}=window._listen;
  if(listenState.solved) return;
  const el=$("#lopt"+i);
  if(i===ans){ listenState.solved=true; el.classList.add("ok");
    for(let k=0;k<3;k++) if(k!==i) $("#lopt"+k).classList.add("dim");
    $("#lfb").innerHTML=`<span style="font-size:20px;font-weight:900;color:var(--green-dk)">${praise}</span>`;
    confetti(); queueNext(1400);
  } else { el.classList.add("no","shakeit");
    toast(hint,2.2); registerWrong();
    setTimeout(()=>el.classList.remove("no","shakeit"),600); }
}

/* --- 练一练（quiz 通用） --- */
let quizState={solved:false};
function quizHTML(st){
  quizState={solved:false};
  window._quiz={opts:st.options||[],ans:st.answer,hint:st.hint||"再想一想哦",praise:st.praise||"答对啦！"};
  const card=o=>{
    let v=optVisual(o,104);
    /* 无图标的文字选项（星期/月份/数字词）：字号按字数自适应，严防溢出卡片 */
    if(!o.icon&&!o.body&&o.phase==null){
      const n=(o.text||"").length;
      const fs=n<=4?56:(n<=6?44:(n<=8?34:27));
      v=v.replace('class="bigchar"',
                  `class="bigchar" style="font-size:${fs}px;line-height:1.15;word-break:break-word;padding:0 8px;text-align:center"`);
    }
    const lb=(o.icon||o.body||o.phase!=null)&&o.text?`<span class="slabel">${o.text}</span>`:"";
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px">${v}${lb}</div>`;
  };
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px" class="sticker">
    <div class="q-pill">${st.question||""}</div>
    <div class="optrow">
      ${window._quiz.opts.map((o,i)=>`<div class="opt" id="opt${i}" onclick="pickOpt(${i})">${card(o)}</div>`).join("")}
    </div>
    <div id="fb" style="height:34px;font-size:22px;font-weight:900;color:var(--green-dk)"></div>
    <div class="mascot-row"><span class="m">${ic((SUBJECTS[S.lv.subject]||{}).guide||"panda",40)}</span><div class="say">点一点图片答题，答对有 <b style="color:var(--gold-ddk)">星星</b> 哦！答错了也没关系～</div></div>
  </div>`;
}
function pickOpt(i){
  const {opts,ans,hint,praise}=window._quiz;
  if(quizState.solved) return;
  const el=$("#opt"+i);
  if(i===ans){ quizState.solved=true; el.classList.add("ok");
    for(let k=0;k<3;k++){ if(k!==i) $("#opt"+k).classList.add("dim"); }
    $("#fb").textContent="🎉 "+praise;
    confetti();
    queueNext(1400);
  } else { el.classList.add("no","shakeit");
    toast(hint,2.2); registerWrong();
    setTimeout(()=>el.classList.remove("no","shakeit"),600); }
}

/* --- 数一数（count：情境道具 + 场景底色） --- */
function countHTML(st){
  /* 试玩反馈②：countRange 存在时每次进题随机取数+重组选项（同一关重玩不再总是同一道） */
  let n=st.count, opts=st.countOptions;
  if(st.countRange){
    const lo=st.countRange[0], hi=st.countRange[1];
    n=lo+Math.floor(Math.random()*(hi-lo+1));
    opts=[...new Set([n-1,n,n+1].filter(v=>v>=1))].sort((a,b)=>a-b).slice(0,3);
  }
  const icon=st.duckIcon||"duck", unit=st.unit||"个";
  window._count={n,opts,solved:false};
  let items="";
  const cols=Math.min(n,5);
  for(let i=0;i<n;i++){
    const row=Math.floor(i/cols), col=i%cols, inRow=Math.min(cols,n-row*cols);
    const x=(92/(inRow+1))*(col+1)+(Math.random()*6-3), y=52+row*52;
    items+=`<span class="countitem" id="dk${i}" style="left:calc(${x}% - 26px);top:${y}px;animation-delay:${(Math.random()*2).toFixed(2)}s" onclick="tapDuck(${i})">${ic(icon,52)}</span>`;
  }
  const bd=st.backdrop||"pond";
  let deco="";
  if(bd==="night") deco=`<div class="ndeco"></div><span style="position:absolute;right:26px;top:16px">${ic("moon",30)}</span>`;
  else if(bd==="sky") deco=`<span style="position:absolute;left:70px;top:24px">${ic("sunface",30)}</span><span class="cloud" style="width:84px;height:26px;left:40%;top:20px;opacity:.7"></span>`;
  else if(bd==="grass") deco=`<span style="position:absolute;left:24px;bottom:12px">${ic("flower",26)}</span><span style="position:absolute;right:30px;bottom:10px">${ic("sprout",24)}</span><span style="position:absolute;right:60px;top:14px">${ic("tree",34)}</span>`;
  else deco=`<div class="wave"></div><span style="position:absolute;left:36px;top:44px">${ic("flower",28)}</span>`;
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px" class="sticker">
    <div class="q-pill">${st.question||""}</div>
    <div class="pond ${bd}" style="width:92%">${deco}${items}
      <div class="cnt-chip">已数 <b id="cnt" style="font-size:24px;color:var(--blue-dk)">0</b> ${unit}</div></div>
    <div style="display:flex;gap:24px">${opts.map(o=>`<button class="numblock" id="nb${o}" onclick="pickCount(${o})">${o}</button>`).join("")}</div>
  </div>`;
}
function tapDuck(i){
  const dk=$("#dk"+i);
  if(dk.classList.contains("counted")) return;
  dk.classList.add("counted");
  const c=S.lv.counted.length+1; S.lv.counted.push(1);
  $("#cnt").textContent=c;
  const b=document.createElement('span'); b.className='cbub'; b.textContent=c;
  b.style.left=dk.style.left; b.style.top=(parseFloat(dk.style.top)-10)+'px';
  dk.parentElement.appendChild(b); setTimeout(()=>b.remove(),850);
}
function pickCount(v){
  const {n,opts}=window._count;
  if(window._count.solved) return;          /* v0.12.2：双击不再连推进两步 */
  if(v===n){ window._count.solved=true; $("#nb"+v).classList.add("ok"); confetti();
    for(const o of opts) if(o!==v) $("#nb"+o).style.opacity=.4;
    queueNext(1300);
  } else { const b=$("#nb"+v); b.classList.remove("shakeit"); void b.offsetWidth; b.classList.add("shakeit");
    toast("再数一数：点一个数一个数",2); }
}

/* --- 比一比（compare：数据驱动） --- */
function compareHTML(st){
  const l=st.leftCount, r=st.rightCount;
  const ansKey=l===r?"same":(l>r?"left":"right");
  window._cmp={ansKey,solved:false};
  const label=k=>{ const o=(st.compareOptions||[]).find(x=>x.key===k); return o?o.label:k; };
  const grid=(icon,n)=>Array.from({length:n},()=>ic(icon,36)).join("");
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px" class="sticker">
    <div class="q-pill" style="background:#EAFBEF;box-shadow:0 4px 0 #BFE8C9">${st.question||"哪一边更多？"}</div>
    <div style="display:flex;gap:44px">
      <div style="text-align:center"><div class="plate">${grid(st.leftIcon,l)}</div><div style="font-size:15px;color:var(--ink-soft);font-weight:900;margin-top:8px">${label("left")}</div></div>
      <div style="text-align:center"><div class="plate">${grid(st.rightIcon,r)}</div><div style="font-size:15px;color:var(--ink-soft);font-weight:900;margin-top:8px">${label("right")}</div></div>
    </div>
    <div style="display:flex;gap:20px">
      <button class="textopt" onclick="pickCmp('left')">${label("left")}</button>
      <button class="textopt" onclick="pickCmp('right')">${label("right")}</button>
      <button class="textopt" onclick="pickCmp('same')">🟰 ${label("same")}</button>
    </div>
  </div>`;
}
function pickCmp(k){
  const {ansKey}=window._cmp;
  if(window._cmp.solved) return;            /* v0.12.2：双击不再连推进两步 */
  const btns=document.querySelectorAll(".textopt");
  const map={left:0,right:1,same:2};
  if(k===ansKey){ window._cmp.solved=true; btns[map[k]].classList.add("ok"); confetti(); queueNext(1300);
  } else { btns[map[k]].classList.add("shakeit"); setTimeout(()=>btns[map[k]].classList.remove("shakeit"),450);
    toast("一个对着一个，比一比",2); }
}

/* --- 数据比一比（cmp：天文台主力题型，看数据说话而不是认图标）--- */
let cmpState={solved:false};
function cmpHTML(st){
  cmpState={solved:false};
  const rows=st.rows||[];
  window._cmpdata={rows,ans:st.answer,hint:st.hint||"比一比每一条",praise:st.praise||"看对啦！"};
  const disc=(st.viz==="disc");
  const base=st.base||40;
  /* 行星数据动辄差三个数量级（10 小时 vs 5832 小时），线性画短的那条就没了；
     跨度超过 12 倍改用对数刻度，条长看趋势、具体数值一律以右侧标签为准，并标一句刻度口径 */
  const vs=rows.map(r=>Math.abs(r.value)||1e-6), mx=Math.max.apply(null,vs), mn=Math.min.apply(null,vs);
  const loggy=mx/Math.max(mn,1e-6) > 12;
  const wOf=v=>{ v=Math.max(Math.abs(v),mn);
    return loggy ? Math.round(10+88*(Math.log(v)-Math.log(mn))/(Math.log(mx)-Math.log(mn)||1))
                 : Math.round(10+88*v/(mx||1)); };
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px" class="sticker">
    <div class="q-pill">${st.question||"比一比"}</div>
    <div class="cmpbox${disc?" disc":""}">
      ${rows.map((r,i)=>{
        const art=disc?bodyHTML(r.body, bodySize(r.r||Math.abs(r.value), base)):bodyHTML(r.body,44);
        return `<div class="cmprow" id="cr${i}" onclick="pickCmpData(${i})">
          <span class="cmpic">${art}</span><span class="cmpnm">${r.name}</span>
          ${disc?"":`<span class="cmpbar"><i style="width:${wOf(r.value)}%"></i></span>`}
          <span class="cmpv">${r.label!=null?r.label:Math.abs(r.value)+(st.unit||"")}</span>
        </div>`;
      }).join("")}
    </div>
    ${st.note?`<div class="cmp-note">${st.note}${loggy?'<span class="cmp-scale">条长按对数刻度，数值看右边</span>':""}</div>`:""}
    <div id="cfb" style="min-height:28px;font-size:20px;font-weight:900;color:var(--green-dk)"></div>
  </div>`;
}
function pickCmpData(i){
  const {rows,ans,hint,praise}=window._cmpdata;
  if(cmpState.solved) return;
  const el=$("#cr"+i);
  if(i===ans){ cmpState.solved=true; el.classList.add("ok");
    for(let k=0;k<rows.length;k++) if(k!==i) $("#cr"+k).classList.add("dim");
    $("#cfb").textContent="🎉 "+praise; confetti(); queueNext(1600);
  } else { el.classList.remove("shakeit"); void el.offsetWidth; el.classList.add("shakeit");
    toast(hint,2.2); registerWrong(); }
}

/* --- 拼一拼（blend） --- */
let blendState={solved:false};
function blendHTML(st){
  blendState={solved:false};
  const b={p:st.parts,o:(st.options||[]).map(o=>o.text),a:st.answer};
  const correct=b.o[b.a];
  window._blend={b, correct};
  /* 英语拼词会把音节切成 4-5 个字母，字号得跟着最宽的一块缩 */
  const fs=Math.round(Math.min(66, 96/Math.max(1,...b.p.map(t=>t.length))));
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px" class="sticker">
    <div class="q-pill">${st.question||"拼一拼"}</div>
    <div class="blend-row">
      <div class="blend-pair">
        ${b.p.map((t,i)=>`<div class="blend-tile ${i%2?"lean-b":"lean-a"}" style="font-size:${fs}px">${t}</div>`).join('<span class="blend-op">+</span>')}
      </div>
      <div class="blend-to"><span class="ar">⇒</span><span class="cap">合起来</span></div>
      <div id="bresult" class="blend-tile blend-slot" style="font-size:${fs}px">?</div>
    </div>
    <div style="display:flex;gap:18px">
      ${b.o.map((t,i)=>`<button class="numblock" style="width:130px;height:78px;font-size:34px" id="bb${i}" onclick="pickBlend(${i})">${t}</button>`).join("")}
    </div>

}
function pickBlend(i){
  const {b, correct}=window._blend;
  if(blendState.solved) return;
  if(i===b.a){ blendState.solved=true; $("#bb"+i).classList.add("ok");
    const r=$("#bresult"); r.textContent=correct;
    r.classList.remove("blend-slot"); r.classList.add("blend-won");
    confetti(); queueNext(1400);
  } else { const el=$("#bb"+i); el.classList.remove("shakeit"); void el.offsetWidth; el.classList.add("shakeit");

}

/* --- 算一算（arith：情境图示） --- */
let arithState={solved:false};
function arithHTML(st){
  arithState={solved:false};
  const op=st.op, a=st.leftCount, b=st.rightCount, opts=st.arithOptions, icon=st.leftIcon||"duck";
  const correct = op==="+" ? a+b : a-b;
  window._arith={op,a,b,opts,correct};
  /* 可视化口径（与 Swift ArithStepView 一致）：
     小数（≤10）逐个数得清 → 十格阵排布；大数（>10）逐个数会铺满整屏（45 个图标 = 1890px 高，
     远超关卡可视区）→ 改用数字卡等式，让孩子看数字本身，不再平铺图标。 */
  const SMALL = 10;
  const iconCell = (crossed)=>`<div style="position:relative">${ic(icon,34)}${crossed?'<span style="position:absolute;left:-3px;top:13px;width:40px;height:5px;background:var(--coral-dk);border-radius:3px;transform:rotate(-14deg)"></span>':''}</div>`;
  /* 十格阵：每行 5 个，最多 2 行（≤10） */
  const tenFrame=(n,crossed)=>{
    const rows=Math.ceil(n/5);
    let h="";
    for(let r=0;r<rows;r++){
      const cnt=Math.min(5, n-r*5);
      h+=`<div style="display:flex;gap:3px">${Array.from({length:cnt},()=>iconCell(crossed)).join("")}</div>`;
    }
    return `<div style="display:flex;flex-direction:column;gap:3px;align-items:center">${h}</div>`;
  };
  const digitCard=(n,cls)=>`<div class="${cls}" style="width:76px;height:70px;border-radius:16px;background:#fff;
      border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;
      font-family:var(--font-title);font-weight:900;font-size:34px;color:var(--accent-ink)">${n}</div>`;
  const side=(n,crossed)=>{
    if(n<=SMALL) return tenFrame(n,crossed);
    /* 大数：数字卡 + 一枚小图标点题（说明这堆是什么东西），避免平铺 */
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      ${digitCard(n,crossed?"dim":"")}
      <span style="display:flex;align-items:center;gap:4px;opacity:${crossed?".55":"1"}">${ic(icon,22)}
        <span style="font-size:14px;font-weight:900;color:var(--ink-soft)">${st.unit||"个"}</span></span>
    </div>`;
  };
  const big = a>SMALL || b>SMALL;
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px" class="sticker">
    <div class="q-pill">${st.question||""}</div>
    <div style="display:flex;align-items:center;gap:14px;padding:2px 0">
      <div style="display:flex;flex-direction:column;gap:2px">${side(a,false)}</div>
      <span style="font-size:42px;font-weight:900;color:var(--orange-dk)">${op==="+"?"+":"−"}</span>
      <div style="display:flex;flex-direction:column;gap:2px;${op!=="+"?"opacity:.65":""}">${side(b,op!=="+")}</div>
      <span style="font-size:42px;font-weight:900;color:var(--ink-soft)">=</span>
      <div id="aresult" style="width:88px;height:80px;border-radius:16px;background:linear-gradient(180deg,#FFE58A,#F7B32B);border:3.5px solid #B8770A;box-shadow:0 5px 0 rgba(184,119,10,.55);display:grid;place-items:center;font-size:42px;font-weight:900;color:#8A5B00">?</div>
    </div>
    ${big?`<div style="font-size:15px;font-weight:900;color:var(--ink-soft)">数太大啦，看数字算一算</div>`:""}
    <div style="display:flex;gap:24px">
      ${opts.map(n=>`<button class="numblock" id="ab${n}" onclick="pickArith(${n})">${n}</button>`).join("")}
    </div>
  </div>`;
}
function pickArith(n){
  const {correct,op}=window._arith;
  if(arithState.solved) return;
  if(n===correct){ arithState.solved=true; $("#ab"+n).classList.add("ok");
    $("#aresult").textContent=correct;
    confetti(); queueNext(1400);
  } else { const el=$("#ab"+n); el.classList.remove("shakeit"); void el.offsetWidth; el.classList.add("shakeit");
    toast(op==="+"?"指着图一个一个数":"划掉的不算哦",2); }
}

/* --- 分一分（split：数的组成） --- */
let splitState={solved:false};
function splitHTML(st){
  splitState={solved:false};
  const total=st.total, part=st.part, rest=total-part, icon=st.leftIcon||"apple", unit=st.unit||"个";
  window._split={rest,opts:st.arithOptions,hint:st.hint,praise:st.praise,icon};
  const grid=(icon2,n)=>Array.from({length:n},()=>ic(icon2,34)).join("");
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px" class="sticker">

function writeSetup(st){
  const svg=$("#wsvg"); if(!svg) return;
  writeState.svg=svg; writeState.cur=0; writeState.done=false; writeState.drawing=false;
  writeState.sampled=[]; writeState.covered=[]; writeState.len=[];
  (st.strokes||[]).forEach((s,i)=>{
    const p=svg.querySelector("#wpath"+i); if(!p) return;
    const L=p.getTotalLength(); const pts=[];
    for(let d=0;d<=L;d+=1.5){ const pt=p.getPointAtLength(Math.min(d,L)); pts.push({x:pt.x,y:pt.y}); }
    writeState.sampled.push(pts); writeState.covered.push(new Array(pts.length).fill(false));
    writeState.len.push(L);
    const ink=svg.querySelector("#wink"+i), dm=svg.querySelector("#wdemo"+i);
    if(ink){ ink.style.strokeDasharray=L; ink.style.strokeDashoffset=L; }
    if(dm){ dm.style.strokeDasharray=L; dm.style.strokeDashoffset=L; }
  });
  /* 有 Pointer Events 就用它（iPadOS 13+/Chrome）；老 WebView 退回 touch/mouse，
     否则标签页里点上去一点反应都没有。重复 setup 不重复绑（同一个 svg 只绑一次） */
  if(svg.__wBound) { wDemo(); return; }
  svg.__wBound=true;
  if(window.PointerEvent){
    svg.addEventListener("pointerdown",wTraceStart);
    svg.addEventListener("pointermove",wTraceMove);
    svg.addEventListener("pointerup",wTraceEnd);
    svg.addEventListener("pointercancel",wTraceEnd);
    svg.addEventListener("pointerleave",wTraceEnd);
  } else {
    svg.addEventListener("touchstart",e=>{ if(e.cancelable) e.preventDefault(); wTraceStart(e); },{passive:false});
    svg.addEventListener("touchmove",e=>{ if(e.cancelable) e.preventDefault(); wTraceMove(e); },{passive:false});
    svg.addEventListener("touchend",wTraceEnd);
    svg.addEventListener("touchcancel",wTraceEnd);
    svg.addEventListener("mousedown",wTraceStart);
    svg.addEventListener("mousemove",wTraceMove);
    svg.addEventListener("mouseup",wTraceEnd);
    svg.addEventListener("mouseleave",wTraceEnd);
  }
  wDemo();
}

/* 统一取坐标：PointerEvent 直接有 clientX/Y，TouchEvent 要取触点 */
function wPt(e){
  if(!e) return null;
  if(e.touches&&e.touches.length) return e.touches[0];
  if(e.changedTouches&&e.changedTouches.length) return e.changedTouches[0];
  return e;
}

/* 屏幕坐标 → viewBox(0-100) 坐标。.frame 被 fitFrame 整体 scale 过，
   所以必须用 getBoundingClientRect 的实测宽高换算，不能按 300px 写死。 */
function wTracePos(e){
  const svg=writeState.svg; if(!svg) return null;
  const p=wPt(e); if(!p||p.clientX===undefined||p.clientY===undefined) return null;
  const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return null;
  return {x:(p.clientX-r.left)/r.width*100, y:(p.clientY-r.top)/r.height*100};
}

function wTraceStart(e){
  if(writeState.done||!writeState.svg) return;
  if(e&&e.pointerType==="mouse"&&e.button!==undefined&&e.button!==0) return;   /* 只认左键 */
  /* 真指针事件才做捕获（touch/mouse 回退路径没有 pointerId）；合成事件捕获会抛，不能让整段挂掉 */
  if(e&&e.pointerId!==undefined){ try{ writeState.svg.setPointerCapture(e.pointerId); }catch(err){} }
  writeState.drawing=true; wTraceMove(e);
}

function wTraceMove(e){
  if(!writeState.drawing||writeState.done) return;
  const i=writeState.cur;
  if(i>=writeState.sampled.length) return;
  const pos=wTracePos(e); if(!pos) return;
  const pts=writeState.sampled[i], cov=writeState.covered[i];
  if(!pts||!pts.length) return;
  const TOL=13;   /* viewBox 单位：约 13% 字格，够宽容也不至于糊到别的笔画上 */
  let hit=0;
  for(let k=0;k<pts.length;k++){
    const dx=pts[k].x-pos.x, dy=pts[k].y-pos.y;
    if(dx*dx+dy*dy<=TOL*TOL){ cov[k]=true; }
    if(cov[k]) hit++;
  }
  const frac=hit/pts.length;
  /* 绿色笔迹按已描比例显出来。cov 只增不减，所以手指滑出笔画走廊时不会倒回去 */
  const ink=writeState.svg.querySelector("#wink"+i);
  if(ink&&frac>0.01){
    const L=writeState.len[i]||ink.getTotalLength();
    ink.style.transition="none"; ink.style.strokeDashoffset=L*(1-frac);
  }
  if(frac>=0.85) wStrokeDone();
}

function wTraceEnd(e){ writeState.drawing=false; }

/* 演示当前这一笔：红色演示层从笔头走一遍；已经描绿的笔迹不受影响 */
function wDemo(){
  if(writeState.done||!writeState.svg) return;
  const i=writeState.cur;
  if(i>=writeState.sampled.length) return;
  const dm=writeState.svg.querySelector("#wdemo"+i);
  if(!dm) return;
  const L=writeState.len[i]||dm.getTotalLength();
  dm.style.transition="none"; dm.style.strokeDashoffset=L;
  void dm.getBBox().width;                                   /* 强制 reflow，否则第二次演示不动 */
  dm.style.transition="stroke-dashoffset .8s ease"; dm.style.strokeDashoffset=0;
}

/* 「▶️ 再看一遍演示」：只重播当前笔，不动已描的绿笔迹 */
function wReplay(){
  if(writeState.done||!writeState.svg) return;
  writeState.drawing=false;
  wDemo();
}

/* 一笔描够 85% → 落笔定色、等下一笔；全部描完 → 过关 */
function wStrokeDone(){
  if(writeState.done||!writeState.svg) return;
  const i=writeState.cur;
  if(i>=writeState.sampled.length) return;
  const ink=writeState.svg.querySelector("#wink"+i), dm=writeState.svg.querySelector("#wdemo"+i);
  if(ink){ ink.style.transition="none"; ink.style.strokeDashoffset=0; }
  if(dm) dm.style.opacity=0;
  writeState.drawing=false;
  writeState.cur++;
  const st=window._w&&window._w.st;
  const fb=$("#wfb");
  if(writeState.cur>=writeState.sampled.length){
    writeState.done=true;
    if(fb){ fb.style.color="var(--green-dk)"; fb.textContent="写好「"+(st&&st.char||"")+"」啦！"; }
    if(window._w&&window._w.sub==="cn"&&st) learnHanzi(st.char);   /* 写完才入汉字册 */
    winStep(st&&st.praise);
    return;
  }
  if(fb){ fb.style.color="var(--green-dk)"; fb.textContent="写对啦！接着描第 "+(writeState.cur+1)+" 笔"; }
  wDemo();
}

function writeAuto(st){
  writeState.cur=0; writeState.done=false;
  if(!writeState.svg) return;
  const n=(st.strokes||[]).length;
  const stepOne=()=>{
    if(writeState.cur>=n){ if(window._w.sub==="cn") learnHanzi(st.char); winStep(st.praise,300); return; }
    const i=writeState.cur;
    const ink=writeState.svg.querySelector("#wink"+i), dm=writeState.svg.querySelector("#wdemo"+i);
    if(ink){ ink.style.transition="stroke-dashoffset .3s"; ink.style.strokeDashoffset=0; }
    if(dm) dm.style.opacity=0;
    writeState.cur++; setTimeout(stepOne,340);
  };
  setTimeout(stepOne,200);
}

    return `<div class="fcard ${red?'red':''}" id="cd${i}" onclick="cardsPick(${i})"><span class="pc-rank">${v}</span><span class="pc-suit">${suits[i%4]}</span></div>`; }).join("");
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px" class="sticker">

function cardsPick(i){
  const cs=cardsState; if(cs.solved||cs.busy) return;
  const st=window._cards.st, el=$("#cd"+i);
  const idx=cs.sel.indexOf(i);
  if(idx>=0){ cs.sel.splice(idx,1); el.classList.remove("sel"); }
  else { if(cs.sel.length>=st.pick) return; cs.sel.push(i); el.classList.add("sel"); }
  const fb=$("#stepfb"); fb.textContent="已选 "+cs.sel.length+" / "+st.pick+" 张";
  if(cs.sel.length===st.pick){
    cs.busy=true;
    const vals=cs.sel.map(k=>st.cards[k]);
    if(cardsCheck(vals,st.target)){
      cs.solved=true; cs.sel.forEach(k=>$("#cd"+k).classList.add("ok")); winStep(st.praise);
    } else {
      setTimeout(()=>{ cs.sel.forEach(k=>$("#cd"+k).classList.remove("sel")); cs.sel=[]; cs.busy=false; fb.textContent="";
        nudge("没凑成哦，换几张牌试试（不扣分）"); },550);
    }
  }
}

function cardsCheck(vals,target){
  if(vals.length===2) return vals[0]+vals[1]===target;
  const n=vals.length, total=1<<(n-1);
  for(let mask=0;mask<total;mask++){ let s=vals[0]; for(let j=1;j<n;j++){ s+= ((mask>>(j-1))&1)? -vals[j] : vals[j]; } if(s===target) return true; }
  return false;
}

function cardsAuto(){
  const st=window._cards.st, cards=st.cards, n=cards.length, pick=st.pick;
  let found=null;
  for(let a=0;a<n&&!found;a++) for(let b=a+1;b<n&&!found;b++){ if(pick===2&&cardsCheck([cards[a],cards[b]],st.target)) found=[a,b]; }
  for(let a=0;a<n&&!found;a++) for(let b=a+1;b<n&&!found;b++) for(let c=b+1;c<n&&!found;c++){ if(pick===3&&cardsCheck([cards[a],cards[b],cards[c]],st.target)) found=[a,b,c]; }
  if(!found){ found=[]; for(let i=0;i<pick;i++) found.push(i); }
  found.forEach((k,idx)=>setTimeout(()=>cardsPick(k),220*(idx+1)));
}

let sudokuState={grid:[],given:[],size:4,symbols:[],solution:[],solved:false,pending:null};

function sudCellTap(r,c){

/* sudPlace / sudBounce（v0.13 补回）：v0.11 合并时和写字三件套一起被删，
   但 onclick 里的调用还在——点图标抛 ReferenceError，格子永远填不上。
   下面是 d838b8e 的原实现，状态与元素 id（sudokuState / #sd{r}_{c} / #sdpalette）至今没变。 */
function sudPlace(v){
  const Sd=sudokuState; if(!Sd.pending) return;
  const r=Sd.pending[0], c=Sd.pending[1], size=Sd.size;
  for(let i=0;i<size;i++){ if((Sd.grid[r][i]===v&&i!==c)||(Sd.grid[i][c]===v&&i!==r)){ sudBounce(); return; } }
  const br=r<2?0:2, bc=c<2?0:2;
  for(let dr=0;dr<2;dr++) for(let dc=0;dc<2;dc++){ const rr=br+dr, cc=bc+dc;
    if((rr!==r||cc!==c)&&Sd.grid[rr][cc]===v){ sudBounce(); return; } }
  Sd.grid[r][c]=v;
  const el=$("#sd"+r+"_"+c);
  if(el){ el.innerHTML=ic(Sd.symbols[v],44); el.classList.add("filled"); }
  $("#sdpalette").innerHTML=""; Sd.pending=null;
  for(let rr=0;rr<size;rr++) for(let cc=0;cc<size;cc++) if(Sd.grid[rr][cc]<0) return;
  let ok=true; for(let rr=0;rr<size;rr++) for(let cc=0;cc<size;cc++) if(Sd.grid[rr][cc]!==Sd.solution[rr][cc]) ok=false;
  if(ok){ Sd.solved=true; winStep(window._sud.praise); }
  else nudge("再检查一下，每行每列不能重复哦");
}

function sudBounce(){
  const p=sudokuState.pending; if(!p) return;
  const el=$("#sd"+p[0]+"_"+p[1]);
  if(el){ el.classList.remove("shakeit"); void el.offsetWidth; el.classList.add("shakeit"); }
  toast("这一行/列/小宫已经有它啦（不扣分）",1.8);
}

function sudokuAuto(){
  const Sd=sudokuState;
  for(let r=0;r<Sd.size;r++) for(let c=0;c<Sd.size;c++){
    if(Sd.given.includes(r*Sd.size+c)) continue;
    Sd.grid[r][c]=Sd.solution[r][c];
    const el=$("#sd"+r+"_"+c); if(el){ el.innerHTML=ic(Sd.symbols[Sd.solution[r][c]],44); el.classList.add("filled"); }
  }
  setTimeout(()=>{ if(!Sd.solved){ Sd.solved=true; winStep(window._sud.praise,400); } },350);
}

let clockSet={h:12,m:0,solved:false,targetH:3,targetM:0};
let clockDrag=null;          /* "h" = 抓的是短针（小时），"m" = 抓的是长针（分钟）；null = 没在拖 */

function clockLabel(h,m){ return h+":"+(m===0?"00":"30"); }

/* 指针带 id（v1.0.1）：拖动时只改这两条线的 x2/y2，不重刷整个 svg，
   否则 pointer capture 会跟着被替换掉的节点一起丢，拖到一半就断。 */
function clockFaceSVG(hour,minute,size){
  const mAng=minute/60*360, hAng=((hour%12)+minute/60)/12*360;
  const hand=(ang,len,w,id)=>{ const a=ang*Math.PI/180;
    return `<line${id?` id="${id}"`:""} x1="50" y1="50" x2="${(50+Math.sin(a)*len).toFixed(1)}" y2="${(50-Math.cos(a)*len).toFixed(1)}" stroke="#57433A" stroke-width="${w}" stroke-linecap="round"/>`; };
  let nums="";
  for(let n=1;n<=12;n++){ const a=n/12*360*Math.PI/180;
    nums+=`<text x="${(50+Math.sin(a)*38).toFixed(1)}" y="${(50-Math.cos(a)*38+3).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="900" fill="#57433A">${n}</text>`; }
  return `<svg viewBox="0 0 100 100" style="width:${size}px;height:${size}px">
    <circle cx="50" cy="50" r="47" fill="#FFFDF6" stroke="#D8CBAF" stroke-width="2.5"/>
    ${nums}${hand(hAng,22,4,"ckhandh")}${hand(mAng,34,2.5,"ckhandm")}<circle cx="50" cy="50" r="3" fill="#C94A3A"/></svg>`;
}

function clockHTML(st){
  window._clk={ans:st.answer, praise:st.praise, solved:false};
  let body;
  if(st.mode==="read"){
    body=`<div style="display:flex;gap:30px;align-items:center;justify-content:center">
      ${clockFaceSVG(st.hour,st.minute,210)}
      <div style="display:flex;flex-direction:column;gap:14px">${(st.options||[]).map((o,i)=>`<button class="numblock" style="width:auto;min-width:150px;padding:0 26px;font-size:26px" id="ck${i}" onclick="clockReadPick(${i})">${o}</button>`).join("")}</div></div>`;
  } else {
    body=`<div style="display:flex;gap:26px;align-items:center;justify-content:center">
      <div id="ckface" style="touch-action:none;cursor:grab">${clockFaceSVG(12,0,210)}</div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
        <div style="display:flex;gap:22px;font-size:15px;font-weight:900;color:var(--ink-soft);align-items:baseline">
          <span>当前 <b id="cknow" style="font-size:23px;color:var(--ink)">12:00</b></span>
          <span>目标 <b style="font-size:23px;color:var(--coral-dk)">${clockLabel(st.hour,st.minute)}</b></span></div>
        <div style="font-size:14.5px;font-weight:800;color:var(--ink-soft)">手指拨指针：外圈长针拨分钟，中间短针拨小时</div>
        <div style="display:flex;gap:10px;align-items:center"><button class="speakopt" onclick="ckHour(-1)">－ 时</button><span id="ckhour" style="font-size:28px;font-weight:900;width:40px;text-align:center">12</span><button class="speakopt" onclick="ckHour(1)">＋ 时</button></div>
        <div style="display:flex;gap:10px">
          <button class="speakopt ck-on" id="ckm0" onclick="ckMin(0)">整点 :00</button>
          <button class="speakopt" id="ckm30" onclick="ckMin(30)">半点 :30</button></div>
        <button class="jbtn j-green" onclick="ckConfirm()">拨好啦 ✓</button></div></div>`;
  }
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px" class="sticker">
    <div class="q-pill">${st.question||"认识钟表"}</div>${body}
    <div id="stepfb" style="min-height:28px;font-size:20px;font-weight:900"></div></div>`;
}

function clockSetSetup(st){
  clockSet={h:12,m:0,solved:false,targetH:st.hour,targetM:st.minute};
  ckRenderFace(); ckBindDrag();
}

/* ckHour / ckMin（v0.13 补回）：拨钟的两个按钮 onclick 一直在，实现被 v0.11 合并删掉，
   点「＋ 时 / － 时 / 整点 / 半点」全都没反应，认钟表「拨一拨」那一关永远拨不到目标时间。 */
function ckHour(d){ if(clockSet.solved) return; clockSet.h=((clockSet.h-1+d+12)%12)+1; ckRenderFace(); }
function ckMin(m){ if(clockSet.solved) return; clockSet.m=m; ckRenderFace(); }

/* 指针拖拽（v1.0.1）：原来钟面只能靠「－ 时 / ＋ 时」加减，试玩反馈「这个没法拨动指针」——
   孩子以为指针能拖，点按钮又像在做加法，和「拨钟」对不上。现在两根针都能用手指拖：
     外圈（半径 ≥26/50）抓长针 → 定分钟（吸附 0/30，与「整点/半点」两档一致）
     里圈抓短针        → 定小时（12 格吸附，短针随分钟偏半格）
   坐标用 svg 的 getBoundingClientRect() 实测换算：.frame 被 fitFrame() 整体 scale()，写死像素会偏。
   拖动期间只改两条针线的 x2/y2（ckPaint），不重刷 svg——重刷会让 pointer capture 跟着失效。 */
function ckBindDrag(){
  if(!window.__ckMoveBound){
    window.__ckMoveBound=1;
    const move=e=>{ if(clockDrag) ckMove(e); };
    const up=()=>{ clockDrag=null; };
    if(window.PointerEvent){
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
    }else{
      window.addEventListener("touchmove",move,{passive:false});
      window.addEventListener("touchend",up); window.addEventListener("touchcancel",up);
      window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    }
  }
  const face=$("#ckface"); if(!face||face.dataset.ckbound) return;
  face.dataset.ckbound="1";
  if(window.PointerEvent) face.addEventListener("pointerdown",ckDown);
  else { face.addEventListener("touchstart",ckDown,{passive:false}); face.addEventListener("mousedown",ckDown); }
}

function ckPt(e){
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return {x:t.clientX,y:t.clientY};
}
function ckAngle(e){
  const svg=$("#ckface svg"); if(!svg) return null;
  const r=svg.getBoundingClientRect(), p=ckPt(e);
  if(!r.width||!r.height) return null;
  const dx=(p.x-r.left)/r.width*100-50, dy=(p.y-r.top)/r.height*100-50;
  let deg=Math.atan2(dx,-dy)*180/Math.PI; if(deg<0) deg+=360;
  return {deg:deg,rad:Math.hypot(dx,dy)};
}
function ckDown(e){
  if(clockSet.solved) return;
  const g=ckAngle(e); if(!g) return;
  if(g.rad>50){ clockDrag=null; return; }            /* 点在钟面外不抓 */
  clockDrag = g.rad>=26 ? "m" : "h";
  if(e.cancelable&&e.preventDefault) e.preventDefault();
  try{ if(e.target&&e.target.setPointerCapture&&e.pointerId!=null) e.target.setPointerCapture(e.pointerId); }catch(_){}
  ckMove(e);
}
function ckMove(e){
  if(!clockDrag||clockSet.solved) return;
  const g=ckAngle(e); if(!g||g.rad<9) return;        /* 太靠圆点不判方向 */
  if(e.cancelable&&e.preventDefault) e.preventDefault();
  if(clockDrag==="h"){
    /* 短针角度 = 30h + 0.5m，所以先减掉分钟带来的半格再四舍五入 */
    let h=Math.round((g.deg-clockSet.m/2)/30)%12; if(h<=0) h+=12;
    clockSet.h=h;
  }else{
    clockSet.m = (g.deg<=90||g.deg>=270) ? 0 : 30;
  }
  ckPaint();
}

function ckRenderFace(){
  const f=$("#ckface"); if(!f) return;
  if(f.querySelector("svg")) f.innerHTML=clockFaceSVG(clockSet.h,clockSet.m,210);
  ckPaint();
}

/* 只刷「显示层」：两根针的角度、小时数字、当前时间、整点/半点选中态 */
function ckPaint(){
  const svg=$("#ckface svg");
  if(svg){
    const put=(id,ang,len)=>{ const el=svg.querySelector("#"+id); if(!el) return;
      const a=ang*Math.PI/180;
      el.setAttribute("x2",(50+Math.sin(a)*len).toFixed(1));
      el.setAttribute("y2",(50-Math.cos(a)*len).toFixed(1)); };
    put("ckhandh",((clockSet.h%12)+clockSet.m/60)/12*360,22);
    put("ckhandm",clockSet.m/60*360,34);
  }
  const h=$("#ckhour"); if(h) h.textContent=clockSet.h;

function moneyAdd(i){ if(moneyState.solved) return; moneyState.sel.push(i); moneyRenderPaid(); }

/* moneyRemove（v0.13 补回）：已付钱币的「✕」点了没反应，多付了退不回来，
   而 moneyConfirm 的提示语还写着「点一点已选的钱币去掉一些」。 */
function moneyRemove(idx){ if(moneyState.solved) return; moneyState.sel.splice(idx,1); moneyRenderPaid(); }

function moneyConfirm(){
  const st=window._money.st; if(moneyState.solved) return;
  const total=moneyState.sel.reduce((s,k)=>s+st.denominations[k].value,0);
  if(total===st.price){ moneyState.solved=true; winStep(st.praise); }
  else if(total>st.price) nudge("付多啦！点一点已选的钱币去掉一些～");
  else nudge("还差 "+(st.price-total)+" 角，再补一点钱～");
}

function moneyRenderPaid(){
  const st=window._money.st;
  const total=moneyState.sel.reduce((s,k)=>s+st.denominations[k].value,0);
  const chips=moneyState.sel.map((k,idx)=>`<span class="mchip" onclick="moneyRemove(${idx})">${st.denominations[k].label}✕</span>`).join(" ");
  $("#moneypaid").innerHTML=`已付 <b style="font-size:24px">${total}</b> 角　${chips}`;
}

function moneyAuto(){
  const st=window._money.st, dens=st.denominations, price=st.price;
  const dp=new Array(price+1).fill(-1); dp[0]=0;
  for(let v=0;v<=price;v++){ if(dp[v]<0) continue;
    dens.forEach((d,i)=>{ if(v+d.value<=price&&dp[v+d.value]<0) dp[v+d.value]=i; }); }
  const picks=[]; let v=price;
  while(v>0&&dp[v]>=0){ picks.push(dp[v]); v-=dens[dp[v]].value; }
  picks.forEach((k,idx)=>setTimeout(()=>moneyAdd(k),160*(idx+1)));
}

function afterStepRender(){
  const st=currentStepObj(); if(!st) return;
  voiceNarrateSoon();          /* 票 10：普通题 / 棋盘题 / boss 内嵌题都从这一处进入 */
  if(st.kind==="write") writeSetup(st);
  else if(st.kind==="clock"&&st.mode==="set") clockSetSetup(st);
  else if(st.kind==="mappuzzle") mapSetup(st);
  if(S.autoSolve&&["write","muldiv","cards","sudoku","clock","money","mappuzzle",
                   "match","shadow","tapall","sequence","balance","sort","lineup","spotlight"].includes(st.kind)){
    setTimeout(()=>autoSolveStep(st),350);
  }
}

function autoSolveStep(st){
  if(st.kind==="muldiv"){ setTimeout(()=>muldivPick(st.answer),300); }
  else if(st.kind==="clock"){
    if(st.mode==="read"){ setTimeout(()=>clockReadPick(st.answer),300); }
    else { setTimeout(()=>{ clockSet.h=st.hour; clockSet.m=st.minute; ckRenderFace(); ckConfirm(); },300); }
  }
  else if(st.kind==="cards"){ cardsAuto(); }
  else if(st.kind==="sudoku"){ sudokuAuto(); }
  else if(st.kind==="money"){ moneyAuto(); }
  else if(st.kind==="mappuzzle"){ mapAuto(); }
  else if(st.kind==="write"){ writeAuto(st); }
  else if(["match","shadow","tapall","sequence","balance","sort","lineup","spotlight"].includes(st.kind)){
    setTimeout(()=>kindAuto(st),200);
  }
}

/* ---------- 拼地图（v0.11 重做：真实省份/大洲轮廓 + 托盘拖拽回原图）
   旧版用手写四边形假地图、块初始位置就在屏外。新版：
   · CHINA_MAP（33 省 + 南海诸岛小图框）/ WORLD_MAP（七大洲）由离线工具从
     DataV 100000_full + Natural Earth 110m 抽稀生成，内嵌为 SVG path；
   · 题面只给 pieces:["新疆",...]，地图全貌打底、目标轮廓虚线显示；
   · 托盘卡片是真实轮廓 + 省名，拖近目标 55px 内吸附，全部归位过关。 */
let mapState={placed:[],drag:null};
function pzMap(st){ return st.map==="world"?WORLD_MAP:CHINA_MAP; }
function mappuzzleHTML(st){
  mapState={placed:(st.pieces||[]).map(()=>false),drag:null};
  window._map={st:st};
  const M=pzMap(st), pieces=st.pieces||[];
  /* 宽度自适应（v1.0.1）：Boss 关卡把题面夹在上下两条血量行之间，可用高度只有 ~546，
     600px 地图会顶出底部 78px（preview_sweep 抓到 24 处越界）。Boss 里收窄到 460。 */
  const bossed=!!(S.lv&&S.lv.boss);
  const MW=bossed?520:600, MH=Math.round(MW*M.h/M.w), TRAY=bossed?88:104;
  const bg=M.ps.map(p=>`<path d="${p.d}" fill="#F4F1E7" stroke="#fff" stroke-width=".3"/>`).join("");
  const sea=M.sea?`<g><rect x="${M.sea.b[0]-.6}" y="${M.sea.b[1]-.6}" width="${M.sea.b[2]-M.sea.b[0]+1.2}" height="${M.sea.b[3]-M.sea.b[1]+1.2}" rx="1.2" fill="rgba(255,255,255,.55)" stroke="#C9BD9F" stroke-width=".3" stroke-dasharray="1 0.8"/><path d="${M.sea.d}" fill="#E2EDDA" stroke="#9FB8A8" stroke-width=".18"/></g>`:"";
  const ghosts=pieces.map((n,i)=>{
    const p=M.ps.find(x=>x.n===n); if(!p) return "";
    return `<path id="pzg${i}" d="${p.d}" fill="rgba(255,255,255,.5)" stroke="#B9A98F" stroke-width=".45" stroke-dasharray="1.4 1"/>`;
  }).join("");
  const cards=pieces.map((n,i)=>{
    const p=M.ps.find(x=>x.n===n); if(!p) return "";
    /* 托盘卡片宽度按块数自适应（v1.0.1）：原来写死 96px，6 块时最后一块会伸出 600px 地图外；
       7 块（七大洲）更放不下。名字最长 3 字（南极洲），64px 也够。 */
    const cw=Math.min(96, Math.max(52, Math.floor((MW-8*(pieces.length-1))/pieces.length)));
    const total=pieces.length*cw+(pieces.length-1)*8;
    const tx=Math.round((MW-total)/2)+i*(cw+8), ty=MH+12;
    return `<div class="pz-piece" id="mb${i}" style="left:${tx}px;top:${ty}px;width:${cw}px;height:${TRAY-14}px">
      <svg viewBox="${p.b[0]} ${p.b[1]} ${Math.max(p.b[2]-p.b[0],.5)} ${Math.max(p.b[3]-p.b[1],.5)}" preserveAspectRatio="xMidYMid meet">
        <path d="${p.d}" fill="var(--accent)" fill-opacity=".78" stroke="#fff" stroke-width=".8"/></svg>
      <span class="pz-name">${p.n}</span></div>`;
  }).join("");
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px" class="sticker">
    <div class="q-pill">${st.question||"拼一拼：把它放回地图"}</div>
    <div id="mapwrap" style="position:relative;width:${MW}px;height:${MH+TRAY}px">
      <div id="mappanel" style="position:absolute;left:0;top:0;width:${MW}px;height:${MH}px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#CDE9F6,#BFE0F2);box-shadow:inset 0 0 0 3px #fff">
        <svg viewBox="0 0 ${M.w} ${M.h}" width="${MW}" height="${MH}" preserveAspectRatio="none">${bg}${sea}${ghosts}</svg>
      </div>
      ${cards}
    </div>
    <div id="stepfb" style="min-height:24px;font-size:16px;font-weight:900;color:var(--ink-soft)">拖着轮廓块回到虚线位置，靠近就会吸住</div></div>`;
}
function mapSetup(st){
  (st.pieces||[]).forEach((n,i)=>{ const el=$("#mb"+i); if(!el) return;
    el.addEventListener("pointerdown",e=>mapDragStart(e,i,el)); });
  mapFit();
}
/* 拼图整体缩到容器里（v1.0.1）：Boss 关把题面夹在两条血量行之间，可用高度只有常规关的一半，
   600px 地图 + 104px 托盘会把托盘顶到下半屏外面。做法是量一次容器再整体 scale：
   卡片坐标仍是布局 px（#mapwrap 的子元素），拖拽换算靠 mapDragStart 里量到的 sc，缩放不影响吸附判定。 */
function mapFit(){
  const wrap=$("#mapwrap"); if(!wrap) return;
  const box=wrap.parentElement; if(!box) return;
  /* 自然高度取渲染时写进 style 的那一版；不能先清空——#mapwrap 的子元素全是绝对定位，
     清掉 height 会塌成 0（第一次改这里就踩过，Boss 拼图被顶到屏幕外）。 */
  const natH=parseFloat(wrap.style.height)||wrap.offsetHeight; if(!natH) return;
  const used=[...box.children].filter(c=>c!==wrap)
    .reduce((s,c)=>s+(c.offsetHeight||0),0) + 24;      /* 兄弟元素 + 三个 10px 间距的余量 */
  const avail=(box.clientHeight||0)-used;
  if(avail>0 && natH>avail){
    const k=Math.max(0.5, avail/natH);
    wrap.style.transformOrigin="50% 0";
    wrap.style.transform="scale("+k.toFixed(3)+")";
    wrap.style.height=Math.round(natH*k)+"px";
  }
}
function pzTarget(i){
  const st=window._map.st, M=pzMap(st), p=M.ps.find(x=>x.n===st.pieces[i]);
  const wrap=$("#mapwrap"), MW=wrap.clientWidth, MH=Math.round(MW*M.h/M.w);
  return { left:p.b[0]*MW/M.w, top:p.b[1]*MH/M.h,
           width:Math.max((p.b[2]-p.b[0])*MW/M.w,14), height:Math.max((p.b[3]-p.b[1])*MH/M.h,14),
           cx:(p.b[0]+p.b[2])/2*MW/M.w, cy:(p.b[1]+p.b[3])/2*MH/M.h };
}
/* 拖拽（v1.0.1 修）：屏幕坐标 → 布局坐标要除以 fitFrame 的缩放比。
   原来直接把 clientX 当 style.left 用，整页被 scale() 过时卡片会按缩放比多走/少走，
   放在地图边上的大块（黑龙江、广东、大洋洲）就永远落不进 55px 吸附圈——
   这是「地图没有可以拖动的」之后暴露的第二层缺陷，之前一块都渲染不出来所以没人看见。 */
function mapDragStart(e,i,el){
  if(mapState.placed[i]) return;
  e.preventDefault();
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  const wrap=$("#mapwrap"), wr=wrap.getBoundingClientRect();
  const sc=(wr.width&&wrap.clientWidth)?wr.width/wrap.clientWidth:1;
  mapState.drag={i,el,sc,sx:e.clientX,sy:e.clientY,
                 ox:parseFloat(el.style.left)||0,oy:parseFloat(el.style.top)||0};
  el.classList.add("drag"); el.style.zIndex=40;
  window.addEventListener("pointermove",mapDragMove);
  window.addEventListener("pointerup",mapDragEnd);
  window.addEventListener("pointercancel",mapDragEnd);
}
function mapDragMove(e){
  const d=mapState.drag; if(!d) return;
  d.el.style.left=(d.ox+(e.clientX-d.sx)/d.sc)+"px";
  d.el.style.top=(d.oy+(e.clientY-d.sy)/d.sc)+"px";
}
function mapDragEnd(){
  const d=mapState.drag; if(!d) return; mapState.drag=null;
  d.el.removeEventListener("pointermove",mapDragMove);
  d.el.removeEventListener("pointerup",mapDragEnd);
  d.el.removeEventListener("pointercancel",mapDragEnd);
  d.el.classList.remove("drag"); d.el.style.zIndex="";
  window.removeEventListener("pointermove",mapDragMove);
  window.removeEventListener("pointerup",mapDragEnd);
  window.removeEventListener("pointercancel",mapDragEnd);
  const i=d.i, t=pzTarget(i);
  /* 吸附判断用布局坐标（style.left + offsetWidth，两者都不受 transform 影响） */
  const cx=(parseFloat(d.el.style.left)||0)+d.el.offsetWidth/2;
  const cy=(parseFloat(d.el.style.top)||0)+d.el.offsetHeight/2;
  if(Math.hypot(cx-t.cx,cy-t.cy)<55){ mapPlace(i,d.el,t); }
  else{
    d.el.style.transition="left .3s,top .3s";
    d.el.style.left=d.ox+"px"; d.el.style.top=d.oy+"px";
    setTimeout(()=>d.el.style.transition="",320);
  }
}
function mapPlace(i,el,t){
  mapState.placed[i]=true;
  const st=window._map.st;
  el.style.transition="left .28s,top .28s,width .28s,height .28s,border-radius .28s,box-shadow .28s";
  el.style.left=t.left+"px"; el.style.top=t.top+"px";
  el.style.width=t.width+"px"; el.style.height=t.height+"px";
  el.classList.add("ok"); el.style.pointerEvents="none";
  const g=$("#pzg"+i); if(g) g.style.display="none";
  learnGeo(st.pieces[i]);
  const placed=mapState.placed.filter(Boolean).length;
  $("#stepfb").textContent="✅ "+st.pieces[i]+" 回家啦（"+placed+" / "+st.pieces.length+"）";
  if(mapState.placed.every(Boolean)) setTimeout(()=>winStep(st.praise||"地图拼好啦！",600),420);
}
function mapAuto(){
  const st=window._map.st; if(!st) return;
  (st.pieces||[]).forEach((n,i)=>setTimeout(()=>{
    const el=$("#mb"+i), t=pzTarget(i);
    if(el) mapPlace(i,el,t);
  },340*(i+1)));
}

function tankTap(ev){
  const glass=$("#glass");
  if(S.lab.phase!=="play"){ if(S.lab.phase==="guess") toast("先完成猜一猜哦 🔮"); return; }
  if(!S.lab.sel){ toast("先在左边工具箱里选一个物品哦 🧰"); return; }
  const rect=glass.getBoundingClientRect();
  const x=ev.clientX-rect.left;

  dropIntoTank(item,x);

  S.lab.sel=null; $("#glass").classList.remove("armed");

function dropIntoTank(item,x){
  const glass=$("#glass"); const H=glass.clientHeight, waterTop=52;
  const el=document.createElement('div'); el.className='titem'; el.innerHTML=ic(item.icon,66);
  const px=Math.min(Math.max(x-33,30),glass.clientWidth-96);
  el.style.left=px+"px"; el.style.top="-70px"; glass.appendChild(el);
  // 与 Swift BuoyancyModel 相同参数。⚠️ 模型里 y 正方向是「水面向上」，渲染时 must 取负换算成 CSS top，
  // 之前写成 waterTop + st.y 把轴翻了过来：不管浮还是沉，物体都朝水面外飞出去，池子里看不到东西
  let st={y:(waterTop+70), v:0}, last=performance.now(), settleT=0, elapsed=0;
  const floorY=H-84;
  function frame(now){
    /* 一次只记一个 raf 句柄：同时丢两件物品时，先跑的那个句柄已被覆盖、取消不掉，
       离开实验室后仍会跑完并触发 onSettled（重复记账/重复发奖）——这里自己收口 */
    if(S.route!=="lab"||!document.body.contains(el)) return;
    const dt=Math.min((now-last)/1000,1/30); last=now;
    const steps=Math.max(1,Math.round(dt/BUOY.dt));
    for(let i=0;i<steps;i++) st=buoyStep(st,item.isFloat);
    let worldY=waterTop-st.y;
    if(worldY>floorY){ worldY=floorY; st={y:(waterTop-floorY),v:0}; }
    el.style.top=(worldY-33)+"px";
    if(st.y<0&&Math.random()<0.06){ const b=document.createElement('span'); b.className='bub'; const s=5+Math.random()*9; b.style.width=b.style.height=s+"px"; b.style.left=(px+33+Math.random()*30-15)+"px"; b.style.top=Math.max(worldY,10)+"px"; glass.appendChild(b); setTimeout(()=>b.remove(),1050); }
    elapsed+=dt;
    const nearRest=Math.abs(st.v)<45&&(item.isFloat?Math.abs(st.y)<90:worldY>=floorY-1);
    if(nearRest) settleT+=dt; else settleT=0;
    if(settleT>0.3||elapsed>3.2){
      /* 落点按物理结论钉死：浮的停在水面、沉的停在水底——超时兜底不该把物体冻在半路 */
      el.style.top=(item.isFloat ? waterTop-30 : floorY-33)+"px";
      if(item.isFloat){ el.classList.add("bobbing"); }
      onSettled(item,item.isFloat);
      return;
    }
    S.lab.raf=requestAnimationFrame(frame);
  }
  S.lab.raf=requestAnimationFrame(frame);
}
const BUOY={g:-980,b:1400,d:6.0,dt:1/60};
function buoyStep(s,isFloat){ let v=s.v; if(s.y<=0){ const a=isFloat?BUOY.b:BUOY.g; v+=a*BUOY.dt; v-=v*BUOY.d*BUOY.dt; } else { v+=BUOY.g*BUOY.dt; } return {y:s.y+v*BUOY.dt,v}; }
function onSettled(item,isFloat){
  const first=!S.tested.includes(item.id);
  if(first) S.tested.push(item.id);
  const chip=$("#rchip");
  chip.textContent=`${item.name} ${isFloat?"浮起来了 ⬆":"沉下去了 ⬇"}`;
  chip.style.display="block";
  if(first){
    const list=$(isFloat?"#listFloat":"#listSink");
    const emp=list.querySelector(".empty"); if(emp) emp.remove();
    list.appendChild(codexChip(item));
    $("#tested").textContent=`已测试 ${S.tested.length} / ${EXP.items.length}`;
    /* 首测即点亮对应现象卡（+1 金币）——此前 6 件物品只有 guessItem 一张卡可点亮，
       其余 5 张永远拿不到（id 还错位：collect 记 "apple"、图鉴认 "sci-apple"） */
    const card="sci-"+item.id;
    if(!S.science.includes(card)){ S.science.push(card); earn("collection",1); toast("📓 现象卡点亮："+item.name,1.6); }
    if(item.id===S.lab.guessItem){
      if((S.lab.guess==="float")===isFloat){ confetti(); toast("🔮 猜对啦！加一颗智慧星 ⭐"); earn("lab-reward",1); }
      else toast("没关系～科学家就是靠不断试错发现规律的 🔬",2.6);
    }
  } else {
    toast(`${item.name} 又${isFloat?"浮起来":"沉下去"}啦！`,1.4);   // 重玩不重复奖励、不重复进列表
  }
  updateFlow(); save();
  /* 收进图鉴按钮（贴纸仪式）：测满 3 件即点亮；点亮后走 collect()， sticker 只发一次 */
  if(S.tested.length>=3 && !S.stickers.includes("st-fuchen")){ const b=$("#collectBtn"); if(b&&b.disabled){ b.disabled=false; b.classList.add("pulse"); } }
}

  const card="sci-"+(S.lab.guessItem||EXP.guessItem);   // 卡 id 与收集册同源（旧版推裸物品 id "apple"，图鉴永远对不上）

  setTimeout(()=>route("collection"),1400);
}

          <button class="jbtn j-cream" style="font-size:14px;padding:10px 16px" onclick="toast('跳过知识点功能将在二期提供')">⏭ 跳过某个知识点</button>
          <button class="jbtn" style="font-size:14px;padding:10px 16px;background:linear-gradient(180deg,#FFE3E0,#FFCFC9);color:#C0392B;box-shadow:0 4px 0 #E8B7B0" onclick="resetAll()">重置全部进度</button>
        </div>
      </div>
      <div class="panel" style="grid-column:1/-1"><h3><span class="icw">${ic("coin",18)}</span>金币收支明细（按来源 · 只读）</h3>
        ${(()=>{const c=coinStats();return `<div class="cs-grid">${c.rows}</div>
          <div class="cs-foot"><span>累计获得 ${c.earned}</span><span>累计消费 ${c.spent}</span><span>当前余额 ${S.coins}</span></div>`})()}</div>
      <div class="panel" style="grid-column:1/-1"><h3><span class="icw">${ic("heart",18)}</span>本产品承诺（家长可放心）</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 20px">
          ${["无广告 · 无推送 · 无外链","无内购 · 无付费陷阱","无社交 · 无陌生人接触","数据只存在这台 iPad 上","进入家长区需通过家长门","超时自动提醒休息眼睛"].map(p=>`<div class="promise">${p}</div>`).join("")}
        </div>
      </div>
    </div>
    <div class="gate" id="gate"><div class="card" id="gateCard">
      <div style="font-size:52px">🔐</div>
      <div style="font-size:26px;font-weight:900;margin:4px 0">家长中心</div>
      <div style="font-size:15px;color:var(--ink-soft);font-weight:800;margin-bottom:4px">这里是大人的设置区，请完成验证：<br>（孩子答不出来的小算术 😊）</div>
      <div class="q" id="gateQ"></div>
      <div style="display:flex;gap:12px;justify-content:center">
        <input id="gateInput" type="number" placeholder="答案" inputmode="numeric">
        <button class="jbtn j-green" onclick="checkGate()">进入</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--ink-soft)">提示：答案会随题目刷新</div>
    </div></div>
  </div>`;
  newGate();
}
function pRow(icon,nm,ratio,val){ return `<div class="subj-row">${ic(icon,19)}<span class="nm">${nm}</span><div class="track"><i style="width:${Math.round(ratio*100)}%"></i></div><span class="val">${val}</span></div>`; }
/* 分段选择器：行为注册表 + data 属性事件 */
const SEG_ACTIONS={};
let segSeq=0;
function seg(title,vals,cur,fmt,on){
  const id="sg"+(segSeq++); SEG_ACTIONS[id]=on;
  return `<div class="seg-label">${title}</div><div class="seg">${vals.map(v=>`<button class="${v===cur?'on':''}" data-seg="${id}" data-v="${v}" onclick="segPick(this)">${fmt(v)}</button>`).join("")}</div>`;
}
function segPick(btn){
  const id=btn.dataset.seg, v=parseInt(btn.dataset.v);
  [...btn.parentElement.children].forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  if(SEG_ACTIONS[id]) SEG_ACTIONS[id](v);
  toast("设置已保存",1);
}
function seg2(title,labels,vals,cur,on){
  const id="sg"+(segSeq++); SEG_ACTIONS[id]=on;
  return `<div class="seg-label">${title}</div><div class="seg">${labels.map((l,i)=>`<button class="${vals[i]===cur?'on':''}" data-seg="${id}" data-v="${vals[i]}" onclick="segPick(this)">${l}</button>`).join("")}</div>`;
}
/* v1.0.3：每日使用上限改为家长可自由设置——默认 15 分钟，最小 5 分钟、每次 ±5 分钟，
   并支持「不限时」（settings.daily===0 时不封顶）。 */
const DAILY_MIN=5, DAILY_MAX=240, DAILY_STEP=5;
function dailyStepper(){
  const v=S.settings.daily, unlim=(v===0);
  const cur=unlim?"不限时":(v+" 分钟");
  return `<div class="seg-label">每日使用上限</div>
  <div class="seg" style="gap:6px">
    <button style="min-width:46px;font-size:19px;font-weight:900" ${unlim?'disabled':''} onclick="dailyBump(-1)">−</button>
    <button class="on" style="flex:1;pointer-events:none">${cur}</button>
    <button style="min-width:46px;font-size:19px;font-weight:900" ${unlim?'disabled':''} onclick="dailyBump(1)">+</button>
    <button class="${unlim?'on':''}" style="min-width:70px" onclick="dailyToggle()">不限时</button>
  </div>
  <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:3px">默认 15 分钟，最小 5 分钟，每次 ±5 分钟</div>`;
}
function dailyBump(d){
  let v=S.settings.daily;
  if(v===0) v=15;
  v=Math.max(DAILY_MIN,Math.min(DAILY_MAX,v+d*DAILY_STEP));
  S.settings.daily=v; save(); renderParent(); toast("设置已保存",1);
}
function dailyToggle(){ S.settings.daily=(S.settings.daily===0)?15:0; save(); renderParent(); toast("设置已保存",1); }
function newGate(){
  const a=6+Math.floor(Math.random()*4), b=6+Math.floor(Math.random()*4);
  window._gateAns=a+b;
  const q=$("#gateQ"); if(q) q.textContent=`${a} + ${b} = ?`;
  const inp=$("#gateInput"); if(inp){ inp.value=""; inp.onkeydown=e=>{if(e.key==="Enter")checkGate();}; }
}
function checkGate(){
  const v=parseInt($("#gateInput").value);
  if(v===window._gateAns){ $("#gate").style.display="none"; toast("✅ 家长验证通过"); }
  else { const c=$("#gateCard"); c.classList.remove("shakeit"); void c.offsetWidth; c.classList.add("shakeit"); toast("答案不对哦，再试试"); newGate(); }
}
function resetAll(){
  S.coins=12; S.stars={}; S.tested=[]; S.science=[]; S.stickers=[]; S.hanzi=[];
  S.learnedPinyin=[]; S.learnedEnglish=[]; S.learnedAstro=[]; S.daily={};
  save(); toast("已重置全部学习进度"); renderParent();
}
/* ================= 护眼休息（工单10：结算断点规则） ================= */
/* 是否正处于一局进行中（棋盘/boss/线性，尚未结算）——此时绝不打断 */
function levelInProgress(){ return S.route==="level" && S.lv && !S.lv.finished; }
/* 到达时长限制的唯一入口：每日总量封顶=全屏收束、绝不延迟；单次时限在关中则延迟到结算后 */
function requestRest(dayOver){
  if(S.resting) return;
  if(dayOver){ S.resting=true; showRest(true); return; }
  if(levelInProgress()){ S.restPending=true; toast("本关结束后，让眼睛休息一下哦～",2.4); return; }
  S.resting=true; showRest(false);
}
/* 结算完成（仪式出现）后检查：待休息则等庆祝完整播放，再进入休息（仪式是天然断点） */
function checkRestAfterSettle(){
  if(!S.restPending) return;
  S.restPending=false;
  setTimeout(()=>{ if(S.route==="level"&&!S.resting){ S.resting=true; showRest(false); } },900);
}
/* 会话计时：每秒仅在学习页面累计；每日封顶优先，其次单次时限 */
function startTimeManager(){
  setInterval(()=>{
    const k=dayKey();
    if(S.dayKey===""){ S.dayKey=k; }
    else if(S.dayKey!==k){ S.dayKey=k; S.daySec=0; S.playSec=0; S.restPending=false; S.daily={}; }   /* v0.12.2：跨天把「今日任务」也归零，否则永远显示 3/3 */
    if(S.resting) return;
    if(S.route==="level"||S.route==="lab"){
      S.playSec++; S.daySec++;
      if(S.settings.daily!==0 && S.daySec>=S.settings.daily*60){ requestRest(true); return; }
      if(S.playSec>=S.settings.once*60){ requestRest(false); }
    }
  },1000);
}

function showRest(dayOver){
  const div=document.createElement('div'); div.className='rest'+(dayOver?' day':'');
  let left=20;
  div.innerHTML=`<div class="card">
    ${dayOver?'<div style="font-size:64px">🌟</div>':
      `<div class="cnt"><svg width="104" height="104"><circle cx="52" cy="52" r="44" stroke="rgba(255,255,255,.25)" stroke-width="10" fill="none"/>
       <circle id="restRing" cx="52" cy="52" r="44" stroke="#FFC53D" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0" transform="rotate(-90 52 52)"/></svg>
       <div class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:900" id="restN">20</div></div>`}
    <h2>${dayOver?"🌙 今天的探险结束啦":"👀 小眼睛休息一下"}</h2>
    <p>${dayOver?"明天再来玩，明天有新关卡等你哦（想继续？家长中心可调）":"看看窗外最远的地方，数 20 秒就回来"}</p>
  </div>`;
  stage.appendChild(div);
  if(!dayOver){
    const t=setInterval(()=>{
      left--;
      const n=$("#restN"), r=$("#restRing");
      if(n) n.textContent=left;
      if(r) r.setAttribute("stroke-dashoffset", 276.5*(1-left/20));
      if(left<=0){ clearInterval(t); div.remove(); S.resting=false; S.playSec=0; S.restPending=false; save(); toast("休息完毕，继续探险！"); }
    },1000);
    S.timers.push(t);
  }
}

/* ================= 启动 ================= */
function fitFrame(){
  const f=document.querySelector('.frame');
  const s=Math.min(document.body.clientWidth/f.offsetWidth, document.body.clientHeight/f.offsetHeight);
  f.style.transform='translate(-50%,-50%) scale('+s+')';
}
window.addEventListener('resize',fitFrame);
window.addEventListener('orientationchange',()=>setTimeout(fitFrame,250));
fitFrame();
startTimeManager();
try{ if(new URLSearchParams(location.search).get("AISolve")==="1") S.autoSolve=true; }catch(e){}
try{
  const _r=new URLSearchParams(location.search).get("route");
  if(_r==="shop"||_r==="collection"||_r==="map") route(_r);
  else if(_r&&_r.indexOf("level:")===0){
    const p=_r.split(":");
    const b={sub:p[1],index:parseInt(p[2],10),step:p[3]!==undefined?parseInt(p[3],10):0};
    enterLevel(b.sub,b.index);
    const lv=curLevelObj();
    if(lv.board&&b.step>0){
      /* ⚠️ L.bd 要在 renderLevel 里才初始化；深链先落步就必须自己先建好棋盘态，
         否则 `S.lv.bd.q=...` 读 null 抛错，整关被 catch 弹回主页（v0.12 修）。 */
      if(!S.lv.bd){
        const first=lv.steps[0];
        S.lv.bd={pos:-1,q:null,queue:[],qi:0,
                 mode:(first&&(first.kind==="teach"||first.kind==="letter"))?"intro":"roll"};
      }
      const wantId=lv.steps[b.step]&&lv.steps[b.step].id;
      const qi=lv.board.spaces.findIndex(sp=>sp.step===wantId);
      /* pos 也要跟着落到这一格：landBoard(pos) 会读 spaces[pos].type，
         pos=-1 时直接抛 TypeError，答完深链那一题整关卡死（v0.13 修写字时一并补） */
      if(qi>=0){ S.lv.bd.q=qi; S.lv.bd.mode="question"; S.lv.bd.pos=qi; }
      /* boss 关的题号走 L.boss.qi（不看 L.step），深链也要把它对齐，否则永远停在第 1 题 */
      if(lv.boss&&qi>=0) S.lv.boss={bh:3,ph:3,qi:qi,outcome:"fighting",rewarded:false};
      renderLevel();
    } else if(b.step>0){ S.lv.step=b.step; renderLevel(); }
  } else route("map");
}catch(e){ route("map"); }
</script>
