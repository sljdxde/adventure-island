<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>探险岛 · 儿童学习大冒险</title>
<style>
/* ============ 探险岛 App 模拟器（1:1 还原 ios/ SwiftUI 工程；数据由 tools/gen_preview_data.py 注入） ============ */
:root{
  --orange:#FF9F43;--orange-dk:#F08C1F;--orange-ddk:#D97706;
  --yellow:#FFC53D;--yellow-dk:#F5A623;--yellow-ddk:#D98A0F;
  --coral:#FF7B6B;--coral-dk:#E85D4E;--coral-ddk:#C24836;
  --blue:#4FA9E8;--blue-dk:#2F86C9;--blue-ddk:#20629E;
  --purple:#9B7BF5;--purple-dk:#7C5CE0;--purple-ddk:#5E3FBE;
  --green:#58C96B;--green-dk:#3BA851;--green-ddk:#2E8A40;
  --cream:#FFF9EE;--cream-dk:#FFF1D8;--ink:#57433A;--ink-soft:#A08A76;
  --gold:#FFD34D;--gold-dk:#E5A916;--gold-ddk:#C08A0C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#17120D;display:grid;place-items:center;min-height:100vh;height:100vh;font-family:"YouYuan","幼圆","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.frame{position:absolute;left:50%;top:50%;width:1052px;height:796px;border-radius:38px;border:14px solid #0d0a07;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 3px #3A2E22;overflow:hidden;background:var(--cream)}
.stage{position:absolute;inset:0;overflow:hidden}
.note{position:fixed;left:18px;top:14px;color:#8a7a63;font-size:13px;font-weight:700;line-height:1.7;z-index:99}
.note b{color:#FFD34D}
/* iPad/触屏：隐藏开发说明，避免压住 HUD */
@media (pointer:coarse){ .note{display:none !important} body{background:#0d0a07} .frame{border-radius:0} }
img.ic{display:inline-block;vertical-align:middle}

/* ---------- Boss 关（工单06：整屏 flex，心条固定行、题目占中区，互不遮挡） ---------- */
.boss-battle{position:absolute;inset:86px 0 0 0;display:flex;flex-direction:column;background:rgba(28,22,16,.28)}
.bb-row{display:flex;align-items:center;gap:12px;padding:0 40px;min-height:72px}
.bb-boss{background:linear-gradient(180deg,rgba(60,46,34,.55),rgba(60,46,34,.15))}
.bb-boss .bb-avatar{line-height:1;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.bb-boss.boss-hit .bb-avatar{animation:bossKnock .45s ease}
@keyframes bossKnock{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(28px) rotate(-8deg)}100%{transform:translateX(0) rotate(0)}}
.bb-name{font-size:18px;font-weight:900;color:#FFF3DC}
.bb-step{flex:1;min-height:0;padding:10px 26px;display:flex}
.bb-step > *{flex:1;min-height:0}
.bb-player{background:linear-gradient(0deg,rgba(60,46,34,.55),rgba(60,46,34,.15));min-height:64px}
.bb-player .bb-avatar{line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.bb-player.player-hit .bb-avatar{animation:playerHit .5s ease}
@keyframes playerHit{0%{transform:translateY(0)}30%{transform:translateY(-16px);filter:drop-shadow(0 0 6px #E84838)}100%{transform:translateY(0)}}
.bb-hearts{display:flex;gap:4px}
.boss-result{background:linear-gradient(180deg,#fff,#FFF1D8);border-radius:32px;padding:30px 42px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.3);border:5px solid var(--yellow);max-width:720px}

/* ---------- 场景背景 ---------- */
.scene{position:absolute;inset:0;z-index:0}
.scene .sky{position:absolute;inset:0}
.scene .glow{position:absolute;width:320px;height:320px;border-radius:50%;left:-180px;top:-180px;background:radial-gradient(circle,#FFF6C9f2,#FFE28A59 55%,transparent 72%)}
.scene .hill{position:absolute;left:-2%;right:-2%;bottom:-4px;height:250px;background-repeat:repeat-x;background-size:auto 100%;background-position:bottom center}
.scene .hill.back{height:300px;opacity:.9}
.hill.back{background-image:url("../../design/assets/bg/hills-back.svg")}
.hill.front{background-image:url("../../design/assets/bg/hills-front.svg")}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92;box-shadow:0 10px 24px rgba(111,199,242,.25)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:14%;bottom:26%}
.cloud::after{width:38%;height:115%;right:12%;bottom:22%}
.c1{width:150px;height:44px;top:60px;animation:drift 38s linear infinite}
.c2{width:100px;height:30px;top:140px;opacity:.8;animation:drift 28s linear infinite reverse}
.c3{width:180px;height:50px;top:26px;animation:drift 46s linear infinite;animation-delay:-18s}
@keyframes drift{0%{left:-200px}100%{left:1060px}}
/* 关卡场景变体：v1 黄昏 / v2 星夜（index%3 轮换）+ astro 常驻星夜 */
.tint{position:absolute;inset:0;pointer-events:none}
.tint.dusk{background:linear-gradient(180deg,rgba(255,150,80,.42),rgba(255,181,107,.18) 45%,transparent 80%)}
.tint.night{background:linear-gradient(180deg,rgba(22,30,78,.55),rgba(34,46,110,.34) 48%,rgba(58,72,148,.16) 90%)}
.stars{position:absolute;inset:0 0 34% 0;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite alternate;background-image:
 radial-gradient(2px 2px at 6% 14%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 13% 42%,#fff 55%,transparent 60%),
 radial-gradient(2.4px 2.4px at 21% 10%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 30% 30%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 38% 8%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 47% 24%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 55% 7%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 63% 34%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 71% 13%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 79% 40%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 87% 11%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 94% 30%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 18% 55%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 44% 48%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 68% 52%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 90% 56%,#fff 55%,transparent 60%)}
@keyframes twinkle{0%{opacity:.75}100%{opacity:1}}
.moon{position:absolute;right:74px;top:34px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#FFFBEE,#FFE9A8 70%,#F7D77E);box-shadow:0 0 36px 12px rgba(255,240,190,.5);pointer-events:none}
.moon::before,.moon::after{content:'';position:absolute;border-radius:50%;background:rgba(214,178,90,.4)}
.moon::before{width:14px;height:14px;right:12px;top:10px}
.moon::after{width:9px;height:9px;right:26px;top:32px}
.theme-cn .sky{background:linear-gradient(180deg,#FFDE9E,#FFCF87 46%,#FFE9BE)}
.theme-cn .hill.back{opacity:.5}
.theme-math .sky{background:linear-gradient(180deg,#58C4F7,#9FE0FB 46%,#DCF6FE)}
.theme-lab .sky{background:linear-gradient(180deg,#8F74EC,#B39CF7 40%,#E2DAFE)}
.theme-lab .hill{opacity:.5}
.theme-pinyin .sky{background:linear-gradient(180deg,#FFC98A,#FFDCA8 46%,#FFF0CE)}
.theme-pinyin .hill{opacity:.8}
.theme-english .sky{background:linear-gradient(180deg,#6FD0A8,#A8E5C8 46%,#E1F8EC)}
.theme-english .hill{opacity:.85}
.theme-astro .sky{background:linear-gradient(180deg,#232C68,#3D4CB0 48%,#7B8ADF)}
.theme-astro .hill{opacity:.5;filter:saturate(.45) brightness(.62) hue-rotate(28deg)}
.theme-coll .sky{background:linear-gradient(180deg,#FFC964,#FFDE94 40%,#FFF2C4)}
.theme-coll .hill{opacity:.6}
.theme-parent .sky{background:linear-gradient(180deg,#A9C0DC,#C6D6E9 44%,#E6EEF5)}
.theme-parent .hill{opacity:.35}
.theme-shop .sky{background:linear-gradient(180deg,#7FC6F2,#A9DCFA 42%,#DFF3FF)}
.theme-shop .hill{opacity:.5}
.v1 .hill{filter:saturate(1.05) brightness(.88) sepia(.18)}
.v1 .cloud{opacity:.7;background:#FFE9CF}
.v2 .hill{filter:saturate(.5) brightness(.62) hue-rotate(24deg)}
.v2 .cloud{opacity:.35;background:#C9D4FF}
.is-night .cloud{opacity:.35;background:#C9D4FF}
/* 地下砖块关（SMB 1-2 风）：深蓝洞窟 + 底部砖排 */
.v3 .sky{background:linear-gradient(180deg,#141F5C,#23337F 52%,#3A55B0)!important}
.v3 .hill{filter:saturate(.45) brightness(.5) hue-rotate(190deg)}
.v3 .cloud{display:none}
.v3 .glow{opacity:.35;background:radial-gradient(circle,#9FB4FF80,transparent 70%)}
.bricksrow{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;z-index:1;pointer-events:none}
.bricksrow img{width:54px;height:54px;margin-right:2px;flex:none}
/* 旋转金币 + 顶砖 + 金币飞行（马里奥元素） */
@keyframes spincoin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.sky-coins img{animation:spincoin 2.6s linear infinite}
.sky-coins img:nth-child(2){animation-delay:.5s}
.sky-coins img:nth-child(3){animation-delay:1s}
@keyframes blockbump{0%{transform:translateX(-50%) translateY(0)}35%{transform:translateX(-50%) translateY(-16px)}100%{transform:translateX(-50%) translateY(0)}}
.blk{cursor:pointer}
.blk.bump{animation:blockbump .5s ease}
.flycoin{position:absolute;z-index:70;pointer-events:none;transition:transform .75s cubic-bezier(.25,-.15,.55,1),opacity .75s}
@keyframes chipbump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.goldchip.bumped{animation:chipbump .45s}
/* 马里奥小人：待机蹦跳 + 点击起跳 */
@keyframes mascotbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(.98,1.03)}}
.mascot{cursor:pointer;animation:mascotbob 1.5s ease-in-out infinite;transition:filter .15s}
.mascot:hover{filter:brightness(1.08) drop-shadow(0 4px 8px rgba(0,0,0,.2))}
@keyframes mascotjump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(3px) scale(1.12,.82)}45%{transform:translateY(-34px) scale(.94,1.1)}70%{transform:translateY(0) scale(1.06,.9)}100%{transform:translateY(0) scale(1,1)}}
.mascot.jump{animation:mascotjump .65s ease-out}
/* 翻翻牌（扑克牌风 3D 翻转） */
.memgrid{display:grid;grid-template-columns:repeat(3,150px);gap:16px}
.mcard{width:150px;height:130px;perspective:700px;cursor:pointer}
.mc-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.9,.4,1.1);transform-style:preserve-3d}
.mcard.flip .mc-inner{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mc-back{background:linear-gradient(180deg,#5A78E8,#3A55C8);border:4px solid #fff;box-shadow:0 5px 0 #2E44A8;color:#fff}
.mc-back b{font-size:36px;font-weight:900}
.mc-back span{font-size:16px;opacity:.85}
.mc-front{background:linear-gradient(180deg,#fff,#F6F9FF);border:3px solid #D8E2F8;transform:rotateY(180deg);position:absolute}
.mcard.ok .mc-front{border-color:#BFE8C9;background:linear-gradient(180deg,#fff,#EFFBEF)}
.mc-suit{position:absolute;top:6px;left:9px;font-size:13px;color:#8A9CC8;font-style:normal}
/* 掷骰子 */

/* ---------- 通用组件 ---------- */
.screen{position:absolute;inset:0;z-index:2;animation:screenIn .28s ease}
@keyframes screenIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.hud{position:absolute;top:0;left:0;right:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:16px 22px 0;z-index:40;pointer-events:none}
.hud-l,.hud-r{display:flex;align-items:center;gap:12px;pointer-events:auto}
.sqbtn{width:62px;height:62px;border:none;cursor:pointer;border-radius:21px;background:linear-gradient(180deg,#FFFDF6,#FFF3DC);box-shadow:0 4px 0 #E8D5AE,0 8px 14px rgba(84,66,58,.12);display:grid;place-items:center;transition:transform .08s}
.sqbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E8D5AE}
.goldchip{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFDF4,#FFF2CE);border-radius:999px;padding:8px 18px 8px 10px;box-shadow:0 4px 0 #EBD9A8,0 6px 12px rgba(84,66,58,.1);font-size:21px;font-weight:900;color:#8A5B00}
.goldchip .ico{width:33px;height:33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE68A,var(--gold) 60%,var(--gold-dk));display:grid;place-items:center}
.jbtn{font-family:inherit;border:none;cursor:pointer;border-radius:999px;font-weight:800;color:#fff;padding:13px 28px;font-size:20px;letter-spacing:1px;position:relative;transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.14)}
.jbtn:active{transform:translateY(4px)}
.j-orange{background:linear-gradient(180deg,#FFB25C,var(--orange) 45%,var(--orange-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--orange-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-yellow{background:linear-gradient(180deg,#FFDD7A,var(--yellow) 45%,var(--yellow-dk));color:#7A4A00;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 var(--yellow-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-green{background:linear-gradient(180deg,#7FD98A,var(--green) 45%,var(--green-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 #2E8A40,0 8px 14px rgba(84,66,58,.18)}
.j-blue{background:linear-gradient(180deg,#7CC4F5,var(--blue) 45%,var(--blue-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--blue-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-purple{background:linear-gradient(180deg,#B79BFF,var(--purple) 45%,var(--purple-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--purple-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-cream{background:linear-gradient(180deg,#FFFDF6,#FFF1D6);color:var(--ink);text-shadow:none;box-shadow:inset 0 3px 0 #fff,0 4px 0 #E4D2AC,0 6px 12px rgba(84,66,58,.12)}
.jbtn:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.nameplate{display:flex;align-items:center;filter:drop-shadow(0 6px 8px rgba(84,66,58,.22))}
.nameplate .ava{width:54px;height:54px;border-radius:50%;border:4px solid #fff;background:linear-gradient(160deg,#FFE29A,var(--yellow));display:grid;place-items:center;z-index:2}
.nameplate .name{background:linear-gradient(180deg,var(--orange),var(--orange-dk));color:#fff;font-weight:900;font-size:18px;padding:10px 18px 10px 22px;margin-left:-14px;border-radius:999px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.sticker{background:linear-gradient(180deg,#fff,var(--cream));border-radius:30px;border:5px solid #fff;outline:3px solid rgba(84,66,58,.08);box-shadow:0 12px 24px rgba(84,66,58,.16)}
.track{height:11px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(84,66,58,.12)}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFE58A,var(--gold));transition:width .5s}
.toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(16px);background:rgba(58,45,36,.94);color:#FFF7E8;font-size:20px;font-weight:700;padding:14px 30px;border-radius:999px;opacity:0;transition:all .3s;z-index:90;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:absolute;font-size:28px;z-index:80;pointer-events:none;animation:cfall 1.6s ease-in forwards}
@keyframes cfall{0%{transform:translateY(-40px) rotate(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(700px) rotate(330deg) scale(1.15);opacity:0}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.pulse{animation:pulse 1.5s ease-in-out infinite}
.shakeit{animation:shake .4s}
.popt{animation:pop .45s}

/* ---------- 迷你棋盘（v0.8 工单02 识字村试点） ---------- */
.bboard{position:absolute;inset:0;z-index:10}
.bspace{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;border:4px solid #fff;box-shadow:0 5px 0 rgba(84,66,58,.18),0 8px 14px rgba(84,66,58,.14);transition:transform .15s}
.bspace.q{background:linear-gradient(180deg,#FFE9AE,#F5B93B)}
.bspace.c{background:linear-gradient(180deg,#C9EFFB,#6FC9EE)}
.bspace.ch{background:linear-gradient(180deg,#E3D8FF,#9B7BF5)}
.bspace.mu{background:linear-gradient(180deg,#FFD9D2,#E85D4E)}
.bspace.re{background:linear-gradient(180deg,#D7F5DD,#58C96B)}
.bspace.passed{opacity:.5;filter:saturate(.5)}
.bspace.now{animation:pulse 1.4s ease-in-out infinite;z-index:11}
.bnode{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:9;pointer-events:none}
.bmascot{position:absolute;transform:translate(-50%,-86%);z-index:14;transition:left .32s ease-in-out,top .32s ease-in-out;filter:drop-shadow(0 6px 6px rgba(84,66,58,.3))}
@keyframes bhop{0%,100%{margin-top:0}45%{margin-top:-30px}}
.bmascot.hop{animation:bhop .34s ease-in-out}
.broll-wrap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px}
.broll{display:flex;align-items:center;gap:14px;border:none;cursor:pointer;border-radius:999px;padding:12px 34px 12px 16px;font-family:inherit;font-size:23px;font-weight:900;color:#7A4A00;text-shadow:0 1px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,#FFDD7A,var(--yellow) 45%,var(--yellow-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 var(--yellow-ddk),0 8px 14px rgba(84,66,58,.18)}
.broll:active{transform:translateY(4px)}
.broll:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.bdie{width:64px;height:64px;border-radius:14px;background:linear-gradient(180deg,#fff,#F2EDDF);border:3px solid #D8CBAF;box-shadow:0 4px 8px rgba(84,66,58,.2);position:relative}
.boverlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(46,36,28,.42)}
.boverlay .sticker{width:min(940px,96%);height:min(560px,92%);padding:18px 26px}
.rest-mascot{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);animation:restin 1.7s ease-in-out forwards}
@keyframes restin{0%{opacity:1;transform:translateX(-50%) scale(1)}60%{opacity:.9;transform:translateX(-50%) scale(.5)}100%{opacity:.12;transform:translateX(-50%) scale(.3)}}

/* ---------- 主页 ---------- */
.pipes{display:flex;align-items:flex-end;justify-content:space-between;padding:0 12px;margin-top:4px}
.pipe-zone{cursor:pointer;text-align:center;width:164px;transition:transform .15s}
.pipe-zone:hover{transform:translateY(-6px)}
.pipe-wrap{position:relative;height:120px;display:flex;align-items:flex-end;justify-content:center}
.pipe-wrap .blk{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:9px;background:linear-gradient(180deg,#FFE58A,#F7B32B);border:3px solid #B8770A;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;text-shadow:1px 2px 0 #B8770A;animation:pulse 1.6s infinite}
.pipe-wrap .guide{position:absolute;right:2px;bottom:0}
.zone-label{display:inline-block;margin-top:-14px;position:relative;z-index:3;background:linear-gradient(180deg,#FFE58A,var(--yellow-dk));border:2.5px solid #B8770A;border-radius:999px;padding:5px 13px;font-size:15.5px;font-weight:900;color:#8A5B00;box-shadow:0 4px 0 rgba(0,0,0,.14);white-space:nowrap}
.zone-meta{margin-top:5px;font-size:12px;font-weight:900;color:var(--green-ddk);text-shadow:0 1px 0 rgba(255,255,255,.55);white-space:nowrap}
.zone-meta .track{width:132px;margin:6px auto 0}

 radial-gradient(2px 2px at 8% 16%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 20% 34%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 33% 12%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 47% 30%,#fff 55%,transparent 60%),

 radial-gradient(2.2px 2.2px at 86% 14%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 94% 32%,#fff 55%,transparent 60%)}

/* ---------- 收集册 ---------- */
.tabs{position:absolute;top:92px;left:26px;display:flex;gap:11px;z-index:20}
.tab{border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .icw{width:50px;height:50px;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 4px 0 rgba(84,66,58,.15);display:grid;place-items:center;transition:all .12s}
.tab .t{font-size:14px;font-weight:900;color:#8A6520;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.tab.active .icw{background:linear-gradient(180deg,#FFDD7A,var(--yellow-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--yellow-ddk);transform:translateY(-4px) scale(1.08)}
.board{position:absolute;left:18px;right:18px;top:186px;bottom:14px;background:linear-gradient(180deg,#FFFBF0,var(--cream-dk));border-radius:40px;border:5px solid #fff;box-shadow:0 14px 28px rgba(84,66,58,.15);z-index:15;overflow:hidden;display:flex;flex-direction:column}
.board .inner{padding:18px 24px;overflow:auto;flex:1}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.slot{aspect-ratio:1/1.02;border-radius:21px;display:grid;place-items:center;align-content:center;cursor:pointer;position:relative;transition:transform .12s;text-align:center}
.slot:hover{transform:translateY(-4px) scale(1.04)}
.slot .em{height:52px;display:grid;place-items:center}
.slot .em img{width:46px;height:46px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
.slot .nm{font-size:14px;font-weight:900;margin-top:3px;letter-spacing:1px}
.slot .tag{position:absolute;top:7px;right:9px;font-size:12px;font-weight:900;border-radius:999px;padding:2px 8px;color:#fff}
.slot.got{background:linear-gradient(180deg,#fff,#FFF6E0);border:4px solid #fff;outline:3px solid #F5DFAC;box-shadow:0 4px 0 #EFDBA8}
.slot.lock{background:#F3EADA;border:4px dashed #E0D2B6;color:#C9BBA0;cursor:default}
.slot.lock .em{opacity:.65;filter:grayscale(1)}
.hint{margin-top:14px;text-align:center;font-size:15px;color:var(--ink-soft);font-weight:800}

/* ---------- 家长中心 ---------- */
.pwrap{position:absolute;inset:88px 22px 16px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:15px;align-content:start;z-index:10}
.panel{background:linear-gradient(180deg,#fff,#FBF7EE);border-radius:26px;border:4px solid #fff;outline:3px solid rgba(84,66,58,.07);box-shadow:0 8px 18px rgba(84,66,58,.1);padding:18px 20px}
.panel h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.panel h3 .icw{width:34px;height:34px;border-radius:11px;background:linear-gradient(180deg,#FFF3D8,#FFE7BC);box-shadow:0 3px 0 #F0DCAC;display:grid;place-items:center}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:900;line-height:1.1}
.ring .num small{font-size:11px;color:var(--ink-soft)}
.seg-label{font-size:14.5px;font-weight:900;margin:4px 0 5px}
.seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:none;background:#F3EADA;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:900;color:var(--ink-soft);cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #E2D4B8}
.seg button.on{background:linear-gradient(180deg,var(--blue),var(--blue-dk));color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--blue-ddk)}
.subj-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.subj-row .nm{width:70px;font-size:15px;font-weight:900}
.subj-row .track{flex:1}
.subj-row .val{width:66px;text-align:right;font-size:13px;font-weight:900;color:var(--ink-soft)}
.stat-chip{background:linear-gradient(180deg,#FFF3D8,#FFE9BC);border-radius:999px;font-size:13px;font-weight:900;color:#9A6B00;padding:5px 12px;box-shadow:0 3px 0 #F0DCAC;display:inline-block;margin:0 6px 6px 0}
/* 金币收支按来源（工单09，家长中心只读） */
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:4px}
.cs-row{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:800;color:var(--ink-soft);border-bottom:1px dashed #EADFC8;padding-bottom:5px}
.cs-row b{font-size:15px}
.cs-foot{margin-top:10px;background:linear-gradient(180deg,#EAF6EC,#D8F0DE);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:900;color:#2A7A40;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.promise{font-size:14px;font-weight:800;color:var(--ink-soft);padding:4px 0 4px 22px;position:relative}
.promise::before{content:'✓';position:absolute;left:2px;color:var(--green-dk);font-weight:900}
.gate{position:absolute;inset:0;background:rgba(30,40,52,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60}
.gate .card{text-align:center;padding:32px 46px;border-radius:30px;border:5px solid #fff;background:linear-gradient(180deg,#FFFDF4,#FFF3D8);box-shadow:0 20px 40px rgba(0,0,0,.3);animation:pop .4s;max-width:520px}
.gate .q{font-size:36px;font-weight:900;letter-spacing:4px;background:#fff;border-radius:16px;padding:12px 30px;margin:12px 0 16px;box-shadow:0 4px 0 #F0DCAC}
.gate input{width:126px;font-size:28px;font-weight:900;text-align:center;padding:11px;border:none;border-radius:15px;background:#fff;box-shadow:inset 0 0 0 3px #E8DFC8,0 4px 0 #E8DFC8;outline:none;font-family:inherit;color:var(--ink)}

/* ---------- 休息遮罩 ---------- */
.rest{position:absolute;inset:0;background:rgba(10,8,6,.6);display:grid;place-items:center;z-index:100}
.rest .card{text-align:center;padding:36px 48px;border-radius:32px;border:5px solid #fff;background:var(--blue-dk);box-shadow:0 20px 40px rgba(0,0,0,.4);color:#fff}
.rest.day .card{background:var(--purple-dk)}
.rest h2{font-size:30px;font-weight:900;margin:10px 0 6px}
.rest p{font-size:17px;opacity:.92;font-weight:800}
.rest .cnt{position:relative;width:104px;height:104px;margin:0 auto 6px}

/* ---------- 金币商店（工单08） ---------- */
.shop-wrap{position:absolute;left:24px;right:24px;top:72px;bottom:14px;display:block;overflow:hidden;padding-top:64px}
.shop-sec{display:block;margin-bottom:22px}
.shop-grid{height:242px;grid-auto-rows:242px;align-items:stretch}
.shop-grid.gdice{height:224px;grid-auto-rows:224px}
.shop-card{height:100%}
.shop-sec h2{font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15);margin:0 0 9px 4px;display:flex;align-items:center;gap:8px}
.shop-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;width:100%;box-sizing:border-box}
.shop-grid.gdice{grid-template-columns:repeat(5,1fr)}
.shop-card{background:#FFFDF6;border-radius:18px;border:3px solid #EAD9B8;padding:11px 8px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 rgba(150,110,60,.25);overflow:hidden}
.shop-card.active{border-color:#34C759;background:#F2FFF5;box-shadow:0 5px 0 rgba(40,160,80,.3)}
.shop-ic{width:74px;height:92px;display:grid;place-items:center}
.shop-ic img{width:100%;height:100%;object-fit:contain}
.shop-dice{width:78px;height:78px;border-radius:16px;background:#fff;border:3px solid #E8DCC6;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.05)}
.shop-dice .pip{position:absolute;width:17px;height:17px;transform:translate(-50%,-50%)}
.shop-dice .pip.dot{border-radius:50%;background:#E84838}
.shop-dice .pip img{width:100%;height:100%}
/* 棋盘掷骰用骰面（工单09，支持自定义点图案） */
.dface{position:relative;border-radius:22%;background:#fff;border:3px solid #E8DCC6;box-shadow:inset 0 -5px 0 rgba(0,0,0,.05)}
.df-pip{position:absolute;transform:translate(-50%,-50%)}
.df-pip.df-dot{border-radius:50%;background:#E84838}
.df-pip img{display:block}
.shop-name{font-size:15px;font-weight:900;color:#5A4632;margin:7px 0 8px;text-align:center;line-height:1.15;min-height:34px;display:flex;align-items:center}
.shop-btn{width:100%;border:none;border-radius:12px;padding:12px 4px;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
.shop-btn.buy{background:linear-gradient(#FFD76B,#F5B32E);color:#7A4A10;box-shadow:0 3px 0 #C98A1E}
.shop-btn.buy.poor{background:#E7DFD0;color:#9A8E78;box-shadow:0 3px 0 #C9BFA8}
.shop-btn.use{background:linear-gradient(#5BD47A,#2FB855);color:#fff;box-shadow:0 3px 0 #1E9242}
.shop-btn.using{background:#E7F7EC;color:#2A9E50;border:2px solid #8FDCA4;box-shadow:none;padding:10px 4px}
.shop-btn .coin{width:17px;height:17px}
/* 衣橱（工单09，收集册内） */
.ward-tip{background:#EAF6FF;border:2px solid #BBDDF2;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:800;color:#2F6E94;margin-bottom:12px}
.ward-sec{margin-bottom:12px}
.ward-sec .shop-grid{height:auto;grid-auto-rows:auto}
.ward-sec .shop-grid .shop-card{height:auto;min-height:186px}
.ward-sec .shop-grid.gdice .shop-card{min-height:176px}
/* 收集册面板高度有限：衣橱卡收紧，保证两行完整放下不滚动 */
.ward-sec .shop-ic{width:58px;height:72px}
.ward-sec .shop-dice{width:62px;height:62px}
.ward-sec .shop-name{margin:4px 0 6px;min-height:30px}
.ward-sec .shop-btn{padding:10px 4px}
.ward-sec .shop-btn.using{padding:8px 4px}
.ward-h{font-size:18px;font-weight:900;color:var(--ink-soft);margin:0 0 8px 4px}
.ward-vis{flex:1;display:grid;place-items:center;align-self:stretch}
.ward-vis.locked{opacity:.18;filter:grayscale(1)}
.shop-card.unowned{background:#F4F1EA;border-color:#E0D9CA;box-shadow:0 5px 0 rgba(150,140,120,.2)}
.shop-btn.togoshop{background:linear-gradient(#EFE9DD,#E0D7C5);color:#7A6E5C;box-shadow:0 3px 0 #C5B9A4}
</style>
</head>

/* ================= 金币账本（v0.8 工单04，与 Swift recordCoin 同源） ================= */
function dayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
/* 金币只经 earn 变动：余额永不为负 + 记账（来源/数额/时间）+ 落盘 */
function earn(src,amt){
  if(!amt) return;
  S.coins=Math.max(0,S.coins+amt);
  S.ledger.push({s:src,a:amt,t:Date.now()});
  if(S.ledger.length>1000) S.ledger.splice(0,S.ledger.length-1000);
  save();
}
/* 消费扣款（工单08 商店）：余额不足返回 false，绝不透支；记一笔负数账本 */
function spend(src,amt){
  if(S.coins<amt) return false;
  S.coins-=amt;
  S.ledger.push({s:src,a:-amt,t:Date.now()});
  if(S.ledger.length>1000) S.ledger.splice(0,S.ledger.length-1000);
  save();
  return true;
}
/* 商店：购买（重复购买拒绝、余额不足提示差额） */
function buyItem(kind,id){
  const cat=CONTENT.shop[kind==="chars"?"characters":"titles"];
  const it=cat.find(x=>x.id===id); if(!it) return;
  const owned=kind==="chars"?S.ownedChars:S.ownedTitles;
  if(owned.includes(id)){ toast("已经拥有啦"); return; }
  if(S.coins<it.price){ toast("金币不够，还差 "+(it.price-S.coins)+" 枚"); return; }
  spend("shop",it.price);
  owned.push(id); save();
  toast("买到「"+it.name+"」啦！");
  renderShop();
}
/* 商店/衣橱：激活（已拥有才可），角色与称号各自独立记忆 */
function activate(kind,id){
  const owned=kind==="chars"?S.ownedChars:S.ownedTitles;
  if(!owned.includes(id)) return;
  if(kind==="chars"){ if(S.activeChar===id)return; S.activeChar=id; }
  else { if(S.activeTitle===id)return; S.activeTitle=id; }
  save(); toast("换上啦，马上生效！"); renderShop();
}

/* 星级按关卡 id 记账（工单05 平移迁移）；复习关跟随前一个正式关解锁、不挡正式关；
   boss 关（工单06）需正式关全部通关才解锁 */
function nodeState(sub,i){
  const lv=(CONTENT[sub]||{levels:[]}).levels, L=lv[i]||{};
  if((S.stars[L.id]||0)>0) return "done";
  if(L.boss){
    const regular=lv.filter(x=>!x.review&&!x.boss);
    return regular.every(x=>(S.stars[x.id]||0)>0) ? "cur" : "lock";
  }
  let k=i-1; while(k>=0&&lv[k]&&(lv[k].review||lv[k].boss)) k--;    // 向前找最近的正式关
  const prevDone = k>=0&&((S.stars[lv[k].id]||0)>0);
  if(L.review) return (k<0||prevDone) ? "cur" : "lock";
  if(k<0) return "cur";
  return prevDone ? "cur" : "lock";
}

function settleLevel(){

  const key=curLevelObj().id;               // 星级按关卡 id 记账（工单05 平移迁移）
  const old=S.stars[key]||0;
  // 仪式金币雨只数本次实际入账（与账本一致，工单07）：星级金币 + 可能的蘑菇 +2
  let rain=0;
  if(stars>old||old===0){ S.stars[key]=stars; earn("level-stars",stars); rain+=stars; }
  if(stars===3 && old<3){ earn("mushroom-bonus",2); rain+=2; }
  L.rain=rain; L.cerStars=stars;
  L.ceremony={skipped:false, done:false};
  S.daily[L.subject]=(S.daily[L.subject]||0)+1;
  save();
  checkRestAfterSettle();   /* 工单10：若单次时限在关中到达，仪式播完后进入休息 */

/* ---------- 仪式驱动（约 4 秒；每拍检查 route/skipped，离开页面即停） ---------- */
function startCeremony(){
  const L=S.lv; if(L.ceremony.done) return;
  // 第 1 拍：滑下旗杆 + 旗子落下
  setTimeout(()=>{
    if(S.route!=="level"||L.ceremony.skipped) return;
    const m=$("#cermascot"); if(m) m.style.bottom="178px";
    const f=$("#cerflag"); if(f) f.classList.add("down");
  },150);
  // 第 2 拍：跑进城堡 + 门开
  setTimeout(()=>{
    if(S.route!=="level"||L.ceremony.skipped) return;
    const m=$("#cermascot");
    if(m){ m.style.transition="bottom .4s,left .8s linear,opacity .3s"; m.style.left="600px"; }
    setTimeout(()=>{ const d=$("#cerdoor"); if(d) d.classList.add("open"); },450);
  },1050);
  // 第 3 拍：金币雨逐枚计数
  setTimeout(()=>{ if(S.route==="level"&&!L.ceremony.skipped) coinRain(); },1900);
}
function coinRain(){
  const L=S.lv, total=L.rain;
  const counter=$("#cercounter"); if(counter) counter.classList.add("show");
  if(total<=0){ afterCoins(); return; }
  let n=0;
  const tick=()=>{
    if(S.route!=="level"||!$("#ceremony")) return;
    if(L.ceremony.skipped) return;
    spawnRainCoin(); n++;
    const cn=$("#cercount"); if(cn) cn.textContent=n;
    if(n<total) setTimeout(tick,190);
    else setTimeout(afterCoins,380);
  };
  tick();
}
function spawnRainCoin(){
  const host=$("#ceremony"); if(!host) return;
  const c=document.createElement('div'); c.className='cer-coin';
  c.innerHTML=ic("coin",30);
  c.style.left=(520+Math.random()*180)+'px'; c.style.bottom='330px'; c.style.opacity='0';
  host.appendChild(c);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    c.style.transition='bottom .55s ease-in,opacity .25s';
    c.style.bottom='206px'; c.style.opacity='1';
    setTimeout(()=>{ c.style.opacity='0'; c.style.bottom='188px'; },500);
    setTimeout(()=>c.remove(),850);
  }));
}
function afterCoins(){
  const L=S.lv;
  if(L.ceremony.skipped) return;
  const spans=document.querySelectorAll("#cerstars span");
  const light=i=>{
    if(S.route!=="level"||!$("#ceremony")) return;
    if(i>=L.cerStars){ setTimeout(showCeremonyButtons,300); return; }
    if(spans[i]) spans[i].classList.add("lit");
    setTimeout(()=>light(i+1),340);
  };
  light(0);
}
function showCeremonyButtons(){
  const L=S.lv; L.ceremony.done=true;
  const b=$("#cerbuttons"), s=$("#cersummary");
  if(b) b.classList.add("show");
  if(s) s.classList.add("show");
}
function skipCeremony(){
  const L=S.lv; if(L.ceremony.done) return;
  L.ceremony.skipped=true;
  const m=$("#cermascot");
  if(m){ m.style.transition="none"; m.style.left="600px"; m.style.bottom="178px"; m.style.opacity="0"; }
  const d=$("#cerdoor"); if(d) d.classList.add("open");
  const counter=$("#cercounter"); if(counter) counter.classList.add("show");
  const cn=$("#cercount"); if(cn) cn.textContent=L.rain;
  document.querySelectorAll("#cerstars span").forEach((sp,i)=>{ if(i<L.cerStars) sp.classList.add("lit"); });
  showCeremonyButtons();
  const s=$("#cersummary"); if(s) s.classList.add("show");
}

/* ================= 迷你棋盘（v0.8 工单02：识字村试点） =================
   掷骰 → 角色沿蛇形路径逐格蹦跳 → 题目格出题（答对 +2 金币、答错可重答）
   → 金币格 +5 → 到城堡走既有结算。路径形状按格数计算，不进 JSON。 */
let boardState={rolling:false,hopping:false};

/// pos: -1 起点 | 0..n-1 格子 | n 城堡（蛇形两行：上行左→右，下行右→左；起点在首格上方、城堡在末格左下，避免与角色/边缘重叠）
function bdPoint(pos,n){
  const x0=150,x1=880,yT=196,yB=380;
  if(pos===-1) return {x:x0, y:yT-96};
  if(pos===n)  return {x:x0-58, y:yB+72};
  const top=Math.ceil(n/2);
  if(pos<top){ const t=top===1?0:pos/(top-1); return {x:x0+(x1-x0)*t, y:yT+Math.sin(t*4.4)*24}; }
  const bot=n-top, t=bot===1?0:(pos-top)/(bot-1);
  return {x:x1-(x1-x0)*t, y:yB+Math.sin(t*4.4)*24};
}
function bdPathSvg(n){
  const pts=[bdPoint(-1,n)];
  for(let i=0;i<n;i++) pts.push(bdPoint(i,n));
  pts.push(bdPoint(n,n));
  const d="M "+pts.map(p=>`${Math.round(p.x)} ${Math.round(p.y)}`).join(" L ");
  return `<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 1024 768" fill="none"><path d="${d}" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 20" opacity=".92"/></svg>`;
}
function pipsHtml(n){
  const pip=activeDicePip();
  return (PIPS[n]||[]).map(p=> pip==="dot"
    ? `<span style="position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#E84838,#C24836);left:calc(${p[0]*100}% - 6px);top:calc(${p[1]*100}% - 6px)"></span>`
    : `<span style="position:absolute;width:15px;height:15px;left:calc(${p[0]*100}% - 7.5px);top:calc(${p[1]*100}% - 7.5px)"><img src="${ICON_DIR}${pip}.svg" style="width:100%;height:100%"></span>`
  ).join("");
}
/* 格子视觉映射（工单03 四件套）：类型 → [样式类, 图标] */
const SPACE_VIS={coin:["c","coin"],chest:["ch","gift"],mushroom:["mu","mushroom"],rest:["re","home"],question:["q","question"]};
function boardHTML(lv){
  const L=S.lv, sps=lv.board.spaces, n=sps.length, pos=L.bd.pos;
  let cells="";
  sps.forEach((sp,i)=>{
    const p=bdPoint(i,n);
    const vis=SPACE_VIS[sp.type]||SPACE_VIS.question;
    cells+=`<div class="bspace ${vis[0]} ${i<pos?'passed':''} ${i===pos?'now':''}" style="left:${p.x}px;top:${p.y}px">${ic(vis[1],34)}</div>`;
  });
  const st=bdPoint(-1,n), ca=bdPoint(n,n), mp=bdPoint(pos,n);
  const rollUI = L.bd.mode==="roll"
    ? `<div class="broll-wrap"><button class="broll" id="broll" onclick="boardRoll()"><div class="bdie" id="bdie">${pipsHtml(6)}</div>掷骰子，前进！</button><div style="font-size:14px;font-weight:900;color:var(--ink);background:rgba(255,253,246,.86);border-radius:999px;padding:5px 16px;box-shadow:0 2px 6px rgba(84,66,58,.18)">掷到几就走几格，答对题目 +2 金币</div></div>`
    : "";
  return `<div class="bboard">${bdPathSvg(n)}
    <div class="bnode" style="left:${st.x-56}px;top:${st.y-8}px">${ic("flag",30)}</div>
    ${cells}
    <div class="bnode" style="left:${ca.x}px;top:${ca.y}px">${ic("castle",62)}</div>
    ${pos<n?`<div class="bmascot" id="bmascot" style="left:${mp.x}px;top:${mp.y}px">${activeCharIcon(54)}</div>`:""}
    ${rollUI}</div>`;
}
function boardRoll(){
  const L=S.lv, n=curLevelObj().board.spaces.length;
  if(L.bd.mode!=="roll"||boardState.rolling||boardState.hopping) return;
  boardState.rolling=true;
  const btn=$("#broll"), die=$("#bdie");
  if(btn) btn.disabled=true;
  let t=0;
  const iv=setInterval(()=>{
    die.innerHTML=pipsHtml(1+Math.floor(Math.random()*6));
    die.style.transform=`rotate(${Math.random()*24-12}deg)`;
    if(++t>=10){
      clearInterval(iv);
      const r=1+Math.floor(Math.random()*6);
      die.innerHTML=pipsHtml(r); die.style.transform="none";
      boardState.rolling=false;
      toast(`掷出 ${r} 点！`,1.4);
      L.bd.mode="moving";
      hopBoard(Math.min(L.bd.pos+r,n));
    }
  },80);
  S.timers.push(iv);
}
function hopBoard(target){
  const L=S.lv, n=curLevelObj().board.spaces.length, el=$("#bmascot");
  boardState.hopping=true;
  let p=L.bd.pos;
  const stepHop=()=>{
    if(S.route!=="level"||!$("#bmascot")){ boardState.hopping=false; return; }
    if(p>=target){ boardState.hopping=false; arriveBoard(target); return; }
    p++;
    const pt=bdPoint(p,n);
    el.style.left=pt.x+"px"; el.style.top=pt.y+"px";
    el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
    setTimeout(stepHop,360);
  };
  stepHop();
}
function arriveBoard(p){
  if(S.route!=="level") return;
  const L=S.lv, lv=curLevelObj(), n=lv.board.spaces.length;
  const from=L.bd.pos;
  L.bd.pos=p;
  /* 试玩反馈①：途经的题目格依次作答——掷大点数=多做几题，绝不跳题（学习密度优先） */
  const passed=[];
  for(let i=from+1;i<=Math.min(p,n-1);i++){ if(lv.board.spaces[i].type==="question") passed.push(i); }
  L.bd.queue=passed; L.bd.qi=0;
  if(passed.length>0){ L.bd.q=passed[0]; L.bd.mode="question"; renderLevel(); return; }
  if(p>=n){ settleLevel(); renderLevel(); return; }   // 到城堡 → 结算卡
  resolveSpace(p);
}
/* 落点是非题目格时的遭遇结算（金币/宝箱/蘑菇/休息站） */
function resolveSpace(p){
  if(S.route!=="level") return;
  const L=S.lv, n=curLevelObj().board.spaces.length;
  const sp=curLevelObj().board.spaces[p];
  if(sp.type==="question"){
    L.bd.q=p; L.bd.mode="question"; renderLevel(); return;
  }
  if(sp.type==="coin"){
    const pt=bdPoint(p,n);
    flyCoins(pt.x,pt.y,3);
    earn("coin-space",5);                    // 金币格 +5 经账本（工单04）
    toast("金币格 +5 金币！",1.6);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },900);
    return;
  }
  if(sp.type==="chest"){
    const amt=chestAmount(), pt=bdPoint(p,n);   // 宝箱 3-8 随机经账本（工单03）
    flyCoins(pt.x,pt.y,Math.min(amt,5));
    confetti();
    earn("chest",amt);
    toast(`🎁 宝箱打开：+${amt} 金币！`,1.8);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },1100);
    return;
  }
  if(sp.type==="mushroom"){
    if(!S.mushroom){ S.mushroom=true; save(); confetti(); toast("🍄 幸运蘑菇到手：下次答错不算错！",2); }
    else toast("已经有一朵幸运蘑菇啦",1.6);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },900);
    return;
  }
  if(sp.type==="rest"){
    L.bd.mode="rest";                        // 休息站：小房子喝水演出（纯视觉，静音等效）
    renderLevel();
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },2100);
    return;
  }
}
/* 休息站演出覆盖层 */
function restHTML(){
  return `<div class="boverlay"><div style="background:#fff;border-radius:28px;padding:34px 46px;text-align:center;box-shadow:0 12px 24px rgba(84,66,58,.22)">
    <div style="position:relative;width:132px;height:112px;margin:0 auto">${ic("home",120)}<div class="rest-mascot">${activeCharIcon(46)}</div></div>
    <div style="font-size:20px;font-weight:900;color:var(--ink);margin-top:6px">咕咚咕咚…喝水休息一下 💧</div>
  </div></div>`;
}
function flyCoins(x,y,k){
  const chip=document.querySelector('.goldchip'); if(!chip) return;
  const sr=stage.getBoundingClientRect(), cr=chip.getBoundingClientRect();
  const tx=cr.left-sr.left+cr.width/2-x, ty=cr.top-sr.top+cr.height/2-y;
  for(let i=0;i<k;i++){
    const c=document.createElement('div'); c.className='flycoin';
    c.innerHTML=ic("coin",30);
    c.style.left=(x-15)+'px'; c.style.top=(y-46)+'px';
    stage.appendChild(c);
    setTimeout(()=>{ c.style.transform=`translate(${tx}px,${ty}px) scale(.4)`; c.style.opacity='0'; }, i*90);
    setTimeout(()=>c.remove(), 950+i*90);
  }
  setTimeout(()=>{ chip.classList.remove("bumped"); void chip.offsetWidth; chip.classList.add("bumped"); }, 720);
}
function boardStepDone(){
  const L=S.lv, lv=curLevelObj(), n=lv.board.spaces.length;
  if(L.bd.mode==="intro"){ L.bd.mode="roll"; renderLevel(); return; }
  if(L.bd.mode==="question"){
    earn("answer",2);                        // 题目格答对 +2 经账本（工单04）
    toast("答对啦 +2 金币！",1.6);
    /* 试玩反馈①：途经题目队列——答完一题看还有没有路过的题目格，都答完再结算落点/城堡 */
    if(L.bd.queue && L.bd.qi < L.bd.queue.length-1){
      L.bd.qi++; L.bd.q=L.bd.queue[L.bd.qi]; renderLevel(); return;
    }
    if(L.bd.pos>=n){ settleLevel(); renderLevel(); return; }
    L.bd.mode="roll"; renderLevel(); return;
  }
}

/* ================= Boss 大挑战（v0.8 工单06） =================
   心条状态机语义与 Swift BossFlow 同源：答对 boss 掉心、答错玩家掉心（蘑菇豁免），

  }

}
function bossHTML(lv){

      <span class="bb-hearts">${bossHeartsHtml(b.ph,30)}</span>

}
function bossWrong(){
  const b=S.lv.boss;
  if(b.locking) return;                 // 反馈窗口内忽略重复点击
  if(S.mushroom){
    S.mushroom=false; save();
    toast("🍄 幸运蘑菇挡了一下：这次不掉心！",2);
    return;
  }
  b.ph--;
  b.locking=true;
  renderLevel();   // 心条 + 受击动画立即反馈
  if(b.ph<=0){ b.outcome="lost"; setTimeout(renderLevel,450); return; }
  setTimeout(()=>{ b.locking=false; if(S.lv.boss&&S.lv.boss.outcome==="fighting"){ b.qi=Math.min(b.qi+1,7); renderLevel(); } },1200);
}
function bossCorrect(){
  const b=S.lv.boss;
  b.bh--;
  if(b.bh<=0){
    b.outcome="won";
    bossWinRewards();
    renderLevel();
    return;
  }
  b.qi=Math.min(b.qi+1,7);
  renderLevel();
}
function bossWinRewards(){
  const b=S.lv.boss; if(b.rewarded) return; b.rewarded=true;
  const stars=b.ph===3?3:(b.ph===2?2:1), key=curLevelObj().id, old=S.stars[key]||0;
  if(stars>old) S.stars[key]=stars;
  earn("boss",15);                           // boss 奖励走账本（工单04 口径）
  S.daily[S.lv.subject]=(S.daily[S.lv.subject]||0)+1;
  save();
}
function bossRetry(){
  S.lv.boss={bh:3,ph:3,qi:0,outcome:"fighting",rewarded:false};
  renderLevel();
}

/* --- 数一数（count：情境道具 + 场景底色） --- */
function countHTML(st){
  /* 试玩反馈②：countRange 存在时每次进题随机取数+重组选项（同一关重玩不再总是同一道） */
  let n=st.count, opts=st.countOptions;
  if(st.countRange){
    const lo=st.countRange[0], hi=st.countRange[1];
    n=lo+Math.floor(Math.random()*(hi-lo+1));
    opts=[...new Set([n-1,n,n+1].filter(v=>v>=1))].sort((a,b)=>a-b).slice(0,3);
  }
  const icon=st.duckIcon||"duck", unit=st.unit||"个";
  window._count={n,opts};
  let items="";
  const cols=Math.min(n,5);
  for(let i=0;i<n;i++){
    const row=Math.floor(i/cols), col=i%cols, inRow=Math.min(cols,n-row*cols);
    const x=(92/(inRow+1))*(col+1)+(Math.random()*6-3), y=52+row*52;
    items+=`<span class="countitem" id="dk${i}" style="left:calc(${x}% - 26px);top:${y}px;animation-delay:${(Math.random()*2).toFixed(2)}s" onclick="tapDuck(${i})">${ic(icon,52)}</span>`;
  }
  const bd=st.backdrop||"pond";
  let deco="";
  if(bd==="night") deco=`<div class="ndeco"></div><span style="position:absolute;right:26px;top:16px">${ic("moon",30)}</span>`;
  else if(bd==="sky") deco=`<span style="position:absolute;left:70px;top:24px">${ic("sunface",30)}</span><span class="cloud" style="width:84px;height:26px;left:40%;top:20px;opacity:.7"></span>`;
  else if(bd==="grass") deco=`<span style="position:absolute;left:24px;bottom:12px">${ic("flower",26)}</span><span style="position:absolute;right:30px;bottom:10px">${ic("sprout",24)}</span><span style="position:absolute;right:60px;top:14px">${ic("tree",34)}</span>`;
  else deco=`<div class="wave"></div><span style="position:absolute;left:36px;top:44px">${ic("flower",28)}</span>`;
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px" class="sticker">
    <div class="q-pill">${st.question||""}</div>
    <div class="pond ${bd}" style="width:92%">${deco}${items}
      <div class="cnt-chip">已数 <b id="cnt" style="font-size:24px;color:var(--blue-dk)">0</b> ${unit}</div></div>
    <div style="display:flex;gap:24px">${opts.map(o=>`<button class="numblock" id="nb${o}" onclick="pickCount(${o})">${o}</button>`).join("")}</div>
  </div>`;
}
function tapDuck(i){
  const dk=$("#dk"+i);

  dk.classList.add("counted");
  const c=S.lv.counted.length+1; S.lv.counted.push(1);
  $("#cnt").textContent=c;
  const b=document.createElement('span'); b.className='cbub'; b.textContent=c;
  b.style.left=dk.style.left; b.style.top=(parseFloat(dk.style.top)-10)+'px';
  dk.parentElement.appendChild(b); setTimeout(()=>b.remove(),850);
}
function pickCount(v){

let memState={flipped:[],matched:[],busy:false,deck:[]};
const SUITS=["♠","♥","♦","♣"];
function memoryHTML(st){
  // 固定伪随机洗牌（按 step id 稳定）
  const seed=[...(st.cards||[])];
  const d=parseInt((st.id||"m").replace(/\D/g,""),10)||7;
  for(let i=seed.length-1;i>0;i--){const j=(d*(i+7))%(i+1);[seed[i],seed[j]]=[seed[j],seed[i]];}
  memState={flipped:[],matched:[],busy:false,deck:seed};
  window._mem={};
  const cardHTML=(c,i)=>{
    const front=c.icon?ic(c.icon,60):`<span style="font-size:${(c.text||"").length>1?32:48}px;font-weight:900;color:var(--ink)">${c.text}</span>`;
    return `<div class="mcard" id="mc${i}" onclick="flipCard(${i})">
      <div class="mc-inner">
        <div class="mc-back"><span>${SUITS[i%4]}</span><b>?</b><span>${SUITS[(i+2)%4]}</span></div>
        <div class="mc-front"><i class="mc-suit">${SUITS[i%4]}</i>${front}</div>

  </div>`;
}
function flipCard(i){
  const M=memState;
  if(M.busy||M.matched.includes(i)||M.flipped.includes(i)) return;
  M.flipped.push(i);
  $("#mc"+i).classList.add("flip");
  if(M.flipped.length===2){
    M.busy=true;
    const [a,b]=M.flipped;
    if(M.deck[a].key===M.deck[b].key){
      setTimeout(()=>{
        M.matched.push(a,b); M.flipped=[]; M.busy=false;
        [a,b].forEach(k=>{$("#mc"+k).classList.add("ok");$("#mc"+k).style.pointerEvents="none";});
        $("#mfb").textContent=`已配对 ${M.matched.length/2} / 3 对`;

      },450);
    } else {
      setTimeout(()=>{
        M.flipped.forEach(k=>$("#mc"+k).classList.remove("flip"));
        M.flipped=[]; M.busy=false;
      },900);
    }
  }
}

function tankTap(ev){
  const glass=$("#glass");
  if(S.lab.phase!=="play"){ if(S.lab.phase==="guess") toast("先完成猜一猜哦 🔮"); return; }
  if(!S.lab.sel){ toast("先在左边工具箱里选一个物品哦 🧰"); return; }

function dropIntoTank(item,x){
  const glass=$("#glass"); const H=glass.clientHeight, waterTop=52;
  const el=document.createElement('div'); el.className='titem'; el.innerHTML=ic(item.icon,66);
  const px=Math.min(Math.max(x-33,30),glass.clientWidth-96);
  el.style.left=px+"px"; el.style.top="-70px"; glass.appendChild(el);
  // 与 Swift BuoyancyModel 相同参数
  let st={y:(H+40-waterTop), v:0}, last=performance.now(), settleT=0, elapsed=0;
  const floorY=H-84;
  function frame(now){
    const dt=Math.min((now-last)/1000,1/30); last=now;
    const steps=Math.max(1,Math.round(dt/BUOY.dt));
    for(let i=0;i<steps;i++) st=buoyStep(st,item.isFloat);
    let worldY=waterTop+st.y;
    if(worldY>floorY){ worldY=floorY; st={y:floorY-waterTop,v:0}; }
    el.style.top=(worldY-33)+"px";
    if(st.y<0&&Math.random()<0.06){ const b=document.createElement('span'); b.className='bub'; const s=5+Math.random()*9; b.style.width=b.style.height=s+"px"; b.style.left=(px+33+Math.random()*30-15)+"px"; b.style.top=Math.max(worldY,10)+"px"; glass.appendChild(b); setTimeout(()=>b.remove(),1050); }
    elapsed+=dt;
    const nearRest=Math.abs(st.v)<45&&(item.isFloat?Math.abs(st.y)<90:worldY>=floorY-1);
    if(nearRest) settleT+=dt; else settleT=0;
    if(settleT>0.3||elapsed>2.6){
      if(item.isFloat){ el.classList.add("bobbing"); el.style.top=(waterTop-30)+"px"; }
      onSettled(item,item.isFloat);
      return;
    }
    S.lab.raf=requestAnimationFrame(frame);
  }
  S.lab.raf=requestAnimationFrame(frame);
}
const BUOY={g:-980,b:1400,d:6.0,dt:1/60};
function buoyStep(s,isFloat){ let v=s.v; if(s.y<=0){ const a=isFloat?BUOY.b:BUOY.g; v+=a*BUOY.dt; v-=v*BUOY.d*BUOY.dt; } else { v+=BUOY.g*BUOY.dt; } return {y:s.y+v*BUOY.dt,v}; }
function onSettled(item,isFloat){
  const first=!S.tested.includes(item.id);

      else toast("没关系～科学家就是靠不断试错发现规律的 🔬",2.6);
    }
  } else {
    toast(`${item.name} 又${isFloat?"浮起来":"沉下去"}啦！`,1.4);   // 重玩不重复奖励、不重复进列表
  }
  updateFlow(); save();
  if(S.tested.length>=3 && !S.science.includes(EXP.guessItem)){ const b=$("#collectBtn"); if(b&&!b.disabled){ b.disabled=false; b.classList.add("pulse"); } }
}

function slotCollected(g,it){
  if(g.id==="science") return needExperiment(it.id)?S.science.includes(it.id):true;
  if(g.id==="sticker") return S.stickers.includes(it.id);
  if(g.id==="hanzi") return S.hanzi.includes(it.text);
  if(g.id==="pinyin") return S.learnedPinyin.includes((it.text||" ")[0]);
  if(g.id==="english") return S.learnedEnglish.includes(it.name);
  if(g.id==="astro") return S.learnedAstro.includes(it.name.split(" ")[0]);
  return true;
}
function needExperiment(id){ return ["sci-apple","sci-rock","sci-wood","sci-key","sci-sponge","sci-balloon"].includes(id); }
function renderBoard(){
  if(S.collTab==="wardrobe"){ renderWardrobe(); return; }
  const g=COLLECTION.find(x=>x.id===S.collTab);
  const got=g.items.filter(it=>slotCollected(g,it)).length;
  let slots="";
  for(const it of g.items){
    const collected=slotCollected(g,it);
    const em = collected ? ((g.id==="hanzi"||g.id==="pinyin")
        ? `<span style="font-size:42px;font-weight:900;color:#E2582A">${it.text}</span>`
        : (it.icon?ic(it.icon,46):""))
      : `<span style="font-size:38px;font-weight:900">？</span>`;
    const tagHtml=collected&&it.tag?`<span class="tag" style="background:${it.tagColor==='blue'?'var(--blue)':'var(--coral-dk)'}">${it.tag}</span>`:"";
    slots+=`<div class="slot ${collected?'got':'lock'}" onclick="slotTap('${g.id}','${it.id}')">
      <span class="em">${em}</span>${tagHtml}
      <span class="nm">${collected?it.name:"？？？"}</span></div>`;
  }
  const hints={science:"💡 去科学岛做实验，就能点亮更多现象图鉴",sticker:"💡 完成每日任务、闯关成功都能掉落贴纸",hanzi:"💡 在识字村闯关，就能点亮更多汉字卡",
    pinyin:"💡 在拼音谷闯关，就能点亮拼音卡",english:"💡 在英语王国闯关，就能点亮单词卡",
    astro:"💡 去天文台闯关，认识更多星空朋友",badge:"💡 徽章记录每一次了不起的坚持"};
  $("#board").innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:19px;font-weight:900;color:var(--ink-soft)">${groupTitle(g,got)}</span>
      <div class="track" style="width:250px"><i style="width:${Math.round(got/g.items.length*100)}%"></i></div></div>
    <div class="grid6">${slots}</div>
    <div class="hint">${hints[g.id]||""}</div>`;
}
function groupTitle(g,got){
  if(g.id==="science") return `已完成 ${got} / ${g.items.length} 个现象`;
  if(g.id==="sticker") return `已获得 ${got} / ${g.items.length} 张`;
  if(g.id==="hanzi") return `已认读 ${got} / ${g.items.length} 字`;
  if(g.id==="pinyin") return `已学会 ${got} / ${g.items.length} 个`;
  if(g.id==="english") return `已学会 ${got} / ${g.items.length} 词`;
  if(g.id==="astro") return `已认识 ${got} / ${g.items.length} 个星空朋友`;
  return "每一枚徽章都是了不起的坚持";
}
function slotTap(gid,id){
  const g=COLLECTION.find(x=>x.id===gid);
  const it=g.items.find(x=>x.id===id);
  if(!slotCollected(g,it)) return;
  if(it.fact){ toast(it.fact,3.2); speak(it.fact); }
  else if(gid==="english"){ toast(it.name); speak(it.name); }
  else if(gid==="astro"){ toast(it.name); speak(it.name.split(" ").join("，")); }
  else if(gid==="hanzi"){ toast(it.text); speak(it.text); }
  else if(gid==="pinyin"){ toast(it.name); speak((it.text||" ")[0]); }
}

/* ================= 家长中心 ================= */
const COIN_SRC_LABEL={"level-stars":"通关星星奖励","mushroom-bonus":"完美蘑菇奖励","answer":"答对题目","coin-space":"金币格","chest":"宝箱","brick":"问号砖","lab-reward":"实验奖励","collection":"收集奖励","boss":"Boss 挑战","shop":"商店消费"};
/* 按来源汇总金币（只读）：正数累计获得，负数累计消费 */
function coinStats(){
  const by={};
  for(const e of S.ledger){ by[e.s]=(by[e.s]||0)+e.a; }
  let earned=0, spent=0;
  const rows=Object.keys(by).sort((a,b)=>by[b]-by[a]).map(s=>{
    const v=by[s];
    if(v>=0) earned+=v; else spent-=v;
    return `<div class="cs-row"><span>${COIN_SRC_LABEL[s]||s}</span><b style="color:${v<0?'#C0392B':'#2A8A48'}">${v>0?'+':''}${v}</b></div>`;
  }).join("");
  return {rows,earned,spent};
}

          <button class="jbtn j-cream" style="font-size:14px;padding:10px 16px" onclick="toast('跳过知识点功能将在二期提供')">⏭ 跳过某个知识点</button>
          <button class="jbtn" style="font-size:14px;padding:10px 16px;background:linear-gradient(180deg,#FFE3E0,#FFCFC9);color:#C0392B;box-shadow:0 4px 0 #E8B7B0" onclick="resetAll()">重置全部进度</button>
        </div>

          <div class="cs-foot"><span>累计获得 ${c.earned}</span><span>累计消费 ${c.spent}</span><span>当前余额 ${S.coins}</span></div>`})()}</div>

        </div>

      <div class="q" id="gateQ"></div>
      <div style="display:flex;gap:12px;justify-content:center">

function pRow(icon,nm,ratio,val){ return `<div class="subj-row">${ic(icon,19)}<span class="nm">${nm}</span><div class="track"><i style="width:${Math.round(ratio*100)}%"></i></div><span class="val">${val}</span></div>`; }
/* 分段选择器：行为注册表 + data 属性事件 */
const SEG_ACTIONS={};
let segSeq=0;
function seg(title,vals,cur,fmt,on){
  const id="sg"+(segSeq++); SEG_ACTIONS[id]=on;
  return `<div class="seg-label">${title}</div><div class="seg">${vals.map(v=>`<button class="${v===cur?'on':''}" data-seg="${id}" data-v="${v}" onclick="segPick(this)">${fmt(v)}</button>`).join("")}</div>`;
}
function segPick(btn){
  const id=btn.dataset.seg, v=parseInt(btn.dataset.v);
  [...btn.parentElement.children].forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  if(SEG_ACTIONS[id]) SEG_ACTIONS[id](v);
  toast("设置已保存",1);
}
function seg2(title,labels,vals,cur,on){
  const id="sg"+(segSeq++); SEG_ACTIONS[id]=on;
  return `<div class="seg-label">${title}</div><div class="seg">${labels.map((l,i)=>`<button class="${vals[i]===cur?'on':''}" data-seg="${id}" data-v="${vals[i]}" onclick="segPick(this)">${l}</button>`).join("")}</div>`;
}
function newGate(){
  const a=6+Math.floor(Math.random()*4), b=6+Math.floor(Math.random()*4);
  window._gateAns=a+b;
  const q=$("#gateQ"); if(q) q.textContent=`${a} + ${b} = ?`;
  const inp=$("#gateInput"); if(inp){ inp.value=""; inp.onkeydown=e=>{if(e.key==="Enter")checkGate();}; }
}
function checkGate(){
  const v=parseInt($("#gateInput").value);
  if(v===window._gateAns){ $("#gate").style.display="none"; toast("✅ 家长验证通过"); }
  else { const c=$("#gateCard"); c.classList.remove("shakeit"); void c.offsetWidth; c.classList.add("shakeit"); toast("答案不对哦，再试试"); newGate(); }
}
function resetAll(){
  S.coins=12; S.stars={}; S.tested=[]; S.science=[]; S.stickers=[]; S.hanzi=[];
  S.learnedPinyin=[]; S.learnedEnglish=[]; S.learnedAstro=[]; S.daily={};
  save(); toast("已重置全部学习进度"); renderParent();
}
/* ================= 护眼休息（工单10：结算断点规则） ================= */
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
/* 是否正处于一局进行中（棋盘/boss/线性，尚未结算）——此时绝不打断 */
function levelInProgress(){ return S.route==="level" && S.lv && !S.lv.finished; }
/* 到达时长限制的唯一入口：每日总量封顶=全屏收束、绝不延迟；单次时限在关中则延迟到结算后 */
function requestRest(dayOver){
  if(S.resting) return;
  if(dayOver){ S.resting=true; showRest(true); return; }
  if(levelInProgress()){ S.restPending=true; toast("本关结束后，让眼睛休息一下哦～",2.4); return; }
  S.resting=true; showRest(false);
}
/* 结算完成（仪式出现）后检查：待休息则等庆祝完整播放，再进入休息（仪式是天然断点） */
function checkRestAfterSettle(){
  if(!S.restPending) return;
  S.restPending=false;
  setTimeout(()=>{ if(S.route==="level"&&!S.resting){ S.resting=true; showRest(false); } },4400);
}
/* 会话计时：每秒仅在学习页面累计；每日封顶优先，其次单次时限 */
function startTimeManager(){
  setInterval(()=>{
    const k=todayKey();
    if(S.dayKey===""){ S.dayKey=k; }
    else if(S.dayKey!==k){ S.dayKey=k; S.daySec=0; S.playSec=0; S.restPending=false; }
    if(S.resting) return;
    if(S.route==="level"||S.route==="lab"){
      S.playSec++; S.daySec++;
      if(S.daySec>=S.settings.daily*60){ requestRest(true); return; }
      if(S.playSec>=S.settings.once*60){ requestRest(false); }
    }
  },1000);
}

function showRest(dayOver){
  const div=document.createElement('div'); div.className='rest'+(dayOver?' day':'');
  let left=20;
  div.innerHTML=`<div class="card">
    ${dayOver?'<div style="font-size:64px">🌟</div>':
      `<div class="cnt"><svg width="104" height="104"><circle cx="52" cy="52" r="44" stroke="rgba(255,255,255,.25)" stroke-width="10" fill="none"/>
       <circle id="restRing" cx="52" cy="52" r="44" stroke="#FFC53D" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0" transform="rotate(-90 52 52)"/></svg>
       <div class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:900" id="restN">20</div></div>`}
    <h2>${dayOver?"🌙 今天的探险结束啦":"👀 小眼睛休息一下"}</h2>
    <p>${dayOver?"明天再来玩，明天有新关卡等你哦（想继续？家长中心可调）":"看看窗外最远的地方，数 20 秒就回来"}</p>
  </div>`;
  stage.appendChild(div);
  if(!dayOver){
    const t=setInterval(()=>{
      left--;
      const n=$("#restN"), r=$("#restRing");
      if(n) n.textContent=left;
      if(r) r.setAttribute("stroke-dashoffset", 276.5*(1-left/20));
      if(left<=0){ clearInterval(t); div.remove(); S.resting=false; S.playSec=0; S.restPending=false; save(); toast("休息完毕，继续探险！"); }
    },1000);
    S.timers.push(t);
  }
}

/* ================= 启动 ================= */
function fitFrame(){
  const f=document.querySelector('.frame');
  const s=Math.min(document.body.clientWidth/f.offsetWidth, document.body.clientHeight/f.offsetHeight);
  f.style.transform='translate(-50%,-50%) scale('+s+')';
}
window.addEventListener('resize',fitFrame);
window.addEventListener('orientationchange',()=>setTimeout(fitFrame,250));
fitFrame();
startTimeManager();
route("map");
</script>
