<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>探险岛 · 儿童学习大冒险</title>
<style>
/* ============ 探险岛 App 模拟器（1:1 还原 ios/ SwiftUI 工程；数据由 tools/gen_preview_data.py 注入） ============ */
:root{
  --orange:#FF9F43;--orange-dk:#F08C1F;--orange-ddk:#D97706;
  --yellow:#FFC53D;--yellow-dk:#F5A623;--yellow-ddk:#D98A0F;
  --coral:#FF7B6B;--coral-dk:#E85D4E;--coral-ddk:#C24836;
  --blue:#4FA9E8;--blue-dk:#2F86C9;--blue-ddk:#20629E;
  --purple:#9B7BF5;--purple-dk:#7C5CE0;--purple-ddk:#5E3FBE;
  --green:#58C96B;--green-dk:#3BA851;--green-ddk:#2E8A40;
  --cream:#FFF9EE;--cream-dk:#FFF1D8;--ink:#57433A;--ink-soft:#A08A76;
  --gold:#FFD34D;--gold-dk:#E5A916;--gold-ddk:#C08A0C;
  /* 棋盘格 token（决策 26）：浅色=格面、彩色=格底，彩底与上方学科 token 同值 */
  --space-q:#FFE9AE;--space-q-dk:#F5B93B;
  --space-coin:#C9EFFB;--space-coin-dk:#6FC9EE;
  --space-chest:#E3D8FF;--space-mush:#FFD9D2;--space-rest:#D7F5DD;
  /* 商店/衣橱按钮 token（决策 26）：购买=金币系、换上=绿色系、使用中=激活绿 */
  --buy-hi:#FFD76B;--buy:#F5B32E;--buy-dk:#C98A1E;--buy-ink:#7A4A10;
  --use-hi:#5BD47A;--use:#2FB855;--use-dk:#1E9242;
  --ok:#34C759;--ok-bg:#F2FFF5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#17120D;display:grid;place-items:center;min-height:100vh;height:100vh;font-family:"YouYuan","幼圆","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.frame{position:absolute;left:50%;top:50%;width:1052px;height:796px;border-radius:38px;border:14px solid #0d0a07;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 3px #3A2E22;overflow:hidden;background:var(--cream)}
.stage{position:absolute;inset:0;overflow:hidden}
.note{position:fixed;left:18px;top:14px;color:#8a7a63;font-size:13px;font-weight:700;line-height:1.7;z-index:99}
.note b{color:#FFD34D}
/* iPad/触屏：隐藏开发说明，避免压住 HUD */
@media (pointer:coarse){ .note{display:none !important} body{background:#0d0a07} .frame{border-radius:0} }
img.ic{display:inline-block;vertical-align:middle}

/* ---------- Boss 关（工单06：整屏 flex，心条固定行、题目占中区，互不遮挡） ---------- */
.boss-battle{position:absolute;inset:86px 0 0 0;display:flex;flex-direction:column;background:rgba(28,22,16,.28)}
.bb-row{display:flex;align-items:center;gap:12px;padding:0 40px;min-height:72px}
.bb-boss{background:linear-gradient(180deg,rgba(60,46,34,.55),rgba(60,46,34,.15))}
.bb-boss .bb-avatar{line-height:1;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.bb-boss.boss-hit .bb-avatar{animation:bossKnock .45s ease}
@keyframes bossKnock{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(28px) rotate(-8deg)}100%{transform:translateX(0) rotate(0)}}
.bb-name{font-size:18px;font-weight:900;color:#FFF3DC}
.bb-step{flex:1;min-height:0;padding:10px 26px;display:flex}
.bb-step > *{flex:1;min-height:0}
.bb-player{background:linear-gradient(0deg,rgba(60,46,34,.55),rgba(60,46,34,.15));min-height:64px}
.bb-player .bb-avatar{line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.bb-player.player-hit .bb-avatar{animation:playerHit .5s ease}
@keyframes playerHit{0%{transform:translateY(0)}30%{transform:translateY(-16px);filter:drop-shadow(0 0 6px #E84838)}100%{transform:translateY(0)}}
.bb-hearts{display:flex;gap:4px}
.boss-result{background:linear-gradient(180deg,#fff,#FFF1D8);border-radius:32px;padding:30px 42px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.3);border:5px solid var(--yellow);max-width:720px}

/* ---------- 场景背景 ---------- */
.scene{position:absolute;inset:0;z-index:0}
.scene .sky{position:absolute;inset:0}
.scene .glow{position:absolute;width:320px;height:320px;border-radius:50%;left:-180px;top:-180px;background:radial-gradient(circle,#FFF6C9f2,#FFE28A59 55%,transparent 72%)}
.scene .hill{position:absolute;left:-2%;right:-2%;bottom:-4px;height:250px;background-repeat:repeat-x;background-size:auto 100%;background-position:bottom center}
.scene .hill.back{height:300px;opacity:.9}
.hill.back{background-image:url("../../design/assets/bg/hills-back.svg")}
.hill.front{background-image:url("../../design/assets/bg/hills-front.svg")}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92;box-shadow:0 10px 24px rgba(111,199,242,.25)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:14%;bottom:26%}
.cloud::after{width:38%;height:115%;right:12%;bottom:22%}
.c1{width:150px;height:44px;top:60px;animation:drift 38s linear infinite}
.c2{width:100px;height:30px;top:140px;opacity:.8;animation:drift 28s linear infinite reverse}
.c3{width:180px;height:50px;top:26px;animation:drift 46s linear infinite;animation-delay:-18s}
@keyframes drift{0%{left:-200px}100%{left:1060px}}
/* 关卡场景变体：v1 黄昏 / v2 星夜（index%3 轮换）+ astro 常驻星夜 */
.tint{position:absolute;inset:0;pointer-events:none}
.tint.dusk{background:linear-gradient(180deg,rgba(255,150,80,.42),rgba(255,181,107,.18) 45%,transparent 80%)}
.tint.night{background:linear-gradient(180deg,rgba(22,30,78,.55),rgba(34,46,110,.34) 48%,rgba(58,72,148,.16) 90%)}
.stars{position:absolute;inset:0 0 34% 0;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite alternate;background-image:
 radial-gradient(2px 2px at 6% 14%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 13% 42%,#fff 55%,transparent 60%),
 radial-gradient(2.4px 2.4px at 21% 10%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 30% 30%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 38% 8%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 47% 24%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 55% 7%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 63% 34%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 71% 13%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 79% 40%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 87% 11%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 94% 30%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 18% 55%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 44% 48%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 68% 52%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 90% 56%,#fff 55%,transparent 60%)}
@keyframes twinkle{0%{opacity:.75}100%{opacity:1}}
.moon{position:absolute;right:74px;top:34px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#FFFBEE,#FFE9A8 70%,#F7D77E);box-shadow:0 0 36px 12px rgba(255,240,190,.5);pointer-events:none}
.moon::before,.moon::after{content:'';position:absolute;border-radius:50%;background:rgba(214,178,90,.4)}
.moon::before{width:14px;height:14px;right:12px;top:10px}
.moon::after{width:9px;height:9px;right:26px;top:32px}
.theme-cn .sky{background:linear-gradient(180deg,#FFDE9E,#FFCF87 46%,#FFE9BE)}
.theme-cn .hill.back{opacity:.5}
.theme-math .sky{background:linear-gradient(180deg,#58C4F7,#9FE0FB 46%,#DCF6FE)}
.theme-lab .sky{background:linear-gradient(180deg,#8F74EC,#B39CF7 40%,#E2DAFE)}
.theme-lab .hill{opacity:.5}
.theme-pinyin .sky{background:linear-gradient(180deg,#FFC98A,#FFDCA8 46%,#FFF0CE)}
.theme-pinyin .hill{opacity:.8}
.theme-english .sky{background:linear-gradient(180deg,#6FD0A8,#A8E5C8 46%,#E1F8EC)}
.theme-english .hill{opacity:.85}
.theme-astro .sky{background:linear-gradient(180deg,#232C68,#3D4CB0 48%,#7B8ADF)}
.theme-astro .hill{opacity:.5;filter:saturate(.45) brightness(.62) hue-rotate(28deg)}
.theme-coll .sky{background:linear-gradient(180deg,#FFC964,#FFDE94 40%,#FFF2C4)}
.theme-coll .hill{opacity:.6}
.theme-parent .sky{background:linear-gradient(180deg,#A9C0DC,#C6D6E9 44%,#E6EEF5)}
.theme-parent .hill{opacity:.35}
.theme-shop .sky{background:linear-gradient(180deg,#7FC6F2,#A9DCFA 42%,#DFF3FF)}
.theme-shop .hill{opacity:.5}
.v1 .hill{filter:saturate(1.05) brightness(.88) sepia(.18)}
.v1 .cloud{opacity:.7;background:#FFE9CF}
.v2 .hill{filter:saturate(.5) brightness(.62) hue-rotate(24deg)}
.v2 .cloud{opacity:.35;background:#C9D4FF}
.is-night .cloud{opacity:.35;background:#C9D4FF}
/* 地下砖块关（SMB 1-2 风）：深蓝洞窟 + 底部砖排 */
.v3 .sky{background:linear-gradient(180deg,#141F5C,#23337F 52%,#3A55B0)!important}
.v3 .hill{filter:saturate(.45) brightness(.5) hue-rotate(190deg)}
.v3 .cloud{display:none}
.v3 .glow{opacity:.35;background:radial-gradient(circle,#9FB4FF80,transparent 70%)}
.bricksrow{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;z-index:1;pointer-events:none}
.bricksrow img{width:54px;height:54px;margin-right:2px;flex:none}
/* 旋转金币 + 顶砖 + 金币飞行（马里奥元素） */
@keyframes spincoin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.sky-coins img{animation:spincoin 2.6s linear infinite}
.sky-coins img:nth-child(2){animation-delay:.5s}
.sky-coins img:nth-child(3){animation-delay:1s}
@keyframes blockbump{0%{transform:translateX(-50%) translateY(0)}35%{transform:translateX(-50%) translateY(-16px)}100%{transform:translateX(-50%) translateY(0)}}
.blk{cursor:pointer}
.blk.bump{animation:blockbump .5s ease}
.flycoin{position:absolute;z-index:70;pointer-events:none;transition:transform .75s cubic-bezier(.25,-.15,.55,1),opacity .75s}
@keyframes chipbump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.goldchip.bumped{animation:chipbump .45s}
/* 马里奥小人：待机蹦跳 + 点击起跳 */
@keyframes mascotbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(.98,1.03)}}
.mascot{cursor:pointer;animation:mascotbob 1.5s ease-in-out infinite;transition:filter .15s}
.mascot:hover{filter:brightness(1.08) drop-shadow(0 4px 8px rgba(0,0,0,.2))}
@keyframes mascotjump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(3px) scale(1.12,.82)}45%{transform:translateY(-34px) scale(.94,1.1)}70%{transform:translateY(0) scale(1.06,.9)}100%{transform:translateY(0) scale(1,1)}}
.mascot.jump{animation:mascotjump .65s ease-out}
/* 翻翻牌（扑克牌风 3D 翻转） */
.memgrid{display:grid;grid-template-columns:repeat(3,150px);gap:16px}
.mcard{width:150px;height:130px;perspective:700px;cursor:pointer}
.mc-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.9,.4,1.1);transform-style:preserve-3d}
.mcard.flip .mc-inner{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mc-back{background:linear-gradient(180deg,#5A78E8,#3A55C8);border:4px solid #fff;box-shadow:0 5px 0 #2E44A8;color:#fff}
.mc-back b{font-size:36px;font-weight:900}
.mc-back span{font-size:16px;opacity:.85}
.mc-front{background:linear-gradient(180deg,#fff,#F6F9FF);border:3px solid #D8E2F8;transform:rotateY(180deg);position:absolute}
.mcard.ok .mc-front{border-color:#BFE8C9;background:linear-gradient(180deg,#fff,#EFFBEF)}
.mc-suit{position:absolute;top:6px;left:9px;font-size:13px;color:#8A9CC8;font-style:normal}
/* 掷骰子 */

/* ---------- 通用组件 ---------- */
.screen{position:absolute;inset:0;z-index:2;animation:screenIn .28s ease}
@keyframes screenIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.hud{position:absolute;top:0;left:0;right:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:16px 22px 0;z-index:40;pointer-events:none}
.hud-l,.hud-r{display:flex;align-items:center;gap:12px;pointer-events:auto}
.sqbtn{width:62px;height:62px;border:none;cursor:pointer;border-radius:21px;background:linear-gradient(180deg,#FFFDF6,#FFF3DC);box-shadow:0 4px 0 #E8D5AE,0 8px 14px rgba(84,66,58,.12);display:grid;place-items:center;transition:transform .08s}
.sqbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E8D5AE}
.goldchip{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFDF4,#FFF2CE);border-radius:999px;padding:8px 18px 8px 10px;box-shadow:0 4px 0 #EBD9A8,0 6px 12px rgba(84,66,58,.1);font-size:21px;font-weight:900;color:#8A5B00}
.goldchip .ico{width:33px;height:33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE68A,var(--gold) 60%,var(--gold-dk));display:grid;place-items:center}
.jbtn{font-family:inherit;border:none;cursor:pointer;border-radius:999px;font-weight:800;color:#fff;padding:13px 28px;font-size:20px;letter-spacing:1px;position:relative;transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.14)}
.jbtn:active{transform:translateY(4px)}
.j-orange{background:linear-gradient(180deg,#FFB25C,var(--orange) 45%,var(--orange-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--orange-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-yellow{background:linear-gradient(180deg,#FFDD7A,var(--yellow) 45%,var(--yellow-dk));color:#7A4A00;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 var(--yellow-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-green{background:linear-gradient(180deg,#7FD98A,var(--green) 45%,var(--green-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 #2E8A40,0 8px 14px rgba(84,66,58,.18)}
.j-blue{background:linear-gradient(180deg,#7CC4F5,var(--blue) 45%,var(--blue-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--blue-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-purple{background:linear-gradient(180deg,#B79BFF,var(--purple) 45%,var(--purple-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--purple-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-cream{background:linear-gradient(180deg,#FFFDF6,#FFF1D6);color:var(--ink);text-shadow:none;box-shadow:inset 0 3px 0 #fff,0 4px 0 #E4D2AC,0 6px 12px rgba(84,66,58,.12)}
.jbtn:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.nameplate{display:flex;align-items:center;filter:drop-shadow(0 6px 8px rgba(84,66,58,.22))}
.nameplate .ava{width:54px;height:54px;border-radius:50%;border:4px solid #fff;background:linear-gradient(160deg,#FFE29A,var(--yellow));display:grid;place-items:center;z-index:2}
.nameplate .name{background:linear-gradient(180deg,var(--orange),var(--orange-dk));color:#fff;font-weight:900;font-size:18px;padding:10px 18px 10px 22px;margin-left:-14px;border-radius:999px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.sticker{background:linear-gradient(180deg,#fff,var(--cream));border-radius:30px;border:5px solid #fff;outline:3px solid rgba(84,66,58,.08);box-shadow:0 12px 24px rgba(84,66,58,.16)}
.track{height:11px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(84,66,58,.12)}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFE58A,var(--gold));transition:width .5s}
.toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(16px);background:rgba(58,45,36,.94);color:#FFF7E8;font-size:20px;font-weight:700;padding:14px 30px;border-radius:999px;opacity:0;transition:all .3s;z-index:90;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:absolute;font-size:28px;z-index:80;pointer-events:none;animation:cfall 1.6s ease-in forwards}
@keyframes cfall{0%{transform:translateY(-40px) rotate(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(700px) rotate(330deg) scale(1.15);opacity:0}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.pulse{animation:pulse 1.5s ease-in-out infinite}
.shakeit{animation:shake .4s}
.popt{animation:pop .45s}

/* ---------- 迷你棋盘（v0.8 工单02 骨架 + v0.10 档 B5/C1/C2 视觉：大富翁式环形赛道） ----------
   棋盘本体是一块垫子：环带即赛道（.broad），格子是铺在赛道上的地契砖（.bcell：色带+米白身体+标签），
   四角是锚点格（起点/回城堡），中央空地放终点城堡地标 + 星轨 + 骰子木托盘。 */
.bboard{position:absolute;inset:0 4px 8px 4px;z-index:10;border-radius:34px;border:7px solid #fff;
  background:linear-gradient(180deg,#FFFBF0,#FFF0D2);
  box-shadow:0 6px 0 rgba(150,110,40,.22),0 18px 34px rgba(84,66,58,.2),inset 0 0 0 5px #F3DFB2;overflow:hidden}
.broad{position:absolute;border:54px solid #E9C983;border-radius:118px;pointer-events:none;
  box-shadow:inset 0 0 0 5px #D6AF63,0 0 0 5px #D6AF63,inset 0 6px 14px rgba(150,110,40,.18)}
.broad-dash{position:absolute;border:3px dashed rgba(255,255,255,.7);border-radius:98px;pointer-events:none}
.bcell{position:absolute;transform:translate(-50%,-50%);width:124px;border-radius:15px;overflow:hidden;z-index:12;
  background:linear-gradient(180deg,#fff,#FFF7E6);border:4px solid #fff;
  box-shadow:0 4px 0 var(--edge-c,#D6AF63),0 7px 12px rgba(84,66,58,.2);transition:transform .14s,box-shadow .14s}
.bcell .band{height:24px;background:linear-gradient(180deg,var(--c1,#FFE9AE),var(--c2,#F5B93B));
  border-bottom:3px solid rgba(255,255,255,.7);box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.bcell .cbd{padding:5px 4px 6px;text-align:center}
.bcell .ico{width:36px;height:36px;margin:0 auto;display:grid;place-items:center}
.bcell .nm{font-size:14px;font-weight:900;letter-spacing:.5px;color:#6B4A20;line-height:1.15}
.bcell .no{position:absolute;right:7px;top:3px;font-size:12px;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 1px 0 rgba(0,0,0,.28)}
/* 走过的格：色带转灰 + 路上留脚印，格体保持可读（不降饱和，见 v0.10 §4 B5 刻意偏离） */
.bcell.done{--edge-c:#B9A88F}
.bcell.done .band{background:linear-gradient(180deg,#CFC2AC,#A8977C)}
.bcell.now{transform:translate(-50%,-50%) scale(1.09);z-index:13;
  box-shadow:0 5px 0 var(--edge-c),0 0 0 5px rgba(255,255,255,.9),0 0 24px 10px rgba(255,214,110,.8)}
.bcell.corner{width:132px}
.bcell.corner .band{height:30px}
.bcell.corner .ico{width:44px;height:44px}
.bcell.corner .nm{font-size:16px}
/* 中央空地：终点城堡地标 + 本关星轨 + 骰子木托盘（大富翁把 logo 放中间，我们放终点城堡） */
.bhub{position:absolute;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:4px 0}
.bgoal{position:relative}
.bgoal .lawn{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:216px;height:28px;border-radius:50%;
  background:radial-gradient(ellipse at center,#8FD86B 0%,#8FD86B 58%,rgba(143,216,107,0) 62%);opacity:.9}

.bstars{display:flex;gap:9px;background:rgba(255,253,246,.94);border:3px solid #fff;border-radius:999px;padding:4px 13px;box-shadow:0 3px 8px rgba(84,66,58,.16)}

.bdietray::after{content:"";position:absolute;inset:8px;border-radius:13px;background:linear-gradient(180deg,#7E4E1F,#A5713C);box-shadow:inset 0 5px 12px rgba(0,0,0,.4)}
/* CSS 3D 立方体骰：结果先定后演，动画只负责把目标面转到正面（v0.10 §5 C1 五段节拍） */
.bdie-holder{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:62px;height:62px;z-index:3;perspective:520px}
.bdie-lift{width:62px;height:62px;transition:transform .12s ease-out}
.bdie-tilt{width:62px;height:62px;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(-9deg)}
.bdie-cube{position:relative;width:62px;height:62px;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.16,.72,.3,1)}
.bdie-cube .f{position:absolute;inset:0;border-radius:13px;border:2px solid rgba(0,0,0,.14);
  background:linear-gradient(160deg,#fff,#F0E7D2);box-shadow:inset 0 4px 0 rgba(255,255,255,.9),inset 0 -6px 10px rgba(160,130,90,.28)}
.bdie-cube .f span{position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FF9A8A,#C24836);box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5)}
.bf1{transform:rotateY(0deg) translateZ(31px)}
.bf2{transform:rotateY(180deg) translateZ(31px)}
.bf3{transform:rotateY(90deg) translateZ(31px)}
.bf4{transform:rotateY(-90deg) translateZ(31px)}
.bf5{transform:rotateX(90deg) translateZ(31px)}
.bf6{transform:rotateX(-90deg) translateZ(31px)}
.bdie-shadow{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:50px;height:12px;border-radius:50%;
  background:rgba(0,0,0,.42);filter:blur(3px);transition:transform .12s ease-out,opacity .12s}
.brollbtn{font-family:inherit;font-size:23px;font-weight:900;letter-spacing:2px;color:#7A4A00;cursor:pointer;
  border:4px solid #fff;border-radius:999px;padding:11px 26px;
  background:linear-gradient(180deg,#FFDD7A,var(--yellow) 45%,var(--yellow-dk));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 5px 0 var(--yellow-ddk),0 9px 15px rgba(84,66,58,.22);
  transition:transform .1s,box-shadow .1s}
.brollbtn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 1px 0 var(--yellow-ddk)}
.brollbtn:disabled{filter:grayscale(.65) opacity(.6);cursor:default}
/* 角色棋子：起跳压扁→空中拉长→落地压扁→小回弹，影子随高度缩放（transform 动画，不再用 margin） */
.btoken{position:absolute;z-index:26;transform:translate(-50%,-50%);transition:left .3s ease-in-out,top .3s ease-in-out;pointer-events:none}
.btoken .tw{width:50px;height:50px;line-height:1}
.btoken .tsh{position:absolute;left:50%;top:46px;transform:translateX(-50%);width:34px;height:10px;border-radius:50%;
  background:rgba(84,66,58,.3);filter:blur(2px)}
.btoken.hop .tw{animation:bhop .32s cubic-bezier(.3,-.4,.5,1.5)}
.btoken.hop .tsh{animation:bsh .32s ease-out}
@keyframes bhop{0%{transform:translateY(0) scale(1.14,.86)}30%{transform:translateY(-32px) scale(.9,1.14)}
  62%{transform:translateY(0) scale(1.16,.84)}82%{transform:translateY(-7px) scale(.97,1.03)}100%{transform:translateY(0) scale(1)}}
@keyframes bsh{0%{transform:translateX(-50%) scale(1);opacity:.34}30%{transform:translateX(-50%) scale(.55);opacity:.16}100%{transform:translateX(-50%) scale(1);opacity:.3}}
.bprint{position:absolute;width:9px;height:12px;border-radius:50% 50% 45% 45%;background:rgba(150,110,40,.3);
  transform:translate(-50%,-50%) rotate(var(--r,0deg));z-index:11;pointer-events:none}
.bshake{animation:bshk .22s}
@keyframes bshk{0%,100%{transform:none}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-2px)}80%{transform:translate(2px,2px)}}
.boverlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(46,36,28,.42)}
.boverlay .sticker{width:min(940px,96%);height:min(560px,92%);padding:18px 26px}
.rest-mascot{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);animation:restin 1.7s ease-in-out forwards}
@keyframes restin{0%{opacity:1;transform:translateX(-50%) scale(1)}60%{opacity:.9;transform:translateX(-50%) scale(.5)}100%{opacity:.12;transform:translateX(-50%) scale(.3)}}

.fstep.done{color:var(--green-dk);background:#EFFBEF}.fstep.done .n{background:var(--green);color:#fff}
.farr{color:rgba(255,255,255,.95);font-weight:900}
.lab-cols{position:absolute;top:150px;left:24px;right:24px;bottom:66px;display:flex;gap:16px;z-index:15}
.shelf{width:212px;padding:13px;display:flex;flex-direction:column;gap:9px}
.shelf .hd,.codex .hd{text-align:center;font-size:16px;font-weight:900;padding:6px 0;border-radius:999px;letter-spacing:2px}
.shelf .hd{color:var(--orange-ddk);background:linear-gradient(180deg,#FFE7A8,var(--yellow));box-shadow:0 3px 0 var(--gold-ddk)}
.codex .hd{color:var(--purple-dk);background:linear-gradient(180deg,#E4D6FF,#D0BCFF);box-shadow:0 3px 0 var(--purple)}
.shelf-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1}
.item{position:relative;border-radius:19px;background:#fff;border:3.5px solid #F2E2C4;box-shadow:0 3px 0 #EFE3C8;display:grid;place-items:center;min-height:82px;cursor:pointer;transition:transform .12s}
.item:hover{transform:translateY(-3px) scale(1.04)}
.item.sel{border-color:var(--purple);background:#F5F0FF;transform:scale(1.06)}
.item.used{opacity:.32;pointer-events:none}
.item .tick{position:absolute;top:-9px;right:-7px;font-size:19px}
.tank{position:relative;flex:1;max-width:470px;height:436px;margin:auto 0}
.tank .glass{position:absolute;inset:0;border-radius:24px;border:9px solid #fff;background:linear-gradient(180deg,rgba(234,249,255,.9) 0 52px,#7FD4F8 52px 100%);box-shadow:inset 0 8px 18px rgba(47,134,201,.18);overflow:hidden;cursor:pointer}
.tank .glass.armed{box-shadow:0 0 0 6px rgba(155,123,245,.5),inset 0 8px 18px rgba(47,134,201,.18)}
.tank .wl{position:absolute;top:44px;left:0;right:0;height:11px;background:rgba(255,255,255,.6);border-radius:40%;animation:water 3.2s ease-in-out infinite}
@keyframes water{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
.titem{position:absolute;font-size:0;transition:none;filter:drop-shadow(0 5px 5px rgba(20,60,90,.25));z-index:5}
.titem img{width:66px;height:66px}
.titem.bobbing{animation:bob 2.6s ease-in-out infinite}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.8);border:2px solid #A1DBF6;animation:bubup 1s ease-out forwards;z-index:4;pointer-events:none}
@keyframes bubup{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-320px);opacity:0}}
.result-chip{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.97);border-radius:999px;padding:9px 24px;font-size:19px;font-weight:900;box-shadow:0 4px 0 rgba(84,66,58,.12);z-index:8;white-space:nowrap}
.guess-card{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:rgba(58,45,80,.4);border-radius:22px}
.guess-card .card{text-align:center;padding:26px 40px;border-radius:26px;border:5px solid #fff;background:linear-gradient(180deg,#FFFDF4,#FFF3D8);box-shadow:0 18px 36px rgba(0,0,0,.3);animation:pop .4s}
.codex{width:224px;padding:13px;display:flex;flex-direction:column;gap:8px}
.clist{background:#fff;border-radius:13px;outline:3px solid #F2E2C4;min-height:86px;padding:7px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.cchip{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(180deg,#FFFDF4,#FFF3D8);border-radius:10px;padding:3px 9px;font-size:14px;font-weight:900;box-shadow:0 2px 0 #F0DCAC;cursor:pointer}
.empty{color:#C6BADF;font-size:13.5px;font-weight:700;padding:4px}
/* 闪闪小课堂（科学知识卡问答获得路径） */
.sci-quiz-cta{margin-top:8px;border:3px solid var(--purple);cursor:pointer;font-family:inherit;width:100%;background:#fff;border-radius:14px;padding:11px 8px;font-size:16px;font-weight:900;color:var(--purple-dk);box-shadow:0 3px 0 rgba(94,63,190,.25)}
.sci-quiz-cta:active{transform:translateY(3px);box-shadow:none}
.sci-quiz-hd{margin-top:8px;font-size:15px;font-weight:900;color:var(--purple-dk);text-align:center}
.sci-quiz-hd.done{color:var(--green-dk)}
.sci-quiz-hd b{color:var(--purple)}
.sci-quiz-list{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.cchip.quiz-todo{background:rgba(155,123,245,.10);color:var(--ink-soft);box-shadow:none;border:2px dashed var(--purple)}
.sci-quiz-card{width:min(560px,92%);padding:26px 30px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.sci-quiz-t{font-size:16px;font-weight:900;color:var(--purple-dk)}
.sci-quiz-q{font-size:22px;font-weight:900;color:var(--ink);line-height:1.45}
.sci-quiz-opts{display:flex;flex-direction:column;gap:10px;width:100%}
.sci-opt{border:3px solid var(--line);cursor:pointer;font-family:inherit;font-size:19px;font-weight:900;color:var(--ink);background:#fff;border-radius:16px;padding:13px 18px;box-shadow:var(--sh-card);transition:transform .08s}
.sci-opt:active{transform:translateY(3px)}

/* ---------- 收集册 ---------- */
.tabs{position:absolute;top:92px;left:26px;display:flex;gap:11px;z-index:20}
.tab{border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .icw{width:50px;height:50px;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 4px 0 rgba(84,66,58,.15);display:grid;place-items:center;transition:all .12s}
.tab .t{font-size:14px;font-weight:900;color:#8A6520;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.tab.active .icw{background:linear-gradient(180deg,#FFDD7A,var(--yellow-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--yellow-ddk);transform:translateY(-4px) scale(1.08)}
.board{position:absolute;left:18px;right:18px;top:186px;bottom:14px;background:linear-gradient(180deg,#FFFBF0,var(--cream-dk));border-radius:40px;border:5px solid #fff;box-shadow:0 14px 28px rgba(84,66,58,.15);z-index:15;overflow:hidden;display:flex;flex-direction:column}
.board .inner{padding:18px 24px;overflow:auto;flex:1}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.slot{aspect-ratio:1/1.02;border-radius:21px;display:grid;place-items:center;align-content:center;cursor:pointer;position:relative;transition:transform .12s;text-align:center}
.slot:hover{transform:translateY(-4px) scale(1.04)}
.slot .em{height:52px;display:grid;place-items:center}
.slot .em img{width:46px;height:46px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
.slot .nm{font-size:14px;font-weight:900;margin-top:3px;letter-spacing:1px}
.slot .tag{position:absolute;top:7px;right:9px;font-size:12px;font-weight:900;border-radius:999px;padding:2px 8px;color:#fff}
.slot.got{background:linear-gradient(180deg,#fff,#FFF6E0);border:4px solid #fff;outline:3px solid #F5DFAC;box-shadow:0 4px 0 #EFDBA8}
.slot.lock{background:#F3EADA;border:4px dashed #E0D2B6;color:#C9BBA0;cursor:default}
.slot.lock .em{opacity:.65;filter:grayscale(1)}
.hint{margin-top:14px;text-align:center;font-size:15px;color:var(--ink-soft);font-weight:800}

/* ---------- 家长中心 ---------- */
.pwrap{position:absolute;inset:88px 22px 16px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:15px;align-content:start;z-index:10}
.panel{background:linear-gradient(180deg,#fff,#FBF7EE);border-radius:26px;border:4px solid #fff;outline:3px solid rgba(84,66,58,.07);box-shadow:0 8px 18px rgba(84,66,58,.1);padding:18px 20px}
.panel h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.panel h3 .icw{width:34px;height:34px;border-radius:11px;background:linear-gradient(180deg,#FFF3D8,#FFE7BC);box-shadow:0 3px 0 #F0DCAC;display:grid;place-items:center}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:900;line-height:1.1}
.ring .num small{font-size:11px;color:var(--ink-soft)}
.seg-label{font-size:14.5px;font-weight:900;margin:4px 0 5px}
.seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:none;background:#F3EADA;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:900;color:var(--ink-soft);cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #E2D4B8}
.seg button.on{background:linear-gradient(180deg,var(--blue),var(--blue-dk));color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--blue-ddk)}
.subj-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.subj-row .nm{width:70px;font-size:15px;font-weight:900}
.subj-row .track{flex:1}
.subj-row .val{width:66px;text-align:right;font-size:13px;font-weight:900;color:var(--ink-soft)}
.stat-chip{background:linear-gradient(180deg,#FFF3D8,#FFE9BC);border-radius:999px;font-size:13px;font-weight:900;color:#9A6B00;padding:5px 12px;box-shadow:0 3px 0 #F0DCAC;display:inline-block;margin:0 6px 6px 0}
/* 金币收支按来源（工单09，家长中心只读） */
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:4px}
.cs-row{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:800;color:var(--ink-soft);border-bottom:1px dashed #EADFC8;padding-bottom:5px}
.cs-row b{font-size:15px}
.cs-foot{margin-top:10px;background:linear-gradient(180deg,#EAF6EC,#D8F0DE);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:900;color:#2A7A40;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.promise{font-size:14px;font-weight:800;color:var(--ink-soft);padding:4px 0 4px 22px;position:relative}
.promise::before{content:'✓';position:absolute;left:2px;color:var(--green-dk);font-weight:900}
.gate{position:absolute;inset:0;background:rgba(30,40,52,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60}
.gate .card{text-align:center;padding:32px 46px;border-radius:30px;border:5px solid #fff;background:linear-gradient(180deg,#FFFDF4,#FFF3D8);box-shadow:0 20px 40px rgba(0,0,0,.3);animation:pop .4s;max-width:520px}
.gate .q{font-size:36px;font-weight:900;letter-spacing:4px;background:#fff;border-radius:16px;padding:12px 30px;margin:12px 0 16px;box-shadow:0 4px 0 #F0DCAC}
.gate input{width:126px;font-size:28px;font-weight:900;text-align:center;padding:11px;border:none;border-radius:15px;background:#fff;box-shadow:inset 0 0 0 3px #E8DFC8,0 4px 0 #E8DFC8;outline:none;font-family:inherit;color:var(--ink)}

/* ---------- 休息遮罩 ---------- */
.rest{position:absolute;inset:0;background:rgba(10,8,6,.6);display:grid;place-items:center;z-index:100}
.rest .card{text-align:center;padding:36px 48px;border-radius:32px;border:5px solid #fff;background:var(--blue-dk);box-shadow:0 20px 40px rgba(0,0,0,.4);color:#fff}
.rest.day .card{background:var(--purple-dk)}
.rest h2{font-size:30px;font-weight:900;margin:10px 0 6px}
.rest p{font-size:17px;opacity:.92;font-weight:800}
.rest .cnt{position:relative;width:104px;height:104px;margin:0 auto 6px}

/* ---------- 金币商店（工单08） ---------- */
.shop-wrap{position:absolute;left:24px;right:24px;top:72px;bottom:14px;display:block;overflow:hidden;padding-top:64px}
.shop-sec{display:block;margin-bottom:22px}
.shop-grid{height:242px;grid-auto-rows:242px;align-items:stretch}
.shop-grid.gdice{height:224px;grid-auto-rows:224px}
.shop-card{height:100%}
.shop-sec h2{font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15);margin:0 0 9px 4px;display:flex;align-items:center;gap:8px}
.shop-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;width:100%;box-sizing:border-box}
.shop-grid.gdice{grid-template-columns:repeat(5,1fr)}
.shop-card{background:#FFFDF6;border-radius:18px;border:3px solid #EAD9B8;padding:11px 8px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 rgba(150,110,60,.25);overflow:hidden}
.shop-card.active{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 5px 0 rgba(40,160,80,.3)}
.shop-ic{width:74px;height:92px;display:grid;place-items:center}
.shop-ic img{width:100%;height:100%;object-fit:contain}
.shop-name{font-size:15px;font-weight:900;color:#5A4632;margin:7px 0 8px;text-align:center;line-height:1.15;min-height:34px;display:flex;align-items:center}
.shop-btn{width:100%;border:none;border-radius:12px;padding:12px 4px;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
.shop-btn.buy{background:linear-gradient(var(--buy-hi),var(--buy));color:var(--buy-ink);box-shadow:0 3px 0 var(--buy-dk)}
.shop-btn.buy.poor{background:#E7DFD0;color:#9A8E78;box-shadow:0 3px 0 #C9BFA8}
.shop-btn.use{background:linear-gradient(var(--use-hi),var(--use));color:#fff;box-shadow:0 3px 0 var(--use-dk)}
.shop-btn.using{background:#E7F7EC;color:#2A9E50;border:2px solid #8FDCA4;box-shadow:none;padding:10px 4px}
.shop-btn .coin{width:17px;height:17px}
/* 衣橱（工单09，收集册内） */
.ward-tip{background:#EAF6FF;border:2px solid #BBDDF2;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:800;color:#2F6E94;margin-bottom:12px}
.ward-sec{margin-bottom:12px}
.ward-sec .shop-grid{height:auto;grid-auto-rows:auto}
.ward-sec .shop-grid .shop-card{height:auto;min-height:186px}
.ward-sec .shop-grid.gdice .shop-card{min-height:176px}
/* 收集册面板高度有限：衣橱卡收紧，保证两行完整放下不滚动 */
.ward-sec .shop-ic{width:58px;height:72px}
.ward-sec .shop-name{margin:4px 0 6px;min-height:30px}
.ward-sec .shop-btn{padding:10px 4px}
.ward-sec .shop-btn.using{padding:8px 4px}
.ward-h{font-size:18px;font-weight:900;color:var(--ink-soft);margin:0 0 8px 4px}
.ward-vis{flex:1;display:grid;place-items:center;align-self:stretch}
.ward-vis.locked{opacity:.18;filter:grayscale(1)}
.shop-card.unowned{background:#F4F1EA;border-color:#E0D9CA;box-shadow:0 5px 0 rgba(150,140,120,.2)}
.shop-btn.togoshop{background:linear-gradient(#EFE9DD,#E0D7C5);color:#7A6E5C;box-shadow:0 3px 0 #C5B9A4}
/* ============ v0.10 档 A（品牌字 + 质感统一）+ 斑马 AI 课三条纪律 ============
   纪律①卡片纯白、文字深色高对比——不再「彩底白字」
   纪律②一屏只允许一个色相：学科页 = 该学科 --accent + 白，背景让给白
   纪律③IP 角色升格为常驻讲解者（指题、表扬），是全场唯一的指令通道
   标题字：系统黑体（微软雅黑 / 苹方）——2026-10-01 试玩否掉了站酷庆科黄油体，
   展示字在 5 岁孩子的屏幕上是噪声；子集化产物仍可用 ios/tools/gen_font_subset.py 重新生成 */
:root{
  --font-title:"Microsoft YaHei","PingFang SC","Heiti SC","Source Han Sans SC",sans-serif;
  --font-body:"Microsoft YaHei","PingFang SC","Heiti SC","Source Han Sans SC",sans-serif;
  --line:#F0E6D6;--sh-card:0 8px 22px rgba(84,66,58,.10),0 2px 0 rgba(84,66,58,.05);
  --accent:#FF9F43;--accent-dk:#D97706;--accent-ink:#8A5300;--accent-soft:#FFF4E2;
}
body{font-family:var(--font-body)}
.kid-title{font-family:var(--font-title);font-weight:800;letter-spacing:2px}
/* ---------- 纪律②：一屏一色 ---------- */
.theme-cn{--accent:#F59A23;--accent-dk:#DB7F0B;--accent-ink:#8A5300;--accent-soft:#FFF4E2}
.theme-math{--accent:#3E93D6;--accent-dk:#2F79B4;--accent-ink:#1D5A8C;--accent-soft:#EAF6FF}
.theme-lab{--accent:#8B6BE8;--accent-dk:#6F4FD0;--accent-ink:#4E33A6;--accent-soft:#F2ECFF}
.theme-pinyin{--accent:#F0705E;--accent-dk:#D24E3C;--accent-ink:#A63A28;--accent-soft:#FFEEE9}
.theme-english{--accent:#3FA85A;--accent-dk:#2E8A46;--accent-ink:#1F6B33;--accent-soft:#EAF8EE}
.theme-astro{--accent:#8E9BEF;--accent-dk:#5563B8;--accent-ink:#E8ECFF;--accent-soft:rgba(255,255,255,.14)}
.theme-shop{--accent:#E0A020;--accent-dk:#C08A0C;--accent-ink:#7A4A00;--accent-soft:#FFF6DF}
.theme-coll{--accent:#E0A020;--accent-dk:#C08A0C;--accent-ink:#7A4A00;--accent-soft:#FFF6DF}
.theme-parent{--accent:#5B8DB8;--accent-dk:#457A9F;--accent-ink:#2E5D7C;--accent-soft:#EEF5FA}
/* 背景让给白：天空收成极浅的品牌色洗色，丘陵退成淡影 */
.theme-cn .sky{background:linear-gradient(180deg,#FFF1DA,#FFF9EF 55%,#fff)}
.theme-math .sky{background:linear-gradient(180deg,#DFF1FF,#F4FBFF 55%,#fff)}
.theme-lab .sky{background:linear-gradient(180deg,#EDE6FF,#F8F5FF 55%,#fff)}
.theme-pinyin .sky{background:linear-gradient(180deg,#FFE7DF,#FFF6F3 55%,#fff)}
.theme-english .sky{background:linear-gradient(180deg,#DFF5E6,#F3FBF5 55%,#fff)}
.theme-shop .sky{background:linear-gradient(180deg,#E4F2FF,#F6FBFF 55%,#fff)}
.theme-coll .sky{background:linear-gradient(180deg,#FFF1D6,#FFF8EA 55%,#fff)}
.theme-parent .sky{background:linear-gradient(180deg,#E6EEF6,#F5F9FC 55%,#fff)}
.theme-astro .sky{background:linear-gradient(180deg,#20295E,#3B4794 52%,#7080CA)}
.scene .hill{opacity:.32;filter:saturate(.5) brightness(1.06)}
.theme-astro .hill{opacity:.22;filter:saturate(.4) brightness(.7)}
.scene .glow{opacity:.55}
.v1 .sky{background:linear-gradient(180deg,#FFE9D2,#FFF6EC 55%,#fff)!important}
.v2 .sky{background:linear-gradient(180deg,#DCE7FF,#F2F6FF 55%,#fff)!important}
.v3 .sky{background:linear-gradient(180deg,#243470,#3A55B0 55%,#6E86CE)!important}
.v1 .hill,.v2 .hill{opacity:.28}
/* ---------- 纪律①：白卡深字 ---------- */
.sticker{background:#fff;border:4px solid #fff;outline:3px solid var(--line);box-shadow:var(--sh-card)}
.panel{background:#fff;border:3px solid var(--line);outline:none;box-shadow:var(--sh-card)}
.panel h3{color:var(--ink);font-family:var(--font-title);font-weight:800;letter-spacing:1px}
.panel h3 .icw{background:var(--accent-soft);box-shadow:none}
.board{background:#fff;border:4px solid #fff;box-shadow:var(--sh-card)}
.q-pill{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:var(--sh-card);
  font-family:var(--font-title);font-weight:800;letter-spacing:1px;font-size:26px;padding:12px 32px}
.goldchip{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:var(--sh-card);
  font-family:var(--font-title);font-weight:800;font-size:23px;padding:7px 18px 7px 9px}
.goldchip .ico{width:30px;height:30px}
.sqbtn{background:#fff;box-shadow:0 3px 0 var(--line),0 6px 12px rgba(84,66,58,.10)}
.sqbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.nameplate .name{background:#fff;color:var(--ink);border:3px solid var(--accent);text-shadow:none;
  box-shadow:var(--sh-card);font-family:var(--font-title);font-weight:800;letter-spacing:1px;font-size:19px}
.nameplate .ava{background:#fff;border:3px solid var(--accent)}
.hud-title{font-family:var(--font-title);font-weight:800;letter-spacing:2px;font-size:27px;color:var(--accent-ink);line-height:1.15}
.hud-sub{font-size:14px;color:var(--ink-2);font-weight:800}
.theme-astro .hud-title{color:#fff;text-shadow:0 2px 8px rgba(20,26,64,.5)}
.theme-astro .hud-sub{color:#C9D4FF}
.theme-astro .q-pill,.theme-astro .goldchip{color:var(--ink)}
.opt{background:#fff;border:4px solid #fff;outline:4px solid var(--line);box-shadow:var(--sh-card)}
.opt:hover{outline-color:var(--accent)}
.opt.ok{outline-color:var(--green);background:#F0FBF2}
.opt.no{outline-color:var(--coral)}
.numblock{background:#fff;border:3px solid var(--line);color:var(--accent-ink);text-shadow:none;
  box-shadow:0 5px 0 var(--line),var(--sh-card);font-family:var(--font-title);font-weight:800}
.numblock:hover{transform:translateY(-4px);border-color:var(--accent)}
.numblock.ok{background:#F0FBF2;border-color:#9FDCB0;color:#1F6B33;box-shadow:0 5px 0 #BFE8C9,var(--sh-card)}
.tcard{background:#fff;color:var(--ink);border:4px solid var(--accent);box-shadow:var(--sh-card);text-shadow:none}
.pinyin{background:#fff;color:var(--accent-ink);border:3px solid var(--accent);box-shadow:var(--sh-card);text-shadow:none}
.wordchip{background:#fff;border:3px solid var(--line);color:var(--ink);box-shadow:var(--sh-card)}
.speakopt{background:#fff;border:2.5px solid var(--line);color:var(--ink-2)}
.speakbtn{background:#fff;border:3px solid var(--accent);box-shadow:var(--sh-card)}
.seqcard{background:#fff;border:3px solid var(--line);box-shadow:var(--sh-card)}
.seqq{background:#fff;border:3px dashed var(--accent);box-shadow:var(--sh-card);color:var(--accent-ink)}
.textopt{background:#fff;border:4px solid var(--line);color:var(--ink);box-shadow:var(--sh-card)}
.textopt.ok{background:#F0FBF2;border-color:#9FDCB0;color:#1F6B33}
.plate{background:#fff;border:4px solid var(--line);box-shadow:var(--sh-card)}
.cnt-chip{background:#fff;color:var(--ink);box-shadow:var(--sh-card)}
.result-chip{background:#fff;color:var(--ink);box-shadow:var(--sh-card)}
.item{background:#fff;border:3px solid var(--line);box-shadow:var(--sh-card)}
.item.sel{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft),var(--sh-card)}
.cchip{background:#fff;border:2px solid var(--line);color:var(--ink);box-shadow:var(--sh-card)}
.clist{background:#fff;outline:2px solid var(--line)}
.schip{background:#fff;color:var(--ink-2);box-shadow:var(--sh-card)}
.schip.done{background:#F0FBF2;color:var(--green-dk)}
.schip.now{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dk)}
.fstep{background:#fff;color:var(--ink-3);box-shadow:var(--sh-card)}
.fstep.now{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dk)}
.fstep.done{background:#F0FBF2;color:var(--green-dk)}
.shelf .hd{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none;font-family:var(--font-title);font-weight:800;letter-spacing:2px}
.codex .hd{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none;font-family:var(--font-title);font-weight:800;letter-spacing:2px}
.slot.got{background:#fff;border:3px solid var(--line);outline:none;box-shadow:var(--sh-card)}
.slot.lock{background:#FBF8F2;border:3px solid var(--line);color:var(--ink-3)}
.tab .t{color:var(--ink-2);text-shadow:none}
.tab.active .icw{background:var(--accent);box-shadow:0 4px 0 var(--accent-dk)}
.hint{color:var(--ink-2)}
.empty{color:var(--ink-3)}
.seg button{background:#fff;border:2px solid var(--line);color:var(--ink-2);box-shadow:none}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dk)}
/* 果冻按钮：统一质感，字用品牌展示字 */
.jbtn{font-family:var(--font-title);font-weight:800;letter-spacing:2px}
.jbtn:active{transform:translateY(4px)}
/* ---------- 纪律③：IP 讲解者（唯一的指令通道） ---------- */
.mascot-row{background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 16px 10px 10px;
  gap:12px;max-width:700px;box-shadow:var(--sh-card);align-items:flex-end;position:relative}
.mascot-row::after{content:"";position:absolute;left:30px;bottom:-10px;width:16px;height:16px;background:#fff;
  border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.mascot-row .m{line-height:1;filter:drop-shadow(0 5px 7px rgba(84,66,58,.22))}
.mascot-row .m img{width:66px;height:66px}
.mascot-row .say{background:var(--accent-soft);color:var(--ink);border-radius:15px;padding:10px 15px;font-size:16.5px;font-weight:800;line-height:1.5}
/* 棋盘地契砖也走同一套：白身 + 深色标签 + 学科色带 */
.bcell .nm{color:var(--ink)}
.bcell{box-shadow:0 4px 0 var(--edge-c,#D6AF63),var(--sh-card)}
.bgoal .cap{color:var(--ink-2);font-family:var(--font-title);font-weight:800;letter-spacing:2px}

/* ---------- 主页：白 + 暖橙，撤掉满屏高饱和（纪律①②） ---------- */
.theme-home{--accent:#F59A23;--accent-dk:#DB7F0B;--accent-ink:#8A5300;--accent-soft:#FFF4E2}
.theme-home .sky{background:linear-gradient(180deg,#CFEBFF,#EAF7FF 46%,#fff)}
.theme-home .hill{opacity:.38}
.banner{background:#fff;border:4px solid var(--accent);box-shadow:var(--sh-card);border-radius:26px}
.banner .stud{display:none}                     /* 四角圆点读起来像缩放手柄，撤掉 */
.banner h1{letter-spacing:18px;text-indent:18px}
.banner h1{font-family:var(--font-title);font-weight:800;letter-spacing:14px;color:var(--accent-ink);text-shadow:none}
.banner p{color:var(--ink-2);font-weight:800;letter-spacing:1px}
.banner .stud{background:var(--accent);border-color:var(--accent-dk)}
.zone-label{background:#fff;border:3px solid var(--accent);color:var(--accent-ink);box-shadow:var(--sh-card);
  font-family:var(--font-title);font-weight:800;letter-spacing:1px;font-size:17.5px;margin-top:-10px}
.zone-meta{color:var(--ink-2);text-shadow:none;font-size:12.5px;
  background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:4px 10px 6px;
  box-shadow:0 2px 0 var(--line);margin-top:6px}
.zone-meta .track{background:rgba(84,66,58,.12);height:8px;box-shadow:none}
.zone-meta .track i{background:linear-gradient(90deg,var(--accent),var(--accent-dk))}
/* 世界地图路径：走过的 = 白底勾，当前 = 品牌色环，未解锁 = 淡点（不再是一排灰饼） */
.lnode{width:36px;height:36px}
.lnode .tk{font-size:19px;font-weight:900;color:var(--green-dk)}
.lnode.done{background:#fff;border:3.5px solid var(--green);box-shadow:0 3px 0 rgba(46,138,64,.28)}
.lnode.done2{background:#fff;border:3.5px solid var(--blue);box-shadow:0 3px 0 rgba(47,134,201,.28)}
.lnode.done2 .tk{color:var(--blue-dk)}
.lnode.cur{background:#fff;border:4px solid var(--accent);box-shadow:0 0 0 6px rgba(245,154,35,.22),0 4px 0 var(--accent-dk)}
.lnode.lock{background:rgba(255,255,255,.62);border:3px solid rgba(255,255,255,.95);box-shadow:none;width:22px;height:22px;cursor:default}
.lnode .lab{color:#fff;text-shadow:0 2px 4px rgba(30,60,20,.55);font-size:12.5px}
.arcpanel{background:#fff;box-shadow:0 -6px 20px rgba(84,66,58,.10)}
.dock-item .icw{background:#fff;box-shadow:0 3px 0 var(--line),var(--sh-card)}
.dock-item .t{color:var(--ink)}
.dock-item .cnt{border:2px solid #fff}
.badge-new{background:#fff;color:var(--coral-dk);border:2.5px solid var(--coral);box-shadow:var(--sh-card)}
/* ---------- 金币商店：两排货架完整入画（旧版 6+6 在 5 列网格里溢出、第二排被帧底裁掉） ---------- */
.shop-wrap{position:absolute;left:22px;right:22px;top:82px;bottom:16px;padding-top:0;overflow:hidden;
  display:flex;flex-direction:column;gap:14px}
.shop-sec{display:flex;flex-direction:column;min-height:0;background:var(--accent-soft);border:3px solid #fff;
  border-radius:26px;padding:12px 14px 14px;box-shadow:var(--sh-card)}
.shop-sec h2{margin:0 0 10px;display:flex;align-items:center;gap:8px;text-shadow:none;color:var(--accent-ink);
  font-family:var(--font-title);font-weight:800;letter-spacing:2px;font-size:21px}
.shop-grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:12px;height:auto;flex:1;min-height:0;align-items:stretch}
.shop-grid.gdice{grid-template-columns:repeat(6,1fr)}
.shop-card{background:#fff;border:2.5px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--line);
  padding:8px 8px 10px;height:100%;min-height:0;overflow:hidden}
.shop-card.active{border-color:#9FDCB0;box-shadow:0 3px 0 #BFE8C9}
.shop-ic{width:100%;height:auto;flex:1;min-height:0;padding:2px 0}
.shop-ic img{width:auto;height:100%;max-width:100%;object-fit:contain}
.shop-name{font-size:14.5px;font-weight:800;color:var(--ink);margin:2px 0 8px;min-height:0;line-height:1.2}
.shop-btn{border-radius:12px;padding:9px 4px;font-size:15.5px;font-family:var(--font-title);font-weight:800;letter-spacing:1px;text-shadow:none}
.shop-btn.buy{background:#fff;border:2.5px solid var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-dk)}
.shop-btn.buy.poor{border-color:var(--line);color:var(--ink-3);box-shadow:0 3px 0 var(--line);background:#FBF8F2}
.shop-btn.use{background:var(--green);color:#fff;box-shadow:0 3px 0 #2E8A40}
.shop-btn.using{background:#F0FBF2;border:2.5px solid #9FDCB0;color:#1F6B33;box-shadow:none;padding:8px 4px}
/* 关卡页单焦点舞台（档 B1）：一块主卡 + 一条角色气泡指令通道，不再两块等权白卡 */
.teach-stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px 26px}
.teach-stage .morph{width:340px;height:282px}
.mascot-row{width:100%;max-width:780px}
.mascot-row .jbtn{margin-left:auto;flex:none}
/* 字母/声母大卡：白卡 + 学科色描边 + 深色字（不再彩底白字） */
.lettercard{width:252px;min-height:242px;border-radius:26px;background:#fff;border:5px solid var(--accent);
  box-shadow:var(--sh-card);display:grid;place-items:center;padding:0 12px;color:var(--accent-ink);
  font-weight:900;line-height:1.15;text-align:center}
.theme-astro .lettercard{color:#3D4CB0}
.mr-btns{margin-left:auto;display:flex;gap:10px;flex:none}
/* 地下砖块关（v3）：从近黑夜色收成暮蓝，白卡压得住、HUD 标题也读得出 */
.v3 .sky{background:linear-gradient(180deg,#42539C,#6E80C4 55%,#B9C7EA)!important}
.v3 .hill{opacity:.22;filter:saturate(.35) brightness(.8)}
.v3 .hud-title{color:#FFF3D8;text-shadow:0 2px 8px rgba(20,26,64,.55)}
.v3 .hud-sub{color:#D6E0FF}
.v3 .bricksrow{opacity:.85}
.theme-astro .goldchip,.v3 .goldchip{color:var(--ink)}
/* 收集册（档 B4）：未收集 = 淡剪影给期待感，不给虚线框 + 问号的未完成感；数字元信息撤下，进度只留视觉条 */
.coll-h{font-family:var(--font-title);font-weight:800;letter-spacing:2px;font-size:22px;color:var(--ink)}
.slot.lock{background:#FBF8F2;border:3px solid var(--line);box-shadow:none}
.slot .sil{display:block;opacity:.15;filter:grayscale(1) brightness(.4)}
.slot .sil-char{font-size:42px;font-weight:900;color:#57433A}
.slot.got .nm{color:var(--ink)}
/* 进度条：白卡面板上原来的白条完全看不见，改成中性槽 + 学科色填充 */
.track{background:rgba(84,66,58,.13);box-shadow:none}
.track i{background:linear-gradient(90deg,var(--accent),var(--accent-dk))}
/* 拼一拼：两个音「合成」一个音，绝不能读成减法。
   加法符号收进实心圆徽章，结果用「⇒」而不是「=」，下面再压一行小字说明关系 */
.blend-row{display:flex;align-items:center;gap:20px}
.blend-pair{display:flex;align-items:center;gap:0;padding:14px 16px;border-radius:32px;
  background:var(--accent-soft);border:3px dashed var(--accent-dk)}
.blend-tile{width:120px;height:120px;border-radius:22px;background:#fff;border:4px solid var(--accent);
  box-shadow:0 4px 0 var(--accent-dk);display:grid;place-items:center;
  font-size:66px;font-weight:900;color:var(--accent-ink);font-family:var(--font-title)}
.blend-tile.lean-a{transform:translateY(-9px) rotate(-4deg)}
.blend-tile.lean-b{transform:translateY(9px) rotate(4deg)}
.blend-op{width:44px;height:44px;margin:0 -12px;border-radius:50%;background:var(--green);color:#fff;
  border:4px solid #fff;box-shadow:0 3px 0 #2E8A40;display:grid;place-items:center;
  font-size:30px;font-weight:900;z-index:2;line-height:1}
.blend-to{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.blend-to .ar{font-size:46px;font-weight:900;color:var(--accent-dk);line-height:1}
.blend-to .cap{font-size:14px;font-weight:800;color:var(--accent-ink);letter-spacing:2px;
  background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.blend-slot{border-style:dashed;border-color:var(--line);background:#FBF8F2;
  box-shadow:0 4px 0 var(--line);color:var(--ink-3)}
.blend-won{border-color:var(--green);box-shadow:0 4px 0 #2E8A40;color:#1F6B33;font-size:60px}
/* ============ 天体视觉（天文台 v0.10）============ */
.bodywrap{position:relative;display:inline-block;flex:none}
.bodywrap.wan{transform:scaleX(-1)}
.body{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  box-shadow:inset -7px -9px 18px rgba(0,0,0,.34),inset 3px 4px 8px rgba(255,255,255,.18),0 4px 12px rgba(10,14,40,.35)}
.body .bd{position:absolute;left:-6%;width:112%;border-radius:50%;background:rgba(255,255,255,.26)}
.body .bd.b1{top:24%;height:8%}
.body .bd.b2{top:42%;height:13%;background:rgba(120,62,22,.30)}
.body .bd.b3{top:63%;height:7%;background:rgba(255,255,255,.20)}
.body .gspot{position:absolute;left:56%;top:55%;width:27%;height:16%;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#FFA97F,#BE4A22 72%)}
.body .gspot.dark{left:50%;top:36%;background:radial-gradient(circle at 38% 36%,#33549F,#142651 72%)}
.body .land{position:absolute;background:#3FA85A;border-radius:56% 44% 42% 58%/58% 42% 58% 42%}
.body .land.l1{left:12%;top:20%;width:44%;height:34%}
.body .land.l2{left:44%;top:52%;width:40%;height:30%}
.body .cap{position:absolute;left:28%;top:1%;width:44%;height:15%;border-radius:50%;background:rgba(255,255,255,.82)}
.body .cr{position:absolute;border-radius:50%;background:rgba(0,0,0,.20);box-shadow:inset 1px 1px 2px rgba(255,255,255,.30)}
.body .cr.c1{left:18%;top:26%;width:19%;height:17%}
.body .cr.c2{left:56%;top:50%;width:14%;height:13%}
.body .cr.c3{left:33%;top:68%;width:10%;height:9%}
.bodywrap>.tailx{position:absolute;right:52%;top:38%;width:150%;height:22%;border-radius:50%;
  background:linear-gradient(270deg,rgba(196,238,255,.95),rgba(196,238,255,0));transform:rotate(-16deg)}
.bodywrap>.ring{position:absolute;left:-30%;top:36%;width:160%;height:30%;border-radius:50%;
  border:7px solid rgba(238,220,186,.92);border-bottom-color:rgba(238,220,186,0);pointer-events:none}
.bodywrap>.ring.front{border-top-color:rgba(238,220,186,0);border-bottom-color:rgba(238,220,186,.95)}
.bodywrap>.ring.thin{border-width:3px;left:-20%;width:140%;height:22%}
.body .mh{position:absolute;left:0;top:0;width:50%;height:100%;background:#2B3560}
.body .me{position:absolute;left:50%;top:0;height:100%;border-radius:50%;transform:translateX(-50%)}
.body .me.dk{background:#2B3560}
.body .me.lt{background:radial-gradient(circle at 36% 32%,#FFFCEB,#F1EACF 55%,#CFC5A6)}
/* 数据对比题（cmp）：一行一个天体，圆盘/条形按数值走，点一行就是作答 */
.cmpbox{width:100%;max-width:760px;display:flex;flex-direction:column;gap:10px;
  background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:var(--sh-card);padding:14px 16px}
.cmprow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;cursor:pointer;
  border:3px solid transparent;transition:transform .12s}
.cmprow:hover{background:var(--accent-soft)}
.cmprow.ok{border-color:var(--green);background:#F1FBF3}
.cmprow.dim{opacity:.42}
.cmpic{width:56px;display:grid;place-items:center;flex:none}
.cmpbox.disc .cmpic{width:130px}
.cmpnm{width:88px;flex:none;font-family:var(--font-title);font-weight:800;font-size:21px;color:var(--ink);text-align:left}
.cmpbar{flex:1;height:26px;border-radius:999px;background:rgba(84,66,58,.10);overflow:hidden;min-width:120px}
.cmpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-dk))}
.cmpv{width:118px;flex:none;text-align:right;font-family:var(--font-title);font-weight:800;font-size:19px;color:var(--accent-ink)}
.cmpbox.disc{max-width:620px}
/* 天文台的 --accent-ink 是给深色夜空上的 HUD 用的（近白），落到白卡上就糊成一片，这里改回深蓝 */
.theme-astro .cmpv,.theme-astro .stat b{color:#3D4CB0}
.theme-astro .cmp-note{background:#EEF1FF}
.theme-astro .cmprow:hover{background:#EEF1FF}
.theme-astro .pcard,.theme-astro .oseq{color:var(--ink)}
.cmp-note{max-width:760px;background:var(--accent-soft);border-radius:14px;padding:8px 14px;
  font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.5}
.cmp-scale{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.5px}
/* 开场卡的数据条（letter.stats） */
.statrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:#fff;border:3px solid var(--line);border-radius:14px;padding:7px 13px;box-shadow:0 3px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:1px;min-width:104px}
.stat b{font-family:var(--font-title);font-weight:800;font-size:20px;color:var(--accent-ink);line-height:1.1}
.stat span{font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:1px}
.factline{max-width:640px;font-size:16px;font-weight:800;color:var(--ink-2);line-height:1.55;text-align:center}
/* 天体大卡 + 天体排序卡 */
.lettercard.cardart{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px 12px}
.lettercard .csub{font-family:var(--font-title);font-weight:800;font-size:21px;letter-spacing:3px;color:var(--accent-ink)}
.pcard{width:112px;height:104px;border-radius:18px;background:#fff;border:3px solid var(--line);
  box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-family:var(--font-title);font-weight:800;font-size:16px;color:var(--ink);cursor:pointer;flex:none}
.pcard.ok{border-color:var(--green)}
/* ============ v0.11：地理学科 + 真地图拼图 + 棋盘主页 + 简洁结算卡 ============ */
/* ---------- 地理（环球号）：一屏一色，青蓝做主色 ---------- */
.theme-geo{--accent:#2FA3B8;--accent-dk:#23808F;--accent-ink:#155E6B;--accent-soft:#E6F6F9}
.theme-geo .sky{background:linear-gradient(180deg,#DDF3F8,#F1FAFD 55%,#fff)}
.theme-geo .hud-title{color:var(--accent-ink)}
/* ---------- 棋盘主页 ---------- */
.hb-panel{position:absolute;left:26px;right:26px;top:110px;bottom:118px;background:#fff;
  border-radius:30px;box-shadow:var(--sh-card);outline:3px solid var(--line);z-index:15;overflow:hidden}
.hb-head{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:16px;
  padding:0 28px;border-bottom:2.5px dashed var(--line)}
.hb-title{font-size:23px;color:var(--accent-ink);letter-spacing:6px}
.hb-slogan{font-size:13.5px;font-weight:800;color:var(--ink-2);letter-spacing:1px}
.hb-overall{margin-left:auto;font-size:14px;font-weight:900;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:6px}
.hb-node{position:absolute;width:156px;height:150px;background:#fff;border:3px solid var(--line);border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
  box-shadow:0 4px 0 rgba(84,66,58,.06);transition:transform .14s;z-index:3}
.hb-node:hover{transform:translateY(-4px)}
.hb-node:active{transform:translateY(0)}
.hb-node .hb-ic{width:64px;height:64px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center}
.hb-node .hb-name{font-size:16.5px;color:var(--ink)}
.hb-node .hb-meta{font-size:12.5px;font-weight:900;color:var(--ink-2)}
.hb-node .hb-track{width:112px;height:8px;border-radius:99px;background:rgba(84,66,58,.10);overflow:hidden}
.hb-node .hb-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-dk))}
.hb-node.cur{border:4px solid var(--accent);box-shadow:0 0 0 6px rgba(245,159,67,.18),0 5px 0 var(--accent-dk)}
.hb-node.cur .hb-name{color:var(--accent-ink)}
.hb-node.full .hb-ic{background:#EAF8EE}
.hb-node.full .hb-name{color:var(--green-dk)}
.hb-node .hb-done{position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;
  background:#3FA85A;color:#fff;font-size:16px;font-weight:900;display:grid;place-items:center;
  border:3px solid #fff;box-shadow:0 3px 6px rgba(46,138,64,.35);z-index:4}
.hb-node.hb-mini{width:108px;height:104px;gap:3px;background:var(--cream);border-radius:18px}
.hb-node.hb-mini .hb-ic{width:46px;height:46px;border-radius:14px;background:#fff}
.hb-node.hb-mini .hb-name{font-size:13.5px}
.hb-node.hb-mini .hb-meta{font-size:11.5px}
.hb-end{background:#FFF6E3;border-color:#EAD9AE}
.hb-mascot{position:absolute;top:-58px;left:50%;transform:translateX(-50%);z-index:5;
  filter:drop-shadow(0 5px 6px rgba(84,66,58,.28))}
/* ---------- 拼地图（真实轮廓） ---------- */
.pz-piece{position:absolute;background:#fff;border:3px solid var(--line);border-radius:14px;cursor:grab;
  touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 4px 10px rgba(84,66,58,.14);overflow:hidden;z-index:10}
.pz-piece svg{width:100%;height:calc(100% - 20px);pointer-events:none}
.pz-piece .pz-name{font-size:13px;font-weight:900;color:var(--ink-2);line-height:1;pointer-events:none}
.pz-piece.drag{cursor:grabbing;box-shadow:0 14px 24px rgba(84,66,58,.28);transform:scale(1.06)}
.pz-piece.ok{border-radius:4px;border-color:transparent;background:transparent;box-shadow:none}
.pz-piece.ok svg{height:100%}
.pz-piece.ok .pz-name{display:none}
/* ---------- 结算卡（替代马里奥仪式） ---------- */
.fin{position:absolute;inset:0;z-index:60;background:rgba(87,67,58,.42);display:flex;align-items:center;justify-content:center}
.fin-card{width:480px;background:#fff;border-radius:30px;box-shadow:0 24px 60px rgba(40,24,10,.35);
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 36px 28px;
  animation:fin-pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes fin-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.fin-badge{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;
  margin-top:-76px;border:5px solid #fff;box-shadow:0 8px 18px rgba(84,66,58,.20)}
.fin-title{font-size:29px;color:var(--accent-ink)}
.fin-stars{display:flex;gap:14px}
.fin-stars span{opacity:.22;transform:scale(.8)}
.fin-stars span.lit{animation:fin-star .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes fin-star{from{opacity:.22;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.fin-coins{display:flex;align-items:center;gap:7px;background:var(--accent-soft);border-radius:999px;
  padding:7px 18px;font-size:19px;font-weight:900;color:var(--accent-ink)}
.fin-sub{font-size:15.5px;font-weight:800;color:var(--ink-2);text-align:center;line-height:1.5}
.fin-btns{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center}

</style>

   旧档星星搬家到新键；仅迁移纯数字尾缀（pinyin-r0/pinyin-boss 等新键不含数字，不受影响） */
function migrateStars(stars){
  for(const k of Object.keys(stars)){
    const m=/^(pinyin|english)-(\d+)$/.exec(k);
    if(!m) continue;
    const nk=(m[1]==="pinyin"?"py":"en")+"-"+m[2];
    if(!(nk in stars)) stars[nk]=stars[k];
    delete stars[k];
  }
}
/* 商店 default 件（price 0）视为初始拥有；激活项若不在拥有集合里则摘下（防止展示未拥有的称号/角色） */
function ensureDefaults(){
  for(const it of CONTENT.shop.characters){ if(it.default && !S.ownedChars.includes(it.id)) S.ownedChars.push(it.id); }
  for(const it of CONTENT.shop.titles){ if(it.default && !S.ownedTitles.includes(it.id)) S.ownedTitles.push(it.id); }
  if(S.activeChar && !S.ownedChars.includes(S.activeChar)) S.activeChar="mario";
  if(S.activeTitle && !S.ownedTitles.includes(S.activeTitle)) S.activeTitle="";
}
function load(){ try{ const d=JSON.parse(localStorage.getItem("adventure-sim")); if(d){ delete d.ownedDice; delete d.activeDice; Object.assign(S,d); migrateStars(S.stars); ensureDefaults(); S.resting=false;
  /* 旧档科学卡 id 归一：collect 曾把裸物品 id（"apple"）推进 science，图鉴认的是 "sci-apple"——
     不迁移的话老孩子的已完成实验在收集册里永远对不上 */
  S.science=(S.science||[]).map(x=>typeof x==="string"&&x&&!x.startsWith("sci-")?"sci-"+x:x);
} }catch(e){} }
load();

/* ================= 金币账本（v0.8 工单04，与 Swift recordCoin 同源） ================= */
function dayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
/* 记账 + 落盘（earn/spend 共用）：只留最近 1000 笔 */
function pushLedger(src,amt){
  S.ledger.push({s:src,a:amt,t:Date.now()});
  if(S.ledger.length>1000) S.ledger.splice(0,S.ledger.length-1000);
  save();
}
/* 金币只经 earn 变动：余额永不为负 + 记账（来源/数额/时间）+ 落盘 */
function earn(src,amt){
  if(!amt) return;
  S.coins=Math.max(0,S.coins+amt);
  pushLedger(src,amt);
}
/* 消费扣款（工单08 商店）：余额不足返回 false，绝不透支；记一笔负数账本 */
function spend(src,amt){
  if(S.coins<amt) return false;
  S.coins-=amt;
  pushLedger(src,-amt);
  return true;
}
/* 商店/衣橱共用的拥有/激活状态（角色与称号各自独立集合） */
function ownState(kind,id){
  return { owned:(kind==="chars"?S.ownedChars:S.ownedTitles).includes(id),
           active:(kind==="chars"?S.activeChar:S.activeTitle)===id };
}
/* 商店：购买（重复购买拒绝、余额不足提示差额） */
function buyItem(kind,id){
  const cat=CONTENT.shop[kind==="chars"?"characters":"titles"];
  const it=cat.find(x=>x.id===id); if(!it) return;
  if(ownState(kind,id).owned){ toast("已经拥有啦"); return; }
  if(S.coins<it.price){ toast("金币不够，还差 "+(it.price-S.coins)+" 枚"); return; }
  spend("shop",it.price);
  (kind==="chars"?S.ownedChars:S.ownedTitles).push(id); save();
  toast("买到「"+it.name+"」啦！");
  renderShop();
}
/* 商店/衣橱：激活（已拥有才可），角色与称号各自独立记忆 */
function activate(kind,id){
  if(!ownState(kind,id).owned) return;
  if(kind==="chars"){ if(S.activeChar===id)return; S.activeChar=id; }
  else { if(S.activeTitle===id)return; S.activeTitle=id; }
  save(); toast("换上啦，马上生效！"); renderShop();
}

/* 问号砖：每根水管每天限领一次（决策 13）；当日已领返回 false 不入账 */
function claimBrick(sub){
  const k=dayKey()+"|brick-"+sub;
  if(S.brick[k]) return false;
  S.brick[k]=1;
  earn("brick",1);
  return true;
}
/* 幸运蘑菇豁免（决策 8，棋盘答错与 boss 掉心共用）：持有则消耗并挡下本次，返回 true */
function mushroomShield(msg){
  if(!S.mushroom) return false;
  S.mushroom=false; save();
  toast("🍄 幸运蘑菇挡了一下："+msg,2);
  return true;
}
/* 答错统一入口（工单03）：棋盘上持有幸运蘑菇时消耗一朵豁免本次（决策 8），否则计入星级 */
function registerWrong(){
  if(S.lv.boss){ bossWrong(); return; }
  if(S.lv.bd && mushroomShield("这次不算错！")) return;
  S.lv.wrong++;
}

/* ============ 天体视觉（v0.10 天文台改版）============
   天文台不再是「认图标」：行星用 CSS 按真实比例画出来，孩子看到大小、环、斑、月相，
   而不是一个通用 planet.svg。数据取自 NASA Planetary Fact Sheet，半径比以地球=1 归一。 */
const BODIES = {
  sun:     {cn:"太阳",  r:109,   g:"radial-gradient(circle at 34% 30%,#FFF6C9,#FFD24A 42%,#F7941D 74%,#E06A0B)"},
  mercury: {cn:"水星",  r:0.383, g:"radial-gradient(circle at 35% 30%,#D8D2CA,#A29A90 52%,#6B6259)", craters:1},
  venus:   {cn:"金星",  r:0.949, g:"radial-gradient(circle at 35% 30%,#FFF3CE,#EFC97F 46%,#C08E3C)"},
  earth:   {cn:"地球",  r:1,     g:"radial-gradient(circle at 35% 30%,#9FE0FF,#2E86D6 48%,#164C8C)", land:1},
  mars:    {cn:"火星",  r:0.532, g:"radial-gradient(circle at 35% 30%,#FFC1A0,#E0552B 50%,#8E2B12)", cap:1},
  jupiter: {cn:"木星",  r:11.21, g:"radial-gradient(circle at 35% 30%,#FDEBCB,#DFA86A 44%,#A26A34)", bands:1, spot:1},
  saturn:  {cn:"土星",  r:9.45,  g:"radial-gradient(circle at 35% 30%,#FFF4D6,#E9C88C 46%,#B0842F)", bands:1, ring:1},
  uranus:  {cn:"天王星",r:4.01,  g:"radial-gradient(circle at 35% 30%,#E2FDFF,#7ADCEA 46%,#3C93AC)", ring:2},
  neptune: {cn:"海王星",r:3.88,  g:"radial-gradient(circle at 35% 30%,#CBDEFF,#4A72D6 48%,#1F3A85)", spot:2},
  moon:    {cn:"月球",  r:0.273, g:"radial-gradient(circle at 35% 30%,#F7F4EC,#CFC9BE 52%,#8E887D)", craters:1},
  pluto:   {cn:"冥王星",r:0.186, g:"radial-gradient(circle at 35% 30%,#F6E6D2,#C3A781 52%,#7E6647)"},
  comet:   {cn:"彗星",  r:0.05,  g:"radial-gradient(circle at 40% 35%,#FFFFFF,#BFE9FF 40%,#5FA8D6 75%)", tail:1},
};
function bodyHTML(key,size){
  const b=BODIES[key]||BODIES.moon, inner=[];
  if(b.bands) inner.push('<i class="bd b1"></i><i class="bd b2"></i><i class="bd b3"></i>');
  if(b.spot===1) inner.push('<i class="gspot"></i>');
  if(b.spot===2) inner.push('<i class="gspot dark"></i>');
  if(b.land) inner.push('<i class="land l1"></i><i class="land l2"></i>');
  if(b.cap) inner.push('<i class="cap"></i>');
  if(b.craters) inner.push('<i class="cr c1"></i><i class="cr c2"></i><i class="cr c3"></i>');
  const disc=`<span class="body" style="background:${b.g}">${inner.join("")}</span>`;
  const ring=b.ring?`<i class="ring back${b.ring===2?" thin":""}"></i>${disc}<i class="ring front${b.ring===2?" thin":""}"></i>`:disc;
  const tail=b.tail?`<i class="tailx"></i>${ring}`:ring;
  return `<span class="bodywrap" style="width:${size}px;height:${size}px">${tail}</span>`;
}
/* 直径比是 11 : 0.38，线性画小行星就成了像素点；开方压缩后大小次序仍然看得清 */
function bodySize(r,base){ return Math.round(Math.max(18, base*Math.pow(r,0.42))); }
/* 月相：亮盘 + 左半暗框 + 一条「晨昏线椭圆」。椭圆半轴 = R·|cosθ|，
   θ=2πp；p<0.25 椭圆是暗的（眉月，亮面只剩一条边），p>0.25 椭圆是亮的（盈凸）。 */
function moonPhaseHTML(size,p){
  const a=Math.cos(2*Math.PI*p), w=Math.max(1,Math.round(size*Math.abs(a)));
  return `<span class="bodywrap${p<0.5?"":" wan"}" style="width:${size}px;height:${size}px">`
    + `<span class="body" style="background:radial-gradient(circle at 36% 32%,#FFFCEB,#F1EACF 55%,#CFC5A6)">`
    + `<i class="mh"></i><i class="me ${a>0?"dk":"lt"}" style="width:${w}px"></i></span></span>`;
}
/* 选项视觉：天体圆盘 / 月相 / 图标 / 纯文字，四选一 */
function optVisual(o,size){
  if(o.body) return bodyHTML(o.body,size);
  if(o.phase!=null) return moonPhaseHTML(size,o.phase);
  if(o.icon) return ic(o.icon,size);
  return `<span class="bigchar">${o.text}</span>`;
}

/* 顶问号方块出金币（马里奥手感）：方块弹跳 + 金币飞向计数器；每根水管每天限领一次 */
function blockTap(ev,el,sub){
  ev.stopPropagation();
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  if(!sub || !claimBrick(sub)){
    toast("今天的金币领过啦，明天再来～",1.6);
    return;
  }
  const r=el.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const c=document.createElement('div'); c.className='flycoin';
  c.innerHTML=ic("coin",32);
  c.style.left=(r.left-sr.left+r.width/2-16)+'px';
  c.style.top=(r.top-sr.top-8)+'px';
  stage.appendChild(c);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    c.style.transform=`translate(${sr.right-r.left-(r.left-sr.left+r.width/2)-80}px,${sr.top-r.top+40}px) scale(.45)`;
    c.style.opacity='0';
  });});
  setTimeout(()=>c.remove(),800);
  const chip=document.getElementById("mapcoin");
  if(chip){ chip.innerHTML=`<span class="ico">${ic("coin",18)}</span>${S.coins}`;
    chip.classList.remove("bumped"); void chip.offsetWidth; chip.classList.add("bumped"); }
}

function pyConvertRun(run){
  const lower=run.toLowerCase(); let out="",i=0;

      const piece=lower.slice(i,i+len),plain=pyStripTones(piece);

      if(w){ hit=w; used=len; }

    if(hit){ out+=hit; i+=used; continue; }
    const two=lower.slice(i,i+2);
    if(two==="zh"||two==="ch"||two==="sh"){ out+=PY_INITIALS[two]||two; i+=2; continue; }
    const one=pyStripTones(lower[i]);
    const w1=PY_INITIALS[one]||PY_FINALS[one];
    if(w1){ out+=w1; i+=1; continue; }
    out+=lower[i]; i+=1;
  }
  return out;
}
function pyConvert(text){ return text.replace(/[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüḿńňǹ]+/g,m=>pyConvertRun(m)); }
/* 中英混排分段：拉丁段用指定语音（en-US），其余用中文（对齐 iOS SpeechService.segments） */
function speakSeg(text,latinLang){
  try{
    speechSynthesis.cancel();
    const parts=text.match(/[A-Za-z]+|[^A-Za-z]+/g)||[];
    for(const p of parts){
      const u=new SpeechSynthesisUtterance(p);
      u.lang=/^[A-Za-z]+$/.test(p)?latinLang:"zh-CN";
      u.rate=.8; u.pitch=1.15;
      speechSynthesis.speak(u);
    }
  }catch(e){}
}
/* 学科语音路由唯一入口（对齐 iOS SpeechService.speak(_:subject:)）：
   英语/天文按混排分段（拉丁段 en-US），拼音转同音字后中文读，其余学科中文 */
function speak(t,sub){
  if(!t) return; sub=sub||(S.lv&&S.lv.subject);
  if(sub==="english"||sub==="astro") return speakSeg(t,"en-US");
  if(sub==="pinyin") t=pyConvert(t);
  try{ const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.8; u.pitch=1.15; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}
}

/* 星级按关卡 id 记账（工单05 平移迁移）；复习关跟随前一个正式关解锁、不挡正式关；
   boss 关（工单06/决策 3）需学科全部通关（含复习关）才解锁 */
function nodeState(sub,i){
  const lv=(CONTENT[sub]||{levels:[]}).levels, L=lv[i]||{};
  if((S.stars[L.id]||0)>0) return "done";
  if(L.boss){
    const before=lv.filter(x=>!x.boss);
    return before.every(x=>(S.stars[x.id]||0)>0) ? "cur" : "lock";
  }
  let k=i-1; while(k>=0&&lv[k]&&(lv[k].review||lv[k].boss)) k--;    // 向前找最近的正式关
  const prevDone = k>=0&&((S.stars[lv[k].id]||0)>0);
  if(L.review) return (k<0||prevDone) ? "cur" : "lock";
  if(k<0) return "cur";
  return prevDone ? "cur" : "lock";
}

/* ================= 迷你棋盘（v0.8 工单02：识字村试点） =================

let boardState={rolling:false,hopping:false,turnsX:0,turnsY:0,pose:{x:90,y:0}};

/* 环形赛道几何（v0.10 档 B5）：格子顺时针铺在圆角矩形环上，四角是锚点格。
   环上的槽位比 JSON 空格多两个——slot 0 = 起点、slot n+1 = 回城堡；L.bd.pos 语义不变
   （-1 起点 · 0..n-1 空格 · n 城堡），所以槽位 = pos+1。 */
const BRING={x0:112,y0:104,x1:868,y1:572};

const _ring={};
function ringLayout(nSlots){
  if(_ring[nSlots]) return _ring[nSlots];
  const c=[{x:BRING.x0,y:BRING.y1},{x:BRING.x1,y:BRING.y1},{x:BRING.x1,y:BRING.y0},{x:BRING.x0,y:BRING.y0}]; // 左下 右下 右上 左上
  const edges=Math.max(0,nSlots-4), per=[0,0,0,0];
  for(let i=0;i<edges;i++) per[i%4]++;                    // 底→右→顶→左 均分边格
  const out=[c[0]];
  for(let s=0;s<4;s++){
    const a=c[s], b=c[(s+1)%4];
    for(let j=1;j<=per[s];j++){ const t=j/(per[s]+1); out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); }
    if(s<3) out.push(b);

}

function starRowHtml(){ const k=S.lv.wrong===0?3:(S.lv.wrong===1?2:1); return [0,1,2].map(i=>`<i class="${i<k?"on":""}"></i>`).join(""); }

      <div class="bgoal" id="bgoal"><div class="lawn"></div>
        <div class="row">${ic("tree",34)}${ic("castle",104)}${ic("home",30)}</div><div class="cap">终点 · 城堡</div></div>
