<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>探险岛 App 模拟器 · iOS v0.3 预览</title>
<style>
/* ============ 探险岛 App 模拟器（1:1 还原 ios/ SwiftUI 工程；数据由 tools/gen_preview_data.py 注入） ============ */
:root{
  --orange:#FF9F43;--orange-dk:#F08C1F;--orange-ddk:#D97706;
  --yellow:#FFC53D;--yellow-dk:#F5A623;--yellow-ddk:#D98A0F;
  --coral:#FF7B6B;--coral-dk:#E85D4E;--coral-ddk:#C24836;
  --blue:#4FA9E8;--blue-dk:#2F86C9;--blue-ddk:#20629E;
  --purple:#9B7BF5;--purple-dk:#7C5CE0;--purple-ddk:#5E3FBE;
  --green:#58C96B;--green-dk:#3BA851;--green-ddk:#2E8A40;
  --cream:#FFF9EE;--cream-dk:#FFF1D8;--ink:#57433A;--ink-soft:#A08A76;
  --gold:#FFD34D;--gold-dk:#E5A916;--gold-ddk:#C08A0C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#17120D;display:grid;place-items:center;min-height:100vh;font-family:"YouYuan","幼圆","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}
.frame{position:relative;width:1052px;height:796px;border-radius:38px;border:14px solid #0d0a07;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 3px #3A2E22;overflow:hidden;background:var(--cream)}
.stage{position:absolute;inset:0;overflow:hidden}
.note{position:fixed;left:18px;top:14px;color:#8a7a63;font-size:13px;font-weight:700;line-height:1.7;z-index:99}
.note b{color:#FFD34D}
img.ic{display:inline-block;vertical-align:middle}

/* ---------- 场景背景 ---------- */
.scene{position:absolute;inset:0;z-index:0}
.scene .sky{position:absolute;inset:0}
.scene .glow{position:absolute;width:320px;height:320px;border-radius:50%;left:-180px;top:-180px;background:radial-gradient(circle,#FFF6C9f2,#FFE28A59 55%,transparent 72%)}
.scene .hill{position:absolute;left:-2%;right:-2%;bottom:-4px;height:250px;background-repeat:repeat-x;background-size:auto 100%;background-position:bottom center}
.scene .hill.back{height:300px;opacity:.9}
.hill.back{background-image:url("../../design/assets/bg/hills-back.svg")}
.hill.front{background-image:url("../../design/assets/bg/hills-front.svg")}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92;box-shadow:0 10px 24px rgba(111,199,242,.25)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:14%;bottom:26%}
.cloud::after{width:38%;height:115%;right:12%;bottom:22%}
.c1{width:150px;height:44px;top:60px;animation:drift 38s linear infinite}
.c2{width:100px;height:30px;top:140px;opacity:.8;animation:drift 28s linear infinite reverse}
.c3{width:180px;height:50px;top:26px;animation:drift 46s linear infinite;animation-delay:-18s}
@keyframes drift{0%{left:-200px}100%{left:1060px}}
/* 关卡场景变体：v1 黄昏 / v2 星夜（index%3 轮换）+ astro 常驻星夜 */
.tint{position:absolute;inset:0;pointer-events:none}
.tint.dusk{background:linear-gradient(180deg,rgba(255,150,80,.42),rgba(255,181,107,.18) 45%,transparent 80%)}
.tint.night{background:linear-gradient(180deg,rgba(22,30,78,.55),rgba(34,46,110,.34) 48%,rgba(58,72,148,.16) 90%)}
.stars{position:absolute;inset:0 0 34% 0;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite alternate;background-image:
 radial-gradient(2px 2px at 6% 14%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 13% 42%,#fff 55%,transparent 60%),
 radial-gradient(2.4px 2.4px at 21% 10%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 30% 30%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 38% 8%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 47% 24%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 55% 7%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 63% 34%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 71% 13%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 79% 40%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 87% 11%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 94% 30%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 18% 55%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 44% 48%,#fff 55%,transparent 60%),
 radial-gradient(1.6px 1.6px at 68% 52%,#fff 55%,transparent 60%),radial-gradient(2px 2px at 90% 56%,#fff 55%,transparent 60%)}
@keyframes twinkle{0%{opacity:.75}100%{opacity:1}}
.moon{position:absolute;right:74px;top:34px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#FFFBEE,#FFE9A8 70%,#F7D77E);box-shadow:0 0 36px 12px rgba(255,240,190,.5);pointer-events:none}
.moon::before,.moon::after{content:'';position:absolute;border-radius:50%;background:rgba(214,178,90,.4)}
.moon::before{width:14px;height:14px;right:12px;top:10px}
.moon::after{width:9px;height:9px;right:26px;top:32px}
.theme-cn .sky{background:linear-gradient(180deg,#FFDE9E,#FFCF87 46%,#FFE9BE)}
.theme-cn .hill.back{opacity:.5}
.theme-math .sky{background:linear-gradient(180deg,#58C4F7,#9FE0FB 46%,#DCF6FE)}
.theme-lab .sky{background:linear-gradient(180deg,#8F74EC,#B39CF7 40%,#E2DAFE)}
.theme-lab .hill{opacity:.5}
.theme-pinyin .sky{background:linear-gradient(180deg,#FFC98A,#FFDCA8 46%,#FFF0CE)}
.theme-pinyin .hill{opacity:.8}
.theme-english .sky{background:linear-gradient(180deg,#6FD0A8,#A8E5C8 46%,#E1F8EC)}
.theme-english .hill{opacity:.85}
.theme-astro .sky{background:linear-gradient(180deg,#232C68,#3D4CB0 48%,#7B8ADF)}
.theme-astro .hill{opacity:.5;filter:saturate(.45) brightness(.62) hue-rotate(28deg)}
.theme-coll .sky{background:linear-gradient(180deg,#FFC964,#FFDE94 40%,#FFF2C4)}
.theme-coll .hill{opacity:.6}
.theme-parent .sky{background:linear-gradient(180deg,#A9C0DC,#C6D6E9 44%,#E6EEF5)}
.theme-parent .hill{opacity:.35}
.v1 .hill{filter:saturate(1.05) brightness(.88) sepia(.18)}
.v1 .cloud{opacity:.7;background:#FFE9CF}
.v2 .hill{filter:saturate(.5) brightness(.62) hue-rotate(24deg)}
.v2 .cloud{opacity:.35;background:#C9D4FF}
.is-night .cloud{opacity:.35;background:#C9D4FF}

/* ---------- 通用组件 ---------- */
.screen{position:absolute;inset:0;z-index:2;animation:screenIn .28s ease}
@keyframes screenIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.hud{position:absolute;top:0;left:0;right:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:16px 22px 0;z-index:40}
.hud-l,.hud-r{display:flex;align-items:center;gap:12px}
.sqbtn{width:62px;height:62px;border:none;cursor:pointer;border-radius:21px;background:linear-gradient(180deg,#FFFDF6,#FFF3DC);box-shadow:0 4px 0 #E8D5AE,0 8px 14px rgba(84,66,58,.12);display:grid;place-items:center;transition:transform .08s}
.sqbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E8D5AE}
.goldchip{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFDF4,#FFF2CE);border-radius:999px;padding:8px 18px 8px 10px;box-shadow:0 4px 0 #EBD9A8,0 6px 12px rgba(84,66,58,.1);font-size:21px;font-weight:900;color:#8A5B00}
.goldchip .ico{width:33px;height:33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE68A,var(--gold) 60%,var(--gold-dk));display:grid;place-items:center}
.jbtn{font-family:inherit;border:none;cursor:pointer;border-radius:999px;font-weight:800;color:#fff;padding:13px 28px;font-size:20px;letter-spacing:1px;position:relative;transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.14)}
.jbtn:active{transform:translateY(4px)}
.j-orange{background:linear-gradient(180deg,#FFB25C,var(--orange) 45%,var(--orange-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--orange-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-yellow{background:linear-gradient(180deg,#FFDD7A,var(--yellow) 45%,var(--yellow-dk));color:#7A4A00;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 var(--yellow-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-green{background:linear-gradient(180deg,#7FD98A,var(--green) 45%,var(--green-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 #2E8A40,0 8px 14px rgba(84,66,58,.18)}
.j-blue{background:linear-gradient(180deg,#7CC4F5,var(--blue) 45%,var(--blue-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--blue-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-purple{background:linear-gradient(180deg,#B79BFF,var(--purple) 45%,var(--purple-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--purple-ddk),0 8px 14px rgba(84,66,58,.18)}
.j-cream{background:linear-gradient(180deg,#FFFDF6,#FFF1D6);color:var(--ink);text-shadow:none;box-shadow:inset 0 3px 0 #fff,0 4px 0 #E4D2AC,0 6px 12px rgba(84,66,58,.12)}
.jbtn:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.nameplate{display:flex;align-items:center;filter:drop-shadow(0 6px 8px rgba(84,66,58,.22))}
.nameplate .ava{width:54px;height:54px;border-radius:50%;border:4px solid #fff;background:linear-gradient(160deg,#FFE29A,var(--yellow));display:grid;place-items:center;z-index:2}
.nameplate .name{background:linear-gradient(180deg,var(--orange),var(--orange-dk));color:#fff;font-weight:900;font-size:18px;padding:10px 18px 10px 22px;margin-left:-14px;border-radius:999px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.sticker{background:linear-gradient(180deg,#fff,var(--cream));border-radius:30px;border:5px solid #fff;outline:3px solid rgba(84,66,58,.08);box-shadow:0 12px 24px rgba(84,66,58,.16)}
.track{height:11px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(84,66,58,.12)}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFE58A,var(--gold));transition:width .5s}
.toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(16px);background:rgba(58,45,36,.94);color:#FFF7E8;font-size:20px;font-weight:700;padding:14px 30px;border-radius:999px;opacity:0;transition:all .3s;z-index:90;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:absolute;font-size:28px;z-index:80;pointer-events:none;animation:cfall 1.6s ease-in forwards}
@keyframes cfall{0%{transform:translateY(-40px) rotate(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(700px) rotate(330deg) scale(1.15);opacity:0}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.pulse{animation:pulse 1.5s ease-in-out infinite}
.shakeit{animation:shake .4s}
.popt{animation:pop .45s}

/* ---------- 主页 ---------- */
.pipes{display:flex;align-items:flex-end;justify-content:space-between;padding:0 12px;margin-top:4px}
.pipe-zone{cursor:pointer;text-align:center;width:164px;transition:transform .15s}
.pipe-zone:hover{transform:translateY(-6px)}
.pipe-wrap{position:relative;height:120px;display:flex;align-items:flex-end;justify-content:center}
.pipe-wrap .blk{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:9px;background:linear-gradient(180deg,#FFE58A,#F7B32B);border:3px solid #B8770A;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;text-shadow:1px 2px 0 #B8770A;animation:pulse 1.6s infinite}
.pipe-wrap .guide{position:absolute;right:2px;bottom:0}
.zone-label{display:inline-block;margin-top:-14px;position:relative;z-index:3;background:linear-gradient(180deg,#FFE58A,var(--yellow-dk));border:2.5px solid #B8770A;border-radius:999px;padding:5px 13px;font-size:15.5px;font-weight:900;color:#8A5B00;box-shadow:0 4px 0 rgba(0,0,0,.14);white-space:nowrap}
.zone-meta{margin-top:5px;font-size:12px;font-weight:900;color:var(--green-ddk);text-shadow:0 1px 0 rgba(255,255,255,.55);white-space:nowrap}
.zone-meta .track{width:132px;margin:6px auto 0}
.badge-new{position:absolute;top:4px;right:-4px;background:linear-gradient(180deg,#FF9068,var(--coral-dk));color:#fff;font-size:12.5px;font-weight:900;border-radius:999px;padding:4px 11px;transform:rotate(8deg);box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:4}
.banner{position:absolute;top:104px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;background:linear-gradient(180deg,#FF8A70,var(--coral-dk));border:4px solid #B8493A;border-radius:22px;padding:12px 58px 14px;box-shadow:0 12px 20px rgba(0,0,0,.22)}
.banner h1{font-size:38px;font-weight:900;color:#fff;letter-spacing:10px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.banner p{font-size:14px;color:#fff;opacity:.95;font-weight:800;letter-spacing:2px}
.banner .stud{position:absolute;width:17px;height:17px;border-radius:50%;background:var(--gold);border:2.5px solid var(--gold-ddk)}
.deco{position:absolute;z-index:5;pointer-events:none}
.sky-coins{position:absolute;right:26px;top:96px;display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
.trail{position:absolute;left:0;right:0;bottom:104px;height:118px;z-index:12}
.trail svg{position:absolute;inset:0;width:100%;height:100%}
.lnode{position:absolute;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .12s;z-index:13}
.lnode:hover{transform:scale(1.12)}
.lnode .lab{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(63,158,56,.6);white-space:nowrap}
.lnode.done{background:linear-gradient(180deg,#7FD98A,var(--green));border:3.5px solid #fff;box-shadow:0 4px 0 var(--green-ddk)}
.lnode.done2{background:linear-gradient(180deg,#7CC4F5,var(--blue));border:3.5px solid #fff;box-shadow:0 4px 0 var(--blue-ddk)}
.lnode.cur{background:linear-gradient(180deg,#FFE58A,var(--gold));border:3.5px solid #fff;box-shadow:0 0 0 6px rgba(255,211,77,.35),0 4px 0 var(--gold-ddk)}
.lnode.lock{background:#c9cfd6;border:3.5px solid #fff;box-shadow:0 4px 0 #9aa1a9;cursor:default}
.arcpanel{position:absolute;left:-20px;right:-20px;bottom:-24px;height:112px;background:linear-gradient(180deg,#FFFBF0,var(--cream-dk));border-radius:50% 50% 0 0/70px 70px 0 0;box-shadow:0 -6px 20px rgba(84,66,58,.12);z-index:14}
.arc-notch{position:absolute;top:-30px;left:30px;width:62px;height:62px;border-radius:50%;background:linear-gradient(180deg,#FFDD7A,var(--yellow-dk));box-shadow:0 4px 0 var(--yellow-ddk);display:grid;place-items:center;z-index:16}
.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:56px;z-index:20}
.dock-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:120px}
.dock-item .icw{position:relative;width:56px;height:56px;border-radius:19px;background:linear-gradient(180deg,#FFFDF6,#FFF0D2);box-shadow:0 4px 0 #E8D5AE;display:grid;place-items:center}
.dock-item .cnt{position:absolute;top:-9px;right:-16px;background:linear-gradient(180deg,#FF9068,var(--coral-dk));color:#fff;font-size:12px;font-weight:900;border-radius:999px;padding:2px 8px}
.dock-item .t{font-size:14px;font-weight:900}
.dock-item.locked{opacity:.65}
.dice{position:absolute;left:118px;bottom:24px;width:62px;height:62px;border-radius:50%;background:linear-gradient(180deg,#FFDD7A,var(--yellow-dk));border:4px solid #fff;box-shadow:0 6px 12px rgba(217,138,15,.5);display:grid;place-items:center;cursor:pointer;z-index:20}
.dice:active{transform:translateY(3px)}

/* ---------- 关卡页 ---------- */
.lv-body{position:absolute;top:98px;left:22px;right:22px;bottom:14px;z-index:10}
.q-pill{display:inline-block;font-size:24px;font-weight:900;background:linear-gradient(180deg,#FFF3D8,#FFE9BC);border-radius:999px;padding:11px 30px;box-shadow:0 4px 0 #F0DCAC}
.opt{width:164px;height:164px;border-radius:28px;border:5px solid #fff;outline:4px solid #F2E2C4;background:#fff;box-shadow:0 10px 20px rgba(84,66,58,.16);display:grid;place-items:center;cursor:pointer;font-size:84px;transition:transform .12s;position:relative}
.opt:hover{transform:translateY(-6px) rotate(-1deg)}
.opt.ok{outline-color:var(--green);background:#EDFBF0;animation:pop .45s}
.opt.no{outline-color:var(--coral);animation:shake .4s}
.opt.dim{opacity:.4;pointer-events:none}
.opt .bigchar{font-size:76px;font-weight:900}
.opt .slabel{font-size:15px;font-weight:900;color:var(--ink-soft)}
.tcard{min-width:168px;height:112px;padding:0 30px;border-radius:24px;background:linear-gradient(180deg,#FFE58A,#F7B32B);border:4px solid #fff;box-shadow:0 6px 0 #B8770A88;display:grid;place-items:center;font-weight:900;color:#fff;text-shadow:1px 3px 0 #B8770A}
.optrow{display:flex;gap:26px}
.speakopt{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border:2.5px solid #F2E2C4;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800;color:var(--ink-soft);cursor:pointer;font-family:inherit}
.morph{position:relative;width:300px;height:265px;display:grid;place-items:center}
.morph .char{position:absolute;font-size:165px;font-weight:900;color:#E2582A;text-shadow:0 5px 0 #FFD9A0;opacity:0;transform:scale(.4);transition:all .5s cubic-bezier(.22,1.2,.36,1)}
.morph.play .char{opacity:1;transform:scale(1)}
.morph .pic{position:absolute;transition:all .5s cubic-bezier(.22,1.2,.36,1)}
.morph.play .pic{opacity:0;transform:scale(.4) rotate(30deg)}
.pinyin{font-size:34px;font-weight:900;color:#fff;background:linear-gradient(180deg,var(--coral),var(--coral-dk));border-radius:16px;padding:5px 26px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 #C24836;text-shadow:0 2px 0 rgba(0,0,0,.14)}
.speakbtn{width:56px;height:56px;border:none;border-radius:50%;background:linear-gradient(180deg,#FFDD7A,var(--yellow-dk));box-shadow:0 4px 0 var(--yellow-ddk);cursor:pointer;display:grid;place-items:center}
.wordchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid #FFE3B3;border-radius:15px;padding:8px 15px;font-size:18px;font-weight:900;color:#B06A00;box-shadow:0 3px 0 #F2E2C4;cursor:pointer}

.pond.sky{background:linear-gradient(180deg,#E0F4FF,#A6DBF8);outline-color:rgba(143,201,236,.5)}
.pond.night{background:linear-gradient(180deg,#2E3A87,#4A5AB8);outline-color:rgba(140,155,232,.55)}
.pond.grass{background:linear-gradient(180deg,#E8F6CF,#B4E18E);outline-color:rgba(143,201,107,.5)}
.pond .wave{position:absolute;left:-5%;right:-5%;bottom:-24px;height:52px;background:radial-gradient(circle at 10px -8px,transparent 18px,rgba(255,255,255,.45) 19px);background-size:42px 28px}
.pond .ndeco{position:absolute;inset:0;pointer-events:none;background-image:
 radial-gradient(2px 2px at 8% 16%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 20% 34%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 33% 12%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 47% 30%,#fff 55%,transparent 60%),
 radial-gradient(2px 2px at 60% 10%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 73% 28%,#fff 55%,transparent 60%),
 radial-gradient(2.2px 2.2px at 86% 14%,#fff 55%,transparent 60%),radial-gradient(1.6px 1.6px at 94% 32%,#fff 55%,transparent 60%)}
.countitem{position:absolute;font-size:0;cursor:pointer;filter:drop-shadow(0 5px 5px rgba(20,60,90,.25));animation:bob 2.4s ease-in-out infinite;transition:transform .12s}
.countitem:hover{transform:scale(1.1)}
.countitem.counted{filter:drop-shadow(0 0 10px #FFD54F)}
.cbub{position:absolute;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#FFE58A,var(--gold));border:2.5px solid #B8770A;display:grid;place-items:center;font-size:20px;font-weight:900;color:#8A5B00;animation:bub .8s ease-out forwards;pointer-events:none;z-index:5}
@keyframes bub{0%{transform:translateY(0) scale(.5);opacity:0}30%{transform:translateY(-24px) scale(1.15);opacity:1}100%{transform:translateY(-52px) scale(1);opacity:0}}
.cnt-chip{position:absolute;top:10px;right:12px;background:#fff;border-radius:999px;padding:7px 16px;font-size:19px;font-weight:900;z-index:6;box-shadow:0 3px 0 rgba(47,134,201,.18)}
.numblock{width:96px;height:90px;border-radius:18px;border:none;font-family:inherit;font-size:42px;font-weight:900;color:#8A5B00;background:linear-gradient(180deg,#FFE58A,#F7B32B);border:3.5px solid #B8770A;box-shadow:0 6px 0 #B8770A88,inset 0 3px 0 rgba(255,255,255,.55);cursor:pointer;text-shadow:0 1px 0 rgba(255,255,255,.5);transition:transform .1s}
.numblock:hover{transform:translateY(-4px)}
.numblock:active{transform:translateY(4px)}
.numblock.ok{background:linear-gradient(180deg,#C6F0A0,#5CB444);border-color:#3F8F30;color:#2F6B22}
.plate{width:250px;height:162px;border-radius:50%;background:radial-gradient(circle at 40% 34%,#fff,#F2EDDF 78%);border:5px solid #fff;box-shadow:0 7px 0 #E4D9C2,0 10px 16px rgba(84,66,58,.12);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 6px;padding:16px}
.plate img{width:36px;height:36px}
.textopt{padding:13px 26px;font-size:21px;border-radius:999px;border:4px solid #F2E2C4;background:#fff;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #E4D2AC;transition:transform .12s}
.textopt:hover{transform:translateY(-4px)}
.textopt.ok{background:linear-gradient(180deg,#C6F0A0,#5CB444);border-color:#3F8F30;color:#2F6B22}
.seqrow{display:flex;align-items:center;gap:10px}
.seqcard{width:84px;height:84px;border-radius:20px;background:#fff;border:4px solid #F2E2C4;box-shadow:0 4px 0 #F2E2C4;display:grid;place-items:center}
.seqq{width:84px;height:84px;border-radius:20px;background:linear-gradient(180deg,#FFFDF4,#FFF3D8);border:4px solid #E8B54A;box-shadow:0 4px 0 #E8B54A66;display:grid;place-items:center;font-size:42px;font-weight:900;color:var(--orange-ddk)}
.finish{position:absolute;inset:0;background:rgba(30,22,16,.45);display:grid;place-items:center;z-index:60}
.finish .card{text-align:center;padding:38px 50px;border-radius:32px;border:5px solid var(--yellow);background:linear-gradient(180deg,#fff,var(--cream-dk));box-shadow:0 20px 40px rgba(0,0,0,.3);animation:pop .45s}
.stepchips{display:flex;align-items:center;gap:5px}
.schip{display:flex;align-items:center;gap:6px;padding:7px 13px;background:rgba(255,255,255,.94);color:var(--ink-soft);font-size:15px;font-weight:800;border-radius:999px;box-shadow:0 3px 0 rgba(84,66,58,.1);white-space:nowrap}
.schip .dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:#EFE6D2;color:#B7A88F}
.schip.done{background:#EFFBEF;color:var(--green-dk)}.schip.done .dot{background:var(--green);color:#fff}
.schip.now{background:linear-gradient(180deg,var(--orange),var(--orange-dk));color:#fff;box-shadow:0 3px 0 var(--orange-ddk)}.schip.now .dot{background:rgba(255,255,255,.3);color:#fff}
.sgap{width:14px;height:3px;background:repeating-linear-gradient(90deg,#D8C9A8 0 5px,transparent 5px 9px)}

/* ---------- 实验室 ---------- */
.flow{display:flex;align-items:center;justify-content:center;gap:9px;position:absolute;top:96px;left:0;right:0;z-index:30}
.fstep{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.94);border-radius:999px;padding:7px 16px;font-size:17px;font-weight:900;color:#B7A6D9;box-shadow:0 3px 0 rgba(124,92,224,.18);white-space:nowrap}
.fstep .n{width:24px;height:24px;border-radius:50%;background:#EDE5FB;color:#9C6BFF;display:grid;place-items:center;font-size:14px;font-weight:900}
.fstep.now{color:#fff;background:linear-gradient(180deg,var(--purple),var(--purple-dk));box-shadow:0 3px 0 var(--purple-ddk)}
.fstep.now .n{background:rgba(255,255,255,.28);color:#fff}
.fstep.done{color:var(--green-dk);background:#EFFBEF}.fstep.done .n{background:var(--green);color:#fff}
.farr{color:rgba(255,255,255,.95);font-weight:900}
.lab-cols{position:absolute;top:150px;left:24px;right:24px;bottom:66px;display:flex;gap:16px;z-index:15}
.shelf{width:212px;padding:13px;display:flex;flex-direction:column;gap:9px}
.shelf .hd,.codex .hd{text-align:center;font-size:16px;font-weight:900;padding:6px 0;border-radius:999px;letter-spacing:2px}
.shelf .hd{color:var(--orange-ddk);background:linear-gradient(180deg,#FFE7A8,var(--yellow));box-shadow:0 3px 0 var(--gold-ddk)}
.codex .hd{color:var(--purple-dk);background:linear-gradient(180deg,#E4D6FF,#D0BCFF);box-shadow:0 3px 0 var(--purple)}
.shelf-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1}
.item{position:relative;border-radius:19px;background:#fff;border:3.5px solid #F2E2C4;box-shadow:0 3px 0 #EFE3C8;display:grid;place-items:center;min-height:82px;cursor:pointer;transition:transform .12s}
.item:hover{transform:translateY(-3px) scale(1.04)}
.item.sel{border-color:var(--purple);background:#F5F0FF;transform:scale(1.06)}
.item.used{opacity:.32;pointer-events:none}
.item .tick{position:absolute;top:-9px;right:-7px;font-size:19px}
.tank{position:relative;flex:1;max-width:470px;height:436px;margin:auto 0}
.tank .glass{position:absolute;inset:0;border-radius:24px;border:9px solid #fff;background:linear-gradient(180deg,rgba(234,249,255,.9) 0 52px,#7FD4F8 52px 100%);box-shadow:inset 0 8px 18px rgba(47,134,201,.18);overflow:hidden;cursor:pointer}
.tank .glass.armed{box-shadow:0 0 0 6px rgba(155,123,245,.5),inset 0 8px 18px rgba(47,134,201,.18)}
.tank .wl{position:absolute;top:44px;left:0;right:0;height:11px;background:rgba(255,255,255,.6);border-radius:40%;animation:water 3.2s ease-in-out infinite}
@keyframes water{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
.titem{position:absolute;font-size:0;transition:none;filter:drop-shadow(0 5px 5px rgba(20,60,90,.25));z-index:5}
.titem img{width:66px;height:66px}
.titem.bobbing{animation:bob 2.6s ease-in-out infinite}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.8);border:2px solid #A1DBF6;animation:bubup 1s ease-out forwards;z-index:4;pointer-events:none}
@keyframes bubup{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-320px);opacity:0}}
.result-chip{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.97);border-radius:999px;padding:9px 24px;font-size:19px;font-weight:900;box-shadow:0 4px 0 rgba(84,66,58,.12);z-index:8;white-space:nowrap}
.guess-card{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:rgba(58,45,80,.4);border-radius:22px}
.guess-card .card{text-align:center;padding:26px 40px;border-radius:26px;border:5px solid #fff;background:linear-gradient(180deg,#FFFDF4,#FFF3D8);box-shadow:0 18px 36px rgba(0,0,0,.3);animation:pop .4s}
.codex{width:224px;padding:13px;display:flex;flex-direction:column;gap:8px}
.clist{background:#fff;border-radius:13px;outline:3px solid #F2E2C4;min-height:86px;padding:7px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.cchip{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(180deg,#FFFDF4,#FFF3D8);border-radius:10px;padding:3px 9px;font-size:14px;font-weight:900;box-shadow:0 2px 0 #F0DCAC;cursor:pointer}
.empty{color:#C6BADF;font-size:13.5px;font-weight:700;padding:4px}

/* ---------- 收集册 ---------- */
.tabs{position:absolute;top:92px;left:26px;display:flex;gap:11px;z-index:20}
.tab{border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .icw{width:50px;height:50px;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 4px 0 rgba(84,66,58,.15);display:grid;place-items:center;transition:all .12s}
.tab .t{font-size:14px;font-weight:900;color:#8A6520;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.tab.active .icw{background:linear-gradient(180deg,#FFDD7A,var(--yellow-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--yellow-ddk);transform:translateY(-4px) scale(1.08)}

.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.slot{aspect-ratio:1/1.02;border-radius:21px;display:grid;place-items:center;align-content:center;cursor:pointer;position:relative;transition:transform .12s;text-align:center}

.slot .nm{font-size:14px;font-weight:900;margin-top:3px;letter-spacing:1px}

.slot.got{background:linear-gradient(180deg,#fff,#FFF6E0);border:4px solid #fff;outline:3px solid #F5DFAC;box-shadow:0 4px 0 #EFDBA8}
.slot.lock{background:#F3EADA;border:4px dashed #E0D2B6;color:#C9BBA0;cursor:default}
.slot.lock .em{opacity:.65;filter:grayscale(1)}
.hint{margin-top:14px;text-align:center;font-size:15px;color:var(--ink-soft);font-weight:800}

.panel{background:linear-gradient(180deg,#fff,#FBF7EE);border-radius:26px;border:4px solid #fff;outline:3px solid rgba(84,66,58,.07);box-shadow:0 8px 18px rgba(84,66,58,.1);padding:18px 20px}

.seg-label{font-size:14.5px;font-weight:900;margin:4px 0 5px}
.seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}

.stat-chip{background:linear-gradient(180deg,#FFF3D8,#FFE9BC);border-radius:999px;font-size:13px;font-weight:900;color:#9A6B00;padding:5px 12px;box-shadow:0 3px 0 #F0DCAC;display:inline-block;margin:0 6px 6px 0}

.gate input{width:126px;font-size:28px;font-weight:900;text-align:center;padding:11px;border:none;border-radius:15px;background:#fff;box-shadow:inset 0 0 0 3px #E8DFC8,0 4px 0 #E8DFC8;outline:none;font-family:inherit;color:var(--ink)}

.rest{position:absolute;inset:0;background:rgba(10,8,6,.6);display:grid;place-items:center;z-index:100}

.rest p{font-size:17px;opacity:.92;font-weight:800}
.rest .cnt{position:relative;width:104px;height:104px;margin:0 auto 6px}

  const letter=steps.find(s=>s.kind==="letter");

function renderStep(sub, st){

    case "arith":   return arithHTML(st);
    case "pattern": return patternHTML(st);
    case "split":   return splitHTML(st);

    case "neighbor":return neighborHTML(st);
  }
  return `<div style="padding:40px">未知步骤：${st.kind}</div>`;
}

    S.daily[L.subject]=(S.daily[L.subject]||0)+1;
    save(); }

function pickListen(i){

let quizState={solved:false};
function quizHTML(st){
  quizState={solved:false};

  const card=o=>{

function pickOpt(i){
  const {opts,ans,hint,praise}=window._quiz;
  if(quizState.solved) return;
  const el=$("#opt"+i);

function tankTap(ev){
  const glass=$("#glass");
  if(S.lab.phase!=="play"){ if(S.lab.phase==="guess") toast("先完成猜一猜哦 🔮"); return; }
  if(!S.lab.sel||S.tested.includes(S.lab.sel)){ toast("先在左边工具箱里选一个物品哦 🧰"); return; }
  const rect=glass.getBoundingClientRect();
  const x=ev.clientX-rect.left;
  const item=EXP.items.find(i=>i.id===S.lab.sel);
  dropIntoTank(item,x);
  $("#item-"+item.id).classList.add("used");
  S.lab.sel=null; $("#glass").classList.remove("armed");
}
function dropIntoTank(item,x){
  const glass=$("#glass"); const H=glass.clientHeight, waterTop=52;
  const el=document.createElement('div'); el.className='titem'; el.innerHTML=ic(item.icon,66);
  const px=Math.min(Math.max(x-33,30),glass.clientWidth-96);
  el.style.left=px+"px"; el.style.top="-70px"; glass.appendChild(el);
  // 与 Swift BuoyancyModel 相同参数
  let st={y:(H+40-waterTop), v:0}, last=performance.now(), settleT=0, elapsed=0;
  const floorY=H-84;
  function frame(now){
    const dt=Math.min((now-last)/1000,1/30); last=now;
    const steps=Math.max(1,Math.round(dt/BUOY.dt));
    for(let i=0;i<steps;i++) st=buoyStep(st,item.isFloat);
    let worldY=waterTop+st.y;
    if(worldY>floorY){ worldY=floorY; st={y:floorY-waterTop,v:0}; }
    el.style.top=(worldY-33)+"px";
    if(st.y<0&&Math.random()<0.06){ const b=document.createElement('span'); b.className='bub'; const s=5+Math.random()*9; b.style.width=b.style.height=s+"px"; b.style.left=(px+33+Math.random()*30-15)+"px"; b.style.top=Math.max(worldY,10)+"px"; glass.appendChild(b); setTimeout(()=>b.remove(),1050); }
    elapsed+=dt;
    const nearRest=Math.abs(st.v)<45&&(item.isFloat?Math.abs(st.y)<90:worldY>=floorY-1);
    if(nearRest) settleT+=dt; else settleT=0;
    if(settleT>0.3||elapsed>2.6){
      if(item.isFloat){ el.classList.add("bobbing"); el.style.top=(waterTop-30)+"px"; }
      onSettled(item,item.isFloat);
      return;
    }
    S.lab.raf=requestAnimationFrame(frame);
  }
  S.lab.raf=requestAnimationFrame(frame);
}
const BUOY={g:-980,b:1400,d:6.0,dt:1/60};
function buoyStep(s,isFloat){ let v=s.v; if(s.y<=0){ const a=isFloat?BUOY.b:BUOY.g; v+=a*BUOY.dt; v-=v*BUOY.d*BUOY.dt; } else { v+=BUOY.g*BUOY.dt; } return {y:s.y+v*BUOY.dt,v}; }
function onSettled(item,isFloat){
  if(S.tested.includes(item.id)) return;
  S.tested.push(item.id);
  const chip=$("#rchip");
  chip.textContent=`${item.name} ${isFloat?"浮起来了 ⬆":"沉下去了 ⬇"}`;
  chip.style.display="block";
  const list=$(isFloat?"#listFloat":"#listSink");
  const emp=list.querySelector(".empty"); if(emp) emp.remove();
  const c=document.createElement('span'); c.className='cchip'; c.innerHTML=`${ic(item.icon,16)}${item.name}`;
  c.title="点我看小知识"; c.onclick=()=>{toast(item.fact,3.2);};
  list.appendChild(c);
  $("#tested").textContent=`已测试 ${S.tested.length} / ${EXP.items.length}`;
  if(item.id===EXP.guessItem){
    if((S.lab.guess==="float")===isFloat){ confetti(); toast("🔮 猜对啦！加一颗智慧星 ⭐"); S.coins++; }
    else toast("没关系～科学家就是靠不断试错发现规律的 🔬",2.6);
  }
  updateFlow(); save();
  if(S.tested.length>=3){ const b=$("#collectBtn"); b.disabled=false; b.classList.add("pulse"); }
}
