/* 走过的路上留一串脚印（替代旧版「已走过 = 降饱和」） */
function printsHtml(pts,pos){
  let h="";
  for(let i=0;i<pos+1;i++){
    const a=pts[i], b=pts[Math.min(i+1,pts.length-1)];
    const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    for(let k=1;k<=2;k++){ const t=k/3;
      h+=`<div class="bprint" style="left:${a.x+(b.x-a.x)*t}px;top:${a.y+(b.y-a.y)*t+((k%2)?7:-7)}px;--r:${ang}deg"></div>`; }
  }
  return h;
}
/* 只刷格态/脚印/星轨，不整屏重绘——整屏重绘会把骰子立方体的累计姿态打回原点（闪帧）。
   hop 期间传入视觉位置：L.bd.pos 要等 arriveBoard 才提交，否则途经题目队列会被清空（试玩反馈①） */
function paintBoard(visPos){
  const L=S.lv, n=curLevelObj().board.spaces.length, pos=(visPos===undefined?L.bd.pos:visPos), pts=ringLayout(n+2);
  for(let i=0;i<=n+1;i++){
    const el=document.getElementById("bc"+i); if(!el) continue;
    el.classList.toggle("done", i-1<pos);
    el.classList.toggle("now", i-1===pos);
  }
  const bp=$("#bprints"); if(bp) bp.innerHTML=printsHtml(pts,pos);
  const tk=$("#btoken"); if(tk){ const p=pts[pos+1]; tk.style.left=p.x+"px"; tk.style.top=(p.y-46)+"px"; }
  const st=$("#bstars"); if(st) st.innerHTML=starRowHtml();
}
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
const dieAlive=()=>S.route==="level"&&!!document.getElementById("bdieCube");
/* 五段节拍（v0.10 §5 C1）：蓄力 120 → 抛出 480 → 落地 90 → 回弹 220 → 定格 260，总 1.17s。
   结果先定后演：掷的瞬间就出 r，动画只把 r 那一面转到正面，所以永远不会卡在"立着"。 */
async function boardRoll(){
  const L=S.lv, n=curLevelObj().board.spaces.length;
  if(L.bd.mode!=="roll"||boardState.rolling||boardState.hopping) return;
  boardState.rolling=true;
  const btn=$("#broll"); if(btn) btn.disabled=true;
  const cube=$("#bdieCube"), lift=$("#bdieLift"), sh=$("#bdieShadow");
  const r=1+Math.floor(Math.random()*6);
  boardState.turnsX+=1; boardState.turnsY+=2;          // 两轴累计不同速 → 翻滚而不是转盘
  const px=DIE_POSE[r][0]+boardState.turnsX*360, py=DIE_POSE[r][1]+boardState.turnsY*360;
  lift.style.transition="transform .12s ease-out";      // ① 蓄力
  lift.style.transform="translateY(-18px) scale(1.15)";
  sh.style.transform="translateX(-50%) scale(.6)"; sh.style.opacity=".14";
  await sleepMs(120);
  if(!dieAlive()){ boardState.rolling=false; return; }
  cube.style.transition="transform .48s cubic-bezier(.16,.72,.3,1)";   // ② 抛出
  cube.style.transform=`rotateX(${px}deg) rotateY(${py}deg)`;
  lift.style.transform="translateY(0) scale(1)";
  sh.style.transform="translateX(-50%) scale(1)"; sh.style.opacity=".34";
  await sleepMs(470);
  if(!dieAlive()){ boardState.rolling=false; return; }
  lift.style.transition="transform .09s ease-in";       // ③ 落地 squash
  lift.style.transform="translateY(0) scale(1.14,.84)";
  sh.style.transform="translateX(-50%) scale(1.25)"; sh.style.opacity=".44";
  await sleepMs(90);
  lift.style.transition="transform .22s cubic-bezier(.3,-1.4,.6,1)";   // ④ 回弹
  lift.style.transform="translateY(0) scale(1)";
  sh.style.transform="translateX(-50%) scale(1)"; sh.style.opacity=".3";
  await sleepMs(220);
  if(!dieAlive()){ boardState.rolling=false; return; }
  boardState.pose={x:px,y:py};                          // ⑤ 定格：姿态存进 boardState，重绘后仍停在点数面上
  const scr=$(".screen"); if(scr){ scr.classList.add("bshake"); setTimeout(()=>scr.classList.remove("bshake"),230); }
  toast(`掷出 ${r} 点！`,1.4);
  await sleepMs(260);
  if(!dieAlive()){ boardState.rolling=false; return; }
  boardState.rolling=false;
  L.bd.mode="moving";
  hopBoard(Math.min(L.bd.pos+r,n));
}
function hopBoard(target){
  const L=S.lv, el=$("#btoken");
  boardState.hopping=true;
  let p=L.bd.pos;
  const stepHop=()=>{
    if(S.route!=="level"||!$("#btoken")){ boardState.hopping=false; return; }
    if(p>=target){ boardState.hopping=false; arriveBoard(target); return; }
    const go=()=>{
      p++;
      const pt=bdPoint(p);
      el.style.left=pt.x+"px"; el.style.top=(pt.y-46)+"px";
      el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
      paintBoard(p);
      setTimeout(stepHop,340);
    };
    if(p+1===target) setTimeout(go,120); else go();   // 最后一跳前停 120ms（anticipation），落点才有力
  };
  stepHop();
}
function arriveBoard(p){
  if(S.route!=="level") return;
  const L=S.lv, lv=curLevelObj(), n=lv.board.spaces.length;
  const from=L.bd.pos;
  L.bd.pos=p;
  /* 试玩反馈①：途经的题目格依次作答——掷大点数=多做几题，绝不跳题（学习密度优先） */
  const passed=[];
  for(let i=from+1;i<=Math.min(p,n-1);i++){ if(lv.board.spaces[i].type==="question") passed.push(i); }
  L.bd.queue=passed; L.bd.qi=0;
  if(passed.length>0){ L.bd.q=passed[0]; L.bd.mode="question"; renderLevel(); return; }
  landBoard(p);
}
/* 落格结算唯一入口（决策 6「掷骰 → … → 落格结算」）：到城堡→通关仪式；
   题目格必经途经队列作答，答完回正常回合；其余事件格→遭遇结算，一格都不许吞 */
function landBoard(p){
  if(S.route!=="level") return;
  const L=S.lv, sps=curLevelObj().board.spaces, n=sps.length;
  if(p>=n){
    const tk=$("#btoken"), goal=$("#bgoal");
    if(tk&&goal){
      /* 最后一格：角色跳进中央城堡——大富翁的中间空地从此有了用途 */
      tk.style.transition="left .42s ease-in-out,top .42s ease-in-out";
      tk.style.left=((BRING.x0+BRING.x1)/2)+"px";
      tk.style.top=(BHUB.y+104)+"px";
      goal.classList.add("reached");
      paintBoard();
      setTimeout(()=>{ if(S.route!=="level") return; settleLevel(); renderLevel(); },540);
      return;
    }
    settleLevel(); renderLevel(); return;              // 到城堡 → 结算仪式
  }
  if(sps[p].type==="question"){ L.bd.mode="roll"; renderLevel(); return; }  // 落点题目格已在队列答完
  resolveSpace(p);
}
/* 落点遭遇结算：金币 +5（工单04）/ 宝箱 3-8（工单03）/ 幸运蘑菇 / 休息站演出 */
function resolveSpace(p){
  if(S.route!=="level") return;
  const L=S.lv, sp=curLevelObj().board.spaces[p];
  if(sp.type==="coin"){
    const pt=bdPoint(p);
    flyCoins(pt.x+BD_OX,pt.y+BD_OY,3);
    earn("coin-space",5);                    // 金币格 +5 经账本（工单04）
    toast("金币格 +5 金币！",1.6);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },900);
    return;
  }
  if(sp.type==="chest"){
    const amt=chestAmount(), pt=bdPoint(p);   // 宝箱 3-8 随机经账本（工单03）
    flyCoins(pt.x+BD_OX,pt.y+BD_OY,Math.min(amt,5));
    confetti();
    earn("chest",amt);
    toast(`🎁 宝箱打开：+${amt} 金币！`,1.8);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },1100);
    return;
  }
  if(sp.type==="mushroom"){
    if(!S.mushroom){ S.mushroom=true; save(); confetti(); toast("🍄 幸运蘑菇到手：下次答错不算错！",2); }
    else toast("已经有一朵幸运蘑菇啦",1.6);
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },900);
    return;
  }
  if(sp.type==="rest"){
    L.bd.mode="rest";                        // 休息站：小房子喝水演出（纯视觉，静音等效）
    renderLevel();
    setTimeout(()=>{ if(S.route!=="level") return; L.bd.mode="roll"; renderLevel(); },2100);
    return;
  }
}
/* 休息站演出覆盖层 */
function restHTML(){
  return `<div class="boverlay"><div style="background:#fff;border-radius:28px;padding:34px 46px;text-align:center;box-shadow:0 12px 24px rgba(84,66,58,.22)">
    <div style="position:relative;width:132px;height:112px;margin:0 auto">${ic("home",120)}<div class="rest-mascot">${activeCharIcon(46)}</div></div>
    <div style="font-size:20px;font-weight:900;color:var(--ink);margin-top:6px">咕咚咕咚…喝水休息一下 💧</div>

}
function flyCoins(x,y,k){
  const chip=document.querySelector('.goldchip'); if(!chip) return;
  const sr=stage.getBoundingClientRect(), cr=chip.getBoundingClientRect();
  /* 整块 frame 被 fitFrame 缩放，getBoundingClientRect 是缩放后的像素：先除以缩放比再喂给 transform */
  const z=sr.width/1024||1;
  const tx=(cr.left-sr.left+cr.width/2)/z-x, ty=(cr.top-sr.top+cr.height/2)/z-y;
  for(let i=0;i<k;i++){
    const c=document.createElement('div'); c.className='flycoin';
    c.innerHTML=ic("coin",30);
    c.style.left=(x-15)+'px'; c.style.top=(y-46)+'px';
    stage.appendChild(c);
    setTimeout(()=>{ c.style.transform=`translate(${tx}px,${ty}px) scale(.4)`; c.style.opacity='0'; }, i*90);
    setTimeout(()=>c.remove(), 950+i*90);
  }
  setTimeout(()=>{ chip.classList.remove("bumped"); void chip.offsetWidth; chip.classList.add("bumped"); }, 720);
}
function boardStepDone(){
  const L=S.lv, lv=curLevelObj(), n=lv.board.spaces.length;

    /* 试玩反馈①：途经题目队列——答完一题看还有没有路过的题目格，都答完再结算落点 */
    if(L.bd.queue && L.bd.qi < L.bd.queue.length-1){
      L.bd.qi++; L.bd.q=L.bd.queue[L.bd.qi]; renderLevel(); return;

}

/* --- 数据比一比（cmp：天文台主力题型，看数据说话而不是认图标）--- */
let cmpState={solved:false};
function cmpHTML(st){
  cmpState={solved:false};
  const rows=st.rows||[];
  window._cmpdata={rows,ans:st.answer,hint:st.hint||"比一比每一条",praise:st.praise||"看对啦！"};
  const disc=(st.viz==="disc");
  const base=st.base||40;
  /* 行星数据动辄差三个数量级（10 小时 vs 5832 小时），线性画短的那条就没了；
     跨度超过 12 倍改用对数刻度，条长看趋势、具体数值一律以右侧标签为准，并标一句刻度口径 */
  const vs=rows.map(r=>Math.abs(r.value)||1e-6), mx=Math.max.apply(null,vs), mn=Math.min.apply(null,vs);
  const loggy=mx/Math.max(mn,1e-6) > 12;
  const wOf=v=>{ v=Math.max(Math.abs(v),mn);

  memState={flipped:[],matched:[],busy:false,deck:seed};

  M.flipped.push(i);
  $("#mc"+i).classList.add("flip");

function writeSetup(st){
  const svg=$("#wsvg"); if(!svg) return;
  writeState.svg=svg; writeState.cur=0; writeState.done=false;
  writeState.sampled=[]; writeState.covered=[];
  (st.strokes||[]).forEach((s,i)=>{
    const p=svg.querySelector("#wpath"+i); if(!p) return;
    const L=p.getTotalLength(); const pts=[];
    for(let d=0;d<=L;d+=1.5){ const pt=p.getPointAtLength(Math.min(d,L)); pts.push({x:pt.x,y:pt.y}); }
    writeState.sampled.push(pts); writeState.covered.push(new Array(pts.length).fill(false));
    p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
  });
  svg.addEventListener("pointerdown",e=>wTraceStart(e));
  svg.addEventListener("pointermove",e=>wTraceMove(e));
  svg.addEventListener("pointerup",e=>wTraceEnd(e));
  svg.addEventListener("pointercancel",e=>wTraceEnd(e));
  wDemo();
}

function wTraceStart(e){ if(writeState.done) return; writeState.svg.setPointerCapture(e.pointerId); writeState.drawing=true; wTraceMove(e); }

function wTraceMove(e){
  if(!writeState.drawing||writeState.done) return;
  const i=writeState.cur; if(i>=writeState.sampled.length) return;
  const pos=wTracePos(e), pts=writeState.sampled[i], cov=writeState.covered[i], TOL=13;
  for(let k=0;k<pts.length;k++){ const dx=pts[k].x-pos.x, dy=pts[k].y-pos.y; if(dx*dx+dy*dy<=TOL*TOL) cov[k]=true; }
  const frac=cov.filter(Boolean).length/pts.length;
  if(frac>0.12){ const p=writeState.svg.querySelector("#wpath"+i); const L=p.getTotalLength(); p.style.transition="none"; p.style.strokeDashoffset=L*(1-frac); }
  if(frac>=0.85) wStrokeDone();
}

function wTraceEnd(e){ writeState.drawing=false; }

function wDemo(){
  if(writeState.done) return;
  const i=writeState.cur; if(i>=writeState.sampled.length) return;
  const p=writeState.svg.querySelector("#wpath"+i); if(!p) return;
  const L=p.getTotalLength();
  p.setAttribute("stroke","#C94A3A");
  p.style.transition="none"; p.style.strokeDashoffset=L; void p.getBBox();
  p.style.transition="stroke-dashoffset .8s ease"; p.style.strokeDashoffset=0;
}

function writeAuto(st){

  };
  setTimeout(stepOne,200);
}

function cardsPick(i){
  const cs=cardsState; if(cs.solved||cs.busy) return;
  const st=window._cards.st, el=$("#cd"+i);
  const idx=cs.sel.indexOf(i);
  if(idx>=0){ cs.sel.splice(idx,1); el.classList.remove("sel"); }
  else { if(cs.sel.length>=st.pick) return; cs.sel.push(i); el.classList.add("sel"); }
  const fb=$("#stepfb"); fb.textContent="已选 "+cs.sel.length+" / "+st.pick+" 张";
  if(cs.sel.length===st.pick){
    cs.busy=true;
    const vals=cs.sel.map(k=>st.cards[k]);
    if(cardsCheck(vals,st.target)){
      cs.solved=true; cs.sel.forEach(k=>$("#cd"+k).classList.add("ok")); winStep(st.praise);

function cardsCheck(vals,target){
  if(vals.length===2) return vals[0]+vals[1]===target;
  const n=vals.length, total=1<<(n-1);
  for(let mask=0;mask<total;mask++){ let s=vals[0]; for(let j=1;j<n;j++){ s+= ((mask>>(j-1))&1)? -vals[j] : vals[j]; } if(s===target) return true; }
  return false;
}

function cardsAuto(){
  const st=window._cards.st, cards=st.cards, n=cards.length, pick=st.pick;
  let found=null;
  for(let a=0;a<n&&!found;a++) for(let b=a+1;b<n&&!found;b++){ if(pick===2&&cardsCheck([cards[a],cards[b]],st.target)) found=[a,b]; }
  for(let a=0;a<n&&!found;a++) for(let b=a+1;b<n&&!found;b++) for(let c=b+1;c<n&&!found;c++){ if(pick===3&&cardsCheck([cards[a],cards[b],cards[c]],st.target)) found=[a,b,c]; }
  if(!found){ found=[]; for(let i=0;i<pick;i++) found.push(i); }
  found.forEach((k,idx)=>setTimeout(()=>cardsPick(k),220*(idx+1)));
}

  const chips=moneyState.sel.map((k,idx)=>`<span class="mchip" onclick="moneyRemove(${idx})">${st.denominations[k].label}✕</span>`).join(" ");
  $("#moneypaid").innerHTML=`已付 <b style="font-size:24px">${total}</b> 角　${chips}`;
}

function moneyAuto(){
  const st=window._money.st, dens=st.denominations, price=st.price;
  const dp=new Array(price+1).fill(-1); dp[0]=0;
  for(let v=0;v<=price;v++){ if(dp[v]<0) continue;
    dens.forEach((d,i)=>{ if(v+d.value<=price&&dp[v+d.value]<0) dp[v+d.value]=i; }); }
  const picks=[]; let v=price;
  while(v>0&&dp[v]>=0){ picks.push(dp[v]); v-=dens[dp[v]].value; }
  picks.forEach((k,idx)=>setTimeout(()=>moneyAdd(k),160*(idx+1)));
}

function afterStepRender(){
  const st=currentStepObj(); if(!st) return;
  if(st.kind==="write") writeSetup(st);
  else if(st.kind==="clock"&&st.mode==="set") clockSetSetup(st);
  else if(st.kind==="mappuzzle") mapSetup(st);
  if(S.autoSolve&&["write","muldiv","cards","sudoku","clock","money","mappuzzle"].includes(st.kind)){
    setTimeout(()=>autoSolveStep(st),350);
  }
}

function autoSolveStep(st){
  if(st.kind==="muldiv"){ setTimeout(()=>muldivPick(st.answer),300); }
  else if(st.kind==="clock"){
    if(st.mode==="read"){ setTimeout(()=>clockReadPick(st.answer),300); }
    else { setTimeout(()=>{ clockSet.h=st.hour; clockSet.m=st.minute; ckRenderFace(); ckConfirm(); },300); }
  }
  else if(st.kind==="cards"){ cardsAuto(); }
  else if(st.kind==="sudoku"){ sudokuAuto(); }
  else if(st.kind==="money"){ moneyAuto(); }
  else if(st.kind==="mappuzzle"){ mapAuto(); }
  else if(st.kind==="write"){ writeAuto(st); }
}

/* ---------- 拼地图（v0.11 重做：真实省份/大洲轮廓 + 托盘拖拽回原图）
   旧版用手写四边形假地图、块初始位置就在屏外。新版：
   · CHINA_MAP（33 省 + 南海诸岛小图框）/ WORLD_MAP（七大洲）由离线工具从
     DataV 100000_full + Natural Earth 110m 抽稀生成，内嵌为 SVG path；
   · 题面只给 pieces:["新疆",...]，地图全貌打底、目标轮廓虚线显示；
   · 托盘卡片是真实轮廓 + 省名，拖近目标 55px 内吸附，全部归位过关。 */
let mapState={placed:[],drag:null};
function pzMap(st){ return st.map==="world"?WORLD_MAP:CHINA_MAP; }
function mappuzzleHTML(st){
  mapState={placed:(st.pieces||[]).map(()=>false),drag:null};
  window._map={st:st};
  const M=pzMap(st), pieces=st.pieces||[];
  const MW=600, MH=Math.round(MW*M.h/M.w), TRAY=104;
  const bg=M.ps.map(p=>`<path d="${p.d}" fill="#F4F1E7" stroke="#fff" stroke-width=".3"/>`).join("");
  const sea=M.sea?`<g><rect x="${M.sea.b[0]-.6}" y="${M.sea.b[1]-.6}" width="${M.sea.b[2]-M.sea.b[0]+1.2}" height="${M.sea.b[3]-M.sea.b[1]+1.2}" rx="1.2" fill="rgba(255,255,255,.55)" stroke="#C9BD9F" stroke-width=".3" stroke-dasharray="1 0.8"/><path d="${M.sea.d}" fill="#E2EDDA" stroke="#9FB8A8" stroke-width=".18"/></g>`:"";
  const ghosts=pieces.map((n,i)=>{
    const p=M.ps.find(x=>x.n===n); if(!p) return "";
    return `<path id="pzg${i}" d="${p.d}" fill="rgba(255,255,255,.5)" stroke="#B9A98F" stroke-width=".45" stroke-dasharray="1.4 1"/>`;
  }).join("");
  const cards=pieces.map((n,i)=>{
    const p=M.ps.find(x=>x.n===n); if(!p) return "";
    const cw=96, tx=i*(cw+8)+8, ty=MH+12;
    return `<div class="pz-piece" id="mb${i}" style="left:${tx}px;top:${ty}px;width:${cw}px;height:${TRAY-14}px">
      <svg viewBox="${p.b[0]} ${p.b[1]} ${Math.max(p.b[2]-p.b[0],.5)} ${Math.max(p.b[3]-p.b[1],.5)}" preserveAspectRatio="xMidYMid meet">
        <path d="${p.d}" fill="var(--accent)" fill-opacity=".78" stroke="#fff" stroke-width=".8"/></svg>
      <span class="pz-name">${p.n}</span></div>`;
  }).join("");
  return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px" class="sticker">
    <div class="q-pill">${st.question||"拼一拼：把它放回地图"}</div>
    <div id="mapwrap" style="position:relative;width:${MW}px;height:${MH+TRAY}px">
      <div id="mappanel" style="position:absolute;left:0;top:0;width:${MW}px;height:${MH}px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#CDE9F6,#BFE0F2);box-shadow:inset 0 0 0 3px #fff">
        <svg viewBox="0 0 ${M.w} ${M.h}" width="${MW}" height="${MH}" preserveAspectRatio="none">${bg}${sea}${ghosts}</svg>
      </div>
      ${cards}
    </div>
    <div id="stepfb" style="min-height:24px;font-size:16px;font-weight:900;color:var(--ink-soft)">拖着轮廓块回到虚线位置，靠近就会吸住</div></div>`;
}
function mapSetup(st){
  (st.pieces||[]).forEach((n,i)=>{ const el=$("#mb"+i); if(!el) return;
    el.addEventListener("pointerdown",e=>mapDragStart(e,i,el)); });
}
function pzTarget(i){
  const st=window._map.st, M=pzMap(st), p=M.ps.find(x=>x.n===st.pieces[i]);
  const wrap=$("#mapwrap"), MW=wrap.clientWidth, MH=Math.round(MW*M.h/M.w);
  return { left:p.b[0]*MW/M.w, top:p.b[1]*MH/M.h,
           width:Math.max((p.b[2]-p.b[0])*MW/M.w,14), height:Math.max((p.b[3]-p.b[1])*MH/M.h,14),
           cx:(p.b[0]+p.b[2])/2*MW/M.w, cy:(p.b[1]+p.b[3])/2*MH/M.h };
}
function mapDragStart(e,i,el){
  if(mapState.placed[i]) return;
  e.preventDefault();
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  const wr=$("#mapwrap").getBoundingClientRect(), br=el.getBoundingClientRect();
  mapState.drag={i,el,dx0:e.clientX-br.left,dy0:e.clientY-br.top,wr,ox:parseFloat(el.style.left),oy:parseFloat(el.style.top)};
  el.classList.add("drag"); el.style.zIndex=40;
  window.addEventListener("pointermove",mapDragMove);
  window.addEventListener("pointerup",mapDragEnd);
  window.addEventListener("pointercancel",mapDragEnd);
}
function mapDragMove(e){
  const d=mapState.drag; if(!d) return;
  d.el.style.left=(e.clientX-d.wr.left-d.dx0)+"px";
  d.el.style.top=(e.clientY-d.wr.top-d.dy0)+"px";
}
function mapDragEnd(){
  const d=mapState.drag; if(!d) return; mapState.drag=null;
  d.el.removeEventListener("pointermove",mapDragMove);
  d.el.removeEventListener("pointerup",mapDragEnd);
  d.el.removeEventListener("pointercancel",mapDragEnd);
  d.el.classList.remove("drag"); d.el.style.zIndex="";
  window.removeEventListener("pointermove",mapDragMove);
  window.removeEventListener("pointerup",mapDragEnd);
  window.removeEventListener("pointercancel",mapDragEnd);
  const i=d.i, t=pzTarget(i);
  const r=d.el.getBoundingClientRect(), wr=d.wr;
  const cx=r.left-wr.left+r.width/2, cy=r.top-wr.top+r.height/2;
  const name=window._map.st.pieces[i];
  if(Math.hypot(cx-t.cx,cy-t.cy)<55){ mapPlace(i,d.el,t); }
  else{
    d.el.style.transition="left .3s,top .3s";
    d.el.style.left=d.ox+"px"; d.el.style.top=d.oy+"px";
    setTimeout(()=>d.el.style.transition="",320);
  }
}
function mapPlace(i,el,t){
  mapState.placed[i]=true;
  const st=window._map.st;
  el.style.transition="left .28s,top .28s,width .28s,height .28s,border-radius .28s,box-shadow .28s";
  el.style.left=t.left+"px"; el.style.top=t.top+"px";
  el.style.width=t.width+"px"; el.style.height=t.height+"px";
  el.classList.add("ok"); el.style.pointerEvents="none";
  const g=$("#pzg"+i); if(g) g.style.display="none";
  learnGeo(st.pieces[i]);
  const placed=mapState.placed.filter(Boolean).length;
  $("#stepfb").textContent="✅ "+st.pieces[i]+" 回家啦（"+placed+" / "+st.pieces.length+"）";
  if(mapState.placed.every(Boolean)) setTimeout(()=>winStep(st.praise||"地图拼好啦！",600),420);
}
function mapAuto(){
  const st=window._map.st; if(!st) return;
  (st.pieces||[]).forEach((n,i)=>setTimeout(()=>{
    const el=$("#mb"+i), t=pzTarget(i);
    if(el) mapPlace(i,el,t);
  },340*(i+1)));
}

function tankTap(ev){
  const glass=$("#glass");
  if(S.lab.phase!=="play"){ if(S.lab.phase==="guess") toast("先完成猜一猜哦 🔮"); return; }
  if(!S.lab.sel){ toast("先在左边工具箱里选一个物品哦 🧰"); return; }
  const rect=glass.getBoundingClientRect();
  const x=ev.clientX-rect.left;

  dropIntoTank(item,x);
  $("#item-"+item.id).classList.add("used");
  S.lab.sel=null; $("#glass").classList.remove("armed");

function dropIntoTank(item,x){
  const glass=$("#glass"); const H=glass.clientHeight, waterTop=52;
  const el=document.createElement('div'); el.className='titem'; el.innerHTML=ic(item.icon,66);
  const px=Math.min(Math.max(x-33,30),glass.clientWidth-96);
  el.style.left=px+"px"; el.style.top="-70px"; glass.appendChild(el);
  // 与 Swift BuoyancyModel 相同参数。⚠️ 模型里 y 正方向是「水面向上」，渲染时 must 取负换算成 CSS top，
  // 之前写成 waterTop + st.y 把轴翻了过来：不管浮还是沉，物体都朝水面外飞出去，池子里看不到东西
  let st={y:(waterTop+70), v:0}, last=performance.now(), settleT=0, elapsed=0;
  const floorY=H-84;
  function frame(now){
    /* 一次只记一个 raf 句柄：同时丢两件物品时，先跑的那个句柄已被覆盖、取消不掉，
       离开实验室后仍会跑完并触发 onSettled（重复记账/重复发奖）——这里自己收口 */
    if(S.route!=="lab"||!document.body.contains(el)) return;
    const dt=Math.min((now-last)/1000,1/30); last=now;
    const steps=Math.max(1,Math.round(dt/BUOY.dt));
    for(let i=0;i<steps;i++) st=buoyStep(st,item.isFloat);
    let worldY=waterTop-st.y;
    if(worldY>floorY){ worldY=floorY; st={y:(waterTop-floorY),v:0}; }
    el.style.top=(worldY-33)+"px";
    if(st.y<0&&Math.random()<0.06){ const b=document.createElement('span'); b.className='bub'; const s=5+Math.random()*9; b.style.width=b.style.height=s+"px"; b.style.left=(px+33+Math.random()*30-15)+"px"; b.style.top=Math.max(worldY,10)+"px"; glass.appendChild(b); setTimeout(()=>b.remove(),1050); }
    elapsed+=dt;
    const nearRest=Math.abs(st.v)<45&&(item.isFloat?Math.abs(st.y)<90:worldY>=floorY-1);
    if(nearRest) settleT+=dt; else settleT=0;
    if(settleT>0.3||elapsed>3.2){
      /* 落点按物理结论钉死：浮的停在水面、沉的停在水底——超时兜底不该把物体冻在半路 */
      el.style.top=(item.isFloat ? waterTop-30 : floorY-33)+"px";
      if(item.isFloat){ el.classList.add("bobbing"); }
      onSettled(item,item.isFloat);
      return;
    }
    S.lab.raf=requestAnimationFrame(frame);
  }
  S.lab.raf=requestAnimationFrame(frame);
}
const BUOY={g:-980,b:1400,d:6.0,dt:1/60};
function buoyStep(s,isFloat){ let v=s.v; if(s.y<=0){ const a=isFloat?BUOY.b:BUOY.g; v+=a*BUOY.dt; v-=v*BUOY.d*BUOY.dt; } else { v+=BUOY.g*BUOY.dt; } return {y:s.y+v*BUOY.dt,v}; }

}

/* 是否正处于一局进行中（棋盘/boss/线性，尚未结算）——此时绝不打断 */
function levelInProgress(){ return S.route==="level" && S.lv && !S.lv.finished; }
/* 到达时长限制的唯一入口：每日总量封顶=全屏收束、绝不延迟；单次时限在关中则延迟到结算后 */
function requestRest(dayOver){
  if(S.resting) return;
  if(dayOver){ S.resting=true; showRest(true); return; }
  if(levelInProgress()){ S.restPending=true; toast("本关结束后，让眼睛休息一下哦～",2.4); return; }
  S.resting=true; showRest(false);
}
/* 结算完成（仪式出现）后检查：待休息则等庆祝完整播放，再进入休息（仪式是天然断点） */
function checkRestAfterSettle(){
  if(!S.restPending) return;
  S.restPending=false;
  setTimeout(()=>{ if(S.route==="level"&&!S.resting){ S.resting=true; showRest(false); } },900);
}
/* 会话计时：每秒仅在学习页面累计；每日封顶优先，其次单次时限 */
function startTimeManager(){
  setInterval(()=>{
    const k=dayKey();
    if(S.dayKey===""){ S.dayKey=k; }
    else if(S.dayKey!==k){ S.dayKey=k; S.daySec=0; S.playSec=0; S.restPending=false; }
    if(S.resting) return;
    if(S.route==="level"||S.route==="lab"){
      S.playSec++; S.daySec++;
      if(S.daySec>=S.settings.daily*60){ requestRest(true); return; }
      if(S.playSec>=S.settings.once*60){ requestRest(false); }
    }
  },1000);
}

    <h2>${dayOver?"🌙 今天的探险结束啦":"👀 小眼睛休息一下"}</h2>
    <p>${dayOver?"明天再来玩，明天有新关卡等你哦（想继续？家长中心可调）":"看看窗外最远的地方，数 20 秒就回来"}</p>
  </div>`;
  stage.appendChild(div);
  if(!dayOver){
    const t=setInterval(()=>{
      left--;
      const n=$("#restN"), r=$("#restRing");
      if(n) n.textContent=left;
      if(r) r.setAttribute("stroke-dashoffset", 276.5*(1-left/20));
      if(left<=0){ clearInterval(t); div.remove(); S.resting=false; S.playSec=0; S.restPending=false; save(); toast("休息完毕，继续探险！"); }
    },1000);
    S.timers.push(t);
  }
}

/* ================= 启动 ================= */
function fitFrame(){
  const f=document.querySelector('.frame');
  const s=Math.min(document.body.clientWidth/f.offsetWidth, document.body.clientHeight/f.offsetHeight);
  f.style.transform='translate(-50%,-50%) scale('+s+')';
}
window.addEventListener('resize',fitFrame);
window.addEventListener('orientationchange',()=>setTimeout(fitFrame,250));
fitFrame();
startTimeManager();
try{ if(new URLSearchParams(location.search).get("AISolve")==="1") S.autoSolve=true; }catch(e){}
try{
  const _r=new URLSearchParams(location.search).get("route");
  if(_r==="shop"||_r==="collection"||_r==="map") route(_r);
  else if(_r&&_r.indexOf("level:")===0){
    const p=_r.split(":");
    const b={sub:p[1],index:parseInt(p[2],10),step:p[3]!==undefined?parseInt(p[3],10):0};
    enterLevel(b.sub,b.index);
    const lv=curLevelObj();
    if(lv.board&&b.step>0){
      const wantId=lv.steps[b.step]&&lv.steps[b.step].id;
      const qi=lv.board.spaces.findIndex(sp=>sp.step===wantId);
      if(qi>=0){ S.lv.bd.q=qi; S.lv.bd.mode="question"; }
      renderLevel();
    } else if(b.step>0){ S.lv.step=b.step; renderLevel(); }
  } else route("map");
}catch(e){ route("map"); }
</script>
