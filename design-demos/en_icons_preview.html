<html><head><meta charset="utf-8"><style>
body{margin:0;background:#F7F1E3;font-family:"PingFang SC",sans-serif}
h2{color:#5B4636;font-size:16px;margin:14px 16px 4px}
.g{display:flex;flex-wrap:wrap;gap:10px;padding:6px 16px}
.c{background:#fff;border-radius:12px;padding:10px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.1);width:108px}
img{width:96px;height:96px;display:block;margin:0 auto}
span{display:block;font-size:12px;color:#5B4636;margin-top:4px;font-weight:700}
.n{color:#999;font-size:10px}
</style></head><body>
<h2>情绪（开心 / 爱 / 兴奋）</h2>
<div class="g">
<div class="c"><img src="../design/assets/icons/happy.svg"><span>happy 开心</span></div>
<div class="c"><img src="../design/assets/icons/heart.svg"><span>heart 爱</span></div>
<div class="c"><img src="../design/assets/icons/excited.svg"><span>excited 兴奋</span></div>
<div class="c"><img src="../design/assets/icons/party.svg"><span class="n">party 派对(对照)</span></div>
</div>
<h2>音乐（喇叭 / 唱歌）</h2>
<div class="g">
<div class="c"><img src="../design/assets/icons/speaker.svg"><span class="n">speaker 喇叭</span></div>
<div class="c"><img src="../design/assets/icons/sing.svg"><span>sing 唱歌</span></div>
</div>
<h2>人物（女孩 / 老师）</h2>
<div class="g">
<div class="c"><img src="../design/assets/icons/girl.svg"><span class="n">girl 我</span></div>
<div class="c"><img src="../design/assets/icons/teacher.svg"><span>teacher 老师</span></div>
</div>
<h2>脚印（人脚 / 动物爪）</h2>
<div class="g">
<div class="c"><img src="../design/assets/icons/foot.svg"><span>foot 人脚</span></div>
<div class="c"><img src="../design/assets/icons/paw.svg"><span class="n">paw 爪印</span></div>
</div>
<h2>恐龙（霸王龙 / 吼叫 / 长脖子 / 旧 dino）</h2>
<div class="g">
<div class="c"><img src="../design/assets/icons/trex.svg"><span>trex 霸王龙</span></div>
<div class="c"><img src="../design/assets/icons/roar.svg"><span>roar 吼</span></div>
<div class="c"><img src="../design/assets/icons/bronto.svg"><span>bronto 长脖子</span></div>
<div class="c"><img src="../design/assets/icons/dino.svg"><span class="n">dino 旧</span></div>
<div class="c"><img src="../design/assets/icons/leaf.svg"><span class="n">leaf 叶</span></div>
</div>
</body></html>
