<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>03 · 思维镇 · 数感关卡流</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ---------- 场景变体 ---------- */
  .scene.field { background: linear-gradient(180deg, #FFCE6B 0%, #FFE29A 46%, #FFF4CE 66%); }
  .scene.field .sun { background: radial-gradient(circle, rgba(255,240,170,.95) 0%, rgba(255,214,102,.5) 38%, transparent 70%); }
  .scene.field .hills-back, .scene.field .hills-front { filter: hue-rotate(-14deg) saturate(.85); }
  .scene-deco { position: absolute; display: none; pointer-events: none; }
  .scene.field .scene-deco.field-only { display: block; }
  .scene.pond .scene-deco.pond-only { display: block; }

  .body-wrap {
    position: absolute; inset: 96px 0 0;
    display: grid; place-items: center;
    padding-bottom: 52px;
    z-index: 15;
  }

  .qa-card {
    width: 820px;
    background: linear-gradient(180deg, #FFFFFF, #F4FBFF);
    border-radius: 34px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-3);
    padding: 28px 34px 24px;
    text-align: center;
    position: relative;
  }
  .round-tag {
    position: absolute; top: -21px; left: 34px;
    background: linear-gradient(180deg, var(--blue), var(--blue-dk));
    border: 3px solid var(--blue-ddk);
    color: #fff; font-size: 17px; font-weight: 900;
    border-radius: 999px; padding: 7px 22px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 4px 0 var(--blue-ddk);
    letter-spacing: 1px;
  }
  .lvl-tag {
    position: absolute; top: -21px; right: 34px;
    background: linear-gradient(180deg, var(--coral), var(--coral-dk));
    border: 3px solid var(--coral-ddk);
    color: #fff; font-size: 16px; font-weight: 900;
    border-radius: 999px; padding: 7px 20px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 4px 0 var(--coral-ddk);
  }
  .question { font-size: 28px; font-weight: 900; margin: 6px 0 14px; letter-spacing: 1px; }
  .question .hl { color: var(--blue-dk); }
  .question .tip { font-size: 17px; color: var(--ink-soft); font-weight: 800; }

  /* ---------- 点数场景（池塘 / 果树） ---------- */
  .count-zone {
    position: relative;
    height: 186px;
    border-radius: 26px;
    border: 5px solid #fff;
    box-shadow: 0 0 0 4px var(--pb), inset 0 6px 14px rgba(47,134,201,.22);
    background: linear-gradient(180deg, #C9EFFB 0%, #8ED8F6 68%, #6FC9EE 100%);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .count-zone.orchard {
    background: linear-gradient(180deg, #DFF6C8 0%, #B9E88C 62%, #9ADB6E 100%);
    box-shadow: 0 0 0 4px var(--pb), inset 0 6px 14px rgba(80,140,40,.22);
  }
  .count-zone .wave {
    position: absolute; left: -5%; right: -5%; bottom: -26px; height: 60px;
    background: radial-gradient(circle at 10px -8px, transparent 20px, rgba(255,255,255,.45) 21px);
    background-size: 44px 30px;
  }
  .count-zone .tree-bg {
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    font-size: 150px; opacity: .95;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.15));
  }
  .count-item {
    position: absolute;
    font-size: 56px;
    cursor: pointer;
    transition: transform .15s;
    user-select: none;
    filter: drop-shadow(0 6px 6px rgba(20,60,90,.25));
  }
  .count-item.bob { animation: float-bob 2.2s ease-in-out infinite; }
  .count-item:hover { transform: scale(1.15); }
  .count-item.counted { filter: drop-shadow(0 0 12px #FFD54F); }
  .count-item.apple { font-size: 40px; filter: drop-shadow(0 4px 5px rgba(0,0,0,.2)); }
  .count-bubble {
    position: absolute;
    font-size: 24px; font-weight: 900; color: #8A5B00;
    background: linear-gradient(180deg, #FFE58A, var(--gold));
    border: 3px solid var(--gold-ddk);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    animation: bubbleUp .8s ease-out forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes bubbleUp {
    0% { transform: translateY(0) scale(.5); opacity: 0; }
    30% { transform: translateY(-26px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-60px) scale(1); opacity: 0; }
  }
  .counter-chip {
    position: absolute; top: 10px; right: 12px;
    background: #fff;
    border: 3px solid var(--pb);
    border-radius: 999px; padding: 6px 18px;
    font-size: 19px; font-weight: 900;
    box-shadow: 0 4px 0 rgba(47,134,201,.18);
    z-index: 6;
  }
  .counter-chip b { color: var(--blue-dk); font-size: 25px; }

  /* ---------- 比多少 ---------- */
  .plates { display: flex; gap: 34px; justify-content: center; margin-bottom: 20px; }
  .plate {
    width: 270px; height: 170px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, #FFFFFF, #F2EDDF 78%);
    box-shadow: 0 7px 0 #E4D9C2, 0 0 0 4px var(--pb), inset 0 -6px 0 rgba(0,0,0,.04);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 2px 10px;
    font-size: 44px;
    padding: 18px;
  }
  .plate.jar {
    border-radius: 26px;
    width: 220px; height: 190px;
    background: linear-gradient(180deg, rgba(234,249,255,.9), rgba(168,220,245,.75));
    position: relative;
  }
  .plate.jar::before {
    content: ''; position: absolute; top: -14px; left: 12%; right: 12%; height: 18px;
    border-radius: 8px;
    background: linear-gradient(180deg, #FF9068, var(--coral-dk));
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .plate-label { font-size: 17px; font-weight: 900; color: var(--ink-soft); margin-top: 12px; }
  .plate-wrap { text-align: center; }

  /* ---------- 排序 ---------- */
  .order-row { display: flex; gap: 22px; justify-content: center; margin-bottom: 20px; }
  .order-card {
    width: 150px; height: 130px;
    border-radius: 24px;
    background: #fff;
    border: 4px solid #fff;
    box-shadow: 0 6px 0 #EFDFBB, 0 0 0 3px var(--pb);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 2px 6px; padding: 10px;
    font-size: 40px;
    cursor: pointer;
    transition: transform .12s, opacity .3s;
    position: relative;
  }
  .order-card:hover { transform: translateY(-5px); }
  .order-card.picked { opacity: .35; pointer-events: none; }
  .order-card .ord {
    position: absolute; top: -14px; left: -12px;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(180deg, var(--green), var(--green-dk));
    border: 3px solid #fff;
    color: #fff; font-size: 17px; font-weight: 900;
    display: grid; place-items: center;
    animation: pop .3s;
  }
  .order-card.wrong { animation: shake .4s; }
  .train-row { display: flex; gap: 14px; justify-content: center; align-items: flex-end; margin-bottom: 20px; }
  .train-car {
    width: 108px; height: 104px;
    border-radius: 20px;
    background: linear-gradient(180deg, #FFFDF6, #FFEFD2);
    border: 4px solid #E8D5AE;
    box-shadow: 0 5px 0 #DCC493;
    display: grid; place-items: center;
    position: relative;
    cursor: pointer;
    transition: transform .12s, opacity .3s;
  }
  .train-car .ic { font-size: 52px; }
  .train-car .num {
    position: absolute; top: -16px; right: -12px;
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(180deg, #FFE58A, var(--gold));
    border: 3px solid var(--gold-ddk);
    color: #8A5B00; font-size: 19px; font-weight: 900;
    display: grid; place-items: center;
  }
  .train-car:hover { transform: translateY(-5px); }
  .train-car.picked { opacity: .35; pointer-events: none; }
  .train-car.wrong { animation: shake .4s; }
  .order-progress { font-size: 19px; font-weight: 900; color: var(--green-dk); height: 26px; margin-bottom: 8px; }

  /* ---------- 选项 ---------- */
  .num-options { display: flex; gap: 28px; justify-content: center; }
  .num-btn {
    width: 100px; height: 92px;
    border-radius: 20px;
    border: 3px solid var(--gold-ddk);
    font-family: var(--font-round);
    font-size: 42px; font-weight: 900;
    color: #8A5B00;
    background: linear-gradient(180deg, #FFE58A 0%, var(--gold) 40%, var(--gold-dk) 100%);
    box-shadow: 0 6px 0 var(--gold-ddk), 0 10px 14px rgba(192,138,12,.3), inset 0 3px 0 rgba(255,255,255,.55);
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
    cursor: pointer;
    transition: transform .12s;
  }
  .num-btn:hover { transform: translateY(-5px); }
  .num-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-ddk); }
  .num-btn.correct { background: linear-gradient(180deg, #C6F0A0 0%, #92DC6A 40%, #5CB444 100%); border-color: var(--green-ddk); color: #2F6B22; box-shadow: 0 6px 0 #3F8F30, inset 0 3px 0 rgba(255,255,255,.5); animation: pop .4s; }
  .num-btn.wrong { animation: shake .4s; }
  .num-btn.dim { opacity: .4; pointer-events: none; }

  .text-options { display: flex; gap: 18px; justify-content: center; }
  .text-btn {
    padding: 12px 26px; font-size: 22px;
    border-radius: 999px; border: 3px solid #E4D2AC;
    font-family: var(--font-round);
    background: #fff; color: var(--ink); font-weight: 900; cursor: pointer;
    box-shadow: 0 5px 0 #E4D2AC, var(--sh-1);
    letter-spacing: 1px;
    transition: transform .12s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .text-btn .ic { font-size: 25px; }
  .text-btn:hover { transform: translateY(-5px); }
  .text-btn.correct { background: linear-gradient(180deg, #C6F0A0, #5CB444); border-color: var(--green-ddk); color: #2F6B22; box-shadow: 0 5px 0 #3F8F30; animation: pop .4s; }
  .text-btn.wrong { animation: shake .4s; }

  /* ---------- 关卡完成 / 通关 ---------- */
  .level-done {
    display: none;
    flex-direction: column; align-items: center; gap: 10px;
    animation: pop .45s;
  }
  .level-done.show { display: flex; }
  .level-done .ld-stars { font-size: 52px; letter-spacing: 12px; filter: drop-shadow(0 6px 6px rgba(192,138,12,.35)); }
  .level-done .ld-sub { font-size: 17px; color: var(--ink-soft); font-weight: 800; }

  .finish-card {
    position: absolute; inset: 96px 26px 52px;
    z-index: 30;
    background: linear-gradient(180deg, #FFFFFF, #F4FBFF);
    border: 5px solid var(--pb);
    border-radius: 34px;
    box-shadow: var(--sh-3);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center;
  }
  .finish-card.show { display: flex; animation: pop .5s; }
  .finish-card .f-party { font-size: 64px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.18)); }
  .finish-card h2 { font-size: 32px; letter-spacing: 3px; }
  .finish-card .f-stars { font-size: 54px; letter-spacing: 14px; filter: drop-shadow(0 6px 6px rgba(192,138,12,.35)); }
  .finish-card .f-sub { font-size: 18px; color: var(--ink-soft); font-weight: 800; }
</style>
</head>
<body data-theme="math">
<div class="stage">

  <div class="scene pond" id="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hills-back"></div>
    <div class="hills-front"></div>
    <span class="scene-deco pond-only" style="left:50px; bottom:200px; font-size:42px; opacity:.9;"><img class="ic" src="assets/icons/wave.svg" alt=""></span>
    <span class="scene-deco field-only" style="left:44px; bottom:190px; font-size:74px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));"><img class="ic" src="assets/icons/tree.svg" alt=""></span>
    <span class="scene-deco field-only" style="right:52px; bottom:200px; font-size:64px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));"><img class="ic" src="assets/icons/tree.svg" alt=""></span>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <button class="sqbtn" onclick="goHome()" title="返回"><img class="ic" src="assets/icons/back.svg" alt=""></button>
      <div>
        <div class="page-title">思维镇 · 数与量关卡</div>
        <div class="page-sub" id="hudSub">关卡进度 5 / 40 · 4-5岁 L2</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="step-chips" id="stepChips">
        <span class="step-chip" data-r="0"><span class="dot">1</span>点数</span>
        <span class="gap"></span>
        <span class="step-chip" data-r="1"><span class="dot">2</span>比多少</span>
        <span class="gap"></span>
        <span class="step-chip" data-r="2"><span class="dot">3</span>排序</span>
      </div>
      <div class="gold-chip"><span class="ico"><img class="ic" src="assets/icons/star.svg" alt=""></span><span id="starCnt">2</span></div>
    </div>
  </div>

  <div class="body-wrap">
    <div class="qa-card" id="qaCard">
      <div class="round-tag" id="roundTag">第 1 题 · 数一数</div>
      <div class="lvl-tag" id="lvlTag">第 5 关</div>
      <div id="roundBox"></div>
      <div class="level-done" id="levelDone">
        <div class="ld-stars"><img class="ic" src="assets/icons/starface.svg" alt=""><img class="ic" src="assets/icons/starface.svg" alt=""><img class="ic" src="assets/icons/starface.svg" alt=""></div>
        <div class="question" id="ldTitle">本关完成！</div>
        <div class="ld-sub" id="ldSub">学会了：5 以内点数 · 比多少 · 少到多排序</div>
        <div>
          <button class="jbtn jbtn-orange" id="ldNext" onclick="nextLevel()">下一关 ▶</button>
          <button class="jbtn jbtn-cream" style="margin-left:12px;" onclick="goHome()">返回地图</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 通关卡 -->
  <div class="finish-card" id="finishCard">
    <div class="f-party"><img class="ic" src="assets/icons/party.svg" alt=""></div>
    <h2>思维镇 · 本轮通关！</h2>
    <div class="f-stars"><img class="ic" src="assets/icons/starface.svg" alt=""><img class="ic" src="assets/icons/starface.svg" alt=""><img class="ic" src="assets/icons/starface.svg" alt=""></div>
    <div class="f-sub">两关六题全部完成 · 点数 / 比多少 / 排序 全掌握</div>
    <div style="margin-top:10px;">
      <button class="jbtn jbtn-orange" onclick="goHome()"><img class="ic" src="assets/icons/home.svg" alt="">返回地图</button>
      <button class="jbtn jbtn-cream" style="margin-left:12px;" onclick="restart()">再玩一遍 ↻</button>
    </div>
  </div>

  <div class="safe-tip">先点一点帮助点数，再选答案 · 答错不扣分，大胆试！</div>
  <div class="design-note">设计稿 03 · 数学关卡流（2 关 × 3 题：点数 / 比多少 / 排序 · 池塘与果园双场景）</div>
</div>

<script src="art.js"></script>
<script src="app.js"></script>
<script>
  /* ============ 关卡数据 ============ */
  const LEVELS = [
    {
      no: 5, scene: 'pond', sub: '关卡进度 5 / 40 · 4-5岁 L2', learn: '5 以内点数 · 比多少 · 少到多排序',
      rounds: [
        { type: 'count', zone: 'pond', item: 'duck', n: 5, opts: [3, 4, 5],
          q: '池塘里有几只小鸭？', tip: '（点一点，数数看）',
          okSay: '答对啦，一共五只小鸭。', hint: '再数一数：用手指点住小鸭，一只一只数' },
        { type: 'compare', style: 'plate', a: ['apple', 4], b: ['banana', 2],
          q: '果盘里的水果，哪边更多？', ok: 'a',
          okSay: '答对啦，苹果有四个，香蕉只有两个，苹果更多。', hint: '小提示：可以一一对应着比，苹果配香蕉' },
        { type: 'order', item: 'duck', counts: [2, 5, 3],
          q: '给鸭群排排队：从少到多点一点', tip: '（先点最少的）',
          okSay: '排对啦！2 只、3 只、5 只，从少到多。', hint: '先数一数每群几只，从最少的开始点' },
      ]
    },
    {
      no: 6, scene: 'field', sub: '关卡进度 6 / 40 · 4-5岁 L3', learn: '6 的点数 · 罐装比较 · 数字火车排序',
      rounds: [
        { type: 'count', zone: 'orchard', item: 'apple', n: 6, opts: [5, 6, 7], appleOnTree: true,
          q: '果树上有几个苹果？', tip: '（点一点苹果）',
          okSay: '答对啦，树上一共有六个苹果。', hint: '从上往下、一排一排点，不要漏掉哦' },
        { type: 'compare', style: 'jar', a: ['candy', 3], b: ['candy', 5],
          q: '两个糖果罐，哪罐糖果更多？', ok: 'b',
          okSay: '答对啦，右边罐子里有五颗糖，比三颗多。', hint: '数一数每罐几颗，再比一比' },
        { type: 'train', nums: [3, 1, 5, 2, 4],
          q: '数字火车出发：按 1 到 5 的顺序点车厢', tip: '',
          okSay: '火车出发啦！1、2、3、4、5 顺序全对。', hint: '找一找写着 1 的车厢先点' },
      ]
    },
  ];

  let li = 0, ri = 0, stars = 2;

  /* ============ 渲染 ============ */
  function setSteps(idx) {
    document.querySelectorAll('#stepChips .step-chip').forEach(c => {
      const r = +c.dataset.r;
      c.classList.remove('now', 'done');
      if (r < idx) c.classList.add('done');
      if (r === idx) c.classList.add('now');
    });
  }

  function loadLevel(i) {
    li = i; ri = 0;
    const L = LEVELS[i];
    document.getElementById('scene').className = 'scene ' + L.scene;
    document.getElementById('hudSub').textContent = L.sub;
    document.getElementById('lvlTag').textContent = '第 ' + L.no + ' 关';
    document.getElementById('levelDone').classList.remove('show');
    loadRound(0);
  }

  function loadRound(r) {
    ri = r;
    const L = LEVELS[li], R = L.rounds[r];
    setSteps(r);
    const names = { count: '数一数', compare: '比一比', order: '排一排', train: '排一排' };
    document.getElementById('roundTag').textContent = '第 ' + (r + 1) + ' 题 · ' + names[R.type];
    const box = document.getElementById('roundBox');
    box.style.display = 'block';
    if (R.type === 'count') renderCount(box, R);
    if (R.type === 'compare') renderCompare(box, R);
    if (R.type === 'order') renderOrder(box, R);
    if (R.type === 'train') renderTrain(box, R);
  }

  function renderCount(box, R) {
    const spots = R.appleOnTree
      ? [[300, 26], [360, 52], [430, 30], [470, 74], [380, 92], [320, 70]]
      : Array.from({ length: R.n }, (_, i) => [16 + i * (720 / R.n) + Math.random() * 20, 0]);
    box.innerHTML = `
      <div class="question">${R.q}<span class="tip">${R.tip || ''}</span></div>
      <div class="count-zone ${R.zone === 'orchard' ? 'orchard' : ''}" id="cz">
        ${R.zone === 'orchard' ? '<span class="tree-bg">' + icon('tree') + '</span>' : ''}
        ${R.zone === 'pond' ? '<div class="wave"></div>' : ''}
        <div class="counter-chip">已数 <b id="cnt">0</b> ${R.zone === 'orchard' ? '个' : '只'}</div>
      </div>
      <div class="num-options" id="opts">${R.opts.map(n => `<button class="num-btn" data-n="${n}">${n}</button>`).join('')}</div>`;
    const cz = document.getElementById('cz');
    const counted = new Set();
    for (let i = 0; i < R.n; i++) {
      const d = document.createElement('div');
      d.className = 'count-item' + (R.zone === 'pond' ? ' bob' : '') + (R.item === 'apple' ? ' apple' : '');
      d.innerHTML = icon(R.item);
      if (R.appleOnTree) { d.style.left = spots[i][0] + 'px'; d.style.top = spots[i][1] + 'px'; }
      else { d.style.left = spots[i][0] + 'px'; d.style.bottom = '44px'; d.style.animationDelay = (Math.random() * 2) + 's'; }
      d.onclick = () => {
        if (!counted.has(i)) {
          counted.add(i); d.classList.add('counted');
          const n = counted.size;
          document.getElementById('cnt').textContent = n;
          speak(String(n));
          const b = document.createElement('div');
          b.className = 'count-bubble'; b.textContent = n;
          b.style.left = d.style.left;
          if (R.appleOnTree) b.style.top = (spots[i][1] - 34) + 'px';
          else b.style.bottom = '116px';
          cz.appendChild(b);
          setTimeout(() => b.remove(), 850);
        }
        d.style.scale = '1.2'; setTimeout(() => d.style.scale = '1', 160);
      };
      cz.appendChild(d);
    }
    document.querySelectorAll('#opts .num-btn').forEach(b => b.onclick = () => {
      if (+b.dataset.n === R.n) roundOk(R, b, '#opts .num-btn');
      else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); dingNO(); toast(R.hint); }
    });
  }

  function renderCompare(box, R) {
    const wrap = (side, cfg) => `
      <div class="plate-wrap">
        <div class="plate ${R.style === 'jar' ? 'jar' : ''}">${icon(cfg[0]).repeat(cfg[1])}</div>
        <div class="plate-label">${side === 'a' ? '左边' : '右边'}${R.style === 'jar' ? '罐' : '盘'}</div>
      </div>`;
    box.innerHTML = `
      <div class="question">${R.q}</div>
      <div class="plates">${wrap('a', R.a)}${wrap('b', R.b)}</div>
      <div class="text-options" id="opts">
        <button class="text-btn" data-k="a">${icon(R.a[0])}左边多</button>
        <button class="text-btn" data-k="b">${icon(R.b[0])}右边多</button>
        <button class="text-btn" data-k="same">${icon('equal')}一样多</button>
      </div>`;
    document.querySelectorAll('#opts .text-btn').forEach(b => b.onclick = () => {
      if (b.dataset.k === R.ok) roundOk(R, b, '#opts .text-btn');
      else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); dingNO(); toast(R.hint); }
    });
  }

  function renderOrder(box, R) {
    const sorted = [...R.counts].sort((a, b) => a - b);
    box.innerHTML = `
      <div class="question">${R.q}<span class="tip">${R.tip || ''}</span></div>
      <div class="order-progress" id="op"></div>
      <div class="order-row" id="opts">
        ${R.counts.map((c, i) => `<div class="order-card" data-c="${c}" data-i="${i}">${icon(R.item).repeat(c)}</div>`).join('')}
      </div>`;
    let step = 0;
    document.querySelectorAll('#opts .order-card').forEach(card => card.onclick = () => {
      if (+card.dataset.c === sorted[step]) {
        step++;
        card.classList.add('picked');
        card.insertAdjacentHTML('beforeend', `<span class="ord">${step}</span>`);
        document.getElementById('op').textContent = '已排 ' + step + ' / ' + R.counts.length;
        speak(String(sorted[step - 1]));
        if (step === sorted.length) roundOk(R, card, '#opts .order-card');
        else dingOK();
      } else {
        card.classList.remove('wrong'); void card.offsetWidth; card.classList.add('wrong');
        dingNO(); toast(R.hint);
      }
    });
  }

  function renderTrain(box, R) {
    box.innerHTML = `
      <div class="question">${R.q}</div>
      <div class="order-progress" id="op"></div>
      <div class="train-row" id="opts">
        ${R.nums.map(n => `<div class="train-car" data-n="${n}">${icon('train')}<span class="num">${n}</span></div>`).join('')}
      </div>`;
    let step = 1;
    document.querySelectorAll('#opts .train-car').forEach(car => car.onclick = () => {
      if (+car.dataset.n === step) {
        car.classList.add('picked');
        document.getElementById('op').textContent = '已挂车厢 ' + step + ' / ' + R.nums.length;
        speak(String(step));
        if (step === R.nums.length) roundOk(R, car, '#opts .train-car');
        else { dingOK(); step++; }
      } else {
        car.classList.remove('wrong'); void car.offsetWidth; car.classList.add('wrong');
        dingNO(); toast(R.hint);
      }
    });
  }

  /* ============ 流程 ============ */
  function roundOk(R, el, sel) {
    el.classList.add('correct');
    document.querySelectorAll(sel).forEach(b => { if (b !== el) b.classList.add('dim'); });
    stars++; document.getElementById('starCnt').textContent = stars;
    dingOK(); speak(R.okSay); confetti();
    setTimeout(() => {
      if (ri + 1 < LEVELS[li].rounds.length) { loadRound(ri + 1); toast('第 ' + (ri + 1) + ' 题'); }
      else levelDone();
    }, 1300);
  }

  function levelDone() {
    setSteps(3);
    document.getElementById('roundBox').style.display = 'none';
    const L = LEVELS[li];
    document.getElementById('ldTitle').textContent = '第 ' + L.no + ' 关完成！';
    document.getElementById('ldSub').textContent = '学会了：' + L.learn;
    document.getElementById('ldNext').textContent = (li + 1 < LEVELS.length) ? '下一关 ▶' : '查看通关奖励 ▶';
    document.getElementById('levelDone').classList.add('show');
    confetti(); dingOK();
  }

  function nextLevel() {
    if (li + 1 < LEVELS.length) { loadLevel(li + 1); toast('进入第 ' + LEVELS[li].no + ' 关'); }
    else {
      document.getElementById('finishCard').classList.add('show');
      confetti(); dingOK();
      speak('太棒了！思维镇两关全部完成！');
    }
  }

  function restart() {
    document.getElementById('finishCard').classList.remove('show');
    loadLevel(0);
  }

  loadLevel(0);
</script>
</body>
</html>
