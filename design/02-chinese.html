<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 · 识字村 · 象形字关卡流</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ---------- 场景变体 ---------- */
  .scene.night { background: linear-gradient(180deg, #2E3A6E 0%, #45549B 46%, #6A76C0 66%); }
  .scene.night .sun {
    top: -60px; left: auto; right: -70px;
    background: radial-gradient(circle, rgba(255,246,214,.6) 0%, rgba(255,246,214,.2) 40%, transparent 70%);
  }
  .scene.night .hills-back, .scene.night .hills-front { filter: brightness(.55) saturate(.7); }
  .scene.night .cloud { opacity: .22; }
  .scene.pond { background: linear-gradient(180deg, #6FD0F2 0%, #A8E6FA 46%, #DCF8FF 66%); }
  .scene.dusk { background: linear-gradient(180deg, #FF9A66 0%, #FFC07A 46%, #FFE3B0 66%); }
  .scene.dusk .sun { background: radial-gradient(circle, rgba(255,190,120,.95) 0%, rgba(255,170,90,.5) 40%, transparent 70%); }
  .scene.dusk .hills-back, .scene.dusk .hills-front { filter: hue-rotate(-18deg) saturate(.85) brightness(.96); }

  .star-dot {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: #FFF6D0; box-shadow: 0 0 8px 2px rgba(255,246,208,.6);
    display: none; animation: twinkle 2.2s ease-in-out infinite;
  }
  .scene.night .star-dot { display: block; }
  @keyframes twinkle { 0%,100% { opacity:.35; transform:scale(.8);} 50% { opacity:1; transform:scale(1.2);} }
  .scene-deco { position: absolute; display: none; pointer-events: none; }
  .scene.pond .scene-deco.pond-only { display: block; }
  .scene.dusk .scene-deco.dusk-only { display: block; }

  .body-wrap {
    position: absolute;
    top: 96px; left: 0; right: 0; bottom: 0;
    display: flex;
    gap: 22px;
    padding: 8px 26px 62px;
    z-index: 15;
  }

  /* ---------- 左：象形演变卷轴卡 ---------- */
  .morph-card {
    width: 400px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    background: linear-gradient(180deg, #FFFDF4, #FFF3D8);
    border-radius: 32px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-2);
    padding: 16px;
    position: relative;
  }
  .morph-card .corner { position: absolute; font-size: 30px; opacity: .95; }
  .lvl-tag {
    position: absolute; top: -18px; left: 26px;
    background: linear-gradient(180deg, var(--coral), var(--coral-dk));
    border: 3px solid var(--coral-ddk);
    color: #fff; font-size: 16px; font-weight: 900;
    border-radius: 999px; padding: 6px 18px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 4px 0 var(--coral-ddk);
    letter-spacing: 1px;
  }
  .morph-card .caption {
    font-size: 18px; font-weight: 900; color: #8A5B00;
    background: linear-gradient(180deg, #FFE7A8, var(--gold));
    border-radius: 999px; padding: 7px 22px;
    box-shadow: 0 3px 0 var(--gold-ddk);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .morph {
    position: relative;
    width: 270px; height: 236px;
    display: grid; place-items: center;
  }
  .morph .layer { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .6s, transform .6s cubic-bezier(.22,1.2,.36,1); }
  .morph .art-layer { opacity: 1; transform: scale(1); display: grid; place-items: center; }
  .morph .art-layer > img { grid-area: 1 / 1; }
  .morph .art-layer .rays { transform-origin: center; animation: rays-spin 16s linear infinite; }
  .morph .art-layer .flicker { animation: flicker 1.1s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { transform: scale(1) rotate(-1.5deg);} 50% { transform: scale(1.06) rotate(1.5deg);} }
  .morph.play .art-layer { opacity: 0; transform: scale(.4) rotate(30deg); }
  .morph .char {
    font-family: var(--font-kai);
    font-size: 170px; font-weight: 900;
    color: #E2582A;
    text-shadow: 0 5px 0 #FFD9A0, 0 9px 0 rgba(217,119,6,.16);
    opacity: 0; transform: scale(.4);
  }
  .morph.play .char { opacity: 1; transform: scale(1); }
  @keyframes rays-spin { to { transform: rotate(360deg); } }

  .pinyin-row { display: flex; align-items: center; gap: 14px; }
  .pinyin {
    font-size: 34px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, var(--coral), var(--coral-dk));
    border-radius: 18px; padding: 4px 24px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), 0 5px 0 var(--coral-ddk);
    text-shadow: 0 2px 0 rgba(0,0,0,.14);
    letter-spacing: 2px;
  }
  .speak-btn {
    border: none; cursor: pointer;
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(180deg, #FFDD7A, var(--yellow-dk));
    font-size: 27px; color: #7A4A00;
    border: 3px solid var(--yellow-ddk);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 5px 0 var(--yellow-ddk), var(--sh-1);
    display: grid; place-items: center;
  }
  .speak-btn:active { transform: translateY(4px); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 1px 0 var(--yellow-ddk), var(--sh-1); }

  .word-chips { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
  .word-chip {
    background: #fff; border: 3px solid #FFE3B3;
    border-radius: 16px; padding: 6px 13px;
    font-size: 17px; font-weight: 900; color: #B06A00;
    cursor: pointer; box-shadow: 0 3px 0 #F2E2C4;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .word-chip .ic { font-size: 21px; }
  .word-chip:active { transform: translateY(3px); box-shadow: 0 0 0 #F2E2C4; }

  /* ---------- 右：答题贴纸卡 ---------- */
  .qa-card {
    flex: 1;
    min-width: 0;
    background: linear-gradient(180deg, #FFFFFF, #FFF9EC);
    border-radius: 32px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-2);
    padding: 20px 24px 16px;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
  }
  .question {
    font-size: 25px; font-weight: 900;
    background: linear-gradient(180deg, #FFF3D8, #FFE9BC);
    border-radius: 999px;
    padding: 10px 30px;
    box-shadow: 0 4px 0 #F0DCAC;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .question .hl { color: var(--coral-dk); font-size: 31px; font-family: var(--font-kai); }
  .options { display: flex; gap: 16px; justify-content: center; }
  .answer-card .char-opt { font-family: var(--font-kai); font-size: 74px; font-weight: 900; color: #57433A; }
  .feedback {
    height: 34px; font-size: 21px; font-weight: 900;
    color: var(--green-dk);
    opacity: 0; transition: opacity .25s;
    display: flex; align-items: center; gap: 8px;
  }
  .feedback.show { opacity: 1; }
  .next-btn { display: none; }
  .next-btn.show { display: inline-flex; animation: pop .4s; }

  .mascot-row {
    margin-top: auto;
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, #FFF7E4, #FFEDC9);
    border-radius: 22px;
    padding: 10px 18px;
    box-shadow: inset 0 0 0 3px #FFE3B3;
  }
  .mascot-row .m { font-size: 56px; filter: drop-shadow(0 4px 6px rgba(84,66,58,.18)); animation: float-bob 2.8s ease-in-out infinite; }
  .mascot-row .say {
    background: #fff; border-radius: 16px;
    padding: 9px 16px;
    font-size: 15.5px; font-weight: 800; color: var(--ink-soft);
    box-shadow: var(--sh-1);
    position: relative;
    line-height: 1.5;
  }
  .mascot-row .say::before {
    content: ''; position: absolute; left: -7px; top: 22px;
    width: 14px; height: 14px; background: #fff;
    transform: rotate(45deg); border-radius: 3px;
  }
  .mascot-row .say b { color: var(--orange-dk); }

  /* ---------- 通关卡 ---------- */
  .finish-card {
    position: absolute; inset: 8px 26px 62px;
    z-index: 30;
    background: linear-gradient(180deg, #FFFFFF, #FFF6E2);
    border: 5px solid var(--pb);
    border-radius: 34px;
    box-shadow: var(--sh-3);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    text-align: center;
  }
  .finish-card.show { display: flex; animation: pop .5s; }
  .finish-card .f-party { font-size: 64px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.18)); }
  .finish-card h2 { font-size: 34px; letter-spacing: 3px; }
  .finish-card .f-stars { font-size: 54px; letter-spacing: 14px; filter: drop-shadow(0 6px 6px rgba(192,138,12,.35)); }
  .finish-card .f-sub { font-size: 18px; color: var(--ink-soft); font-weight: 800; }
  .finish-card .f-learn {
    display: flex; gap: 14px; margin-top: 4px;
  }
  .finish-card .f-learn span {
    background: #FFF3D8; border: 3px solid #F0DCAC; border-radius: 16px;
    padding: 8px 18px; font-size: 24px; font-weight: 900;
    font-family: var(--font-kai); color: #E2582A;
    box-shadow: 0 3px 0 #F0DCAC;
  }

  .star-fly { position: absolute; z-index: 60; animation: starUp 1s ease-out forwards; pointer-events: none; font-size: 44px; }
  @keyframes starUp {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translateY(-150px) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body data-theme="cn">
<div class="stage">

  <div class="scene" id="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="hills-back"></div>
    <div class="hills-front"></div>
    <span class="star-dot" style="left:14%; top:16%;"></span>
    <span class="star-dot" style="left:30%; top:9%; animation-delay:.5s;"></span>
    <span class="star-dot" style="left:52%; top:14%; animation-delay:1s;"></span>
    <span class="star-dot" style="left:70%; top:8%; animation-delay:1.5s;"></span>
    <span class="star-dot" style="left:86%; top:18%; animation-delay:.8s;"></span>
    <span class="star-dot" style="left:62%; top:24%; animation-delay:1.8s;"></span>
    <span class="scene-deco pond-only" style="left:60px; bottom:210px; font-size:44px; opacity:.9;"><img class="ic" src="assets/icons/wave.svg" alt=""></span>
    <span class="scene-deco pond-only" style="right:90px; bottom:230px; font-size:38px; opacity:.8;"><img class="ic" src="assets/icons/wave.svg" alt=""></span>
    <span class="scene-deco dusk-only" style="left:44px; top:150px; font-size:46px; animation:float-bob 3s ease-in-out infinite;"><img class="ic" src="assets/icons/flame.svg" alt=""></span>
    <span class="scene-deco dusk-only" style="right:60px; top:190px; font-size:40px; animation:float-bob 3.4s .6s ease-in-out infinite;"><img class="ic" src="assets/icons/volcano.svg" alt=""></span>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <button class="sqbtn" onclick="goHome()" title="返回"><img class="ic" src="assets/icons/back.svg" alt=""></button>
      <div>
        <div class="page-title">识字村 · 象形字关卡</div>
        <div class="page-sub" id="hudSub">关卡进度 3 / 10</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="step-chips">
        <span class="step-chip done"><span class="dot">✓</span>玩一玩</span>
        <span class="gap"></span>
        <span class="step-chip now"><span class="dot">2</span>认一认</span>
        <span class="gap"></span>
        <span class="step-chip"><span class="dot">3</span>练一练</span>
        <span class="gap"></span>
        <span class="step-chip"><span class="dot">4</span>写一写</span>
      </div>
      <div class="gold-chip"><span class="ico"><img class="ic" src="assets/icons/star.svg" alt=""></span><span id="starCnt">3</span></div>
    </div>
  </div>

  <div class="body-wrap" id="bodyWrap">

    <!-- 左：象形演变 -->
    <div class="morph-card">
      <span class="lvl-tag" id="lvlTag">第 3 关</span>
      <span class="corner" style="left:14px; top:12px;"><img class="ic" src="assets/icons/flower.svg" alt=""></span>
      <span class="corner" style="right:14px; top:12px;"><img class="ic" src="assets/icons/flower.svg" alt=""></span>
      <div class="caption" id="caption">看一看：太阳变成了什么字？</div>
      <div class="morph" id="morph">
        <div class="layer art-layer" id="artLayer"></div>
        <div class="layer"><div class="char" id="charLayer">日</div></div>
      </div>
      <div class="pinyin-row">
        <span class="pinyin" id="pinyin">rì</span>
        <button class="speak-btn" onclick="speakWord()" title="听读音"><img class="ic" src="assets/icons/speaker.svg" alt=""></button>
      </div>
      <div class="word-chips" id="wordChips"></div>
    </div>

    <!-- 右：答题 -->
    <div class="qa-card">
      <div class="question">找一找：哪个是 <span class="hl" id="qChar">日</span> ？</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="fb"></div>
      <button class="jbtn jbtn-green next-btn" id="nextBtn" onclick="nextLevel()">下一关 ▶</button>
      <div class="mascot-row">
        <span class="m"><img class="ic" src="assets/icons/panda.svg" alt=""></span>
        <div class="say" id="mascotSay">点一点右边的图片答题，答对有 <b>星星</b> 哦！<br>答错了也没关系，再想想就好～</div>
      </div>
    </div>
  </div>

  <!-- 通关卡 -->
  <div class="finish-card" id="finishCard">
    <div class="f-party"><img class="ic" src="assets/icons/party.svg" alt=""></div>
    <h2>识字村 · 本轮通关！</h2>
    <div class="f-stars"><img class="ic" src="assets/icons/starface.svg" alt=""><img class="ic" src="assets/icons/starface.svg" alt=""><img class="ic" src="assets/icons/starface.svg" alt=""></div>
    <div class="f-sub">本轮学会 4 个象形字 · 获得 4 颗星星</div>
    <div class="f-learn"><span>日</span><span>月</span><span>水</span><span>火</span></div>
    <div style="margin-top:10px;">
      <button class="jbtn jbtn-orange" onclick="goHome()"><img class="ic" src="assets/icons/home.svg" alt="">返回地图</button>
      <button class="jbtn jbtn-cream" style="margin-left:12px;" onclick="restart()">再玩一遍 ↻</button>
    </div>
  </div>

  <div class="safe-tip"><img class="ic" src="assets/icons/speaker.svg" alt=""> 点击图片答题 · 点喇叭听读音 · 点词卡学词语</div>
  <div class="design-note">设计稿 02 · 语文关卡流（4 关 × 4 场景：暖阳 / 星夜 / 池塘 / 篝火）</div>
</div>

<script src="art.js"></script>
<script src="app.js"></script>
<script>
  const LEVELS = [
    {
      no: 3, char: '日', pinyin: 'rì', scene: '', charColor: '#E2582A',
      caption: '看一看：太阳变成了什么字？',
      art: '<img class="rays" src="assets/icons/sunrays.svg" alt="" width="212" height="212"><img class="face" src="assets/icons/sunface.svg" alt="" width="170" height="170">',
      words: [['sunrise', '日出'], ['cake', '生日'], ['calendar', '日子']],
      opts: [['sun', 1], ['moon', 0], ['wave', 0]],
      ok: '真棒！「日」就是太阳的日！', hint: '再想一想：太阳每天从东边升起来哦',
      say: '太阳圆圆的，古人画个圆圈加一点，就是「日」！'
    },
    {
      no: 4, char: '月', pinyin: 'yuè', scene: 'night', charColor: '#7C5CE0',
      caption: '看一看：月亮变成了什么字？',
      art: '<img src="assets/icons/moon.svg" alt="" width="196" height="196">',
      words: [['moon', '月亮'], ['star', '星星'], ['cake', '月饼']],
      opts: [['moon', 1], ['sun', 0], ['star', 0]],
      ok: '真棒！「月」就是月亮的月！', hint: '再想一想：晚上天上弯弯的就是月亮',
      say: '月亮弯弯像小船，「月」字就是照它的样子写的！'
    },
    {
      no: 5, char: '水', pinyin: 'shuǐ', scene: 'pond', charColor: '#2F86C9',
      caption: '看一看：浪花变成了什么字？',
      art: '<img src="assets/icons/wave.svg" alt="" width="200" height="200">',
      words: [['wave', '海水'], ['', '雨水'], ['', '汽水']],
      opts: [['wave', 1], ['sun', 0], ['moon', 0]],
      ok: '真棒！「水」就是喝水的水！', hint: '再想一想：小河里哗哗流的就是水',
      say: '水波一浪一浪的，「水」字中间就是流动的水流！'
    },
    {
      no: 6, char: '火', pinyin: 'huǒ', scene: 'dusk', charColor: '#E85D4E',
      caption: '看一看：火苗变成了什么字？',
      art: '<img class="flicker" src="assets/icons/flame.svg" alt="" width="196" height="196">',
      words: [['flame', '火苗'], ['volcano', '火山'], ['', '营火']],
      opts: [['char:火', 1], ['char:水', 0], ['char:山', 0]],
      ok: '真棒！「火」就是火苗的火！', hint: '再想一想：烧饭取暖要靠火',
      say: '火苗往上窜的样子，就是「火」字上面的两点！'
    },
  ];

  let li = 0, solved = false, stars = 3;
  const morph = document.getElementById('morph');
  setInterval(() => { if (!document.getElementById('finishCard').classList.contains('show')) morph.classList.toggle('play'); }, 2600);

  function loadLevel(i) {
    li = i; solved = false;
    const L = LEVELS[i];
    document.getElementById('scene').className = 'scene ' + L.scene;
    document.getElementById('hudSub').textContent = '关卡进度 ' + L.no + ' / 10';
    document.getElementById('lvlTag').textContent = '第 ' + L.no + ' 关';
    document.getElementById('caption').textContent = L.caption;
    document.getElementById('artLayer').innerHTML = L.art;
    const ch = document.getElementById('charLayer');
    ch.textContent = L.char; ch.style.color = L.charColor;
    document.getElementById('pinyin').textContent = L.pinyin;
    document.getElementById('qChar').textContent = L.char;
    document.getElementById('wordChips').innerHTML = L.words.map(w =>
      `<span class="word-chip" onclick="speak('${w[1]}');toast('词卡：${w[1]}')">${w[0] ? icon(w[0]) : ''}${w[1]}</span>`).join('');
    document.getElementById('options').innerHTML = L.opts.map(o =>
      `<div class="answer-card" data-ok="${o[1]}" onclick="pick(this)">${o[0].startsWith('char:') ? `<span class="char-opt">${o[0].slice(5)}</span>` : icon(o[0])}</div>`).join('');
    document.getElementById('fb').classList.remove('show');
    document.getElementById('fb').textContent = '';
    document.getElementById('nextBtn').classList.remove('show');
    document.getElementById('mascotSay').innerHTML = L.say + '<br>答对有 <b>星星</b>，答错再想想～';
    morph.classList.remove('play');
    speak(L.char + '，' + L.caption.replace('看一看：', '').replace('？', ''));
  }

  function speakWord() {
    const L = LEVELS[li];
    speak(L.pinyin + '。' + L.char + '，' + L.ok.replace('真棒！', '').replace('！', ''));
    toast('播放读音（系统TTS演示，正式版为童声录音）');
  }

  function pick(el) {
    if (solved) return;
    const L = LEVELS[li];
    if (el.dataset.ok === '1') {
      solved = true;
      el.classList.add('correct');
      document.querySelectorAll('.answer-card').forEach(c => { if (c !== el) c.classList.add('dim'); });
      const fb = document.getElementById('fb');
      fb.textContent = L.ok; fb.classList.add('show');
      stars++; document.getElementById('starCnt').textContent = stars;
      dingOK(); speak(L.ok);
      confetti(); flyStar(el);
      const nb = document.getElementById('nextBtn');
      nb.textContent = (li === LEVELS.length - 1) ? '查看通关奖励 ▶' : '下一关 ▶';
      nb.classList.add('show');
    } else {
      el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
      dingNO();
      toast(L.hint);
    }
  }

  function nextLevel() {
    if (li + 1 < LEVELS.length) {
      loadLevel(li + 1);
      toast('进入第 ' + LEVELS[li].no + ' 关');
    } else {
      document.getElementById('bodyWrap').style.visibility = 'hidden';
      document.getElementById('finishCard').classList.add('show');
      confetti(); dingOK();
      speak('太棒了！本轮四个象形字全部学会！');
    }
  }

  function restart() {
    document.getElementById('finishCard').classList.remove('show');
    document.getElementById('bodyWrap').style.visibility = 'visible';
    loadLevel(0);
  }

  function flyStar(el) {
    const stage = document.querySelector('.stage');
    const s = document.createElement('span');
    s.className = 'star-fly';
    s.innerHTML = icon('star');
    const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const scale = sr.width / stage.offsetWidth;
    s.style.left = ((r.left - sr.left) / scale + r.width / scale / 2 - 20) + 'px';
    s.style.top  = ((r.top - sr.top) / scale) + 'px';
    stage.appendChild(s);
    setTimeout(() => s.remove(), 1100);
  }

  loadLevel(0);
</script>
</body>
</html>
