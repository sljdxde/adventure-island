<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>04 · 科学实验室 · 浮与沉</title>
<link rel="stylesheet" href="style.css">
<style>
  .scene .star { position: absolute; font-size: 20px; opacity: .85; animation: twinkle 2.4s ease-in-out infinite; color: #fff; }
  @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.85);} 50% { opacity: 1; transform: scale(1.15);} }

  /* ---------- 四步法 ---------- */
  .flow-bar {
    position: absolute;
    top: 96px; left: 30px; right: 30px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    z-index: 30;
  }
  .flow-step {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.95);
    border: 3px solid #D8CCF5;
    border-radius: 999px;
    padding: 6px 17px;
    font-size: 18px; font-weight: 900;
    color: #B7A6D9;
    box-shadow: 0 4px 0 rgba(124,92,224,.18);
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .flow-step .n {
    width: 28px; height: 28px; border-radius: 50%;
    background: #EDE5FB; color: #9C6BFF;
    display: grid; place-items: center;
    font-size: 16px; font-weight: 900;
  }
  .flow-step.now { color: #fff; background: linear-gradient(180deg, var(--purple), var(--purple-dk)); border-color: var(--purple-ddk); box-shadow: 0 4px 0 var(--purple-ddk); }
  .flow-step.now .n { background: rgba(255,255,255,.28); color: #fff; animation: pulse-glow 1.6s infinite; }
  .flow-step.done { color: var(--green-dk); background: #EFFBEF; border-color: #BFE8C6; }
  .flow-step.done .n { background: var(--green); color: #fff; }
  .flow-arrow { color: rgba(255,255,255,.95); font-size: 20px; font-weight: 900; text-shadow: 0 2px 0 rgba(124,92,224,.4); }

  /* ---------- 主体三栏 ---------- */
  .lab-body {
    position: absolute;
    top: 154px; left: 26px; right: 26px; bottom: 68px;
    display: flex;
    gap: 18px;
    z-index: 15;
  }

  .shelf {
    width: 206px;
    background: linear-gradient(180deg, #FFFDF4, #FFF1D6);
    border-radius: 30px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-2);
    padding: 14px 14px 10px;
    display: flex; flex-direction: column;
  }
  .shelf h4 {
    font-size: 18px; text-align: center; margin-bottom: 10px;
    color: #7A4A00;
    background: linear-gradient(180deg, #FFE7A8, var(--gold));
    border: 2.5px solid var(--gold-ddk);
    border-radius: 999px; padding: 4px 0;
    box-shadow: 0 3px 0 var(--gold-ddk);
    letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .shelf h4 .ic { font-size: 20px; }
  .shelf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
  .item-card {
    background: #fff;
    border-radius: 20px;
    border: 3px solid #F2E2C4;
    display: grid; place-items: center;
    font-size: 44px;
    cursor: grab;
    transition: transform .12s, border-color .12s, opacity .3s;
    user-select: none;
    position: relative;
    min-height: 82px;
    box-shadow: 0 4px 0 #EFE3C8;
  }
  .item-card:hover { transform: translateY(-4px) scale(1.05); }
  .item-card.selected { border-color: var(--purple); background: #F5F0FF; transform: scale(1.07); box-shadow: 0 4px 0 var(--purple-dk), var(--sh-2); }
  .item-card.used { opacity: .3; pointer-events: none; }
  .item-card .tick {
    position: absolute; top: -10px; right: -8px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--green); border: 2.5px solid #fff;
    color: #fff; font-size: 13px; font-weight: 900;
    display: none; place-items: center;
  }
  .item-card.used .tick { display: grid; }
  .shelf-tip { font-size: 13.5px; color: var(--ink-soft); text-align: center; font-weight: 800; margin-top: 8px; line-height: 1.5; }

  /* 水箱（玻璃质感） */
  .tank-zone {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
  }
  .tank {
    position: relative;
    width: 470px; height: 400px;
    border: 9px solid #FFFFFF;
    border-radius: 34px;
    box-shadow: var(--sh-3), 0 0 0 4px var(--pb), inset 0 0 0 3px #C9ECFA, inset 0 10px 20px rgba(47,134,201,.18);
    background: linear-gradient(180deg, rgba(234,249,255,.92) 0 56px, #7FD4F8 56px 100%);
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow .2s;
  }
  .tank.armed { box-shadow: var(--sh-3), 0 0 0 7px rgba(155,123,245,.6), inset 0 0 0 3px #C9ECFA; }
  .tank .waterline {
    position: absolute; top: 50px; left: 0; right: 0; height: 12px;
    background: rgba(255,255,255,.55);
    border-radius: 40%;
    animation: water 3.2s ease-in-out infinite;
  }
  @keyframes water {
    0%,100% { transform: translateX(-14px) scaleY(1); }
    50%     { transform: translateX(14px) scaleY(1.5); }
  }
  .tank .caustics {
    position: absolute; inset: 56px 0 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.25) 0 26px, transparent 27px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.2) 0 34px, transparent 35px),
      radial-gradient(circle at 45% 80%, rgba(255,255,255,.18) 0 30px, transparent 31px);
  }
  .tank-item {
    position: absolute;
    font-size: 58px;
    left: 50%;
    transition: top 1.1s cubic-bezier(.45,.05,.35,1), transform 1.1s;
    filter: drop-shadow(0 6px 6px rgba(20,60,90,.25));
    z-index: 4;
  }
  .tank-item.floating { animation: float-bob 2.8s ease-in-out infinite; }
  .bubble {
    position: absolute;
    bottom: -20px;
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    box-shadow: inset -2px -2px 4px rgba(160,220,250,.9);
    animation: bubble-rise 1.3s ease-out forwards;
    z-index: 3;
  }
  @keyframes bubble-rise {
    0% { transform: translateY(0); opacity: .9; }
    100% { transform: translateY(-320px); opacity: 0; }
  }
  .result-chip {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    top: 12px;
    background: rgba(255,255,255,.97);
    border: 3px solid var(--pb);
    border-radius: 999px;
    padding: 8px 24px;
    font-size: 20px; font-weight: 900;
    box-shadow: 0 4px 0 rgba(84,66,58,.12);
    z-index: 8;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .result-chip .ic { font-size: 24px; }
  .result-chip.show { opacity: 1; transform: translateX(-50%) translateY(6px); }

  /* 猜想浮层 */
  .guess-overlay {
    position: absolute; inset: 0;
    background: rgba(58,45,80,.45);
    backdrop-filter: blur(2px);
    display: grid; place-items: center;
    z-index: 40;
    border-radius: 24px;
  }
  .guess-card {
    background: linear-gradient(180deg, #FFFDF4, #FFF3D8);
    border-radius: 30px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-3);
    padding: 24px 42px;
    text-align: center;
    animation: pop .4s;
  }
  .guess-card h3 { font-size: 26px; margin-bottom: 4px; color: var(--purple-dk); letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .guess-card h3 .ic { font-size: 26px; }
  .guess-card .sub { font-size: 17px; color: var(--ink-soft); font-weight: 800; margin-bottom: 16px; }
  .guess-card .big { font-size: 76px; margin: 2px 0 8px; filter: drop-shadow(0 8px 8px rgba(0,0,0,.18)); }
  .guess-btns { display: flex; gap: 18px; justify-content: center; }
  .guess-btns .jbtn { white-space: nowrap; font-size: 21px; }

  /* 图鉴面板 */
  .codex {
    width: 238px;
    background: linear-gradient(180deg, #FFFDF4, #FFF1D6);
    border-radius: 30px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-2);
    padding: 14px;
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .codex h4 {
    font-size: 18px; color: var(--purple-dk); text-align: center;
    background: linear-gradient(180deg, #E4D6FF, #D0BCFF);
    border: 2.5px solid var(--purple-dk);
    border-radius: 999px; padding: 4px 0;
    box-shadow: 0 3px 0 var(--purple-dk);
    letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .codex h4 .ic { font-size: 20px; }
  .codex .col-title { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .codex .list {
    background: #fff;
    border-radius: 18px;
    min-height: 88px;
    padding: 8px;
    display: flex; flex-wrap: wrap; gap: 6px;
    align-content: flex-start;
    border: 3px solid #F2E2C4;
  }
  .codex .chip {
    background: linear-gradient(180deg, #FFFDF4, #FFF3D8);
    border: 2.5px solid #F0DCAC;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 17px;
    font-weight: 900;
    box-shadow: 0 3px 0 #F0DCAC;
    animation: pop .35s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .codex .chip .ic { font-size: 20px; }
  .codex .empty { color: #C6BADF; font-size: 15px; font-weight: 700; padding: 6px; }
  .codex .progress-line { text-align: center; font-size: 16px; font-weight: 900; color: var(--purple-dk); }

  .lab-footer { position: absolute; left: 26px; bottom: 16px; z-index: 20; }
  .btn-collect.ready { animation: pulse-glow 1.5s infinite; }
</style>
</head>
<body data-theme="lab">
<div class="stage">

  <div class="scene">
    <div class="sun"></div>
    <span class="star" style="left:18%; top:12%;">✦</span>
    <span class="star" style="left:70%; top:9%; animation-delay:.8s;">✦</span>
    <span class="star" style="left:86%; top:22%; animation-delay:1.4s;">✦</span>
    <span class="star" style="left:38%; top:7%; animation-delay:.4s;">✦</span>
    <div class="cloud c1" style="opacity:.55"></div>
    <div class="cloud c2" style="opacity:.45"></div>
    <div class="hills-back"></div>
    <div class="hills-front"></div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <button class="sqbtn" onclick="goHome()" title="返回"><img class="ic" src="assets/icons/back.svg" alt=""></button>
      <div>
        <div class="page-title"><img class="ic" src="assets/icons/flask.svg" alt="">科学实验室 · 浮与沉</div>
        <div class="page-sub">实验 7 / 10 · 向导闪闪 <img class="ic" src="assets/icons/robot.svg" alt=""></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="gold-chip"><span class="ico"><img class="ic" src="assets/icons/goggles.svg" alt=""></span>已戴好</div>
      <div class="gold-chip"><span class="ico"><img class="ic" src="assets/icons/star.svg" alt=""></span>1</div>
    </div>
  </div>

  <!-- 四步法 -->
  <div class="flow-bar">
    <span class="flow-step now" id="fs1"><span class="n">1</span>猜一猜</span>
    <span class="flow-arrow">➜</span>
    <span class="flow-step" id="fs2"><span class="n">2</span>动手做</span>
    <span class="flow-arrow">➜</span>
    <span class="flow-step" id="fs3"><span class="n">3</span>看现象</span>
    <span class="flow-arrow">➜</span>
    <span class="flow-step" id="fs4"><span class="n">4</span>收进图鉴</span>
  </div>

  <div class="lab-body">

    <!-- 工具箱 -->
    <div class="shelf">
      <h4><img class="ic" src="assets/icons/flask.svg" alt="">工具箱</h4>
      <div class="shelf-grid" id="shelf"></div>
      <div class="shelf-tip">点选物品<br>再点水箱放进去<br>（也可直接拖拽）</div>
    </div>

    <!-- 水箱 -->
    <div class="tank-zone">
      <div class="tank" id="tank">
        <div class="waterline"></div>
        <div class="caustics"></div>
        <div class="result-chip" id="resultChip"></div>

        <!-- 猜想浮层 -->
        <div class="guess-overlay" id="guessOverlay">
          <div class="guess-card">
            <h3>猜一猜 <img class="ic" src="assets/icons/crystal.svg" alt=""></h3>
            <div class="big"><img class="ic" src="assets/icons/apple.svg" alt=""></div>
            <div class="sub">苹果放进水里，会怎么样？</div>
            <div class="guess-btns">
              <button class="jbtn jbtn-yellow" onclick="makeGuess('float')">↑ 浮起来</button>
              <button class="jbtn jbtn-blue" onclick="makeGuess('sink')">↓ 沉下去</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 图鉴 -->
    <div class="codex">
      <h4><img class="ic" src="assets/icons/book.svg" alt="">现象图鉴</h4>
      <div class="col-title" style="color:var(--blue-dk);">↑ 浮起来</div>
      <div class="list" id="listFloat"><span class="empty">还没有发现…</span></div>
      <div class="col-title" style="color:var(--coral-dk);">↓ 沉下去</div>
      <div class="list" id="listSink"><span class="empty">还没有发现…</span></div>
      <div class="progress-line" id="codexProg">已测试 0 / 6</div>
      <button class="jbtn jbtn-purple btn-collect" id="collectBtn" style="font-size:19px; padding:11px 0; width:100%;" disabled onclick="collect()"><img class="ic" src="assets/icons/star.svg" alt="">收进图鉴</button>
    </div>
  </div>

  <div class="lab-footer">
    <button class="jbtn jbtn-cream" style="font-size:18px; padding:10px 22px;" onclick="location.reload()">↻ 重新实验</button>
  </div>

  <div class="safe-tip"><img class="ic" src="assets/icons/goggles.svg" alt=""> 虚拟实验室随便玩 · 真的做实验时，一定要请爸爸妈妈陪哦！</div>
  <div class="design-note" style="bottom:44px;">设计稿 04 · 科学实验室（派对风面板 × 四步探究法）</div>
</div>

<script src="art.js"></script>
<script src="app.js"></script>
<script>
  const ITEMS = [
    { id: 'apple',   name: '苹果', sink: false },
    { id: 'rock',    name: '石头', sink: true  },
    { id: 'wood',    name: '木头', sink: false },
    { id: 'key',     name: '钥匙', sink: true  },
    { id: 'sponge',  name: '海绵', sink: false },
    { id: 'balloon', name: '气球', sink: false },
  ];
  const FACTS = {
    apple:   '苹果皮里有小气孔，像穿了救生衣',
    rock:    '石头比同体积的水重很多，所以沉底',
    wood:    '木头里有空隙，轻，所以能浮',
    key:     '金属钥匙小小的却很重，一下就沉啦',
    sponge:  '海绵干的时候会浮，吸满水会慢慢沉哦',
    balloon: '气球里是空气，最轻，漂在最上面',
  };

  let phase = 'guess';
  let selected = null;
  let tested = new Set();
  let guessApple = null;

  const shelfEl = document.getElementById('shelf');
  ITEMS.forEach(it => {
    const d = document.createElement('div');
    d.className = 'item-card';
    d.id = 'card-' + it.id;
    d.title = it.name;
    d.draggable = true;
    d.innerHTML = icon(it.id) + '<span class="tick">✓</span>';
    d.onclick = () => selectItem(it.id);
    d.ondragstart = (e) => { e.dataTransfer.setData('text/plain', it.id); selectItem(it.id, true); };
    shelfEl.appendChild(d);
  });

  const tank = document.getElementById('tank');
  tank.ondragover = (e) => { e.preventDefault(); tank.classList.add('armed'); };
  tank.ondragleave = () => tank.classList.remove('armed');
  tank.ondrop = (e) => {
    e.preventDefault();
    tank.classList.remove('armed');
    const id = e.dataTransfer.getData('text/plain');
    if (phase === 'play') dropIn(id, e.offsetX);
  };
  tank.onclick = (e) => {
    if (phase === 'play' && selected) {
      dropIn(selected, e.offsetX);
    } else if (phase === 'play') {
      toast('先在左边工具箱里选一个物品哦');
    }
  };

  function selectItem(id, quiet) {
    if (phase !== 'play') return;
    if (tested.has(id)) return;
    selected = id;
    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
    const card = document.getElementById('card-' + id);
    if (card) card.classList.add('selected');
    tank.classList.add('armed');
    const it = ITEMS.find(i => i.id === id);
    if (!quiet) { speak(it.name); toast('已选中 ' + it.name + '，现在点水箱放进去！'); }
  }

  function makeGuess(g) {
    guessApple = g;
    phase = 'play';
    document.getElementById('guessOverlay').style.display = 'none';
    setFlow(2);
    speak('好，记下你的猜想啦。动手试试看！');
    toast('猜想已记录！把物品放进水箱验证吧');
  }

  function setFlow(n) {
    for (let i = 1; i <= 4; i++) {
      const el = document.getElementById('fs' + i);
      el.classList.remove('now', 'done');
      if (i < n) el.classList.add('done');
      if (i === n) el.classList.add('now');
    }
  }

  function dropIn(id, x) {
    if (phase !== 'play' || !id || tested.has(id)) return;
    const it = ITEMS.find(i => i.id === id);
    tested.add(id);

    const card = document.getElementById('card-' + id);
    card.classList.remove('selected');
    card.classList.add('used');
    selected = null;
    tank.classList.remove('armed');

    const el = document.createElement('div');
    el.className = 'tank-item';
    el.innerHTML = icon(it.id);
    const tx = Math.min(Math.max((x || 235) - 30, 40), 390);
    el.style.left = tx + 'px';
    el.style.top = '-70px';
    tank.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.top = it.sink ? '310px' : '110px';
    }));
    if (!it.sink) setTimeout(() => el.classList.add('floating'), 1150);

    for (let i = 0; i < 7; i++) {
      setTimeout(() => spawnBubble(tx + 10 + Math.random() * 40), i * 130);
    }

    setFlow(3);
    const verb = it.sink ? '沉下去了 ↓' : '浮起来了 ↑';
    const chip = document.getElementById('resultChip');
    chip.innerHTML = icon(it.id) + '<span>' + it.name + ' ' + verb + '</span>';
    chip.classList.add('show');
    speak(it.name + (it.sink ? '沉下去了' : '浮起来了'));

    setTimeout(() => {
      const list = it.sink ? document.getElementById('listSink') : document.getElementById('listFloat');
      const emp = list.querySelector('.empty'); if (emp) emp.remove();
      const c = document.createElement('span');
      c.className = 'chip';
      c.innerHTML = icon(it.id) + it.name;
      c.style.cursor = 'pointer';
      c.title = '点我看小知识';
      c.onclick = () => { toast(FACTS[it.id]); speak(FACTS[it.id]); };
      list.appendChild(c);
      document.getElementById('codexProg').textContent = '已测试 ' + tested.size + ' / ' + ITEMS.length;
      setFlow(2);

      if (it.id === 'apple' && guessApple) {
        const right = (guessApple === 'float') === !it.sink;
        if (right) { confetti(); dingOK(); toast('猜对啦！加一颗智慧星'); }
        else { toast('没关系～科学家就是靠不断试错发现规律的'); }
      } else {
        dingOK();
      }

      if (tested.size >= 3) {
        const btn = document.getElementById('collectBtn');
        btn.disabled = false;
        btn.classList.add('ready');
      }
    }, 1400);
  }

  function spawnBubble(x) {
    const b = document.createElement('div');
    const size = 6 + Math.random() * 12;
    b.className = 'bubble';
    b.style.width = b.style.height = size + 'px';
    b.style.left = x + 'px';
    tank.appendChild(b);
    setTimeout(() => b.remove(), 1400);
  }

  function collect() {
    confetti();
    speak('太棒了，实验记录收进图鉴！');
    toast('图鉴 +1 · 获得「浮沉小侦探」贴纸');
    setFlow(4);
    setTimeout(() => location.href = '05-collection.html', 1600);
  }
</script>
</body>
</html>
