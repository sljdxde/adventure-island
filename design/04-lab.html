<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>04 · 科学实验室 · 三实验探究</title>
<link rel="stylesheet" href="style.css">
<style>
  .scene .star { position: absolute; font-size: 20px; opacity: .85; animation: twinkle 2.4s ease-in-out infinite; color: #fff; }
  @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.85);} 50% { opacity: 1; transform: scale(1.15);} }

  /* ---------- 四步法 ---------- */
  .flow-bar {
    position: absolute;
    top: 96px; left: 30px; right: 30px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    z-index: 30;
  }
  .flow-step {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.95);
    border: 3px solid #D8CCF5;
    border-radius: 999px;
    padding: 6px 17px;
    font-size: 18px; font-weight: 900;
    color: #B7A6D9;
    box-shadow: 0 4px 0 rgba(124,92,224,.18);
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .flow-step .n {
    width: 28px; height: 28px; border-radius: 50%;
    background: #EDE5FB; color: #9C6BFF;
    display: grid; place-items: center;
    font-size: 16px; font-weight: 900;
  }
  .flow-step.now { color: #fff; background: linear-gradient(180deg, var(--purple), var(--purple-dk)); border-color: var(--purple-ddk); box-shadow: 0 4px 0 var(--purple-ddk); }
  .flow-step.now .n { background: rgba(255,255,255,.28); color: #fff; animation: pulse-glow 1.6s infinite; }
  .flow-step.done { color: var(--green-dk); background: #EFFBEF; border-color: #BFE8C6; }
  .flow-step.done .n { background: var(--green); color: #fff; }
  .flow-arrow { color: rgba(255,255,255,.95); font-size: 20px; font-weight: 900; text-shadow: 0 2px 0 rgba(124,92,224,.4); }

  /* ---------- 主体三栏 ---------- */
  .lab-body {
    position: absolute;
    top: 154px; left: 26px; right: 26px; bottom: 68px;
    display: flex;
    gap: 18px;
    z-index: 15;
  }

  .shelf {
    width: 210px;
    background: linear-gradient(180deg, #FFFDF4, #FFF1D6);
    border-radius: 30px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-2);
    padding: 12px 12px 10px;
    display: flex; flex-direction: column;
  }
  .exp-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .exp-tab {
    flex: 1;
    border: 2.5px solid #E4D6C0; background: #fff;
    border-radius: 12px; padding: 5px 2px;
    font-family: var(--font-round);
    font-size: 13px; font-weight: 900; color: var(--ink-soft);
    cursor: pointer;
    box-shadow: 0 3px 0 #E4D6C0;
    white-space: nowrap;
  }
  .exp-tab.on {
    background: linear-gradient(180deg, #C7B4FF, var(--purple));
    border-color: var(--purple-ddk);
    color: #fff;
    box-shadow: 0 3px 0 var(--purple-ddk);
  }
  .shelf h4 {
    font-size: 17px; text-align: center; margin-bottom: 8px;
    color: #7A4A00;
    background: linear-gradient(180deg, #FFE7A8, var(--gold));
    border: 2.5px solid var(--gold-ddk);
    border-radius: 999px; padding: 4px 0;
    box-shadow: 0 3px 0 var(--gold-ddk);
    letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .shelf h4 .ic { font-size: 19px; }
  .shelf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; flex: 1; }
  .item-card {
    background: #fff;
    border-radius: 18px;
    border: 3px solid #F2E2C4;
    display: grid; place-items: center;
    font-size: 40px;
    cursor: grab;
    transition: transform .12s, border-color .12s, opacity .3s;
    user-select: none;
    position: relative;
    min-height: 74px;
    box-shadow: 0 4px 0 #EFE3C8;
  }
  .item-card:hover { transform: translateY(-4px) scale(1.05); }
  .item-card.selected { border-color: var(--purple); background: #F5F0FF; transform: scale(1.07); box-shadow: 0 4px 0 var(--purple-dk), var(--sh-2); }
  .item-card.used { opacity: .3; pointer-events: none; }
  .item-card .tick {
    position: absolute; top: -10px; right: -8px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--green); border: 2.5px solid #fff;
    color: #fff; font-size: 13px; font-weight: 900;
    display: none; place-items: center;
  }
  .item-card.used .tick { display: grid; }
  .shelf-tip { font-size: 13px; color: var(--ink-soft); text-align: center; font-weight: 800; margin-top: 8px; line-height: 1.5; }

  /* 水箱 / 实验台 */
  .tank-zone {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
  }
  .tank {
    position: relative;
    width: 470px; height: 400px;
    border: 9px solid #FFFFFF;
    border-radius: 34px;
    box-shadow: var(--sh-3), 0 0 0 4px var(--pb), inset 0 0 0 3px #C9ECFA, inset 0 10px 20px rgba(47,134,201,.18);
    background: linear-gradient(180deg, rgba(234,249,255,.92) 0 56px, #7FD4F8 56px 100%);
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow .2s;
  }
  .tank.bench {
    background: linear-gradient(180deg, #F7ECD8 0%, #EAD3AC 60%, #DDBE8C 100%);
    box-shadow: var(--sh-3), 0 0 0 4px var(--pb), inset 0 10px 20px rgba(140,90,43,.15);
  }
  .tank.armed { box-shadow: var(--sh-3), 0 0 0 7px rgba(155,123,245,.6), inset 0 0 0 3px #C9ECFA; }
  .tank .waterline {
    position: absolute; top: 50px; left: 0; right: 0; height: 12px;
    background: rgba(255,255,255,.55);
    border-radius: 40%;
    animation: water 3.2s ease-in-out infinite;
  }
  .tank.bench .waterline { display: none; }
  @keyframes water {
    0%,100% { transform: translateX(-14px) scaleY(1); }
    50%     { transform: translateX(14px) scaleY(1.5); }
  }
  .tank .caustics {
    position: absolute; inset: 56px 0 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.25) 0 26px, transparent 27px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.2) 0 34px, transparent 35px),
      radial-gradient(circle at 45% 80%, rgba(255,255,255,.18) 0 30px, transparent 31px);
  }
  .tank.bench .caustics { display: none; }
  .tank .magnet-anchor {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 92px;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.25));
    display: none;
  }
  .tank.bench .magnet-anchor { display: block; }
  .tank .bench-label {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 900; color: #8A6540;
    background: rgba(255,255,255,.75); border-radius: 999px; padding: 4px 16px;
    display: none;
  }
  .tank.bench .bench-label { display: block; }
  .tank-item {
    position: absolute;
    font-size: 56px;
    left: 50%;
    transition: top 1.1s cubic-bezier(.45,.05,.35,1), transform 1.1s, opacity 1s, filter 1s;
    filter: drop-shadow(0 6px 6px rgba(20,60,90,.25));
    z-index: 4;
  }
  .tank-item.floating { animation: float-bob 2.8s ease-in-out infinite; }
  .tank-item.dissolving { opacity: 0; filter: blur(3px); }
  .bubble {
    position: absolute;
    bottom: -20px;
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    box-shadow: inset -2px -2px 4px rgba(160,220,250,.9);
    animation: bubble-rise 1.3s ease-out forwards;
    z-index: 3;
  }
  @keyframes bubble-rise {
    0% { transform: translateY(0); opacity: .9; }
    100% { transform: translateY(-320px); opacity: 0; }
  }
  .result-chip {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    top: 12px;
    background: rgba(255,255,255,.97);
    border: 3px solid var(--pb);
    border-radius: 999px;
    padding: 8px 24px;
    font-size: 20px; font-weight: 900;
    box-shadow: 0 4px 0 rgba(84,66,58,.12);
    z-index: 8;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .result-chip .ic { font-size: 24px; }
  .result-chip.show { opacity: 1; transform: translateX(-50%) translateY(6px); }

  /* 猜想浮层 */
  .guess-overlay {
    position: absolute; inset: 0;
    background: rgba(58,45,80,.45);
    backdrop-filter: blur(2px);
    display: grid; place-items: center;
    z-index: 40;
    border-radius: 24px;
  }
  .guess-card {
    background: linear-gradient(180deg, #FFFDF4, #FFF3D8);
    border-radius: 30px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-3);
    padding: 22px 40px;
    text-align: center;
    animation: pop .4s;
  }
  .guess-card h3 { font-size: 25px; margin-bottom: 4px; color: var(--purple-dk); letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .guess-card h3 .ic { font-size: 25px; }
  .guess-card .sub { font-size: 17px; color: var(--ink-soft); font-weight: 800; margin-bottom: 14px; }
  .guess-card .big { font-size: 72px; margin: 2px 0 8px; filter: drop-shadow(0 8px 8px rgba(0,0,0,.18)); }
  .guess-btns { display: flex; gap: 16px; justify-content: center; }
  .guess-btns .jbtn { white-space: nowrap; font-size: 20px; padding: 12px 24px; }

  /* 图鉴面板 */
  .codex {
    width: 238px;
    background: linear-gradient(180deg, #FFFDF4, #FFF1D6);
    border-radius: 30px;
    border: 5px solid var(--pb);
    box-shadow: var(--sh-2);
    padding: 14px;
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .codex h4 {
    font-size: 18px; color: var(--purple-dk); text-align: center;
    background: linear-gradient(180deg, #E4D6FF, #D0BCFF);
    border: 2.5px solid var(--purple-dk);
    border-radius: 999px; padding: 4px 0;
    box-shadow: 0 3px 0 var(--purple-dk);
    letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .codex h4 .ic { font-size: 20px; }
  .codex .col-title { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .codex .list {
    background: #fff;
    border-radius: 18px;
    min-height: 84px;
    padding: 8px;
    display: flex; flex-wrap: wrap; gap: 6px;
    align-content: flex-start;
    border: 3px solid #F2E2C4;
  }
  .codex .chip {
    background: linear-gradient(180deg, #FFFDF4, #FFF3D8);
    border: 2.5px solid #F0DCAC;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 16px;
    font-weight: 900;
    box-shadow: 0 3px 0 #F0DCAC;
    animation: pop .35s;
    display: inline-flex; align-items: center; gap: 5px;
    cursor: pointer;
  }
  .codex .chip .ic { font-size: 19px; }
  .codex .empty { color: #C6BADF; font-size: 15px; font-weight: 700; padding: 6px; }
  .codex .progress-line { text-align: center; font-size: 16px; font-weight: 900; color: var(--purple-dk); }

  .lab-footer { position: absolute; left: 26px; bottom: 16px; z-index: 20; }
  .btn-collect.ready { animation: pulse-glow 1.5s infinite; }
</style>
</head>
<body data-theme="lab">
<div class="stage">

  <div class="scene">
    <div class="sun"></div>
    <span class="star" style="left:18%; top:12%;">✦</span>
    <span class="star" style="left:70%; top:9%; animation-delay:.8s;">✦</span>
    <span class="star" style="left:86%; top:22%; animation-delay:1.4s;">✦</span>
    <span class="star" style="left:38%; top:7%; animation-delay:.4s;">✦</span>
    <div class="cloud c1" style="opacity:.55"></div>
    <div class="cloud c2" style="opacity:.45"></div>
    <div class="hills-back"></div>
    <div class="hills-front"></div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <button class="sqbtn" onclick="goHome()" title="返回"><img class="ic" src="assets/icons/back.svg" alt=""></button>
      <div>
        <div class="page-title"><img class="ic" src="assets/icons/flask.svg" alt="">科学实验室</div>
        <div class="page-sub"><span id="expSub">实验 7 / 10 · 浮与沉</span> · 向导闪闪 <img class="ic" src="assets/icons/robot.svg" alt=""></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="gold-chip"><span class="ico"><img class="ic" src="assets/icons/goggles.svg" alt=""></span>已戴好</div>
      <div class="gold-chip"><span class="ico"><img class="ic" src="assets/icons/star.svg" alt=""></span>1</div>
    </div>
  </div>

  <!-- 四步法 -->
  <div class="flow-bar">
    <span class="flow-step now" id="fs1"><span class="n">1</span>猜一猜</span>
    <span class="flow-arrow">➜</span>
    <span class="flow-step" id="fs2"><span class="n">2</span>动手做</span>
    <span class="flow-arrow">➜</span>
    <span class="flow-step" id="fs3"><span class="n">3</span>看现象</span>
    <span class="flow-arrow">➜</span>
    <span class="flow-step" id="fs4"><span class="n">4</span>收进图鉴</span>
  </div>

  <div class="lab-body">

    <!-- 工具箱 -->
    <div class="shelf">
      <div class="exp-tabs" id="expTabs"></div>
      <h4><img class="ic" src="assets/icons/flask.svg" alt="">工具箱</h4>
      <div class="shelf-grid" id="shelf"></div>
      <div class="shelf-tip">点选物品<br>再点实验区放进去<br>（也可直接拖拽）</div>
    </div>

    <!-- 实验区 -->
    <div class="tank-zone">
      <div class="tank" id="tank">
        <div class="waterline"></div>
        <div class="caustics"></div>
        <div class="magnet-anchor"><img class="ic" src="assets/icons/magnet.svg" alt=""></div>
        <div class="bench-label">实验台 · 磁铁放在中间</div>
        <div class="result-chip" id="resultChip"></div>

        <!-- 猜想浮层 -->
        <div class="guess-overlay" id="guessOverlay">
          <div class="guess-card">
            <h3>猜一猜 <img class="ic" src="assets/icons/crystal.svg" alt=""></h3>
            <div class="big" id="guessBig"></div>
            <div class="sub" id="guessSub"></div>
            <div class="guess-btns" id="guessBtns"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 图鉴 -->
    <div class="codex">
      <h4><img class="ic" src="assets/icons/book.svg" alt="">现象图鉴</h4>
      <div class="col-title" style="color:var(--blue-dk);" id="colTitle0">↑ 浮起来</div>
      <div class="list" id="list0"><span class="empty">还没有发现…</span></div>
      <div class="col-title" style="color:var(--coral-dk);" id="colTitle1">↓ 沉下去</div>
      <div class="list" id="list1"><span class="empty">还没有发现…</span></div>
      <div class="progress-line" id="codexProg">已测试 0 / 6</div>
      <button class="jbtn jbtn-purple btn-collect" id="collectBtn" style="font-size:19px; padding:11px 0; width:100%;" disabled onclick="collect()"><img class="ic" src="assets/icons/star.svg" alt="">收进图鉴</button>
    </div>
  </div>

  <div class="lab-footer">
    <button class="jbtn jbtn-cream" style="font-size:18px; padding:10px 22px;" onclick="loadExp(ei)">↻ 重新实验</button>
  </div>

  <div class="safe-tip"><img class="ic" src="assets/icons/goggles.svg" alt=""> 虚拟实验室随便玩 · 真的做实验时，一定要请爸爸妈妈陪哦！</div>
  <div class="design-note" style="bottom:44px;">设计稿 04 · 科学实验室（3 实验：浮与沉 / 磁铁吸谁 / 溶不溶解 × 四步探究法）</div>
</div>

<script src="art.js"></script>
<script src="app.js"></script>
<script>
  /* ============ 实验数据 ============ */
  const EXPS = [
    {
      id: 7, tab: '浮与沉', name: '浮与沉', tank: 'water',
      cols: ['↑ 浮起来', '↓ 沉下去'],
      guessQ: (n) => n + '放进水里，会怎么样？',
      items: [
        { id: 'apple',   name: '苹果', col: 0 },
        { id: 'rock',    name: '石头', col: 1 },
        { id: 'wood',    name: '木头', col: 0 },
        { id: 'key',     name: '钥匙', col: 1 },
        { id: 'sponge',  name: '海绵', col: 0 },
        { id: 'balloon', name: '气球', col: 0 },
      ],
      facts: {
        apple: '苹果皮里有小气孔，像穿了救生衣', rock: '石头比同体积的水重很多，所以沉底',
        wood: '木头里有空隙，轻，所以能浮', key: '金属钥匙小小的却很重，一下就沉啦',
        sponge: '海绵干的时候会浮，吸满水会慢慢沉哦', balloon: '气球里是空气，最轻，漂在最上面',
      },
      sticker: '浮沉小侦探',
    },
    {
      id: 8, tab: '磁铁吸谁', name: '磁铁吸谁', tank: 'bench',
      cols: ['⊙ 被吸住', '○ 没被吸'],
      guessQ: (n) => n + '靠近磁铁，会被吸住吗？',
      items: [
        { id: 'key',     name: '钥匙', col: 0 },
        { id: 'coin',    name: '硬币', col: 0 },
        { id: 'rock',    name: '石头', col: 1 },
        { id: 'wood',    name: '木头', col: 1 },
        { id: 'sponge',  name: '海绵', col: 1 },
        { id: 'balloon', name: '气球', col: 1 },
      ],
      facts: {
        key: '钥匙是铁做的，磁铁最喜欢铁', coin: '硬币里也有金属，一下就被吸住',
        rock: '石头不是金属，磁铁吸不动它', wood: '木头和磁铁没有缘分，吸不住',
        sponge: '海绵软软的，磁铁对它没感觉', balloon: '气球是橡胶的，磁铁吸不住哦',
      },
      sticker: '磁铁小行家',
    },
    {
      id: 9, tab: '溶不溶解', name: '溶不溶解', tank: 'water',
      cols: ['✦ 溶解了', '● 没溶解'],
      guessQ: (n) => n + '放进水里搅一搅，会溶解吗？',
      items: [
        { id: 'salt',   name: '盐', col: 0 },
        { id: 'sugar',  name: '糖', col: 0 },
        { id: 'candy',  name: '糖果', col: 0 },
        { id: 'sand',   name: '沙子', col: 1 },
        { id: 'rock',   name: '石头', col: 1 },
        { id: 'key',    name: '钥匙', col: 1 },
      ],
      facts: {
        salt: '盐粒躲进水里不见了，水却变咸了', sugar: '糖慢慢化在水里，水变甜啦',
        candy: '糖果的外衣溶化了，水还会变色呢', sand: '沙子再搅也不溶，最后沉在杯底',
        rock: '石头硬硬的，水可溶不动它', key: '钥匙是金属，泡多久都不会溶',
      },
      sticker: '溶解小博士',
    },
  ];

  let ei = 0;
  let phase = 'guess';
  let selected = null;
  let tested = new Set();
  let guessCol = null;

  const tank = document.getElementById('tank');

  /* ============ 实验切换 ============ */
  function buildTabs() {
    document.getElementById('expTabs').innerHTML = EXPS.map((e, i) =>
      `<button class="exp-tab${i === ei ? ' on' : ''}" onclick="loadExp(${i})">${e.id} ${e.tab}</button>`).join('');
  }

  function loadExp(i) {
    ei = i;
    const E = EXPS[i];
    phase = 'guess'; selected = null; tested = new Set(); guessCol = null;
    buildTabs();
    document.getElementById('expSub').textContent = '实验 ' + E.id + ' / 10 · ' + E.name;
    tank.className = 'tank' + (E.tank === 'bench' ? ' bench' : '');
    tank.querySelectorAll('.tank-item, .bubble').forEach(el => el.remove());
    document.getElementById('resultChip').classList.remove('show');
    document.getElementById('colTitle0').textContent = E.cols[0];
    document.getElementById('colTitle1').textContent = E.cols[1];
    document.getElementById('list0').innerHTML = '<span class="empty">还没有发现…</span>';
    document.getElementById('list1').innerHTML = '<span class="empty">还没有发现…</span>';
    document.getElementById('codexProg').textContent = '已测试 0 / ' + E.items.length;
    const btn = document.getElementById('collectBtn');
    btn.disabled = true; btn.classList.remove('ready');
    // 工具箱
    const shelf = document.getElementById('shelf');
    shelf.innerHTML = '';
    E.items.forEach(it => {
      const d = document.createElement('div');
      d.className = 'item-card';
      d.id = 'card-' + it.id;
      d.title = it.name;
      d.draggable = true;
      d.innerHTML = icon(it.id) + '<span class="tick">✓</span>';
      d.onclick = () => selectItem(it.id);
      d.ondragstart = (e) => { e.dataTransfer.setData('text/plain', it.id); selectItem(it.id, true); };
      shelf.appendChild(d);
    });
    // 猜想浮层
    const g = E.items[0];
    document.getElementById('guessBig').innerHTML = icon(g.id);
    document.getElementById('guessSub').textContent = E.guessQ(g.name);
    document.getElementById('guessBtns').innerHTML =
      `<button class="jbtn jbtn-yellow" onclick="makeGuess(0)">${E.cols[0]}</button>
       <button class="jbtn jbtn-blue" onclick="makeGuess(1)">${E.cols[1]}</button>`;
    document.getElementById('guessOverlay').style.display = 'grid';
    setFlow(1);
  }

  /* ============ 交互 ============ */
  tank.ondragover = (e) => { e.preventDefault(); tank.classList.add('armed'); };
  tank.ondragleave = () => tank.classList.remove('armed');
  tank.ondrop = (e) => {
    e.preventDefault();
    tank.classList.remove('armed');
    const id = e.dataTransfer.getData('text/plain');
    if (phase === 'play') dropIn(id, e.offsetX);
  };
  tank.onclick = (e) => {
    if (phase === 'play' && selected) dropIn(selected, e.offsetX);
    else if (phase === 'play') toast('先在左边工具箱里选一个物品哦');
  };

  function selectItem(id, quiet) {
    if (phase !== 'play') return;
    if (tested.has(id)) return;
    selected = id;
    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
    const card = document.getElementById('card-' + id);
    if (card) card.classList.add('selected');
    tank.classList.add('armed');
    const it = EXPS[ei].items.find(i => i.id === id);
    if (!quiet) { speak(it.name); toast('已选中 ' + it.name + '，现在点实验区放进去！'); }
  }

  function makeGuess(col) {
    guessCol = col;
    phase = 'play';
    document.getElementById('guessOverlay').style.display = 'none';
    setFlow(2);
    speak('好，记下你的猜想啦。动手试试看！');
    toast('猜想已记录！把物品放进实验区验证吧');
  }

  function setFlow(n) {
    for (let i = 1; i <= 4; i++) {
      const el = document.getElementById('fs' + i);
      el.classList.remove('now', 'done');
      if (i < n) el.classList.add('done');
      if (i === n) el.classList.add('now');
    }
  }

  function dropIn(id, x) {
    const E = EXPS[ei];
    if (phase !== 'play' || !id || tested.has(id)) return;
    const it = E.items.find(i => i.id === id);
    if (!it) return;
    tested.add(id);

    const card = document.getElementById('card-' + id);
    card.classList.remove('selected');
    card.classList.add('used');
    selected = null;
    tank.classList.remove('armed');

    const el = document.createElement('div');
    el.className = 'tank-item';
    el.innerHTML = icon(it.id);
    const tx = Math.min(Math.max((x || 235) - 30, 40), 390);
    el.style.left = tx + 'px';
    el.style.top = '-70px';
    tank.appendChild(el);

    const isBench = E.tank === 'bench';
    const restTop = isBench ? (it.col === 0 ? 236 : 316) : (E.id === 9 ? (it.col === 0 ? 250 : 316) : (it.col === 1 ? 316 : 110));
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.top = restTop + 'px'; }));
    if (!isBench && E.id === 7 && it.col === 0) setTimeout(() => el.classList.add('floating'), 1150);
    if (E.id === 9 && it.col === 0) setTimeout(() => { el.classList.add('dissolving'); swirl(tx); }, 1300);

    if (!isBench) for (let i = 0; i < 7; i++) setTimeout(() => spawnBubble(tx + 10 + Math.random() * 40), i * 130);

    setFlow(3);
    const chip = document.getElementById('resultChip');
    chip.innerHTML = icon(it.id) + '<span>' + it.name + ' ' + E.cols[it.col].slice(2) + '</span>';
    chip.classList.add('show');
    speak(it.name + E.cols[it.col].slice(2));

    setTimeout(() => {
      const list = document.getElementById('list' + it.col);
      const emp = list.querySelector('.empty'); if (emp) emp.remove();
      const c = document.createElement('span');
      c.className = 'chip';
      c.innerHTML = icon(it.id) + it.name;
      c.title = '点我看小知识';
      c.onclick = () => { toast(E.facts[it.id]); speak(E.facts[it.id]); };
      list.appendChild(c);
      document.getElementById('codexProg').textContent = '已测试 ' + tested.size + ' / ' + E.items.length;
      setFlow(2);

      if (it.id === E.items[0].id && guessCol !== null) {
        const right = guessCol === it.col;
        if (right) { confetti(); dingOK(); toast('猜对啦！加一颗智慧星'); }
        else toast('没关系～科学家就是靠不断试错发现规律的');
        guessCol = null;
      } else dingOK();

      if (tested.size >= 3) {
        const btn = document.getElementById('collectBtn');
        btn.disabled = false;
        btn.classList.add('ready');
      }
    }, 1400);
  }

  function spawnBubble(x) {
    const b = document.createElement('div');
    const size = 6 + Math.random() * 12;
    b.className = 'bubble';
    b.style.width = b.style.height = size + 'px';
    b.style.left = x + 'px';
    tank.appendChild(b);
    setTimeout(() => b.remove(), 1400);
  }
  function swirl(x) {
    for (let i = 0; i < 10; i++) setTimeout(() => spawnBubble(x + Math.random() * 50), i * 110);
  }

  function collect() {
    const E = EXPS[ei];
    confetti();
    speak('太棒了，实验记录收进图鉴！');
    toast('图鉴 +1 · 获得「' + E.sticker + '」贴纸');
    setFlow(4);
    setTimeout(() => location.href = '05-collection.html', 1600);
  }

  loadExp(0);
</script>
</body>
</html>
